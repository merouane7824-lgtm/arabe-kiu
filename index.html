{n:8, t:'La santé, hier et aujourd’hui', ar:'الصِّحَّةُ بَيْنَ الأَمْسِ وَاليَوْمِ', html:`
<div class="txt"><div class="tt">الصِّحَّةُ (مُلَخَّصٌ)</div><div class="body">كَانَ النَّاسُ فِي المَاضِي يَظُنُّونَ أَنَّ السَّمِينَ صَحِيحٌ وَأَنَّ النَّحِيفَ مَرِيضٌ. ثُمَّ تَقَدَّمَ الطِّبُّ، وَعَرَفَ النَّاسُ أَنَّ البَدَانَةَ تُسَبِّبُ أَمْرَاضًا خَطِيرَةً، مِثْلَ أَمْرَاضِ القَلْبِ وَالسُّكَّرِيِّ وَضَغْطِ الدَّمِ. فَأَصْبَحَ النَّاسُ يَتَّبِعُونَ الحِمْيَةَ وَيَأْكُلُونَ الخُضْرَوَاتِ وَالفَوَاكِهَ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Autrefois, les gens pensaient que le gros était en bonne santé et le maigre malade. Puis la médecine a progressé et l'on a su que l'obésité provoque des maladies graves comme les maladies du cœur, le diabète et l'hypertension. Les gens se sont mis à suivre des régimes et à manger des légumes et des fruits.</div></details>
<div class="hadith"><div class="a">مَا مَلَأَ آدَمِيٌّ وِعَاءً شَرًّا مِنْ بَطْنٍ، بِحَسْبِ ابْنِ آدَمَ أُكُلَاتٌ يُقِمْنَ صُلْبَهُ، فَإِنْ كَانَ لَا مَحَالَةَ، فَثُلُثٌ لِطَعَامِهِ، وَثُلُثٌ لِشَرَابِهِ، وَثُلُثٌ لِنَفَسِهِ</div><div class="f">« Le fils d'Adam n'a pas rempli de récipient pire que son ventre. Il lui suffit de quelques bouchées pour se tenir droit ; s'il lui faut plus, alors un tiers pour sa nourriture, un tiers pour sa boisson et un tiers pour sa respiration. »</div><div class="src">Rapporté par at-Tirmidhī, Ibn Mājah et Aḥmad (authentique).</div></div>
<div class="txt"><div class="body">وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ</div><div class="src">« Mangez et buvez, et ne commettez pas d'excès, car Il n'aime pas ceux qui commettent des excès. » — Al-A‘rāf, 31</div></div>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">عَلَامَةٌ</td><td>signe</td></tr><tr><td class="ac">تَقَدَّمَ</td><td>progresser, avancer</td></tr>
  <tr><td class="ac">البَدَانَةُ = السِّمْنَةُ</td><td>l'obésité</td></tr><tr><td class="ac">يُصِيبُ</td><td>toucher, frapper (une maladie)</td></tr>
  <tr><td class="ac">يُحَذِّرُ</td><td>mettre en garde</td></tr><tr><td class="ac">الخُبْزُ الأَسْمَرُ</td><td>le pain complet</td></tr>
  <tr><td class="ac">الحَلِيبُ كَامِلُ الدَّسَمِ</td><td>le lait entier</td></tr><tr><td class="ac">نَفَسٌ</td><td>souffle, respiration</td></tr>
</tbody></table></div>
<h3 class="sub">Règles</h3>
<div class="rule">
  <div>Le mot (<span class="arword">الكَلِمَةُ</span>) est soit un <b>nom</b>, soit un <b>verbe</b>, soit une <b>particule</b>.</div>
  <div>Attention à la <b>hamza</b> : deux mots peuvent ne différer que par elle, et changer complètement de sens : <span class="arword">سَأَلَ</span> (demander) ≠ <span class="arword">سَالَ</span> (couler). Ne confonds pas non plus <span class="arword">ء</span> et la hamza allongée <span class="arword">آ</span> (= أَا) : <span class="arword">آدَمُ، آكُلُ</span>.</div>
</div>`},

/* ---------------------------------------------------------------- 9 */
{n:9, t:'L’homme a besoin de repos', ar:'الإِنْسَانُ يَحْتَاجُ إِلَى التَّرْوِيحِ', html:`
<div class="dlg">
  <div class="ln"><span class="who">Hishām</span><span class="a">الحَمْدُ لِلَّهِ عَلَى سَلَامَتِكَ!</span><span class="f">Louange à Allah pour ta guérison (formule à un convalescent) !</span></div>
  <div class="ln"><span class="who">Ibrāhīm</span><span class="a">أُغْمِيَ عَلَيَّ فِي الشَّرِكَةِ، وَلَمَّا أَفَقْتُ وَجَدْتُ نَفْسِي فِي المُسْتَشْفَى</span><span class="f">Je me suis évanoui au travail, et quand j'ai repris conscience je me suis retrouvé à l'hôpital.</span></div>
  <div class="ln"><span class="who">Hishām</span><span class="a">مَاذَا قَالَ الطَّبِيبُ؟</span><span class="f">Qu'a dit le médecin ?</span></div>
  <div class="ln"><span class="who">Ibrāhīm</span><span class="a">قَالَ : يَجِبُ أَنْ تُغَيِّرَ أُسْلُوبَ حَيَاتِكَ، حَيَاتُكَ كُلُّهَا عَمَلٌ</span><span class="f">Il a dit : tu dois changer de mode de vie, ta vie n'est que travail.</span></div>
  <div class="ln"><span class="who">Hishām</span><span class="a">يَا لَهُ مِنْ أَمْرٍ عَجِيبٍ!</span><span class="f">Quelle chose étonnante !</span></div>
</div>
<p class="faint" style="font-size:.84rem">Dialogue de révision rédigé avec le vocabulaire de la leçon.</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">التَّرْوِيحُ</td><td>la détente, le repos (après le travail)</td></tr>
  <tr><td class="ac">أُغْمِيَ عَلَيَّ</td><td>je me suis évanoui</td></tr>
  <tr><td class="ac">أَفَاقَ</td><td>reprendre connaissance</td></tr>
  <tr><td class="ac">فَحَصَنِي</td><td>il m'a examiné</td></tr>
  <tr><td class="ac">أُسْلُوبُ الحَيَاةِ</td><td>le mode de vie</td></tr>
  <tr><td class="ac">قَضَى · أَقْضِي</td><td>passer (du temps) · que je passe</td></tr>
  <tr><td class="ac">يَقْصِدُ</td><td>vouloir dire</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : les outils d'interrogation</h3>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th class="ac">Outil</th><th>Pour…</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td class="ac">مَنْ</td><td>qui ? (doué de raison)</td><td class="ac">مَنْ فَحَصَكَ؟</td></tr>
  <tr><td class="ac">مَا · مَاذَا</td><td>quoi ? (non doué de raison)</td><td class="ac">مَاذَا حَدَثَ؟</td></tr>
  <tr><td class="ac">لِمَاذَا</td><td>pourquoi ?</td><td class="ac">لِمَاذَا أَنْتَ هُنَا؟</td></tr>
  <tr><td class="ac">كَيْفَ</td><td>comment ?</td><td class="ac">كَيْفَ حَالُكَ؟</td></tr>
  <tr><td class="ac">مَتَى</td><td>quand ?</td><td class="ac">مَتَى أَفَقْتَ؟</td></tr>
  <tr><td class="ac">أَيْنَ</td><td>où ?</td><td class="ac">أَيْنَ وَجَدْتَ نَفْسَكَ؟</td></tr>
  <tr><td class="ac">كَمْ</td><td>combien ?</td><td class="ac">كَمْ يَوْمًا بَقِيتَ؟</td></tr>
  <tr><td class="ac">أَيُّ</td><td>quel ?</td><td class="ac">أَيُّ بَلَدٍ تُفَضِّلُ؟</td></tr>
  <tr><td class="ac">هَلْ · أَ</td><td>est-ce que ?</td><td class="ac">هَلْ أَنْتَ بِخَيْرٍ؟</td></tr>
</tbody></table></div>`},

/* ---------------------------------------------------------------- 10 */
{n:10, t:'Les formes de détente · le sujet', ar:'صُوَرُ التَّرْوِيحِ · الفَاعِلُ', html:`
<div class="txt"><div class="tt">صُوَرُ التَّرْوِيحِ (مُلَخَّصٌ)</div><div class="body">يَحْتَاجُ العَامِلُ وَالطَّالِبُ إِلَى التَّرْوِيحِ بَعْدَ عَنَاءِ العَمَلِ وَالدِّرَاسَةِ. وَلَيْسَ الهَدَفُ قَتْلَ الوَقْتِ، بَلْ قَضَاءُ الوَقْتِ فِي أَنْشِطَةٍ مُفِيدَةٍ : القِرَاءَةِ، وَالرِّيَاضَةِ، وَالسَّفَرِ، وَزِيَارَةِ المَتَاحِفِ، وَصَيْدِ السَّمَكِ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Le travailleur et l'étudiant ont besoin de détente après la fatigue du travail et des études. Le but n'est pas de tuer le temps, mais de le passer dans des activités utiles : la lecture, le sport, le voyage, la visite des musées, la pêche.</div></details>
<div class="hadith"><div class="a">المُؤْمِنُ القَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللهِ مِنَ المُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ</div><div class="f">« Le croyant fort est meilleur et plus aimé d'Allah que le croyant faible, et en chacun il y a du bien. »</div><div class="src">Rapporté par Muslim. ‘Umar ibn al-Khaṭṭāb écrivit aussi : « Apprenez à vos enfants la natation, le tir et l'équitation. »</div></div>
<div class="pills"><span class="pill">الأَنْشِطَةُ <small>les activités</small></span><span class="pill">عَنَاءٌ <small>fatigue</small></span><span class="pill">مُتْعَةٌ <small>plaisir</small></span><span class="pill">الشَّاطِئُ <small>la plage</small></span><span class="pill">المَتَاحِفُ <small>les musées</small></span><span class="pill">المُخَيَّمَاتُ <small>les camps</small></span><span class="pill">الرِّمَايَةُ <small>le tir</small></span><span class="pill">السِّبَاحَةُ <small>la natation</small></span><span class="pill">رُكُوبُ الخَيْلِ <small>l'équitation</small></span><span class="pill">الجِسْمُ · العَقْلُ <small>le corps · l'esprit</small></span></div>
<h3 class="sub">Règle : le sujet <span class="ar">الفَاعِلُ</span></h3>
<div class="bi">
  <div class="fr"><span class="tag">Définition</span>Le sujet est un <b>nom marfū‘</b> qui désigne <b>celui qui a fait l'action</b>.</div>
  <div class="arb"><span class="tag">التَّعْرِيفُ</span>الفَاعِلُ : هُوَ الاِسْمُ المَرْفُوعُ الَّذِي فَعَلَ الفِعْلَ.</div>
</div>
<div class="exs">
  <div class="ex1"><span class="a">يُمَارِسُ النَّاسُ الرِّيَاضَةَ</span><span class="f">Les gens pratiquent le sport — النَّاسُ : sujet (ḍamma).</span></div>
  <div class="ex1"><span class="a">قَرَأَتِ البِنْتُ قِصَّةً</span><span class="f">La fille a lu une histoire — البِنْتُ : sujet.</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Tant que le loisir ne mène pas à l'interdit et n'est pas une perte de temps, il est encouragé en islam.</p></div>`},

/* ---------------------------------------------------------------- 11 */
{n:11, t:'Comment passer les vacances ? · le vocatif', ar:'كَيْفَ نَقْضِي العُطْلَةَ؟ · النِّدَاءُ', html:`
<div class="dlg">
  <div class="ln"><span class="who">La mère</span><span class="a">العُطْلَةُ عَلَى الأَبْوَابِ يَا أَبَا أَحْمَدَ</span><span class="f">Les vacances approchent, Abū Aḥmad.</span></div>
  <div class="ln"><span class="who">Le père</span><span class="a">هَيَّا نُنَادِ الأَوْلَادَ وَنُنَاقِشْهُمْ</span><span class="f">Allons appeler les enfants et discutons avec eux.</span></div>
  <div class="ln"><span class="who">Le père</span><span class="a">كَيْفَ نَقْضِي العُطْلَةَ يَا أَوْلَادُ؟ نُرِيدُ آرَاءَكُمْ</span><span class="f">Comment passer les vacances, les enfants ? Nous voulons vos avis.</span></div>
  <div class="ln"><span class="who">Aḥmad</span><span class="a">أَرَى السَّفَرَ إِلَى مَصِيفٍ جَمِيلٍ</span><span class="f">Je propose de voyager dans une belle station d'été.</span></div>
  <div class="ln"><span class="who">Badr</span><span class="a">سَأَلْعَبُ وَأَسْبَحُ فِي البَحْرِ</span><span class="f">Je jouerai et je nagerai dans la mer.</span></div>
</div>
<p class="faint" style="font-size:.84rem">Extraits reformulés pour la révision.</p>
<div class="pills"><span class="pill">العُطْلَةُ عَلَى الأَبْوَابِ <small>les vacances sont proches</small></span><span class="pill">هَيَّا <small>allons !</small></span><span class="pill">نُنَاقِشُ <small>nous discutons</small></span><span class="pill">آرَاءٌ (رَأْيٌ) <small>avis</small></span><span class="pill">مَصِيفٌ <small>station d'été</small></span><span class="pill">بَرَامِجُ التِّلْفَازِ <small>programmes télé</small></span><span class="pill">نَقْضِي <small>nous passons</small></span><span class="pill">عُطْلَةٌ سَعِيدَةٌ <small>bonnes vacances</small></span></div>
<h3 class="sub">Règle : le vocatif <span class="ar">النِّدَاءُ</span></h3>
<p><span class="arword">يَا</span> est une particule d'appel (<span class="arword">حَرْفُ نِدَاءٍ</span>) qui entre sur le nom appelé (<span class="arword">المُنَادَى</span>).</p>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th>Nom appelé</th><th class="ac">Fin</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td>Nom propre seul</td><td class="ac">ḍamma (sans tanwīn)</td><td class="ac">يَا أَحْمَدُ · يَا فَاطِمَةُ</td></tr>
  <tr><td>Nom défini « appelé » (ex. un groupe)</td><td class="ac">ḍamma</td><td class="ac">يَا أَوْلَادُ</td></tr>
  <tr><td>Nom annexé (muḍāf)</td><td class="ac">fatḥa</td><td class="ac">يَا أُمَّ أَحْمَدَ · يَا عَبْدَ اللهِ</td></tr>
  <tr><td>أَبٌ annexé (un des 5 noms)</td><td class="ac">alif</td><td class="ac">يَا أَبَا أَحْمَدَ</td></tr>
</tbody></table></div>`},

/* ---------------------------------------------------------------- 12 */
{n:12, t:'Le camping · l’interdiction', ar:'المُخَيَّمَاتُ · لَا النَّاهِيَةُ', html:`
<div class="txt"><div class="tt">المُخَيَّمَاتُ (مُلَخَّصٌ)</div><div class="body">يُفَضِّلُ كَثِيرٌ مِنَ النَّاسِ التَّرْوِيحَ خَارِجَ البُيُوتِ، فَيَقْضُونَ أَيَّامًا فِي المُخَيَّمَاتِ : عَلَى شَاطِئِ البَحْرِ، أَوْ فِي الغَابَةِ، أَوْ فِي الصَّحْرَاءِ، حَيْثُ الهَوَاءُ النَّقِيُّ. يَنْصِبُونَ الخِيَامَ، وَيَحْمِلُونَ مَعَهُمُ الطَّعَامَ وَالمَاءَ، وَيَصْطَادُونَ السَّمَكَ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Beaucoup de gens préfèrent se détendre hors de chez eux : ils passent des jours en camping, au bord de la mer, en forêt ou dans le désert, là où l'air est pur. Ils plantent les tentes, emportent nourriture et eau, et pêchent du poisson.</div></details>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td data-label="Mot" class="ac">الخِيَامُ (خَيْمَةٌ)</td><td data-label="Sens">les tentes</td><td data-label="Mot" class="ac">الغَابَةُ</td><td data-label="Sens">la forêt</td></tr>
  <tr><td data-label="Mot" class="ac">الهَوَاءُ النَّقِيُّ</td><td data-label="Sens">l'air pur (= الطَّاهِرُ)</td><td data-label="Mot" class="ac">البَرُّ</td><td data-label="Sens">la terre ferme, la campagne</td></tr>
  <tr><td data-label="Mot" class="ac">يَحْمِلُ</td><td data-label="Sens">il porte</td><td data-label="Mot" class="ac">يَصْطَادُونَ</td><td data-label="Sens">ils pêchent / chassent</td></tr>
  <tr><td data-label="Mot" class="ac">وَسَائِلُ (وَسِيلَةٌ)</td><td data-label="Sens">moyens, équipements</td><td data-label="Mot" class="ac">أَوَانٍ</td><td data-label="Sens">ustensiles</td></tr>
  <tr><td data-label="Mot" class="ac">إِعْدَادٌ</td><td data-label="Sens">préparation</td><td data-label="Mot" class="ac">عِدَّةُ أَسَابِيعَ</td><td data-label="Sens">plusieurs semaines</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : l'interdiction</h3>
<p>Après le <span class="arword">لَا</span> de l'interdiction, le verbe au présent prend <b>toujours un sukūn</b> (ou perd son nūn).</p>
<div class="exs">
  <div class="ex1"><span class="a">لَا تَتْرُكِ النَّارَ مُشْتَعِلَةً</span><span class="f">Ne laisse pas le feu allumé ! (sukūn → kasra de liaison)</span></div>
  <div class="ex1"><span class="a">لَا تَذْهَبُوا إِلَى الغَابَةِ وَحْدَكُمْ</span><span class="f">N'allez pas seuls dans la forêt ! (nūn supprimé)</span></div>
  <div class="ex1"><span class="a">لَا تَسْبَحْ بَعْدَ الأَكْلِ</span><span class="f">Ne nage pas après avoir mangé !</span></div>
</div>`},

/* ---------------------------------------------------------------- 13 */
{n:13, t:'Choisis celle qui a la religion', ar:'فَاظْفَرْ بِذَاتِ الدِّينِ', html:`
<div class="txt"><div class="tt">مُلَخَّصُ الحِوَارِ</div><div class="body">بِلَالٌ قَلِقٌ، لِأَنَّهُ يُرِيدُ الزَّوَاجَ وَلَا يَجِدُ الفَتَاةَ المُنَاسِبَةَ. تَقْتَرِحُ عَلَيْهِ أُمُّهُ فَتَيَاتٍ كَثِيرَاتٍ، وَهُوَ يَبْحَثُ عَنِ المَالِ وَالجَمَالِ وَالحَسَبِ. فَتَقُولُ لَهُ أُمُّهُ : هٰذِهِ الأَشْيَاءُ وَحْدَهَا لَا تُحَقِّقُ السَّعَادَةَ، فَعَلَيْكَ بِذَاتِ الدِّينِ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Bilāl est inquiet : il veut se marier et ne trouve pas la jeune fille qui convient. Sa mère lui propose beaucoup de jeunes filles, mais il cherche la richesse, la beauté et la noblesse. Sa mère lui dit : ces choses seules ne réalisent pas le bonheur ; attache-toi à celle qui a la religion.</div></details>
<div class="hadith"><div class="a">تُنْكَحُ المَرْأَةُ لِأَرْبَعٍ : لِمَالِهَا، وَلِحَسَبِهَا، وَلِجَمَالِهَا، وَلِدِينِهَا، فَاظْفَرْ بِذَاتِ الدِّينِ تَرِبَتْ يَدَاكَ</div><div class="f">« On épouse une femme pour quatre raisons : ses biens, sa lignée, sa beauté et sa religion. Choisis donc celle qui a la religion, que tes mains se couvrent de poussière ! »</div><div class="src">Rapporté par al-Bukhārī et Muslim (Riyāḍ aṣ-Ṣāliḥīn n° 364).</div></div>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">قَلِقٌ</td><td>inquiet, anxieux</td></tr>
  <tr><td class="ac">مُنَاسِبَةٌ</td><td>qui convient</td></tr>
  <tr><td class="ac">فَقِيرَةٌ ≠ غَنِيَّةٌ</td><td>pauvre ≠ riche</td></tr>
  <tr><td class="ac">الحَسَبُ وَالنَّسَبُ</td><td>la noblesse (qualités, rang) et la lignée</td></tr>
  <tr><td class="ac">السَّعَادَةُ</td><td>le bonheur</td></tr>
  <tr><td class="ac">تُحَقِّقُ</td><td>elle réalise</td></tr>
  <tr><td class="ac">فَاظْفَرْ</td><td>emporte, obtiens (impératif de ظَفِرَ)</td></tr>
</tbody></table></div>
<h3 class="sub">Règles</h3>
<div class="rule">
  <div><span class="arword">عَلَيْكَ</span> (« attache-toi à… ») n'est pas un verbe mais un mot qui a le <b>sens d'un impératif</b> : <span class="arword">اِسْمُ فِعْلِ أَمْرٍ</span> (عَلَى + كَ).</div>
  <div>Le <b>wāw de prolongation</b> (<span class="arword">وَاوُ المَدِّ</span>) est une voyelle longue, toujours avec sukūn, jamais en début de mot : <span class="arword">نُورٌ</span>. Le <b>wāw consonne</b> (<span class="arword">وَاوُ اللِّينِ</span> / consonne) accepte les voyelles et le sukūn et peut être au début, au milieu ou à la fin : <span class="arword">وَلَدٌ، ثَوْرٌ</span>.</div>
  <div>Le <b>masculin</b> désigne un être masculin ; le <b>féminin</b> un être féminin. Parmi les marques du féminin : la <b>tā’ marbūṭa</b> (avec des exceptions).</div>
</div>`},

/* ---------------------------------------------------------------- R2 */
{n:'R2', annex:true, tag:'R2', t:'Compréhension et traduction (2) · pluriels', ar:'التَّرْجَمَةُ وَالفَهْمُ (٢)', html:`
<div class="rule">
  <div>Un <b>nom propre féminin</b> est diptote (sans tanwīn) : <span class="arword">جَاءَتْ فَاطِمَةُ، رَأَيْتُ زَيْنَبَ، مَرَرْتُ بِمَرْيَمَ</span>.</div>
  <div>L'<b>annexion</b> rend défini : dans <span class="arword">سَيَّارَةُ فَاطِمَةَ</span>, <span class="arword">سَيَّارَةُ</span> devient <b>ma‘rifa</b> → son adjectif prend ال : <span class="arword">سَيَّارَةُ فَاطِمَةَ الجَمِيلَةُ</span>.</div>
  <div>Après <span class="arword">لَا النَّاهِيَةُ</span>, le présent est <b>majzūm</b> ; après <span class="arword">لَا النَّافِيَةُ</span>, il reste <b>marfū‘</b>.</div>
</div>
<h3 class="sub">Les pluriels</h3>
<div class="schema cols-3">
  <div class="scard r-sujet"><div class="top">سَالِمٌ (مُذَكَّرٌ)</div><div class="fr-s">le singulier reste <b>intact</b> + <b>ـُونَ / ـِينَ</b></div><div class="ex">مُعَلِّمُونَ</div></div>
  <div class="scard r-info"><div class="top">سَالِمٌ (مُؤَنَّثٌ)</div><div class="fr-s">singulier intact + <b>ـَاتٌ</b></div><div class="ex">مُعَلِّمَاتٌ</div></div>
  <div class="scard r-cod"><div class="top">تَكْسِيرٌ</div><div class="fr-s">le singulier est « <b>brisé</b> » : aucun suffixe</div><div class="ex">كُتُبٌ · رِجَالٌ</div></div>
</div>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th>Pluriel brisé…</th><th>Nombre</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td>de petit nombre <span class="ar">جَمْعُ القِلَّةِ</span></td><td>de 3 à 10</td><td class="ac">فِتْيَةٌ · أَوْلَادٌ</td></tr>
  <tr><td>de grand nombre <span class="ar">جَمْعُ الكَثْرَةِ</span></td><td>plus de 10</td><td class="ac">فِتْيَانٌ</td></tr>
</tbody></table></div>
<p class="faint" style="font-size:.86rem">On les reconnaît par leur <b>schème</b> : <span class="arword">جَاءَ الفِتْيَةُ</span> (quelques jeunes) / <span class="arword">جَاءَ الفِتْيَانُ</span> (de nombreux jeunes).</p>`},

/* ---------------------------------------------------------------- 14 */
{n:14, t:'Y a-t-il des problèmes entre les époux ?', ar:'هَلْ بَيْنَ الزَّوْجَيْنِ مَشَاكِلُ؟', html:`
<div class="txt"><div class="tt">الحَيَاةُ الزَّوْجِيَّةُ (مُلَخَّصٌ)</div><div class="body">فِي الحَيَاةِ الزَّوْجِيَّةِ خَيْرٌ كَثِيرٌ، وَلٰكِنْ قَدْ تَظْهَرُ بَعْضُ المَشَاكِلِ. لَيْسَتِ المُشْكِلَةُ فِي وُجُودِ الخِلَافَاتِ، بَلْ أَنْ نَعْجِزَ عَنْ حَلِّهَا. الحَيَاةُ الزَّوْجِيَّةُ رِحْلَةٌ طَوِيلَةٌ، وَالسَّبِيلُ إِلَى النَّجَاحِ فِيهَا هُوَ الحِوَارُ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Dans la vie conjugale il y a beaucoup de bien, mais des problèmes peuvent apparaître. Le problème n'est pas l'existence de désaccords, mais d'être incapables de les résoudre. La vie conjugale est un long voyage, et le chemin de la réussite est le dialogue.</div></details>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">الزَّوْجَانِ</td><td>les deux époux</td><td class="ac">خِلَافَاتٌ</td><td>désaccords</td></tr>
  <tr><td class="ac">عَاجِزٌ عَنْ</td><td>incapable de</td><td class="ac">حَلٌّ</td><td>solution</td></tr>
  <tr><td class="ac">ثَارُوا</td><td>ils se sont révoltés, emportés</td><td class="ac">الطَّلَاقُ</td><td>le divorce</td></tr>
  <tr><td class="ac">رِحْلَةٌ</td><td>voyage</td><td class="ac">السَّبِيلُ</td><td>la voie, le chemin</td></tr>
  <tr><td class="ac">شَخْصِيَّةٌ</td><td>personnalité</td><td class="ac">يَشْكُو · الشَّكْوَى</td><td>se plaindre · la plainte</td></tr>
  <tr><td class="ac">السِّيَاسَةُ</td><td>la politique</td><td class="ac">الصُّحُفُ · المَجَلَّاتُ</td><td>journaux · magazines</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : nominale ou verbale ?</h3>
<div class="roads">
  <div class="road nom"><div class="top">جُمْلَةٌ اِسْمِيَّةٌ</div><div class="q">commence par un nom</div><div class="ex">الحِوَارُ سَبِيلُ النَّجَاحِ</div></div>
  <div class="road verb"><div class="top">جُمْلَةٌ فِعْلِيَّةٌ</div><div class="q">commence par un verbe</div><div class="ex">تَحْدُثُ خِلَافَاتٌ بَيْنَ الزَّوْجَيْنِ</div></div>
</div>`},

/* ---------------------------------------------------------------- 15 */
{n:15, t:'Veiller hors de la maison · expressions', ar:'السَّهَرُ خَارِجَ البَيْتِ', html:`
<div class="txt"><div class="tt">مُلَخَّصُ الحِوَارِ</div><div class="body">يُرِيدُ نَاصِرٌ أَنْ يَتْرُكَ زَوْجَتَهُ، لِأَنَّهَا تَغَيَّرَتْ وَأَصْبَحَتْ مُهْمِلَةً. فَسَأَلَهُ صَدِيقُهُ فَيْصَلٌ : هَلْ تَغَيَّرْتَ أَنْتَ؟ فَاعْتَرَفَ نَاصِرٌ أَنَّهُ يَسْهَرُ كَثِيرًا خَارِجَ البَيْتِ. فَنَصَحَهُ فَيْصَلٌ : لَا تَسْهَرْ خَارِجَ البَيْتِ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Nāṣir veut quitter sa femme car elle a changé et est devenue négligente. Son ami Fayṣal lui demande : et toi, as-tu changé ? Nāṣir avoue qu'il veille beaucoup hors de la maison. Fayṣal lui conseille : ne veille pas hors de la maison.</div></details>
<div class="pills"><span class="pill">مُطِيعَةٌ <small>obéissante, dévouée</small></span><span class="pill">مُهْمِلَةٌ <small>négligente</small></span><span class="pill">عَنِيدَةٌ <small>têtue</small></span><span class="pill">لَا تَهْتَمُّ بِـ <small>elle ne s'occupe pas de</small></span><span class="pill">تَغَيَّرَتْ <small>elle a changé</small></span><span class="pill">أَسْهَرُ <small>je veille</small></span><span class="pill">فِعْلًا <small>effectivement</small></span></div>
<h3 class="sub">Expressions à connaître</h3>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Expression</th><th>Quand l'utiliser</th></tr></thead><tbody>
  <tr><td class="ac">إِنْ شَاءَ اللهُ</td><td>quand on parle d'une action future</td></tr>
  <tr><td class="ac">بِإِذْنِ اللهِ</td><td>quand on promet quelque chose</td></tr>
  <tr><td class="ac">جَزَاكَ اللهُ خَيْرًا</td><td>pour remercier (invocation)</td></tr>
  <tr><td class="ac">شَفَاكَ اللهُ</td><td>pour souhaiter la guérison à un malade</td></tr>
  <tr><td class="ac">فِكْرَةٌ طَيِّبَةٌ</td><td>pour approuver (« bonne idée »)</td></tr>
  <tr><td class="ac">يَا لَهُ مِنْ أَمْرٍ عَجِيبٍ!</td><td>étonnement</td></tr>
  <tr><td class="ac">إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ</td><td>face à un malheur, une mauvaise nouvelle</td></tr>
</tbody></table></div>
<div class="hadith"><div class="a">إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلِنَفْسِكَ عَلَيْكَ حَقًّا، وَلِأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ</div><div class="f">« Ton Seigneur a un droit sur toi, ta personne a un droit sur toi et ta famille a un droit sur toi : donne à chacun son dû. » — Paroles de Salmān à Abū ad-Dardā’, que le Prophète ﷺ approuva : « Salmān a dit vrai. »</div><div class="src">Rapporté par al-Bukhārī.</div></div>`},

/* ---------------------------------------------------------------- R3 */
{n:'R3', annex:true, tag:'R3', t:'Le tā’ du féminin au passé', ar:'تَاءُ التَّأْنِيثِ السَّاكِنَةُ', html:`
<p class="lead">Au passé, le verbe dont le sujet est féminin reçoit à la fin un <span class="arword">تْ</span> avec sukūn : la <b>tā’ du féminin</b>. Elle se place <b>après</b> le verbe (suffixe).</p>
<div class="exs">
  <div class="ex1"><span class="a">ذَهَبَتْ فَاطِمَةُ</span><span class="f">Fāṭima est partie.</span></div>
  <div class="ex1"><span class="a">تَغَيَّرَتِ الزَّوْجَةُ</span><span class="f">L'épouse a changé (sukūn → kasra de liaison devant ال).</span></div>
</div>
<div class="warn"><div class="ct">L'accord</div><p>Quand le verbe est au passé et suivi de son sujet, ils s'accordent en <b>genre</b>… mais <b>pas en nombre</b> : <span class="arword">ذَهَبَتِ الطَّالِبَاتُ</span> (et non ذَهَبْنَ الطَّالِبَاتُ).</p></div>
<div class="roads">
  <div class="road verb"><div class="top">ت (verbe)</div><div class="q">tā’ « ouverte » : <b>تْ</b> du féminin, toujours lue « t »</div><div class="ex">قَالَتْ</div></div>
  <div class="road nom"><div class="top">ة (nom)</div><div class="q">tā’ marbūṭa : se lit « h » à la pause</div><div class="ex">زَوْجَةٌ</div></div>
</div>`},

/* ---------------------------------------------------------------- 16 */
{n:16, t:'La famille, hier et aujourd’hui · les pronoms', ar:'الأُسْرَةُ بَيْنَ الأَمْسِ وَاليَوْمِ', html:`
<div class="txt"><div class="tt">الأُسْرَةُ (مُلَخَّصٌ)</div><div class="body">كَانَتِ الأُسْرَةُ الكَبِيرَةُ تَسْكُنُ فِي بَيْتٍ وَاحِدٍ يَضُمُّ جَمِيعَ أَفْرَادِهَا. ثُمَّ اخْتَفَتْ فِي مُجْتَمَعَاتٍ كَثِيرَةٍ، وَظَهَرَتِ الأُسْرَةُ الصَّغِيرَةُ : الزَّوْجُ وَالزَّوْجَةُ وَالأَوْلَادُ. وَضَعُفَتِ العَلَاقَةُ بَيْنَ أَفْرَادِ الأُسْرَةِ، لِأَنَّ الآبَاءَ يَقْضُونَ مُعْظَمَ الوَقْتِ فِي العَمَلِ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>La grande famille habitait une seule maison qui réunissait tous ses membres. Puis elle a disparu dans de nombreuses sociétés, et la petite famille est apparue : le mari, l'épouse et les enfants. Le lien entre les membres de la famille s'est affaibli, car les parents passent la plupart du temps au travail.</div></details>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">نِظَامٌ</td><td>organisation, système</td><td class="ac">اِخْتِفَاءٌ</td><td>disparition</td></tr>
  <tr><td class="ac">يَضُمُّ</td><td>réunir, contenir</td><td class="ac">أَفْرَادٌ (فَرْدٌ)</td><td>membres</td></tr>
  <tr><td class="ac">مُعْظَمٌ</td><td>la plupart</td><td class="ac">نَاحِيَةٌ</td><td>côté, aspect</td></tr>
  <tr><td class="ac">غَادَرَ</td><td>quitter</td><td class="ac">مُتْعَبَةٌ</td><td>fatiguée</td></tr>
  <tr><td class="ac">نَظَافَةٌ</td><td>propreté, ménage</td><td class="ac">إِعْدَادُ الطَّعَامِ</td><td>préparation du repas</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : les pronoms</h3>
<div class="schema cols-2">
  <div class="scard"><div class="top">الضَّمِيرُ المُنْفَصِلُ</div><div class="mid">pronom isolé</div><div class="ex">هُوَ · هِيَ · نَحْنُ</div></div>
  <div class="scard"><div class="top">الضَّمِيرُ المُتَّصِلُ</div><div class="mid">pronom attaché</div><div class="ex">بَيْتُهُ · يَتْرُكُونَهُمْ</div></div>
</div>
<div class="clair"><div class="ct">À noter</div><p>Pour <span class="arword">نَحْنُ</span> (1ʳᵉ personne du pluriel) et pour le <b>duel</b> (<span class="arword">أَنْتُمَا، هُمَا</span>), il n'y a <b>pas de différence de genre</b>. Tableau complet dans l'outil <a href="#/outils/pronoms">Pronoms</a>.</p></div>`},

/* ---------------------------------------------------------------- 17 */
{n:17, t:'La famille (suite) · la particule lam', ar:'لَمْ : حَرْفُ نَفْيٍ وَجَزْمٍ وَقَلْبٍ', html:`
<p class="lead"><span class="arword">لَمْ</span> est une particule de <b>négation</b>, de <b>jazm</b> et de <b>« retournement »</b> (<span class="arword">قَلْبٌ</span>) : elle se place devant un <b>présent</b>, le met au <b>majzūm</b>, et lui donne un sens <b>passé</b>.</p>
<div class="irab"><div class="phrase">لَمْ يَرَ الآبَاءُ أَطْفَالَهُمْ</div>
  <div class="row"><b>لَمْ :</b> حَرْفُ نَفْيٍ وَجَزْمٍ وَقَلْبٍ.</div>
  <div class="row"><b>يَرَ :</b> فِعْلٌ مُضَارِعٌ مَجْزُومٌ وَعَلَامَةُ جَزْمِهِ حَذْفُ حَرْفِ العِلَّةِ.</div>
  <div class="row"><b>الآبَاءُ :</b> فَاعِلٌ مَرْفُوعٌ. <b>أَطْفَالَهُمْ :</b> مَفْعُولٌ بِهِ مَنْصُوبٌ.</div>
  <div class="tr">« Les pères n'ont pas vu leurs enfants. »</div></div>
<div class="exs">
  <div class="ex1"><span class="a">لَمْ تَجِدِ الأُمُّ وَقْتًا لِلْجُلُوسِ مَعَ أَطْفَالِهَا</span><span class="f">La mère n'a pas trouvé le temps de s'asseoir avec ses enfants.</span></div>
  <div class="ex1"><span class="a">لَمْ يَرْجِعُوا إِلَّا فِي اللَّيْلِ</span><span class="f">Ils ne sont revenus que la nuit (nūn supprimé).</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p><span class="arword">مَا رَأَى</span> (passé) et <span class="arword">لَمْ يَرَ</span> (présent majzūm) ont le même sens : « il n'a pas vu ». Le second est très fréquent dans les textes.</p></div>`},

/* ---------------------------------------------------------------- 18 */
{n:18, t:'Entre le village et la ville · les conjonctions', ar:'بَيْنَ القَرْيَةِ وَالمَدِينَةِ · حُرُوفُ العَطْفِ', html:`
<div class="txt"><div class="tt">مُلَخَّصُ الحِوَارِ</div><div class="body">تُرِيدُ الأُمُّ أَنْ تَتْرُكَ القَرْيَةَ وَتَسْكُنَ فِي العَاصِمَةِ، لِأَنَّ أَوْلَادَهَا يَعِيشُونَ هُنَاكَ. وَالأَبُ يُحِبُّ بَيْتَهُ وَمَزْرَعَتَهُ، وَلَا يُحِبُّ العَاصِمَةَ، فَفِيهَا التَّلَوُّثُ وَالضَّوْضَاءُ وَالاِزْدِحَامُ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>La mère veut quitter le village et habiter dans la capitale, car ses enfants y vivent. Le père aime sa maison et sa ferme et n'aime pas la capitale, où il y a la pollution, le bruit et la foule.</div></details>
<div class="pills"><span class="pill">العَاصِمَةُ <small>la capitale</small></span><span class="pill">رَحَلَ <small>partir, voyager</small></span><span class="pill">مَزْرَعَةٌ <small>ferme</small></span><span class="pill">الزَّرْعُ <small>les cultures</small></span><span class="pill">الحَوَادِثُ <small>les accidents</small></span><span class="pill">التَّلَوُّثُ <small>la pollution</small></span><span class="pill">الضَّوْضَاءُ <small>le vacarme</small></span><span class="pill">الاِزْدِحَامُ <small>la foule, l'affluence</small></span><span class="pill">الجِيرَانُ <small>les voisins</small></span></div>
<h3 class="sub">Règle : les conjonctions de coordination <span class="ar">حُرُوفُ العَطْفِ</span></h3>
<p>Elles relient ce qui suit à ce qui précède ; le mot coordonné prend le <b>même cas</b> : <span class="arword">رَأَيْتُ مُحَمَّدًا وَزَيْدًا</span>.</p>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th class="ac">Conjonction</th><th>Sens</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td class="ac">وَ</td><td>et — simple réunion, <b>sans ordre</b> (<span class="ar">مُطْلَقُ الجَمْعِ</span>)</td><td class="ac">جَاءَ مُحَمَّدٌ وَزَيْدٌ</td></tr>
  <tr><td class="ac">فَـ</td><td>puis aussitôt — <b>ordre</b> immédiat</td><td class="ac">رَأَيْتُ مُحَمَّدًا فَزَيْدًا</td></tr>
  <tr><td class="ac">ثُمَّ</td><td>puis, ensuite — ordre + <b>délai</b></td><td class="ac">جَاءَ مُحَمَّدٌ ثُمَّ زَيْدٌ</td></tr>
  <tr><td class="ac">أَوْ</td><td>ou</td><td class="ac">خُذْ كِتَابًا أَوْ قَلَمًا</td></tr>
</tbody></table></div>`},

/* ---------------------------------------------------------------- 19 */
{n:19, t:'Préférer la vie dans les grandes villes', ar:'الحَيَاةُ فِي المُدُنِ الكَبِيرَةِ', html:`
<div class="txt"><div class="tt">المُدُنُ الكَبِيرَةُ (مُلَخَّصٌ)</div><div class="body">يَعِيشُ مَلَايِينُ النَّاسِ فِي المُدُنِ الكَبِيرَةِ، وَيُوَاجِهُونَ مَشَاكِلَ كَثِيرَةً، مِثْلَ التَّلَوُّثِ وَالجَرِيمَةِ وَالاِزْدِحَامِ. وَبِالرَّغْمِ مِنْ ذٰلِكَ يُفَضِّلُ كَثِيرٌ مِنْهُمُ الحَيَاةَ فِيهَا، لِأَنَّ فِيهَا المَصَانِعَ وَالشَّرِكَاتِ وَالجَامِعَاتِ وَالمُسْتَشْفَيَاتِ. وَيَزْدَادُ سُكَّانُ المُدُنِ كُلَّ يَوْمٍ، لِأَنَّ أَهْلَ الرِّيفِ يُهَاجِرُونَ إِلَيْهَا.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Des millions de personnes vivent dans les grandes villes et y affrontent de nombreux problèmes : la pollution, la criminalité, la foule. Malgré cela, beaucoup préfèrent y vivre, car il y a les usines, les entreprises, les universités et les hôpitaux. La population des villes augmente chaque jour, car les habitants de la campagne y émigrent.</div></details>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">مَلَايِينُ</td><td>des millions</td><td class="ac">يُوَاجِهُ</td><td>affronter, être confronté à</td></tr>
  <tr><td class="ac">الجَرِيمَةُ</td><td>la criminalité</td><td class="ac">بِالرَّغْمِ مِنْ</td><td>malgré</td></tr>
  <tr><td class="ac">المَصَانِعُ (مَصْنَعٌ)</td><td>les usines</td><td class="ac">الرِّيفُ</td><td>la campagne</td></tr>
  <tr><td class="ac">الرَّعْيُ</td><td>l'élevage, le pâturage</td><td class="ac">أَدْرَكَ</td><td>se rendre compte, saisir</td></tr>
  <tr><td class="ac">بَلَغَ</td><td>atteindre</td><td class="ac">نِسْبَةٌ</td><td>taux, pourcentage</td></tr>
  <tr><td class="ac">سُكَّانُ العَالَمِ</td><td>les habitants du monde</td><td class="ac">دُوَلُ العَالَمِ الثَّالِثِ</td><td>les pays du tiers-monde</td></tr>
  <tr><td class="ac">القَرْنُ</td><td>le siècle</td><td class="ac">بَنَى · أَنْشَأَ</td><td>construire</td></tr>
</tbody></table></div>
<h3 class="sub">Petits mots pour argumenter</h3>
<div class="schema cols-3">
  <div class="scard"><div class="top">لِأَنَّ</div><div class="fr-s">parce que (+ nom ou pronom)</div></div>
  <div class="scard"><div class="top">لٰكِنَّ · لٰكِنْ</div><div class="fr-s">mais</div></div>
  <div class="scard"><div class="top">بِالرَّغْمِ مِنْ</div><div class="fr-s">malgré</div></div>
</div>
<div class="clair"><div class="ct">Remarque</div><p><span class="arword">مَصَانِعُ</span> et <span class="arword">مَلَايِينُ</span> sont des pluriels du type <span class="arword">مَفَاعِلُ / مَفَاعِيلُ</span> : diptotes (pas de tanwīn) — voir R1.</p></div>`},

/* ---------------------------------------------------------------- R5 */
{n:'R5', annex:true, tag:'R5', t:'Bilan : comprendre et traduire', ar:'التَّرْجَمَةُ وَالفَهْمُ : مُرَاجَعَةٌ', html:`
<p class="lead">Méthode pour traduire une phrase arabe sans se perdre :</p>
<div class="rule">
  <div><b>Repère le type de phrase</b> : nominale (nom en tête) ou verbale (verbe en tête).</div>
  <div><b>Trouve le verbe et son temps</b> : passé, présent (+ سَـ = futur), impératif ; nié par مَا / لَمْ / لَا / لَنْ ?</div>
  <div><b>Cherche le sujet</b> (ḍamma, ou pronom caché) puis le <b>complément</b> (fatḥa).</div>
  <div><b>Repère les groupes</b> : annexion (« le … de … »), préposition + nom (kasra), adjectifs (même cas, même article).</div>
  <div><b>Traduis le sens</b>, pas mot à mot : « être » n'apparaît pas au présent en arabe.</div>
</div>
<h3 class="sub">Entraînement</h3>
<details class="sol"><summary><span class="ar">لَمْ يَذْهَبْ عَامِرٌ إِلَى الطَّبِيبِ.</span></summary><div>‘Āmir n'est pas allé chez le médecin. (لَمْ + présent majzūm = passé nié)</div></details>
<details class="sol"><summary><span class="ar">لَا تَسْهَرْ خَارِجَ البَيْتِ.</span></summary><div>Ne veille pas hors de la maison ! (لَا de l'interdiction)</div></details>
<details class="sol"><summary><span class="ar">سَأَتَّبِعُ الحِمْيَةَ.</span></summary><div>Je suivrai le régime. (سَـ = futur)</div></details>
<details class="sol"><summary><span class="ar">يَا أَبَا عَمْرٍو، مَا رَأْيُكَ؟</span></summary><div>Ô Abū ‘Amr, quel est ton avis ? (vocatif : أَبَا, annexé)</div></details>
<details class="sol"><summary><span class="ar">يَعِيشُ مَلَايِينُ النَّاسِ فِي المُدُنِ الكَبِيرَةِ.</span></summary><div>Des millions de gens vivent dans les grandes villes. (verbe au singulier devant un sujet pluriel)</div></details>

 {c:17, d:'d', q:'« Ils ne sont pas revenus » avec لَمْ :', o:['لَمْ يَرْجِعُونَ','لَمْ يَرْجِعُوا','لَمْ رَجَعُوا','لَنْ يَرْجِعُوا'], a:[1], j:'لَمْ + présent majzūm (nūn supprimé).', cat:'gram'},
 {c:18, d:'m', q:'Quelle conjonction indique l’ordre avec un délai ?', o:['وَ','فَـ','ثُمَّ','أَوْ'], a:[2], j:'جَاءَ مُحَمَّدٌ ثُمَّ زَيْدٌ.', cat:'gram'},

 {c:19, d:'m', q:'بِالرَّغْمِ مِنْ signifie :', o:['parce que','malgré','grâce à','à cause de'], a:[1], j:'', cat:'vocab'},

 {c:19, d:'f', q:'Le singulier de مَصَانِعُ :', o:['صَانِعٌ','مَصْنَعٌ','صِنَاعَةٌ','مَصْنُوعٌ'], a:[1], j:'مَصْنَعٌ = usine.', cat:'vocab'},
 {c:'R5', d:'m', q:'لَمْ يَذْهَبْ عَامِرٌ إِلَى الطَّبِيبِ se traduit :', o:['‘Āmir n’ira pas chez le médecin','‘Āmir n’est pas allé chez le médecin','‘Āmir ne va pas chez le médecin','‘Āmir, ne va pas chez le médecin !'], a:[1], j:'لَمْ + présent majzūm = passé nié.', cat:'gram'},

],"j":"","cat":"qcm"},{"id":"s1-c19-q3","c":19,"d":"m","t":"qcm","q":"tā’ marbūṭa (ة) à l’arrêt (waqf) se lit :","o":["t","h","d","r"],"a":[1],"j":"","cat":"qcm"},{"id":"s1-c19-q4","c":19,"d":"m","t":"qcm","q":"amākin est un pluriel :","o":["masculin sain","féminin sain","cassé","duel"],"a":[2],"j":"","cat":"qcm"},{"id":"s1-c19-v0","c":19,"d":"f","t":"vf","q":"« En arabe, le sujet précède le verbe dans la phrase verbale. »","o":["Vrai","Faux"],"a":[1],"j":"Il suit le verbe.","cat":"vf"},{"id":"s1-c19-v1","c":19,"d":"f","t":"vf","q":"« Muslimāt est un pluriel féminin sain. »","o":["Vrai","Faux"],"a":[0],"j":"Suffixe -āt.","cat":"vf"},{"id":"s1-c19-v2","c":19,"d":"f","t":"vf","q":"« Zahratu en liaison devient Zahrah à l’arrêt. »","o":["Vrai","Faux"],"a":[0],"j":"Tā’ marbūṭa → h en pause.","cat":"vf"},{"id":"s1-c19-v3","c":19,"d":"f","t":"vf","q":"« Le pluriel cassé conserve la forme du singulier. »","o":["Vrai","Faux"],"a":[1],"j":"La forme change (elle est « brisée »).","cat":"vf"},{"id":"s1-c19-v4","c":19,"d":"f","t":"vf","q":"« Qālat porte une tā’ maftūḥa car c’est un verbe au féminin. »","o":["Vrai","Faux"],"a":[0],"j":".","cat":"vf"}],"pts":{"1":["L’arabe est indispensable pour la pratique (prière, invocations) et la compréhension (Coran, ḥadīth, fiqh).","Le cours adopte l’arabe littéral (fuṣḥā), commun à tous les pays arabophones.","Défi majeur pour le francophone : sons absents du français → écouter d’abord, produire ensuite.","Priorité : communication réelle en situations (classe, marché, famille, médecin…).","Quatre compétences indissociables : écouter, lire, parler, écrire.","Lecture : commencer par des textes vocalisés ; respecter lieux et modes d’articulation.","Écriture : droite→gauche, formes contextuelles des lettres, pas de majuscules/minuscules.","Objectif final : lire correctement Coran et hadiths, et manier le lexique islamique courant.","Motivation + méthode adaptée + pratique régulière = progression réelle.","Prochain cours : inventaire et maîtrise des sons."],"2":["Alphabet arabe = 28 lettres, toutes consonnes ; la voyelle est un signe.","Écriture droite→gauche ; formes des lettres selon position (début/milieu/fin/isolée).","Groupes à distinguer par les points : ب/ت/ث, ج/ح/خ, د/ذ, ر/ز, س/ش, ص/ض, ط/ظ.","Lettres non-liantes avec ce qui suit : ا/أ، د، ذ، ر، ز، و.","Sons emphatiques (ص/ض/ط/ظ) et sons interdentaux (ث/ذ) → exigent un effort spécifique.","ق ≠ ك ; ne pas confondre خ avec ق.","Voyelles courtes : بَ/بِ/بُ = ba/bi/bu (signes au-dessus/en-dessous).","On lit ce qu’on écrit (règle générale), d’où l’intérêt d’apprendre écriture + lecture ensemble."],"3":["L’arabe a 28 consonnes ; la voyelle est un signe (ḥaraka).","Fatḥa/Kasra/ḍamma : a / i / u (courts), posés sur/sous la lettre.","Sukūn indique zéro voyelle → fermeture : ab, ib, ub ; ar, ir, ur.","Changer la voyelle change la lecture et peut changer le sens (ex. kataba ≠ kutiba).","On écrit ce qu’on entend ; pas de majuscules/minuscules, mais formes selon la position.","Progression recommandée : maîtriser ba/bi/bu sur tout l’alphabet, puis enchaîner sur des mots simples."],"4":["Trois voyelles brèves (a/i/u) ↔ trois voyelles longues (ā/ī/ū).","Alif allonge a, yā’ allonge i, wāw allonge u.","Ne pas allonger si le signe d’allongement n’est pas présent.","Allonger quand il est écrit (sinon faute de lecture).","Certaines lettres ne s’attachent pas à ce qui suit (effet visible lors du madd).","La pause se marque par sukūn sur la voyelle brève finale.","Salutation : as-salāmu ‘alaykum → réponse wa ‘alaykumu s-salām wa raḥmatu-llāh.","Se présenter : ismī … ; Demander le nom : mā ismuka/ismuki ? ; Demander l’état : kayfa l-ḥāl ? ; Répondre : anā bi-khayr, al-ḥamdu lillāh."],"5":["Une lettre = plusieurs formes : début / milieu / fin / isolée.","ب / م / ف / و : savoir les écrire et les reconnaître à toutes les positions.","و n’est pas liant vers la droite (ne s’attache pas à ce qui suit).","Tanwīn : ـً = -an (avec alif écrit), ـٍ = -in, ـٌ = -un.","Le -n du tanwīn est prononcé, l’alif (de ـً) ne l’est pas.","Le tanwīn marque l’indéfini (développement grammatical ultérieur).","Les voyelles servent la lecture ; ne pas confondre tanwīn avec voyelle longue.","Vocabulaire : répertorier les mots nouveaux dans un cahier personnel."],"6":["هذا = masculin ; هذه = féminin ; tous deux = proche.","Féminin : souvent ـة (tā’ marbūṭa) → هذه.","Masculin : pas de tā’ marbūṭa → هذا (sauf exceptions comme نَارٌ).","Le tanwīn indique un/une (indéfini) et se prononce -n.","Français ≠ arabe pour le genre : « mosquée/maison/porte » sont masculins en arabe.","Question : ما هذا؟ / ما هذه؟ → réponse avec هذا/هذه + nom indéfini.","Possessif -ي : جَدِّي، أُمِّي، أَخِي (« mon/ma »).","Utiliser هذا/هذه pour humains, animaux, choses selon le genre arabe."],"7":["مَا = « quoi ? » (choses/animaux) ; مَنْ = « qui ? » (personnes).","هَلْ / أَ introduisent une question oui/non ; répondre نَعَم / لَا.","هذا avec masculin, هذه avec féminin (souvent ـة).","Toujours réutiliser le démonstratif dans la réponse : نَعَم، هٰذَا… / لَا، هٰذِهِ…","Le tanwīn marque l’indéfini : كِتَابٌ، بَيْتٌ، سَيَّارَةٌ…","Ne pas confondre chat/chien, cheval/âne, etc. : vérifier et corriger avec لَا + bonne phrase.","En présentation : أَنَا… / هَلْ أَنْتَ…؟ → نَعَم / لَا + profession/statut."],"8":["Deux familles de pronoms : isolés vs suffixes (aujourd’hui : isolés).","أَنَا، أَنْتَ/أَنْتِ، هُوَ، هِيَ : maîtriser formes et accords.","Féminin en ـة : طَالِبَةٌ، مُهَنْدِسَةٌ، مُدَرِّسَةٌ…","Présentation type : أَنَا + nationalité / مِهْنَة ; مِنْ أَيْنَ أَنْتَ؟ ; كَيْفَ الحَالُ؟","Réponse d’état : بِخَيْرٍ، وَالْحَمْدُ لِلَّهِ.","Chiffres 0–10 : صِفْرٌ → عَشَرَةٌ.","Ne pas confondre هٰذَا/هٰذِهِ (démonstratifs) avec هُوَ/هِيَ (pronoms personnels)."],"9":["Chaddah = consonne doublée ; jamais en début de mot.","Lire correctement : …ّ + a/u/i → …a/u/i avec doublement.","Tanwīn = indéfini ; al- = défini.","Qamariyya : on entend « al » ; Shamsiyya : on assimile et on double la lettre suivante.","Reconnaître l’assimilation dans : الشَّمْس، النُّور، الطِّفْل، الصَّدِيق…","Tā’ marbūṭa marque le féminin ; vigilance sur l’accord.","ت، د، ض : connaître leurs formes selon la position et leurs propriétés d’attache.","En lecture, surveiller la place de la voyelle par rapport à la Chaddah (ex. مُدَرِّبٌ)."],"10":["Ayna = « où ? » ; on répond par un lieu.","taḥta/khalf/fawqa/amāma → kasra sur le nom suivant.","al- : lire al avec qamariyya, assimiler avec shamsiyya.","Phrases simples : verbe (accompli) + sujet (kataba Zaydun, kharaja Muḥammadun…).","Yā’ possessif (-ī) : abī, ummī, baytī, etc.","س/ص/ز : connaître les formes début/milieu/fin/isolée.","11–19 : unité + ‘ashara ; 20 : ‘ishrūna.","Multiplier les phrases à partir du vocabulaire déjà acquis."],"11":["MAN hādhā/hādhihi ? → attendre un nom ou une profession.","MĀ hādhā/hādhihi ? → attendre un objet/un animal.","hādhā pour masc., hādhihi pour fém. (souvent tā’ marbūṭa).","a / hal + phrase → question oui/non (na‘am / lā).","ana / naḥnu (locuteur) ; anta/anti/antumā/antum/antunna (allocutaire) ; huwa/hiya/humā/hum/hunna (absent).","rā’ ne s’attache pas à ce qui suit ; soigner les tracés de lām / nūn selon la position.","Construire des phrases simples avec le vocabulaire déjà vu."],"12":["Lafẓ ≠ Kalima : le premier peut être sans sens, le second doit en porter un.","Kalim (≥3 mots) peut ne pas être une phrase ; Kalam = phrase complète.","al- → défini ; tanwīn → indéfini.","Ordre usuel : verbe–sujet–compl. ; adapter zahaba/zahabat au genre du sujet.","Ayna / ilā pour lieu/destination ; hal pour question oui/non.","jīm / shīn / yā’ : savoir tracer début–milieu–fin ; dāl / alif ne s’attachent pas.","Les dialogues simples renforcent la mise en pratique du vocabulaire et des structures."],"13":["Trois catégories de mots : ism / fi‘l / ḥarf.","Ism : sens sans temps ; fi‘l : action + temps ; ḥarf : outil dépendant d’un nom/verbe.","Kalam peut avoir 2 mots (nom + nom) ; kalim demande ≥ 3 mots.","Défini par al-, indéfini par tanwīn.","Accord : zahaba (masc.) / zahabat (fém.).","Iḍāfa : le deuxième nom est à kasra (mudarrisu aṭfālin).","Les pronoms suffixes (ex. -tu) sont traités comme ism en analyse grammaticale.","La grammaire (naḥw) guide l’ordre des mots et les cas (sujet/complément)."],"14":["Naḥw = phrase ; Ṣarf = mot.","Mīzān : projeter la racine sur ف/ع/ل, reporter chaque ajout.","K–T–B → kataba / kātib / kitāb / maktab / maktaba.","D–Kh–L → dakhala / yadkhulu / udkhul / dukhūl.","S–J–D → sajada / sujūd / sajjāda / masjid.","‘–L–M → ‘alima / ‘ālim / ‘ilm / ‘ulamā’.","Respect des voyelles dans la pesée : elles comptent.","Écriture : maîtriser les formes et sons de خ / غ (début/milieu/fin, brèves/longues)."],"15":["Ṣarf : mot ; naḥw : phrase.","Mīzān : identifier aṣl / zā’id.","Iḍāfa = « de » (ta‘rīfu aṣ-ṣalāh…).","Waqf : on s’arrête sur sukūn (…الرَّحِيمْ).","Aṣ-ṣalāh = 2ᵉ pilier, farḍ sur chaque musulman.","Hadith : « buniya al-islāmu ‘alā khams… » (inclut iqāmat aṣ-ṣalāh).","Cinq prières obligatoires énumérées explicitement.","Lettre solaire : assimilation de al- dans aṣ-ṣalāt.","Coordination : wa répété pour lister.","Répondre en phrases courtes et correctes en arabe."],"16":["Trois critères décident du démonstratif : distance–genre–nombre.","hādhā/hādhihi (proche) ↔ dhālika/tilka (loin) pour le singulier.","hādhāni/hātāni = duel (proche), accord obligatoire.","hā’ulā’i (proche) / ulā’ika (loin) = pluriel humain.","Pluriel non humain → souvent hādhihi (traité fém. sing.).","Toujours regarder le nom qui suit pour choisir.","Les exemples du cours couvrent masculin/féminin et personnes/choses.","Bien intégrer l’usage de هنا / هناك (ici / là-bas)."],"17":["ʿĪd al-Aḍḥā : souvenir de l’obéissance d’Ibrāhīm et d’Ismāʿīl ; bélier à la place du fils.","Prière de ʿĪd : évoquée comme familiale et joyeuse.","al-jumla al-fiʿliyya = verbe + sujet (obligatoires).","Le sujet (fāʿil) est marfūʿ (ḍamma), vient après le verbe.","L’objet prend fatḥa (ex. ṣalāta l-ʿīd).","Tout verbe a un sujet : à l’analyse, identifie les deux.","Accord du verbe avec le genre du sujet (féminin/masculin).","Interrogatifs utiles : ayna, matā, kaifa, limādhā, mā, kam, man, hal.","À l’arrêt, on neutralise la voyelle courte finale (sukūn).","Lire avec les voyelles aide à voir les fonctions (ḍamma/fatḥa)."],"18":["La phrase verbale exige verbe + sujet ; le sujet est marfū‘ (ḍamma) et vient après le verbe.","Accord verbe/sujet : masculin ↔ masculin, féminin ↔ féminin.","Hadith : dire Bismillāh, manger de la main droite, manger devant soi.","Impératifs relevés : سَمِّ (dis Bismillāh), كُلْ (mange).","Vocabulaire : inā’/ṣaḥfa (assiette), yamīn/yarār (droite/gauche), tataḥarraku (bouger).","Alif : mamdūda (…ـاء) vs maqṣūra (…ـى) — bien distinguer les formes finales.","Phrase nominale : mubtada’ + khabar (pas de verbe exprimé)."],"19":["Verbe + sujet : ordre canonique de la phrase verbale ; sujet marfū‘ (ḍamma).","Accord au féminin : Dhahabat Fāṭimatu…","Phrase nominale : mubtada’ + khabar (sans verbe exprimé).","Pluriels :","Masculin sain : -ūn / -īn ; Féminin sain : -āt ;","Cassé : la forme du singulier change (ex. makān → amākin).","tā’ marbūṭa : -t en liaison, -h en pause ; tā’ maftūḥa : -t y compris en pause.","Lecture/arrêt : bien appliquer les règles de wasl/waqf sur la finale des mots."]},"obj":{"1":["Comprendre pourquoi l’apprentissage de l’arabe est indispensable pour le musulman.","Identifier quel arabe sera étudié (littéral/classique) et pourquoi.","Connaître les compétences visées au niveau 1 : écouter, lire, parler, écrire.","Prendre conscience des défis phonétiques (sons absents du français) et des solutions.","Situer les objectifs pédagogiques de l’année : sons, vocabulaire, syntaxe, écriture, communication."],"2":["Comprendre la structure de l’alphabet arabe (28 lettres) et la différence consonnes / voyelles.","Identifier les formes d’écriture des lettres (début/milieu/fin/isolée) et la direction de l’écriture.","Distinguer les groupes de lettres proches (formes et points) et les sons absents du français.","Connaître les lettres qui ne s’attachent pas à ce qui suit.","Introduire les voyelles courtes (placement des signes) et la relation consonne + voyelle pour la prononciation."],"3":["Distinguer consonnes et voyelles en arabe et comprendre leur rôle dans la prononciation.","Identifier et prononcer correctement les trois voyelles courtes : fatḥa / kasra / ḍamma.","Comprendre la notion de sukūn (absence de voyelle courte) et ses effets sur la lecture.","S’entraîner à combiner consonnes et voyelles (ba/bi/bu, etc.) et à reconnaître les sons dans des exemples.","Revoir les rappels essentiels sur l’écriture (droite→gauche, attache, formes selon la position)."],"4":["Comprendre le système des voyelles longues en arabe et leur lien avec les voyelles courtes.","Identifier alif / wāw / yā’ en tant que signes d’allongement (madd) et savoir quand les employer.","Repérer les lettres qui ne s’attachent pas et l’impact sur l’écriture des voyelles longues.","Appliquer ces règles à la lecture correcte (ne pas allonger sans raison, allonger quand c’est requis).","Mettre en pratique dans un premier dialogue de présentation : salutation, se nommer, demander l’état."],"5":["Reconnaître et écrire ب / م / ف / و aux trois positions (début, milieu, fin) et à l’état isolé.","Lire correctement des mots exemples en identifiant la forme des consonnes selon leur position.","Comprendre le tanwīn (doublement des voyelles brèves) et sa réalisation phonétique en -n.","Savoir quand ajouter alif avec le tanwīn fatḥa et ne pas l’ajouter avec kasra/ḍamma.","Réactiver du vocabulaire courant rencontré dans les exemples."],"6":["Distinguer et employer correctement هذا (hādhā) et هذه (hādhihi).","Identifier le genre (masculin/féminin) d’un nom à partir de sa forme (ماربُوطَة/مَفْتُوحَة).","Relier le tanwīn (ـٌ / ـً / ـٍ) à l’indéfini dans les exemples avec les démonstratifs.","Construire des phrases nominales simples : « هذا… / هذه… ».","Répondre à la question ما هذا؟ / ما هذه؟ par une phrase correcte."],"7":["Distinguer مَا (mā) et مَنْ (man) et les employer correctement.","Poser une question de confirmation avec هَلْ ou أَ et répondre par نَعَم / لَا.","Réviser l’usage de هذا (hādhā, masc.) et هذه (hādhihi, fém.) avec des noms, humains/animaux/choses.","Construire et enchaîner questions–réponses simples en arabe (présentation d’objets/personnes)."],"8":["Comprendre ce que sont الضَّمَائِر et distinguer المُنْفَصِلَة / المُتَّصِلَة (présentation du jour : المُنْفَصِلَة).","Employer correctement أنا، أَنْتَ/أَنْتِ، هُوَ، هِيَ avec des noms/professions au masculin et au féminin.","Former des phrases de présentation (nationalité, profession, état).","Connaître et lire les chiffres 0 à 10 en arabe."],"9":["Rappeler les ḍamā’ir al-munfaṣila (pronoms personnels isolés) et la différence masculin/féminin.","Comprendre et appliquer la Chaddah (achaddah) : principe de doublement et lecture avec fatḥa / ḍamma / kasra.","Passer de l’indéfini (tanwīn) au défini avec al- et distinguer al-qamariyya / al-shamsiyya (lecture « al » vs. assimilation avec doublement).","Reconnaître et écrire ت (tā’), د (dāl), ض (ḍād) selon la position (début/milieu/fin/isolée).","S’exercer sur des exemples concrets et corriger les erreurs de lecture usuelles."],"10":["Comprendre AYNA comme particule d’interrogation du lieu et y répondre correctement.","Employer les circonstanciels de lieu : taḥta (sous), khalf(a) (derrière), fawqa (au-dessus/sur), amāma (devant) avec la kasra requise sur le nom qui suit.","Revoir l’article défini al- et l’assimilation shamsiyya/qamariyya dans les réponses.","Passer de kalima (mot) à kalām (phrase) : composer des phrases verbales simples (verbe + sujet).","Lire/écrire س / ص / ز (sīn, ṣād, zāy) selon leur position.","Compter de 11 à 20 en chiffres composés."],"11":["Distinguer MAN (qui ?) et MĀ (quoi ?) et les employer correctement.","Utiliser les déictiques hādhā (masc.) et hādhihi (fém.) selon le genre du nom.","Présenter des personnes/objets avec questions-réponses simples (y compris confirmation avec a / hal).","Maîtriser les pronoms personnels isolés au singulier, duel et pluriel (locuteur, allocutaire, absent).","Reconnaître et tracer lām / rā’ / nūn selon la position dans le mot."],"12":["Définir clairement lafẓ, kalima, kalim et kalam, et distinguer leurs usages.","Identifier nom / verbe / particule dans des exemples simples et composer des phrases.","Appliquer les règles vues à des exemples concrets (ordre verbe–sujet, accord, défini/indéfini).","Lire/écrire les lettres jīm, shīn, yā’ selon leur position.","Mettre en pratique via un court dialogue et des expressions usuelles."],"13":["Distinguer clairement lafẓ, kalima, kalim, kalam (rappel) et introduire les trois catégories de kalima.","Définir al-ism, al-fi‘l, al-ḥarf et reconnaître des exemples typiques.","Analyser des phrases nominales et verbales simples (ordre, accord, défini/indéfini).","Pratiquer l’annexion (al-iḍāfa) à partir d’exemples donnés.","Classer des mots dans ism / fi‘l / ḥarf et composer des phrases modèles."],"14":["Distinguer clairement an-naḥw (grammaire/syntaxe) et aṣ-ṣarf (morphophonologie).","Comprendre le rôle de al-mīzān aṣ-ṣarfī : identifier l’aṣl (base) et le zā’id (augment).","Savoir “peser” des mots sur les patrons (fa‘ala, maf‘al, maf‘ala, fā‘il, fi‘āl, etc.).","Reconnaître les dérivations à partir de racines : K–T–B, D–Kh–L, S–J–D, ‘–L–M.","Assimiler des notions d’écriture et de prononciation (diacritiques, formes de خ/غ/…)."],"15":["Distinguer aṣ-ṣarf (morphophonologie) et an-naḥw (syntaxe) et rappeler al-mīzān aṣ-ṣarfī.","Comprendre et reconnaître l’iḍāfa (annexion) dans des groupes nominaux.","Lire un texte court sur la prière, en appliquant la règle du waqf (pause sur sukūn).","Identifier le statut de la prière et citer les cinq prières obligatoires.","Répondre à des questions de compréhension en formulant des phrases correctes en arabe."],"16":["Comprendre la notion d’Asmā’ al-Ishāra (les noms/adjectifs démonstratifs) en arabe.","Distinguer proche (qarīb) et lointain (ba‘īd).","Choisir le démonstratif approprié selon le genre (masculin/féminin) et le nombre (singulier/duel/pluriel).","Appliquer la règle aux personnes et aux choses (dont pluriels non doués de raison).","S’exercer à repérer et compléter correctement des phrases avec le bon démonstratif."],"17":["Lire et comprendre un texte court sur ʿĪd al-Aḍḥā (vocabulaire et sens).","Expliquer l’histoire d’Ibrāhīm et Ismāʿīl liée au sacrifice.","Identifier et appliquer les règles de la phrase verbale : verbe (fiʿl), sujet (fāʿil), ordre et marques (marfūʿ).","Distinguer sujet et complément par les voyelles finales (ḍamma / fatḥa).","Utiliser les outils d’interrogation : ayna, matā, kaifa, limādhā, mā, kam, man, hal."],"18":["Rappeler la phrase verbale (al-jumla al-fi‘liyya) : verbe + sujet, ordre et marques.","Lire et comprendre un hadith sur les bonnes manières à table (vocabulaire et règles).","Extraire des règles pratiques : dire Bismillāh, manger de la main droite, devant soi.","Distinguer al-alif al-mamdūda et al-alif al-maqṣūra dans l’écriture arabe.","Comparer phrase verbale et phrase nominale par des exemples simples."],"19":["Rappeler la structure de la phrase verbale (verbe + sujet) et les marques associées.","Lire un texte court sur l’épicerie et en tirer des exemples de phrases verbales et nominales.","Identifier trois types de pluriels : masculin sain, féminin sain, cassé (taqsīr).","Distinguer tā’ marbūṭa (fermée) et tā’ maftūḥa (ouverte) à l’écrit et à l’oral (règle d’arrêt/liaison).","S’exercer à classer des mots et former des phrases correctes."]},"kw":[{"c":1,"ar":"العَرَبِيَّةُ الفُصْحَى","tr":"al-‘arabiyya al-fuṣḥā","fr":"Arabe littéral/classique, langue du Coran et des sciences."},{"c":1,"ar":"لَهْجَة","tr":"lahja","fr":"Dialecte/localisme linguistique."},{"c":1,"ar":"أَصْوَات / مَخَارِج","tr":"aṣwāt / makhārij","fr":"Sons / lieux d’articulation des lettres."},{"c":1,"ar":"تَجْوِيد", ":"Pluriel de ḥaraka : les voyelles courtes."},{"c":3,"ar":"فَتْحَة","tr":"fatḥa","fr":"Voyelle courte « a » placée au-dessus."},{"c":3,"ar":"كَسْرَة","tr":"kasra","fr":"Voyelle courte « i » placée au-dessous."},{"c":3,"ar":"ضَمَّة","tr":"ḍamma","fr":"Voyelle courte « u/ou » placée au-dessus."},{"c":3,"ar":"سُكُون","tr":"sukūn","fr":"Absence de voyelle courte ; fermeture syllabique."},{"c":3,"ar":"صَوْت","tr":"ṣawt","fr":"Son ; réalisation phonétique."},{"c":3,"ar":"حَرْف","tr":"ḥarf","fr":"Lettre (consonne de l’alphabet arabe)."},{"c":3,"ar":"نُطْق","tr":"nuṭq","fr":"Prononciation ; manière d’articuler."},{"c":3,"ar":"إمْلَاء","tr":"imlā’","fr":"Dictée/écriture (droite→gauche, attache)."},{"c":3,"ar":"تَنْوِين","tr":"tanwīn","fr":"Nunation (terminaison en -un/-an/-in), annoncée mais non étudiée ici."},{"c":3,"ar":"اتِّصَال","tr":"ittiṣāl","fr":"Attache des lettres dans le mot."},{"c":4,"ar":"مَدّ","tr":"madd","fr":"Allongement vocalique (voyelle longue)."},{"c":4,"ar":"أَلِف","tr":"alif","fr":"Signe d’allongement de fatḥa (→ ā)."},{"c":4,"ar":"يَاء","tr":"yā’","fr":"Signe d’allongement de kasra (→ ī)."},{"c":4,"ar":"وَاو","tr":"wāw","fr":"Signe d’allongement de ḍamma (→ ū)."},{"c":4,"ar":"فَتْحَة","tr":"fatḥa","fr":"Voyelle brève « a »."},{"c":4,"ar":"كَسْرَة","tr":"kasra","fr":"Voyelle brève « i »."},{"c":4,"ar":"ضَمَّة","tr":"ḍamma","fr":"Voyelle brève « u »."},{"c":4,"ar":"سُكُون","tr":"sukūn","fr":"Absence de voyelle (fermeture), notamment en pause."},{"c":4,"ar":"تَحِيَّة","tr":"taḥiyya","fr":"Salutation (répondre par mieux ou égal)."},{"c":4,"ar":"اسْم","tr":"ism","fr":"Nom (ex. اسمي ismī : « mon nom »)."},{"c":4,"ar":"كَيْفَ الحَال","tr":"kayfa l-ḥāl","fr":"« Comment vas-tu ? »"},{"c":4,"ar":"بِخَيْر","tr":"bi-khayr","fr":"« Bien, en bonne santé »."},{"c":5,"ar":"تَنْوِين","tr":"tanwīn","fr":"Doublement d’une voyelle brève, réalisé en -n final (indéfini)."},{"c":5,"ar":"أَلِف","tr":"alif","fr":"Lettre ajoutée avec tanwīn fatḥa (écrit, non prononcé)."},{"c":5
