{n:1, t:'À l’aéroport : nominale, verbale, yā’ an-nisba', ar:'فِي المَطَارِ', html:`
<p class="lead">On reprend les deux types de phrase, avec le vocabulaire du voyage. Le premier mot décide de tout.</p>
<div class="roads">
  <div class="road nom"><div class="top">جُمْلَةٌ اِسْمِيَّةٌ</div><div class="q">commence par un <b>nom</b> · مُبْتَدَأٌ + خَبَرٌ</div><div class="ex">أَحْمَدُ طَالِبٌ</div><div class="q">Aḥmad est étudiant.</div></div>
  <div class="road verb"><div class="top">جُمْلَةٌ فِعْلِيَّةٌ</div><div class="q">commence par un <b>verbe</b> · فِعْلٌ + فَاعِلٌ</div><div class="ex">يُسَافِرُ أَحْمَدُ</div><div class="q">Aḥmad voyage.</div></div>
</div>
<div class="breakdown"><div class="bd-phrase">يُسَافِرُ أَحْمَدُ إِلَى مَكَّةَ</div><div class="bd-words">
  <div class="bd-word r-action"><span class="w">يُسَافِرُ</span><span class="role">verbe</span><span class="fr">il voyage (présent)</span></div>
  <div class="bd-word r-sujet"><span class="w">أَحْمَدُ</span><span class="role">sujet (fā‘il)</span><span class="fr">ḍamma</span></div>
  <div class="bd-word r-outil"><span class="w">إِلَى مَكَّةَ</span><span class="role">préposition + nom</span><span class="fr">vers La Mecque</span></div>
</div></div>

<h3 class="sub">Après une préposition : la kasra <span class="ar">حَرْفُ الجَرِّ</span></h3>
<p>Après <span class="arword">فِي، مِنْ، إِلَى، عَلَى…</span> le nom est <b>majrūr</b> et prend la <b>kasra</b>.</p>
<div class="exs">
  <div class="ex1"><span class="a">فِي المَطَارِ</span><span class="f">✅ à l'aéroport</span></div>
  <div class="ex1"><span class="a">فِي المَطَارُ</span><span class="f">❌ faute : ḍamma impossible après فِي</span></div>
</div>

<h3 class="sub">La nationalité <span class="ar">يَاءُ النِّسْبَةِ</span></h3>
<p>On ajoute un <span class="arword">ـِيٌّ</span> (avec chadda) au nom de pays ou de ville pour former l'adjectif d'appartenance.</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Pays</th><th class="ac">Masculin</th><th class="ac">Féminin</th></tr></thead><tbody>
  <tr><td class="ac">فَرَنْسَا</td><td class="ac">فَرَنْسِيٌّ</td><td class="ac">فَرَنْسِيَّةٌ</td></tr>
  <tr><td class="ac">تَنْزَانْيَا</td><td class="ac">تَنْزَانِيٌّ</td><td class="ac">تَنْزَانِيَّةٌ</td></tr>
  <tr><td class="ac">مِصْرُ</td><td class="ac">مِصْرِيٌّ</td><td class="ac">مِصْرِيَّةٌ</td></tr>
  <tr><td class="ac">العِرَاقُ</td><td class="ac">عِرَاقِيٌّ</td><td class="ac">عِرَاقِيَّةٌ</td></tr>
</tbody></table></div>
<h3 class="sub">Vocabulaire de l'aéroport</h3>
<div class="pills"><span class="pill">المَطَارُ <small>l'aéroport</small></span><span class="pill">جَوَازُ السَّفَرِ <small>le passeport</small></span><span class="pill">الطَّائِرَةُ <small>l'avion</small></span><span class="pill">المُذِيعُ <small>l'annonceur</small></span><span class="pill">الاِسْتِعْدَادُ <small>la préparation</small></span><span class="pill">حَدِيثٌ <small>moderne</small></span></div>
<div class="warn"><div class="ct">Piège de lecture</div><p><span class="arword">المَطَارُ</span> (al-maṭār, l'aéroport) ≠ <span class="arword">المَطَرُ</span> (al-maṭar, la pluie) : seul l'alif long les distingue !</p></div>`},

{n:3, t:'La nourriture : kam, mādhā, les nombres 3–10', ar:'الطَّعَامُ وَالأَعْدَادُ', html:`
<h3 class="sub" style="margin-top:0">Deux questions utiles</h3>
<div class="schema cols-2">
  <div class="scard"><div class="top">مَاذَا؟</div><div class="mid">Qu'est-ce que ?</div><div class="ex">مَاذَا تَأْكُلُ؟</div><div class="fr-s">Que manges-tu ?</div></div>
  <div class="scard"><div class="top">كَمْ؟</div><div class="mid">Combien ?</div><div class="ex">كَمْ كِتَابًا عِنْدَكَ؟</div><div class="fr-s">+ nom singulier manṣūb</div></div>
</div>

<h3 class="sub">Les nombres de 3 à 10 : l'accord inversé</h3>
<p>C'est LA règle à retenir : <b>le nombre prend le genre opposé du nom compté</b>, et le nom compté (<span class="arword">المَعْدُودُ</span>) est au <b>pluriel majrūr</b>.</p>
<div class="bi">
  <div class="fr"><span class="tag">Règle</span>Le nombre s'oppose au dénombré en genre. Le dénombré est un pluriel au cas indirect, analysé comme complément du nom.</div>
  <div class="arb"><span class="tag">القَاعِدَةُ</span>العَدَدُ يُخَالِفُ المَعْدُودَ فِي التَّذْكِيرِ وَالتَّأْنِيثِ. التَّمْيِيزُ جَمْعٌ مَجْرُورٌ وَيُعْرَبُ مُضَافًا إِلَيْهِ.</div>
</div>
<div class="roads">
  <div class="road verb"><div class="top">ثَلَاثَةُ طُلَّابٍ</div><div class="q">nom <b>masculin</b> → nombre <b>avec ة</b></div><div class="ex">خَمْسَةُ كُتُبٍ</div></div>
  <div class="road nom"><div class="top">ثَلَاثُ طَالِبَاتٍ</div><div class="q">nom <b>féminin</b> → nombre <b>sans ة</b></div><div class="ex">خَمْسُ سَيَّارَاتٍ</div></div>
</div>
<div class="warn"><div class="ct">Pièges classiques</div><p>❌ <span class="arword">سَبْعَةُ سَيَّارَاتٍ</span> → ✅ <span class="arword">سَبْعُ سَيَّارَاتٍ</span>. ❌ <span class="arword">خَمْسَةُ كِتَابٍ</span> (singulier) → ✅ <span class="arword">خَمْسَةُ كُتُبٍ</span>. Teste-toi avec l'outil <a href="#/outils/nombres">Nombres</a>.</p></div>

<h3 class="sub">Les ordinaux <span class="ar">العَدَدُ التَّرْتِيبِيُّ</span></h3>
<p>De 2 à 10, un seul schème : <span class="arword">فَاعِلٌ</span> (<span class="arword">ثَانٍ، ثَالِثٌ، رَابِعٌ…</span>). L'ordinal est un <b>adjectif</b> : il suit le nom et s'accorde avec lui. « Premier » : <span class="arword">أَوَّلُ</span>, féminin <span class="arword">أُولَى</span>.</p>
<div class="exs"><div class="ex1"><span class="a">الدَّرْسُ الثَّالِثُ · الحِصَّةُ الثَّالِثَةُ</span><span class="f">la troisième leçon · le troisième cours (accord)</span></div></div>

<h3 class="sub">Le complément d'objet <span class="ar">المَفْعُولُ بِهِ</span></h3>
<p>Il indique <b>sur qui / sur quoi</b> porte l'action. Il est <b>manṣūb</b> (fatḥa) et vient en principe après le sujet. Il peut être un nom ou un pronom.</p>
<div class="breakdown"><div class="bd-phrase">أَكَلَ الوَلَدُ الخُبْزَ</div><div class="bd-words">
  <div class="bd-word r-action"><span class="w">أَكَلَ</span><span class="role">verbe</span><span class="fr">a mangé</span></div>
  <div class="bd-word r-sujet"><span class="w">الوَلَدُ</span><span class="role">sujet</span><span class="fr">marfū‘ (ḍamma)</span></div>
  <div class="bd-word r-cod"><span class="w">الخُبْزَ</span><span class="role">complément</span><span class="fr">manṣūb (fatḥa)</span></div>
</div></div>
<h3 class="sub">Vocabulaire</h3>
<div class="pills"><span class="pill">لَحْمٌ <small>viande</small></span><span class="pill">دَجَاجٌ <small>poulet</small></span><span class="pill">سَمَكٌ <small>poisson</small></span><span class="pill">خُبْزٌ <small>pain</small></span><span class="pill">أَرُزٌّ <small>riz</small></span><span class="pill">شَايٌ <small>thé</small></span><span class="pill">قَهْوَةٌ <small>café</small></span><span class="pill">كَثِيرٌ ≠ قَلِيلٌ <small>beaucoup ≠ peu</small></span><span class="pill">سَمِينٌ ≠ نَحِيفٌ <small>gros ≠ maigre</small></span></div>
<div class="recap mauve"><div class="rt">Aperçu : l'interdiction</div><p><span class="arword">لَا</span> + présent = « ne… pas ! ». Le verbe perd sa ḍamma et prend un <b>sukūn</b> : <span class="arword">لَا تَأْكُلْ كَثِيرًا</span> « Ne mange pas trop ! » (cours 14).</p></div>`},

/* ---------------------------------------------------------------- 4 */
{n:4, t:'La Hijra : conjuguer au passé', ar:'الفِعْلُ المَاضِي', html:`
<div class="txt"><div class="tt">الهِجْرَةُ</div><div class="body">خَرَجَ النَّبِيُّ ﷺ مِنْ مَكَّةَ مَعَ أَبِي بَكْرٍ الصِّدِّيقِ، وَهَاجَرَا إِلَى المَدِينَةِ. فَرِحَ الأَنْصَارُ بِوُصُولِهِ، وَبَنَى المُسْلِمُونَ المَسْجِدَ، وَآخَى النَّبِيُّ ﷺ بَيْنَ المُهَاجِرِينَ وَالأَنْصَارِ.</div><div class="src">Petit texte de révision : le Prophète ﷺ sortit de La Mecque avec Abū Bakr ; ils émigrèrent à Médine ; les Anṣār se réjouirent, les musulmans bâtirent la mosquée et le Prophète ﷺ fraternisa entre Muhājirūn et Anṣār.</div></div>
<p class="lead">Le <span class="arword">مَاضٍ</span> exprime une action <b>terminée</b>. Sa base est la 3ᵉ personne du masculin singulier (<span class="arword">ذَهَبَ</span> « il est allé ») ; on ajoute des <b>terminaisons</b> pour chaque personne.</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Pronom</th><th class="ac">ذَهَبَ</th><th>Sens</th><th class="ac">Terminaison</th></tr></thead><tbody>
  <tr><td class="ac">هُوَ</td><td class="ac">ذَهَبَ</td><td>il est allé</td><td class="ac">ـَ</td></tr>
  <tr><td class="ac">هِيَ</td><td class="ac">ذَهَبَتْ</td><td>elle est allée</td><td class="ac">ـَتْ</td></tr>
  <tr><td class="ac">هُمَا (m)</td><td class="ac">ذَهَبَا</td><td>ils sont allés (2)</td><td class="ac">ـَا</td></tr>
  <tr><td class="ac">هُمَا (f)</td><td class="ac">ذَهَبَتَا</td><td>elles sont allées (2)</td><td class="ac">ـَتَا</td></tr>
  <tr><td class="ac">هُمْ</td><td class="ac">ذَهَبُوا</td><td>ils sont allés</td><td class="ac">ـُوا</td></tr>
  <tr><td class="ac">هُنَّ</td><td class="ac">ذَهَبْنَ</td><td>elles sont allées</td><td class="ac">ـْنَ</td></tr>
  <tr><td class="ac">أَنْتَ</td><td class="ac">ذَهَبْتَ</td><td>tu es allé</td><td class="ac">ـْتَ</td></tr>
  <tr><td class="ac">أَنْتِ</td><td class="ac">ذَهَبْتِ</td><td>tu es allée</td><td class="ac">ـْتِ</td></tr>
  <tr><td class="ac">أَنْتُمَا</td><td class="ac">ذَهَبْتُمَا</td><td>vous êtes allés (2)</td><td class="ac">ـْتُمَا</td></tr>
  <tr><td class="ac">أَنْتُمْ</td><td class="ac">ذَهَبْتُمْ</td><td>vous êtes allés</td><td class="ac">ـْتُمْ</td></tr>
  <tr><td class="ac">أَنْتُنَّ</td><td class="ac">ذَهَبْتُنَّ</td><td>vous êtes allées</td><td class="ac">ـْتُنَّ</td></tr>
  <tr><td class="ac">أَنَا</td><td class="ac">ذَهَبْتُ</td><td>je suis allé(e)</td><td class="ac">ـْتُ</td></tr>
  <tr><td class="ac">نَحْنُ</td><td class="ac">ذَهَبْنَا</td><td>nous sommes allés</td><td class="ac">ـْنَا</td></tr>
</tbody></table></div>
<p class="faint" style="font-size:.84rem">Conjugue n'importe quel verbe régulier avec l'outil <a href="#/outils/conjugueur">Conjugueur</a>.</p>

<h3 class="sub">L'accord verbe / sujet</h3>
<div class="rule">
  <div>Quand le verbe est <b>avant</b> son sujet, il reste au <b>singulier</b> : il ne s'accorde qu'en <b>genre</b>.</div>
  <div>Quand le nom est <b>avant</b> le verbe, ce nom n'est plus le sujet (c'est un mubtada’) : le verbe s'accorde alors en <b>genre et en nombre</b>.</div>
</div>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th></th><th class="ac">Singulier</th><th class="ac">Duel</th><th class="ac">Pluriel</th></tr></thead><tbody>
  <tr><td>Verbe d'abord (m.)</td><td class="ac">ذَهَبَ الطَّالِبُ</td><td class="ac">ذَهَبَ الطَّالِبَانِ</td><td class="ac">ذَهَبَ الطُّلَّابُ</td></tr>
  <tr><td>Verbe d'abord (f.)</td><td class="ac">ذَهَبَتِ الطَّالِبَةُ</td><td class="ac">ذَهَبَتِ الطَّالِبَتَانِ</td><td class="ac">ذَهَبَتِ الطَّالِبَاتُ</td></tr>
  <tr><td>Nom d'abord</td><td class="ac" colspan="3">الطُّلَّابُ ذَهَبُوا إِلَى الجَامِعَةِ · الطَّالِبَاتُ ذَهَبْنَ إِلَى الجَامِعَةِ</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p>Au passé, <b>la fin du verbe dit qui agit</b> : <span class="arword">ـتُ</span> = je, <span class="arword">ـنَا</span> = nous, <span class="arword">ـتَ</span> = tu (m.), <span class="arword">ـتِ</span> = tu (f.), <span class="arword">ـَتْ</span> = elle, <span class="arword">ـُوا</span> = ils.</p></div>`},

/* ---------------------------------------------------------------- 5 */
{n:5, t:'Les trois temps et la formation du présent', ar:'أَقْسَامُ الفِعْلِ', html:`
<div class="bi">
  <div class="fr"><span class="tag">Règle</span>Selon le temps, le verbe se divise en trois : <b>passé</b> (action passée : قَامَ، قَعَدَ), <b>présent</b> (action en cours ou à venir : يَذْهَبُ), <b>impératif</b> (demande d'agir après la parole : اِجْتَهِدْ يَا طَالِبُ).</div>
  <div class="arb"><span class="tag">القَاعِدَةُ</span>يَنْقَسِمُ الفِعْلُ مِنْ حَيْثُ الدَّلَالَةُ عَلَى الزَّمَنِ إِلَى ثَلَاثَةِ أَقْسَامٍ : مَاضٍ وَمُضَارِعٍ وَأَمْرٍ.</div>
</div>
<div class="schema cols-3">
  <div class="scard r-cod"><div class="top">كَتَبَ</div><div class="mid">مَاضٍ · passé</div><div class="fr-s">fin en fatḥa</div></div>
  <div class="scard r-sujet"><div class="top">يَكْتُبُ</div><div class="mid">مُضَارِعٌ · présent</div><div class="fr-s">préfixe + fin en ḍamma</div></div>
  <div class="scard r-info"><div class="top">اُكْتُبْ</div><div class="mid">أَمْرٌ · impératif</div><div class="fr-s">fin en sukūn</div></div>
</div>

<h3 class="sub">Former le présent : les lettres <span class="ar">أَنَيْتُ</span></h3>
<p>Le présent commence par l'une des quatre lettres <span class="arword">أ ن ي ت</span> (<span class="arword">حُرُوفُ المُضَارَعَةِ</span>, mnémotechnique « أَنَيْتُ ») :</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Lettre</th><th>Pour…</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td class="ac">أَ</td><td>je (أَنَا)</td><td class="ac">أَذْهَبُ</td></tr>
  <tr><td class="ac">نَ</td><td>nous (نَحْنُ)</td><td class="ac">نَذْهَبُ</td></tr>
  <tr><td class="ac">يَ</td><td>il, ils, elles (هُوَ، هُمْ، هُنَّ)</td><td class="ac">يَذْهَبُ</td></tr>
  <tr><td class="ac">تَ</td><td>tu, elle, vous (أَنْتَ، هِيَ…)</td><td class="ac">تَذْهَبُ</td></tr>
</tbody></table></div>
<div class="rule">
  <div>La lettre est <b>ḍamma</b> pour les verbes de 4 lettres : <span class="arword">أَكْرَمَ ← يُكْرِمُ</span>, <span class="arword">قَرَّبَ ← يُقَرِّبُ</span>. Sinon <b>fatḥa</b> : <span class="arword">يَذْهَبُ، يَجْتَمِعُ</span>.</div>
  <div>Pour un verbe de 3 lettres, la 1ʳᵉ radicale prend un <b>sukūn</b> et la 2ᵉ prend une voyelle propre au verbe (a, u ou i) : il faut l'apprendre avec le verbe.</div>
  <div>La hamza initiale du passé disparaît au présent : <span class="arword">اِنْطَلَقَ ← يَنْطَلِقُ</span>, <span class="arword">أَحْسَنَ ← يُحْسِنُ</span>.</div>
</div>
<h3 class="sub">Les 4 modèles (abwāb) les plus fréquents</h3>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Modèle</th><th class="ac">Exemples</th><th>Voyelle du présent</th></tr></thead><tbody>
  <tr><td class="ac">فَعَلَ يَفْعَلُ</td><td class="ac">ذَهَبَ يَذْهَبُ · فَتَحَ يَفْتَحُ</td><td>a</td></tr>
  <tr><td class="ac">فَعَلَ يَفْعُلُ</td><td class="ac">كَتَبَ يَكْتُبُ · سَجَدَ يَسْجُدُ</td><td>u</td></tr>
  <tr><td class="ac">فَعَلَ يَفْعِلُ</td><td class="ac">جَلَسَ يَجْلِسُ · رَجَعَ يَرْجِعُ</td><td>i</td></tr>
  <tr><td class="ac">فَعِلَ يَفْعَلُ</td><td class="ac">سَمِعَ يَسْمَعُ · حَفِظَ يَحْفَظُ</td><td>a</td></tr>
</tbody></table></div>

<h3 class="sub">Former l'impératif</h3>
<p>On part du présent à la 2ᵉ personne et on enlève le préfixe. Si la lettre restante a un sukūn, on ajoute une <b>hamza de liaison</b> : <b>اُ</b> si la 2ᵉ radicale porte une ḍamma, sinon <b>اِ</b>.</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Présent</th><th class="ac">On enlève تَ</th><th class="ac">Impératif</th></tr></thead><tbody>
  <tr><td class="ac">تَخْرُجُ</td><td class="ac">خْرُجْ</td><td class="ac">اُخْرُجْ</td></tr>
  <tr><td class="ac">تَذْهَبُ</td><td class="ac">ذْهَبْ</td><td class="ac">اِذْهَبْ</td></tr>
  <tr><td class="ac">تَغْسِلُ</td><td class="ac">غْسِلْ</td><td class="ac">اِغْسِلْ</td></tr>
  <tr><td class="ac">تَحْتَرِمُ</td><td class="ac">حْتَرِمْ</td><td class="ac">اِحْتَرِمْ</td></tr>
  <tr><td class="ac">تُشَاوِرُ</td><td class="ac">شَاوِرْ</td><td class="ac">شَاوِرْ (pas besoin de hamza)</td></tr>
</tbody></table></div>
<div class="warn"><div class="ct">Exception</div><p>Pour le schème <span class="arword">أَفْعَلَ</span>, la hamza est une <b>hamza de coupure</b> avec fatḥa : <span class="arword">أَكْرِمْ، أَعْطِ</span>.</p></div>
<div class="clair"><div class="ct">En clair</div><p>Passé → <b>fatḥa</b> à la fin · Présent → <b>préfixe أ ن ي ت</b> + <b>ḍamma</b> · Impératif → <b>sukūn</b> (+ hamza اُ/اِ au début si nécessaire).</p></div>`},

/* ---------------------------------------------------------------- 6 */
{n:6, t:'Le passé : négation, question, accord', ar:'المَاضِي : النَّفْيُ وَالاِسْتِفْهَامُ', html:`
<h3 class="sub" style="margin-top:0">Nier au passé avec <span class="ar">مَا</span></h3>
<p>On place <span class="arword">مَا</span> devant le verbe au passé, sans rien changer au verbe.</p>
<div class="exs">
  <div class="ex1"><span class="a">شَرِبْتُ القَهْوَةَ ← مَا شَرِبْتُ القَهْوَةَ</span><span class="f">J'ai bu le café → Je n'ai pas bu le café.</span></div>
  <div class="ex1"><span class="a">مَا ذَهَبَ زَيْدٌ إِلَى السُّوقِ</span><span class="f">Zayd n'est pas allé au marché.</span></div>
</div>
<h3 class="sub">Poser une question</h3>
<p>La <b>hamza</b> (<span class="arword">أَ</span>) ou <span class="arword">هَلْ</span> en tête transforment la phrase en question oui / non.</p>
<div class="dlg">
  <div class="ln"><span class="who">Q</span><span class="a">أَكَتَبْتَ الدَّرْسَ؟</span><span class="f">As-tu écrit la leçon ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">نَعَمْ، كَتَبْتُ الدَّرْسَ</span><span class="f">Oui, j'ai écrit la leçon.</span></div>
  <div class="ln"><span class="who">R</span><span class="a">لَا، مَا كَتَبْتُ الدَّرْسَ</span><span class="f">Non, je n'ai pas écrit la leçon.</span></div>
</div>
<h3 class="sub">Rappel : accord et cas</h3>
<div class="schema cols-2">
  <div class="scard"><div class="top">ذَهَبَ الطُّلَّابُ</div><div class="fr-s">verbe avant un sujet pluriel → verbe au <b>singulier</b></div></div>
  <div class="scard"><div class="top">الطُّلَّابُ ذَهَبُوا</div><div class="fr-s">nom avant → accord <b>en nombre</b></div></div>
</div>
<div class="hats">
  <div class="hat h-raf"><div class="v">ـُ</div><div class="nm">الفَاعِلُ</div><div class="say">le sujet prend la ḍamma</div></div>
  <div class="hat h-nasb"><div class="v">ـَ</div><div class="nm">المَفْعُولُ بِهِ</div><div class="say">le complément prend la fatḥa</div></div>
</div>
<div class="clair"><div class="ct">En clair</div><p><span class="arword">مَا</span> + passé = négation du passé. Pour nier le passé avec un verbe au <b>présent</b>, on utilisera <span class="arword">لَمْ</span> (cours 17).</p></div>`},

/* ---------------------------------------------------------------- 7 */
{n:7, t:'Le présent (al-muḍāri‘)', ar:'الفِعْلُ المُضَارِعُ', html:`
<p class="lead">Le <span class="arword">مُضَارِعٌ</span> exprime ce qui se passe <b>au moment où l'on parle ou après</b> (présent et futur). Normalement, il est <b>marfū‘</b> : il finit par une <b>ḍamma</b> ou par un <b>نون</b>.</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Pronom</th><th class="ac">ذَهَبَ ← يَذْهَبُ</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">أَنَا</td><td class="ac">أَذْهَبُ</td><td>je vais</td></tr>
  <tr><td class="ac">نَحْنُ</td><td class="ac">نَذْهَبُ</td><td>nous allons</td></tr>
  <tr><td class="ac">أَنْتَ</td><td class="ac">تَذْهَبُ</td><td>tu vas (m.)</td></tr>
  <tr><td class="ac">أَنْتِ</td><td class="ac">تَذْهَبِينَ</td><td>tu vas (f.)</td></tr>
  <tr><td class="ac">أَنْتُمَا</td><td class="ac">تَذْهَبَانِ</td><td>vous allez (2)</td></tr>
  <tr><td class="ac">أَنْتُمْ</td><td class="ac">تَذْهَبُونَ</td><td>vous allez (m.)</td></tr>
  <tr><td class="ac">أَنْتُنَّ</td><td class="ac">تَذْهَبْنَ</td><td>vous allez (f.)</td></tr>
  <tr><td class="ac">هُوَ</td><td class="ac">يَذْهَبُ</td><td>il va</td></tr>
  <tr><td class="ac">هِيَ</td><td class="ac">تَذْهَبُ</td><td>elle va</td></tr>
  <tr><td class="ac">هُمَا (m)</td><td class="ac">يَذْهَبَانِ</td><td>ils vont (2)</td></tr>
  <tr><td class="ac">هُمَا (f)</td><td class="ac">تَذْهَبَانِ</td><td>elles vont (2)</td></tr>
  <tr><td class="ac">هُمْ</td><td class="ac">يَذْهَبُونَ</td><td>ils vont</td></tr>
  <tr><td class="ac">هُنَّ</td><td class="ac">يَذْهَبْنَ</td><td>elles vont</td></tr>
</tbody></table></div>
<div class="warn"><div class="ct">Formes identiques</div><p><span class="arword">تَذْهَبُ</span> = « tu vas » (m.) <b>ou</b> « elle va » ; <span class="arword">تَذْهَبَانِ</span> = « vous allez (2) » ou « elles vont (2) ». C'est le contexte (ou le pronom) qui tranche.</p></div>
<div class="breakdown"><div class="bd-phrase">يَذْهَبُونَ</div><div class="bd-words">
  <div class="bd-word r-action"><span class="w">يَـ</span><span class="role">préfixe</span><span class="fr">3ᵉ personne</span></div>
  <div class="bd-word r-info"><span class="w">ذْهَبُـ</span><span class="role">radical</span><span class="fr">ذ (sukūn) ه (a) ب</span></div>
  <div class="bd-word r-sujet"><span class="w">ـونَ</span><span class="role">wāw du pluriel + nūn</span><span class="fr">« ils » ; le nūn = marque du raf‘</span></div>
</div></div>
<div class="clair"><div class="ct">En clair</div><p>Préfixe = <b>qui</b> (je, nous, il, tu…) ; fin = <b>ḍamma</b> (forme simple) ou <b>نَ / نِ</b> (formes longues). Ces formes longues sont les « cinq verbes » (cours 12).</p></div>`},

/* ---------------------------------------------------------------- 8 */
{n:8, t:'L’impératif (al-amr)', ar:'فِعْلُ الأَمْرِ', html:`
<p class="lead">L'impératif exprime une <b>demande</b>. Il ne s'emploie qu'à la <b>2ᵉ personne</b> (أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ) et il est <b>invariable</b> (مَبْنِيٌّ).</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Pronom</th><th class="ac">Présent</th><th class="ac">Impératif</th><th>Marque</th></tr></thead><tbody>
  <tr><td class="ac">أَنْتَ</td><td class="ac">تَذْهَبُ</td><td class="ac">اِذْهَبْ</td><td>sukūn</td></tr>
  <tr><td class="ac">أَنْتِ</td><td class="ac">تَذْهَبِينَ</td><td class="ac">اِذْهَبِي</td><td>suppression du nūn</td></tr>
  <tr><td class="ac">أَنْتُمَا</td><td class="ac">تَذْهَبَانِ</td><td class="ac">اِذْهَبَا</td><td>suppression du nūn</td></tr>
  <tr><td class="ac">أَنْتُمْ</td><td class="ac">تَذْهَبُونَ</td><td class="ac">اِذْهَبُوا</td><td>suppression du nūn (+ alif de séparation)</td></tr>
  <tr><td class="ac">أَنْتُنَّ</td><td class="ac">تَذْهَبْنَ</td><td class="ac">اِذْهَبْنَ</td><td>aucun changement</td></tr>
</tbody></table></div>
<div class="rule">
  <div><b>Au début</b> : on enlève le préfixe et on met la <b>hamza de liaison</b> : <span class="arword">اُ</span> si le verbe a « u » au présent (<span class="arword">اُكْتُبْ، اُدْخُلْ</span>), sinon <span class="arword">اِ</span> (<span class="arword">اِشْرَبْ، اِجْلِسْ</span>).</div>
  <div><b>À la fin</b> : on enlève les marques du raf‘ : la ḍamma devient <b>sukūn</b>, et le <b>نون</b> disparaît.</div>
  <div>Avec <span class="arword">أَنْتُمْ</span>, on ajoute un <b>alif</b> après le wāw : <span class="arword">الأَلِفُ الفَارِقَةُ</span> (alif « de séparation »), non prononcé.</div>
  <div>Avec <span class="arword">أَنْتُنَّ</span>, rien ne change à la fin : le <span class="arword">نَ</span> est ici le pronom sujet (<span class="arword">نُونُ النِّسْوَةِ</span>), pas une marque de raf‘.</div>
</div>
<div class="irab"><div class="phrase">اِذْهَبُوا</div>
  <div class="row"><b>اِذْهَبُوا :</b> فِعْلُ أَمْرٍ مَبْنِيٌّ عَلَى حَذْفِ النُّونِ، وَالوَاوُ ضَمِيرٌ مُتَّصِلٌ فِي مَحَلِّ رَفْعٍ فَاعِلٌ، وَالأَلِفُ فَارِقَةٌ.</div>
  <div class="tr">« Allez ! » — verbe à l'impératif construit sur la suppression du nūn ; le wāw est le sujet ; l'alif est « de séparation ».</div></div>
<div class="tbl-wrap"><table class="grid th-sage"><thead><tr><th class="ac">Verbe</th><th class="ac">أَنْتَ</th><th class="ac">أَنْتِ</th><th class="ac">أَنْتُمْ</th></tr></thead><tbody>
  <tr><td class="ac">يَكْتُبُ</td><td class="ac">اُكْتُبْ</td><td class="ac">اُكْتُبِي</td><td class="ac">اُكْتُبُوا</td></tr>
  <tr><td class="ac">يَجْلِسُ</td><td class="ac">اِجْلِسْ</td><td class="ac">اِجْلِسِي</td><td class="ac">اِجْلِسُوا</td></tr>
  <tr><td class="ac">يَدْخُلُ</td><td class="ac">اُدْخُلْ</td><td class="ac">اُدْخُلِي</td><td class="ac">اُدْخُلُوا</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p>Pas d'impératif pour « je » ou « nous » : on donne un ordre à quelqu'un d'autre. Pense « présent sans préfixe, fin coupée ».</p></div>`},

/* ---------------------------------------------------------------- 9 */
{n:9, t:'Les métiers : le futur, kam + tamyīz', ar:'المِهَنُ وَالمُسْتَقْبَلُ', html:`
<h3 class="sub" style="margin-top:0">Exprimer le futur</h3>
<p>On ajoute la particule du futur (<span class="arword">حَرْفُ الاِسْتِقْبَالِ</span>) devant le présent :</p>
<div class="schema cols-2">
  <div class="scard r-action"><div class="top">سَـ</div><div class="mid">futur proche</div><div class="ex">سَأَذْهَبُ إِلَى العَمَلِ</div><div class="fr-s">J'irai au travail.</div></div>
  <div class="scard r-info"><div class="top">سَوْفَ</div><div class="mid">futur plus lointain</div><div class="ex">سَوْفَ أَدْرُسُ الطِّبَّ</div><div class="fr-s">J'étudierai la médecine.</div></div>
</div>
<div class="warn"><div class="ct">Attention</div><p>La particule <span class="arword">سَـ</span> ne s'emploie pas dans une phrase interrogative.</p></div>

<h3 class="sub"><span class="ar">كَمْ</span> + tamyīz</h3>
<p>Après <span class="arword">كَمْ</span> (combien), le nom (<span class="arword">التَّمْيِيزُ</span>) est au <b>singulier</b> et <b>manṣūb</b>.</p>
<div class="exs">
  <div class="ex1"><span class="a">كَمْ كِتَابًا عِنْدَكِ؟</span><span class="f">Combien de livres as-tu ?</span></div>
  <div class="ex1"><span class="a">كَمْ سَاعَةً عَمِلْتَ اليَوْمَ؟</span><span class="f">Combien d'heures as-tu travaillé aujourd'hui ?</span></div>
  <div class="ex1"><span class="a">بِكَمْ رِيَالٍ هٰذَا القَلَمُ؟</span><span class="f">À combien de riyals est ce stylo ? — quand كَمْ est lui-même majrūr (بِكَمْ), le tamyīz peut être majrūr ou manṣūb.</span></div>
</div>
<div class="warn"><div class="ct">Faute fréquente</div><p>❌ <span class="arword">كَمْ سَاعَاتٍ</span> → ✅ <span class="arword">كَمْ سَاعَةً</span> (singulier manṣūb).</p></div>

<h3 class="sub">Les métiers <span class="ar">المِهَنُ</span></h3>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Domaine</th><th class="ac">Métier</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">الطِّبُّ</td><td class="ac">طَبِيبٌ</td><td>médecine → médecin</td></tr>
  <tr><td class="ac">الهَنْدَسَةُ</td><td class="ac">مُهَنْدِسٌ</td><td>ingénierie → ingénieur, architecte</td></tr>
  <tr><td class="ac">الصَّيْدَلَةُ</td><td class="ac">صَيْدَلِيٌّ</td><td>pharmacie → pharmacien</td></tr>
  <tr><td class="ac">الطَّيَرَانُ</td><td class="ac">طَيَّارٌ</td><td>aviation → pilote</td></tr>
  <tr><td class="ac">التَّرْبِيَةُ</td><td class="ac">مُعَلِّمٌ</td><td>éducation → enseignant</td></tr>
</tbody></table></div>
<div class="dlg">
  <div class="ln"><span class="who">Q</span><span class="a">مَاذَا تَعْمَلُ؟</span><span class="f">Que fais-tu comme travail ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَعْمَلُ مُهَنْدِسًا فِي شَرِكَةٍ</span><span class="f">Je travaille comme ingénieur dans une entreprise.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">أَيْنَ عَمَلُكَ؟</span><span class="f">Où est ton travail ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">عَمَلِي قَرِيبٌ مِنَ البَيْتِ</span><span class="f">Mon travail est près de la maison.</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p><span class="arword">عَمَلِي</span> = mon travail (possessif <span class="arword">ـِي</span>). Futur = <span class="arword">سَـ / سَوْفَ</span> + présent. <span class="arword">كَمْ</span> + singulier en <b>-an</b>.</p></div>`},

/* ---------------------------------------------------------------- 10 */
{n:10, t:'L’université : jours, durées, emploi du temps', ar:'فِي الجَامِعَةِ', html:`
<div class="schema cols-3">
  <div class="scard"><div class="top">مَدْرَسَةٌ</div><div class="fr-s">école</div></div>
  <div class="scard"><div class="top">جَامِعَةٌ</div><div class="fr-s">université</div></div>
  <div class="scard"><div class="top">مَكْتَبَةٌ</div><div class="fr-s">bibliothèque</div></div>
  <div class="scard"><div class="top">مُخْتَبَرٌ</div><div class="fr-s">laboratoire</div></div>
  <div class="scard"><div class="top">الجَدْوَلُ الدِّرَاسِيُّ</div><div class="fr-s">l'emploi du temps</div></div>
  <div class="scard"><div class="top">حِصَّةٌ</div><div class="fr-s">un cours, une séance</div></div>
  <div class="scard"><div class="top">الاِخْتِبَارَاتُ</div><div class="fr-s">les examens</div></div>
  <div class="scard"><div class="top">اِسْتِرَاحَةٌ</div><div class="fr-s">pause, récréation</div></div>
  <div class="scard"><div class="top">الحَافِلَةُ</div><div class="fr-s">le bus</div></div>
</div>
<h3 class="sub">Les jours de la semaine <span class="ar">أَيَّامُ الأُسْبُوعِ</span></h3>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Jour</th><th>Français</th><th>Astuce</th></tr></thead><tbody>
  <tr><td class="ac">الأَحَدُ</td><td>dimanche</td><td>racine « un » (أَحَد)</td></tr>
  <tr><td class="ac">الاِثْنَيْنِ</td><td>lundi</td><td>« deux »</td></tr>
  <tr><td class="ac">الثُّلَاثَاءُ</td><td>mardi</td><td>« trois »</td></tr>
  <tr><td class="ac">الأَرْبِعَاءُ</td><td>mercredi</td><td>« quatre »</td></tr>
  <tr><td class="ac">الخَمِيسُ</td><td>jeudi</td><td>« cinq »</td></tr>
  <tr><td class="ac">الجُمُعَةُ</td><td>vendredi</td><td>« le rassemblement »</td></tr>
  <tr><td class="ac">السَّبْتُ</td><td>samedi</td><td></td></tr>
</tbody></table></div>
<h3 class="sub">Les durées</h3>
<div class="pills"><span class="pill">سَاعَةٌ <small>heure</small></span><span class="pill">يَوْمٌ <small>jour</small></span><span class="pill">أُسْبُوعٌ <small>semaine</small></span><span class="pill">شَهْرٌ <small>mois</small></span><span class="pill">سَنَةٌ · عَامٌ <small>année</small></span><span class="pill">قَرْنٌ <small>siècle</small></span><span class="pill">العُطْلَةُ <small>les vacances</small></span></div>
<div class="dlg">
  <div class="ln"><span class="who">Q</span><span class="a">كَمْ حِصَّةً عِنْدَكَ يَوْمَ الأَحَدِ؟</span><span class="f">Combien de cours as-tu le dimanche ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">عِنْدِي ثَلَاثُ حِصَصٍ</span><span class="f">J'ai trois cours. (حِصَّة féminin → ثَلَاثُ)</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">كَيْفَ تَذْهَبُ إِلَى الجَامِعَةِ؟</span><span class="f">Comment vas-tu à l'université ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَذْهَبُ بِالحَافِلَةِ</span><span class="f">J'y vais en bus.</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Les noms des jours viennent des <b>nombres</b> : retiens <span class="arword">أَحَد، اِثْنَان، ثَلَاثَة، أَرْبَعَة، خَمْسَة</span> et tu connais déjà 5 jours sur 7.</p></div>`},

/* ---------------------------------------------------------------- 11 */
{n:11, t:'La phrase nominale : mubtada’ et khabar', ar:'المُبْتَدَأُ وَالخَبَرُ', html:`
<div class="breakdown"><div class="bd-phrase">مُحَمَّدٌ طَالِبٌ</div><div class="bd-words">
  <div class="bd-word r-sujet"><span class="w">مُحَمَّدٌ</span><span class="role">المُبْتَدَأُ</span><span class="fr">de qui on parle · marfū‘</span></div>
  <div class="bd-word r-info"><span class="w">طَالِبٌ</span><span class="role">الخَبَرُ</span><span class="fr">l'information · marfū‘</span></div>
</div></div>
<div class="rule">
  <div>Le <b>mubtada’</b> ouvre la phrase nominale. Il est <b>marfū‘</b> (ḍamma) et, en règle générale, <b>défini</b>.</div>
  <div>Le <b>khabar</b> donne l'information sur le mubtada’. Il est <b>marfū‘</b> et s'accorde avec lui en <b>genre</b> et en <b>nombre</b>.</div>
  <div>Un nom <b>annexé</b> à un nom défini devient défini : <span class="arword">كِتَابُ زَيْدٍ</span> « le livre de Zayd ».</div>
</div>
<h3 class="sub">Les trois formes du khabar</h3>
<div class="schema cols-3">
  <div class="scard r-info"><div class="top">مُفْرَدٌ</div><div class="mid">un mot</div><div class="ex">البَيْتُ كَبِيرٌ</div></div>
  <div class="scard r-action"><div class="top">جُمْلَةٌ</div><div class="mid">une phrase</div><div class="ex">الطَّالِبُ يَكْتُبُ الدَّرْسَ</div></div>
  <div class="scard r-outil"><div class="top">شِبْهُ جُمْلَةٍ</div><div class="mid">« quasi-phrase »</div><div class="ex">الكِتَابُ عَلَى المَكْتَبِ</div></div>
</div>
<h3 class="sub">L'ordre</h3>
<p>En principe le mubtada’ vient <b>avant</b> le khabar. Quand le khabar est une quasi-phrase et le mubtada’ indéfini, on <b>inverse</b> : <span class="arword">فِي البَيْتِ رَجُلٌ</span> « il y a un homme dans la maison ».</p>
<h3 class="sub">Accorde correctement</h3>
<details class="sol"><summary><span class="ar">أَنْتَ ……… صَالِحٌ</span> (رَجُلٌ / رَجُلَانِ / مُسْلِمُونَ)</summary><div><span class="arword">أَنْتَ رَجُلٌ صَالِحٌ</span> — أَنْتَ est singulier masculin.</div></details>
<details class="sol"><summary><span class="ar">أُمِّي قَالَتْ : أَنَا ………</span> (مَرِيضٌ / مَرِيضَةٌ)</summary><div><span class="arword">أَنَا مَرِيضَةٌ</span> — accord au féminin.</div></details>
<div class="clair"><div class="ct">En clair</div><p>« Le livre est sur le bureau » : pas de verbe « être » en arabe. Deux éléments au cas sujet suffisent, ou un nom + un groupe préposition.</p></div>`},

/* ---------------------------------------------------------------- 12 */
{n:12, t:'Le présent avec tous les pronoms, l’élatif', ar:'الأَفْعَالُ الخَمْسَةُ · اِسْمُ التَّفْضِيلِ', html:`
<h3 class="sub" style="margin-top:0">Les « cinq verbes » <span class="ar">الأَفْعَالُ الخَمْسَةُ</span></h3>
<p>Ce sont les formes du présent qui portent un pronom sujet <b>attaché</b> et finissent par un <b>نون</b> au raf‘ :</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th>Pronom attaché</th><th class="ac">Formes</th><th>Personnes</th></tr></thead><tbody>
  <tr><td>أَلِفُ الاِثْنَيْنِ (alif du duel)</td><td class="ac">يَكْتُبَانِ · تَكْتُبَانِ</td><td>هُمَا · أَنْتُمَا</td></tr>
  <tr><td>وَاوُ الجَمَاعَةِ (wāw du groupe)</td><td class="ac">يَكْتُبُونَ · تَكْتُبُونَ</td><td>هُمْ · أَنْتُمْ</td></tr>
  <tr><td>يَاءُ المُخَاطَبَةِ (yā’ de l'interlocutrice)</td><td class="ac">تَكْتُبِينَ</td><td>أَنْتِ</td></tr>
</tbody></table></div>
<div class="recap sky"><div class="rt">À distinguer</div><p><span class="arword">نُونُ النِّسْوَةِ</span> (<span class="arword">يَكْتُبْنَ، تَكْتُبْنَ</span>) n'est <b>pas</b> l'un des cinq verbes : ce نون est le pronom « elles / vous (f.) » et ne bouge jamais.</p></div>
<h3 class="sub">Complète</h3>
<details class="sol"><summary><span class="ar">أَيْنَ ……… أَنْتِ؟</span> (ذَهَبَ)</summary><div><span class="arword">تَذْهَبِينَ</span></div></details>
<details class="sol"><summary><span class="ar">الطَّالِبَاتُ ……… الدَّرْسَ</span> (كَتَبَ, passé)</summary><div><span class="arword">كَتَبْنَ</span> — nom avant le verbe → accord en nombre (féminin pluriel).</div></details>

<h3 class="sub">L'élatif <span class="ar">اِسْمُ التَّفْضِيلِ</span></h3>
<p>Il compare deux choses : l'une a la qualité <b>plus</b> que l'autre. Il suit le schème <span class="arword">أَفْعَلُ</span> et ne prend pas de tanwīn (<span class="arword">مَمْنُوعٌ مِنَ الصَّرْفِ</span>).</p>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th>Emploi</th><th class="ac">Exemple</th><th>Sens</th></tr></thead><tbody>
  <tr><td>Sans ال ni annexion → suivi de <span class="ar">مِنْ</span>, invariable</td><td class="ac">حَامِدٌ أَطْوَلُ مِنْ مُحَمَّدٍ</td><td>Ḥāmid est plus grand que Muḥammad.</td></tr>
  <tr><td></td><td class="ac">فَاطِمَةُ أَطْوَلُ مِنْ أَخِيهَا</td><td>Fāṭima est plus grande que son frère.</td></tr>
  <tr><td>Annexé à un indéfini → « le plus… »</td><td class="ac">بِلَالٌ أَحْسَنُ طَالِبٍ فِي الفَصْلِ</td><td>Bilāl est le meilleur élève de la classe.</td></tr>
  <tr><td></td><td class="ac">فَاطِمَةُ أَحْسَنُ طَالِبَةٍ فِي الفَصْلِ</td><td>Fāṭima est la meilleure élève de la classe.</td></tr>
</tbody></table></div>
<div class="warn"><div class="ct">À retenir</div><p>L'élatif reste <b>masculin singulier</b> ; c'est le nom annexé qui s'accorde. <span class="arword">خَيْرٌ</span> et <span class="arword">شَرٌّ</span> sont des élatifs qui ont perdu leur hamza (de <span class="arword">أَخْيَرُ، أَشَرُّ</span>).</p></div>
<h3 class="sub"><span class="ar">مَعَ</span> (avec)</h3>
<p><span class="arword">مَعَ</span> est un adverbe de lieu toujours <b>annexé</b> : le mot qui suit est <b>majrūr</b>. <span class="arword">ذَهَبْتُ مَعَ صَدِيقِي</span>.</p>`},

/* ---------------------------------------------------------------- 13 */
{n:13, t:'Hamza de liaison / de coupure, ‘umra, 11–19', ar:'هَمْزَةُ الوَصْلِ وَالقَطْعِ', html:`
<div class="roads">
  <div class="road nom"><div class="top">هَمْزَةُ القَطْعِ</div><div class="q">se prononce <b>toujours</b>, où qu'elle soit · s'écrit avec le petit ء</div><div class="ex">أَكَلَ · أَنَا · إِلَى · أَكْرَمَ</div></div>
  <div class="road verb"><div class="top">هَمْزَةُ الوَصْلِ</div><div class="q">seulement en <b>début de mot</b> ; on ne la prononce que si rien ne la précède</div><div class="ex">اِسْمٌ · اِبْنٌ · ال · اُكْتُبْ</div></div>
</div>
<div class="recap gold"><div class="rt">Le test du wa</div><p>Ajoute <span class="arword">وَ</span> devant le mot : si la hamza <b>disparaît à l'oral</b>, c'est une hamza de liaison. <span class="arword">وَاسْمِي</span> → « wa-smī » (waṣl) ; <span class="arword">وَأَنَا</span> → « wa-anā » (qaṭ‘).</p></div>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th>Hamza de liaison dans…</th><th class="ac">Exemples</th></tr></thead><tbody>
  <tr><td>l'article</td><td class="ac">الكِتَابُ · فِي البَيْتِ (fi l-bayt)</td></tr>
  <tr><td>quelques noms</td><td class="ac">اِسْمٌ · اِبْنٌ · اِبْنَةٌ · اِمْرَأَةٌ · اِثْنَانِ</td></tr>
  <tr><td>l'impératif des verbes de 3 lettres</td><td class="ac">اُكْتُبْ · اِجْلِسْ</td></tr>
  <tr><td>les verbes de 5–6 lettres (passé, impératif, maṣdar)</td><td class="ac">اِجْتَمَعَ · اِسْتَغْفَرَ · اِنْطِلَاقٌ</td></tr>
</tbody></table></div>

<h3 class="sub">Ramadan, ‘umra et ḥajj</h3>
<div class="schema cols-3">
  <div class="scard"><div class="top">عُمْرَةٌ</div><div class="fr-s">petit pèlerinage · اِعْتَمَرَ : faire la ‘umra</div></div>
  <div class="scard"><div class="top">حَجٌّ</div><div class="fr-s">grand pèlerinage</div></div>
  <div class="scard"><div class="top">إِحْرَامٌ</div><div class="fr-s">état sacré du pèlerin</div></div>
  <div class="scard"><div class="top">طَوَافٌ</div><div class="fr-s">tours autour de la Ka‘ba</div></div>
  <div class="scard"><div class="top">سَعْيٌ</div><div class="fr-s">parcours entre Ṣafā et Marwa</div></div>
  <div class="scard"><div class="top">يَرْمِي</div><div class="fr-s">il lance (les cailloux)</div></div>
</div>
<div class="pills"><span class="pill">أَصُومُ <small>je jeûne</small></span><span class="pill">قَضَى العُطْلَةَ <small>il a passé les vacances</small></span><span class="pill">السُّرُورُ <small>la joie</small></span></div>

<h3 class="sub">Les nombres composés 11–19 <span class="ar">الأَعْدَادُ المُرَكَّبَةُ</span></h3>
<div class="rule">
  <div>Deux parties : l'<b>unité</b> puis la <b>dizaine</b>. Elles sont <b>invariables</b> (fatḥa), sauf la 1ʳᵉ partie de 12 (<span class="arword">اِثْنَا / اِثْنَتَا</span>).</div>
  <div>Le nom compté est au <b>singulier manṣūb</b> (tamyīz).</div>
  <div><b>11 et 12</b> : les deux parties s'accordent avec le nom.</div>
  <div><b>13 à 19</b> : l'unité prend le genre <b>opposé</b>, la dizaine <b>s'accorde</b>.</div>
</div>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th>Nombre</th><th class="ac">Nom masculin</th><th class="ac">Nom féminin</th></tr></thead><tbody>
  <tr><td>11</td><td class="ac">أَحَدَ عَشَرَ طَالِبًا</td><td class="ac">إِحْدَى عَشْرَةَ طَالِبَةً</td></tr>
  <tr><td>12</td><td class="ac">اِثْنَا عَشَرَ طَالِبًا</td><td class="ac">اِثْنَتَا عَشْرَةَ طَالِبَةً</td></tr>
  <tr><td>15</td><td class="ac">خَمْسَةَ عَشَرَ طَالِبًا</td><td class="ac">خَمْسَ عَشْرَةَ طَالِبَةً</td></tr>
  <tr><td>18</td><td class="ac">ثَمَانِيَةَ عَشَرَ طَالِبًا</td><td class="ac">ثَمَانِيَ (ثَمَانِي) عَشْرَةَ طَالِبَةً</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p>3–10 : nom au <b>pluriel</b> majrūr. 11–19 : nom au <b>singulier</b> en <b>-an</b>. Le générateur de l'outil <a href="#/outils/nombres">Nombres</a> applique ces règles pour toi.</p></div>`},

/* ---------------------------------------------------------------- 14 */
{n:14, t:'L’interdiction : le présent majzūm', ar:'المُضَارِعُ المَجْزُومُ · لَا النَّاهِيَةُ', html:`
<p class="lead">Le présent est normalement <b>marfū‘</b>. Certains outils, les <span class="arword">جَوَازِمُ</span>, le mettent au <b>majzūm</b> (cas « coupé ») : on supprime les marques du raf‘.</p>
<div class="hats">
  <div class="hat h-raf"><div class="v">تَأْكُلُ</div><div class="nm">مَرْفُوعٌ</div><div class="say">ḍamma (forme de base)</div></div>
  <div class="hat h-jazm"><div class="v">لَا تَأْكُلْ</div><div class="nm">مَجْزُومٌ</div><div class="say">la ḍamma devient sukūn</div></div>
</div>
<p>Pour les cinq verbes, c'est le <b>nūn</b> qui disparaît : <span class="arword">تَأْكُلُونَ ← لَا تَأْكُلُوا</span>, <span class="arword">تَأْكُلِينَ ← لَا تَأْكُلِي</span>.</p>
<h3 class="sub">Le lā de l'interdiction <span class="ar">لَا النَّاهِيَةُ</span></h3>
<div class="bi">
  <div class="fr"><span class="tag">Définition</span>Particule de jazm : elle met le présent au majzūm et lui donne un sens <b>futur</b> uniquement (« ne fais pas ! »).</div>
  <div class="arb"><span class="tag">التَّعْرِيفُ</span>حَرْفُ جَزْمٍ يَجْزِمُ الفِعْلَ المُضَارِعَ وَيَجْعَلُ زَمَنَهُ لِلْمُسْتَقْبَلِ فَقَطْ.</div>
</div>
<div class="roads">
  <div class="road verb"><div class="top">لَا النَّافِيَةُ</div><div class="q">elle <b>nie</b> : aucun changement</div><div class="ex">لِمَ لَا تَأْكُلُ يَا مُحَمَّدُ؟</div><div class="q">Pourquoi ne manges-tu pas ?</div></div>
  <div class="road nom"><div class="top">لَا النَّاهِيَةُ</div><div class="q">elle <b>interdit</b> : verbe majzūm</div><div class="ex">لَا تَأْكُلِ الوَجْبَةَ</div><div class="q">Ne mange pas le repas !</div></div>
</div>
<div class="warn"><div class="ct">Petit détail</div><p>Quand un sukūn rencontre l'article ال, on le change en kasra pour la liaison : <span class="arword">لَا تَأْكُلْ + الوَجْبَةَ ← لَا تَأْكُلِ الوَجْبَةَ</span>.</p></div>
<div class="exs">
  <div class="ex1"><span class="a">لَا تَخْرُجْ</span><span class="f">Ne sors pas ! (et non لَا تَخْرُجُ)</span></div>
  <div class="ex1"><span class="a">لَا تَكْذِبُوا</span><span class="f">Ne mentez pas !</span></div>
  <div class="ex1"><span class="a">لَا تَتَأَخَّرِي</span><span class="f">Ne sois pas en retard ! (à une femme)</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p><b>Ordre</b> : <span class="arword">اُخْرُجْ</span> (sors !) · <b>Interdiction</b> : <span class="arword">لَا تَخْرُجْ</span> (ne sors pas !). On garde le préfixe تَ et on coupe la fin.</p></div>`},

/* ---------------------------------------------------------------- 15 */
{n:15, t:'Le présent manṣūb : an, lan, lām de cause', ar:'المُضَارِعُ المَنْصُوبُ', html:`
<p class="lead">Troisième état du présent : le <b>manṣūb</b>. Il arrive après les <b>particules de naṣb</b> (<span class="arword">النَّوَاصِبُ</span>), et sa marque est la <b>fatḥa</b>.</p>
<div class="schema cols-3">
  <div class="scard r-cod"><div class="top">أَنْ</div><div class="mid">« que »</div><div class="fr-s">particule de maṣdar : <span class="ar">أَنْ + verbe = un nom d'action</span></div><div class="ex">أُرِيدُ أَنْ أَشْرَبَ</div></div>
  <div class="scard r-cod"><div class="top">لَنْ</div><div class="mid">« ne… pas / jamais » (futur)</div><div class="fr-s">négation du futur</div><div class="ex">لَنْ أَشْرَبَ القَهْوَةَ</div></div>
  <div class="scard r-cod"><div class="top">لِـ</div><div class="mid">« pour, afin de »</div><div class="fr-s">lām de la cause (<span class="ar">لَامُ التَّعْلِيلِ</span>)</div><div class="ex">جِئْتُ لِأَتَعَلَّمَ</div></div>
</div>
<div class="irab"><div class="phrase">لَنْ أَشْرَبَ القَهْوَةَ</div>
  <div class="row"><b>لَنْ :</b> حَرْفُ نَفْيٍ وَنَصْبٍ وَاسْتِقْبَالٍ مَبْنِيٌّ عَلَى السُّكُونِ، لَا مَحَلَّ لَهُ مِنَ الإِعْرَابِ.</div>
  <div class="row"><b>أَشْرَبَ :</b> فِعْلٌ مُضَارِعٌ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الفَتْحَةُ الظَّاهِرَةُ عَلَى آخِرِهِ، وَالفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ أَنَا.</div>
  <div class="row"><b>القَهْوَةَ :</b> مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الفَتْحَةُ الظَّاهِرَةُ عَلَى آخِرِهِ.</div>
  <div class="tr">« Je ne boirai pas de café. »</div></div>
<div class="clair"><div class="ct">En clair</div><p>Trois états du présent : <b>marfū‘</b> (ḍamma, forme de base) · <b>manṣūb</b> (fatḥa, après أَنْ/لَنْ/لِـ) · <b>majzūm</b> (sukūn, après لَمْ / لَا النَّاهِيَة).</p></div>`},

/* ---------------------------------------------------------------- 16 */
{n:16, t:'Le présent manṣūb (suite) : tableau récapitulatif', ar:'عَلَامَاتُ الإِعْرَابِ فِي المُضَارِعِ', html:`
<p class="lead">Au naṣb, la fatḥa remplace la ḍamma ; pour les <b>cinq verbes</b>, on <b>supprime le nūn</b>. Le nūn des femmes (<span class="arword">نُونُ النِّسْوَةِ</span>) reste toujours (le verbe est <span class="arword">مَبْنِيٌّ عَلَى السُّكُونِ</span>).</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Pronom</th><th class="ac">مَرْفُوعٌ</th><th class="ac">مَنْصُوبٌ (لَنْ)</th><th class="ac">مَجْزُومٌ (لَمْ)</th></tr></thead><tbody>
  <tr><td class="ac">أَنَا</td><td class="ac">أَذْهَبُ</td><td class="ac">أَذْهَبَ</td><td class="ac">أَذْهَبْ</td></tr>
  <tr><td class="ac">نَحْنُ</td><td class="ac">نَذْهَبُ</td><td class="ac">نَذْهَبَ</td><td class="ac">نَذْهَبْ</td></tr>
  <tr><td class="ac">أَنْتَ / هِيَ</td><td class="ac">تَذْهَبُ</td><td class="ac">تَذْهَبَ</td><td class="ac">تَذْهَبْ</td></tr>
  <tr><td class="ac">أَنْتِ</td><td class="ac">تَذْهَبِينَ</td><td class="ac">تَذْهَبِي</td><td class="ac">تَذْهَبِي</td></tr>
  <tr><td class="ac">أَنْتُمَا</td><td class="ac">تَذْهَبَانِ</td><td class="ac">تَذْهَبَا</td><td class="ac">تَذْهَبَا</td></tr>
  <tr><td class="ac">أَنْتُمْ</td><td class="ac">تَذْهَبُونَ</td><td class="ac">تَذْهَبُوا</td><td class="ac">تَذْهَبُوا</td></tr>
  <tr><td class="ac">أَنْتُنَّ</td><td class="ac">تَذْهَبْنَ</td><td class="ac">تَذْهَبْنَ</td><td class="ac">تَذْهَبْنَ</td></tr>
  <tr><td class="ac">هُوَ</td><td class="ac">يَذْهَبُ</td><td class="ac">يَذْهَبَ</td><td class="ac">يَذْهَبْ</td></tr>
  <tr><td class="ac">هُمَا</td><td class="ac">يَذْهَبَانِ</td><td class="ac">يَذْهَبَا</td><td class="ac">يَذْهَبَا</td></tr>
  <tr><td class="ac">هُمْ</td><td class="ac">يَذْهَبُونَ</td><td class="ac">يَذْهَبُوا</td><td class="ac">يَذْهَبُوا</td></tr>
  <tr><td class="ac">هُنَّ</td><td class="ac">يَذْهَبْنَ</td><td class="ac">يَذْهَبْنَ</td><td class="ac">يَذْهَبْنَ</td></tr>
</tbody></table></div>
<div class="schema cols-3">
  <div class="scard r-sujet"><div class="top">الرَّفْعُ</div><div class="fr-s">ḍamma · ou <b>présence</b> du nūn (<span class="ar">ثُبُوتُ النُّونِ</span>)</div></div>
  <div class="scard r-cod"><div class="top">النَّصْبُ</div><div class="fr-s">fatḥa · ou <b>suppression</b> du nūn (<span class="ar">حَذْفُ النُّونِ</span>)</div></div>
  <div class="scard r-info"><div class="top">الجَزْمُ</div><div class="fr-s">sukūn · ou <b>suppression</b> du nūn</div></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Au naṣb et au jazm, les cinq verbes ont la <b>même forme</b> (sans nūn). Seules les formes courtes diffèrent : <b>-a</b> (naṣb) contre <b>sukūn</b> (jazm). Entraîne-toi dans le <a href="#/outils/conjugueur">Conjugueur</a> (onglets Naṣb et Jazm).</p></div>`},

/* ---------------------------------------------------------------- 17 */
{n:17, t:'La négation : mā, lam, lammā, lā, lan', ar:'النَّفْيُ', html:`
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th>Temps nié</th><th class="ac">Outil</th><th class="ac">Verbe</th><th class="ac">Exemple</th><th>Sens</th></tr></thead><tbody>
  <tr><td data-label="Temps nié">Passé</td><td data-label="Outil" class="ac">مَا</td><td data-label="Verbe" class="ac">passé</td><td data-label="Exemple" class="ac">مَا شَرِبْتُ القَهْوَةَ</td><td data-label="Sens">Je n'ai pas bu de café.</td></tr>
  <tr><td data-label="Temps nié">Passé</td><td data-label="Outil" class="ac">لَمْ</td><td data-label="Verbe" class="ac">présent majzūm</td><td data-label="Exemple" class="ac">لَمْ أَكْتُبْ</td><td data-label="Sens">Je n'ai pas écrit.</td></tr>
  <tr><td data-label="Temps nié">« Pas encore »</td><td data-label="Outil" class="ac">لَمَّا</td><td data-label="Verbe" class="ac">présent majzūm</td><td data-label="Exemple" class="ac">لَمَّا أَكْتُبْ</td><td data-label="Sens">Je n'ai pas encore écrit (mais je vais le faire).</td></tr>
  <tr><td data-label="Temps nié">Présent</td><td data-label="Outil" class="ac">لَا</td><td data-label="Verbe" class="ac">présent marfū‘</td><td data-label="Exemple" class="ac">لَا أَشْرَبُ القَهْوَةَ الآنَ</td><td data-label="Sens">Je ne bois pas de café maintenant.</td></tr>
  <tr><td data-label="Temps nié">Futur</td><td data-label="Outil" class="ac">لَنْ</td><td data-label="Verbe" class="ac">présent manṣūb</td><td data-label="Exemple" class="ac">لَنْ أَشْرَبَ القَهْوَةَ</td><td data-label="Sens">Je ne boirai pas de café.</td></tr>
</tbody></table></div>
<div class="rule">
  <div><span class="arword">لَمْ</span> : négation qui transforme le présent en <b>passé</b> (« il n'a pas écrit ») — c'est une particule de <b>négation, de jazm et de « retournement »</b> du temps.</div>
  <div><span class="arword">لَمَّا</span> : la négation <b>dure jusqu'à maintenant</b>, et l'on s'attend à ce que l'action arrive.</div>
  <div><span class="arword">لَا</span> (négation simple) ne change rien au verbe.</div>
</div>
<div class="breakdown"><div class="bd-phrase">لَمْ يَكْتُبِ الطَّالِبُ الدَّرْسَ</div><div class="bd-words">
  <div class="bd-word r-outil"><span class="w">لَمْ</span><span class="role">négation + jazm</span><span class="fr">sens passé</span></div>
  <div class="bd-word r-action"><span class="w">يَكْتُبِ</span><span class="role">présent majzūm</span><span class="fr">sukūn → kasra de liaison devant ال</span></div>
  <div class="bd-word r-sujet"><span class="w">الطَّالِبُ</span><span class="role">sujet</span><span class="fr">ḍamma</span></div>
  <div class="bd-word r-cod"><span class="w">الدَّرْسَ</span><span class="role">complément</span><span class="fr">fatḥa</span></div>
</div></div>
<div class="clair"><div class="ct">En clair</div><p>Pense au <b>temps</b> que tu veux nier : passé → <span class="arword">مَا</span> + passé ou <span class="arword">لَمْ</span> + présent coupé · présent → <span class="arword">لَا</span> · futur → <span class="arword">لَنْ</span> + fatḥa.</p></div>`},

/* ---------------------------------------------------------------- 18 */
{n:18, t:'Le Coran et les prépositions', ar:'القُرْآنُ الكَرِيمُ · حُرُوفُ الجَرِّ', html:`
<p class="lead">Le texte du cours porte sur le Coran : sa <b>révélation</b> (<span class="arword">الوَحْيُ</span>) au Prophète ﷺ, ses <b>sourates</b> et ses <b>versets</b>, puis sa <b>compilation</b> en un seul <span class="arword">مُصْحَفٌ</span>. La règle de grammaire : les <b>prépositions</b>.</p>
<div class="pills"><span class="pill">القُرْآنُ <small>le Coran</small></span><span class="pill">الوَحْيُ <small>la révélation</small></span><span class="pill">نَزَلَ <small>descendre</small></span><span class="pill">سُورَةٌ ج. سُوَرٌ <small>sourate</small></span><span class="pill">آيَةٌ ج. آيَاتٌ <small>verset</small></span><span class="pill">جَمَعَ <small>rassembler, compiler</small></span><span class="pill">المُصْحَفُ <small>le mus·ḥaf</small></span></div>
<h3 class="sub">Les particules de jarr</h3>
<div class="bi">
  <div class="fr"><span class="tag">Règle</span>Ces particules n'entrent <b>que sur des noms</b>, et elles mettent le nom qui suit au cas indirect (<b>majrūr</b>). La marque d'origine du jarr est la <b>kasra</b>.</div>
  <div class="arb"><span class="tag">القَاعِدَةُ</span>هٰذِهِ الحُرُوفُ لَا تَدْخُلُ إِلَّا عَلَى الأَسْمَاءِ، وَتَجُرُّ مَا بَعْدَهَا. وَعَلَامَةُ الجَرِّ الأَصْلِيَّةُ الكَسْرَةُ.</div>
</div>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Particule</th><th>Sens</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td class="ac">فِي</td><td>dans</td><td class="ac">فِي المَسْجِدِ</td></tr>
  <tr><td class="ac">مِنْ</td><td>de, depuis</td><td class="ac">خَرَجْتُ مِنَ البَيْتِ</td></tr>
  <tr><td class="ac">إِلَى</td><td>vers, à</td><td class="ac">ذَهَبَ الطَّالِبُ إِلَى المَدْرَسَةِ</td></tr>
  <tr><td class="ac">عَنْ</td><td>au sujet de, loin de</td><td class="ac">سَأَلْتُ عَنِ الدَّرْسِ</td></tr>
  <tr><td class="ac">عَلَى</td><td>sur</td><td class="ac">الكِتَابُ عَلَى المَكْتَبِ</td></tr>
  <tr><td class="ac">بِـ</td><td>avec, par</td><td class="ac">كَتَبْتُ بِالقَلَمِ</td></tr>
  <tr><td class="ac">لِـ</td><td>pour, à (appartenance)</td><td class="ac">الحَمْدُ لِلَّهِ</td></tr>
  <tr><td class="ac">كَـ</td><td>comme</td><td class="ac">هُوَ كَالأَسَدِ</td></tr>
</tbody></table></div>
<div class="warn"><div class="ct">Deux réflexes</div><p>1) ✅ <span class="arword">إِلَى المَدْرَسَةِ</span> — ❌ <span class="arword">إِلَى المَدْرَسَةُ</span>. 2) On ne met <b>pas</b> une particule directement après une autre : après un ḥarf vient un <b>nom</b>.</p></div>
<div class="clair"><div class="ct">En clair</div><p>Le mot se divise en <b>nom, verbe, particule</b>. Les particules de jarr sont la famille de particules la plus fréquente : repère-les, et mets une <b>kasra</b> au nom qui suit.</p></div>`},

/* ---------------------------------------------------------------- 19 */
{n:19, t:'Le duel et l’épithète (an-na‘t)', ar:'المُثَنَّى وَالنَّعْتُ', html:`
<h3 class="sub" style="margin-top:0">Le duel <span class="ar">المُثَنَّى</span></h3>
<p>Pour parler de <b>deux</b> choses, on ajoute une terminaison au singulier :</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th>Cas</th><th class="ac">Terminaison</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td>Sujet (marfū‘)</td><td class="ac">ـَانِ</td><td class="ac">جَاءَ طَالِبَانِ · كِتَابَانِ</td></tr>
  <tr><td>Complément / après préposition</td><td class="ac">ـَيْنِ</td><td class="ac">رَأَيْتُ طَالِبَيْنِ · فِي كِتَابَيْنِ</td></tr>
  <tr><td>Avec ة</td><td class="ac">ـَتَانِ / ـَتَيْنِ</td><td class="ac">طَالِبَتَانِ · سَيَّارَتَيْنِ</td></tr>
</tbody></table></div>

<h3 class="sub">L'épithète <span class="ar">النَّعْتُ</span></h3>
<p>Le <span class="arword">نَعْتٌ</span> exprime une qualité du nom qu'il décrit (<span class="arword">المَنْعُوتُ</span>). Il se place <b>toujours après</b> lui et s'accorde sur <b>4 points</b> :</p>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th>Accord</th><th class="ac">Exemple</th><th>Analyse</th></tr></thead><tbody>
  <tr><td>1. Genre</td><td class="ac">الطَّالِبَةُ الجَدِيدَةُ مُجْتَهِدَةٌ</td><td>féminin / féminin</td></tr>
  <tr><td>2. Défini / indéfini</td><td class="ac">الطَّالِبُ الجَدِيدُ · طَالِبٌ مُجْتَهِدٌ</td><td>ma‘rifa / ma‘rifa · nakira / nakira</td></tr>
  <tr><td>3. Cas</td><td class="ac">القَلَمُ عَلَى المَكْتَبِ الصَّغِيرِ</td><td>majrūr / majrūr</td></tr>
  <tr><td>4. Nombre</td><td class="ac">الطُّلَّابُ الجُدُدُ مُجْتَهِدُونَ</td><td>pluriel / pluriel</td></tr>
</tbody></table></div>
<div class="pills"><span class="pill">كِتَابٌ جَدِيدٌ</span><span class="pill">سَيَّارَةٌ جَدِيدَةٌ</span><span class="pill">بَيْتَانِ كَبِيرَانِ</span><span class="pill">جَدِيدٌ ≠ قَدِيمٌ</span><span class="pill">كَبِيرٌ ≠ صَغِيرٌ</span></div>

<h3 class="sub">Na‘t ou khabar ?</h3>
<div class="roads">
  <div class="road nom"><div class="top">النَّعْتُ</div><div class="q">précise une qualité <b>déjà connue</b> ; <b>facultatif</b> ; toujours accordé en défini/indéfini</div><div class="ex">الطَّالِبُ الجَدِيدُ</div><div class="q">« le nouvel étudiant… » (phrase incomplète)</div></div>
  <div class="road verb"><div class="top">الخَبَرُ</div><div class="q">apporte une <b>information nouvelle</b> ; <b>pilier</b> indispensable ; en général <b>indéfini</b></div><div class="ex">الطَّالِبُ جَدِيدٌ</div><div class="q">« l'étudiant est nouveau » (phrase complète)</div></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Regarde l'<b>article</b> : <span class="arword">الطَّالِبُ الجَدِيدُ</span> (deux ال) = « le nouvel étudiant » (na‘t) ; <span class="arword">الطَّالِبُ جَدِيدٌ</span> (ال puis tanwīn) = « l'étudiant est nouveau » (khabar).</p></div>`}
);

{n:2, t:'La grande bataille de Badr', ar:'مَعْرَكَةُ بَدْرٍ الكُبْرَى', html:`
<div class="txt"><div class="tt">مَعْرَكَةُ بَدْرٍ (مُلَخَّصٌ)</div><div class="body">كَانَتْ حَيَاةُ المُسْلِمِينَ فِي مَكَّةَ ضَيِّقَةً، فَأَذِنَ اللهُ لَهُمْ بِالهِجْرَةِ إِلَى المَدِينَةِ، وَأَقَامَ فِيهَا الرَّسُولُ ﷺ دَوْلَةً إِسْلَامِيَّةً. وَفِي رَمَضَانَ مِنَ السَّنَةِ الثَّانِيَةِ لِلْهِجْرَةِ اِلْتَقَى المُسْلِمُونَ وَالكَافِرُونَ فِي مَكَانٍ اسْمُهُ بَدْرٌ. كَانَ عَدَدُ المُسْلِمِينَ حَوَالَيْ ثَلَاثِمِائَةِ مُقَاتِلٍ، وَعَدَدُ الكَافِرِينَ نَحْوَ أَلْفِ مُقَاتِلٍ. فَانْتَصَرَ المُسْلِمُونَ اِنْتِصَارًا عَظِيمًا.</div>
<div class="src">Résumé rédigé pour l'appli d'après le texte étudié.</div></div>
<details class="sol"><summary>Traduction</summary><div>La vie des musulmans à La Mecque était très difficile ; Allah leur permit d'émigrer à Médine, où le Messager ﷺ établit un État islamique. En Ramadan de l'an 2 de l'Hégire, les musulmans et les mécréants se rencontrèrent en un lieu appelé Badr. Les musulmans étaient environ 300 combattants, les mécréants environ 1000. Les musulmans remportèrent une immense victoire.</div></details>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th>Repère</th><th>D'après le cours</th></tr></thead><tbody>
  <tr><td>Date</td><td>17 Ramadan, an 2 de l'Hégire</td></tr>
  <tr><td>Musulmans</td><td>≈ 300 combattants, sous le commandement du Prophète ﷺ</td></tr>
  <tr><td>Mécréants</td><td>≈ 1000 combattants, sous le commandement d'Abū Jahl (‘Amr ibn Hishām)</td></tr>
  <tr><td>Issue</td><td>Grande victoire ; beaucoup de mécréants tués, 70 faits prisonniers ; 14 martyrs musulmans</td></tr>
</tbody></table></div>
<h3 class="sub">Nuances de vocabulaire</h3>
<div class="roads">
  <div class="road verb"><div class="top">سَمِعَ</div><div class="q">entendre — même <b>sans le vouloir</b></div></div>
  <div class="road nom"><div class="top">اِسْتَمَعَ</div><div class="q">écouter — <b>volontairement</b>, avec attention</div></div>
</div>
<div class="schema cols-3">
  <div class="scard"><div class="top">غَزْوَةٌ</div><div class="fr-s">expédition à laquelle le Prophète ﷺ a pris part</div></div>
  <div class="scard"><div class="top">شَهِيدٌ ج. شُهَدَاءُ</div><div class="fr-s">celui qui est tué dans le sentier d'Allah</div></div>
  <div class="scard"><div class="top">حَوَالَيْ</div><div class="fr-s">environ (on ne connaît pas le nombre exact)</div></div>
</div>
<div class="recap coral"><div class="rt">Verbes au passif</div><p><span class="arword">قُتِلَ</span> « il a été tué » et <span class="arword">أُسِرَ</span> « il a été capturé » : même racine que <span class="arword">قَتَلَ / أَسَرَ</span>, mais avec <b>u-i</b> (ḍamma puis kasra) — on ne sait pas, ou on ne dit pas, qui a fait l'action.</p></div>`},

{n:3, t:'Dialogue : Aḥmad au restaurant', ar:'حِوَارٌ : فِي المَطْعَمِ', html:`
<p class="lead">Aḥmad est au restaurant et discute avec le serveur (<span class="arword">العَامِلُ</span>) : il demande le menu, commande, paie et repart. Voici un dialogue de révision avec le vocabulaire de la leçon.</p>
<div class="dlg">
  <div class="ln"><span class="who">Aḥmad</span><span class="a">مِنْ فَضْلِكَ، مَا قَائِمَةُ الطَّعَامِ اليَوْمَ؟</span><span class="f">S'il vous plaît, quel est le menu aujourd'hui ?</span></div>
  <div class="ln"><span class="who">Serveur</span><span class="a">تَفَضَّلْ : عِنْدَنَا دَجَاجٌ وَلُحُومٌ وَأَرُزٌّ وَخُضْرَوَاتٌ وَفَوَاكِهُ</span><span class="f">Je vous en prie : nous avons du poulet, des viandes, du riz, des légumes et des fruits.</span></div>

  <tr><td class="ac">خُضْرَوَاتٌ</td><td>légumes</td><td class="ac">مِلْعَقَةٌ</td><td>cuillère</td></tr>

  <tr><td class="ac">فَوَاكِهُ</td><td>fruits</td><td class="ac">سِكِّينٌ</td><td>couteau</td></tr>

/* ---------------------------------------------------------------- R1 */
{n:'R1', annex:true, tag:'R1', t:'Compréhension et traduction (1) · le diptote', ar:'التَّرْجَمَةُ وَالفَهْمُ · المَمْنُوعُ مِنَ الصَّرْفِ', html:`
<p class="lead">Traduire demande plusieurs compétences : le <b>vocabulaire</b>, la <b>morphologie</b> (savoir transformer un verbe d'un temps à l'autre — le dictionnaire ne le fait pas pour toi) et la <b>syntaxe</b> (ordonner les mots dans la phrase).</p>
<div class="recap coral"><div class="rt">Le verbe « être »</div><p>En arabe, « être » au présent se traduit par une <b>phrase nominale</b>, sans verbe : <span class="arword">هٰذَا الطَّالِبُ ذَكِيٌّ</span> « Cet étudiant est intelligent ». <span class="arword">البَابُ مَفْتُوحٌ</span> « La porte est ouverte ».</p></div>
<h3 class="sub">Le nom diptote <span class="ar">المَمْنُوعُ مِنَ الصَّرْفِ</span></h3>
<p>Certains noms <b>refusent le tanwīn</b> et, au cas indirect, prennent une <b>fatḥa</b> au lieu de la kasra. Exemple : les pluriels du type <span class="arword">مَفَاعِلُ</span> (un alif entre deux consonnes, <span class="arword">صِيغَةُ مُنْتَهَى الجُمُوعِ</span>) : <span class="arword">مَسَاجِدُ، مَدَارِسُ، تَلَامِيذُ</span>.</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th>Situation</th><th class="ac">Exemple</th><th>Remarque</th></tr></thead><tbody>
  <tr><td>Sujet</td><td class="ac">هٰذِهِ مَسَاجِدُ</td><td>pas de tanwīn</td></tr>
  <tr><td>Après préposition</td><td class="ac">دَخَلْتُ فِي مَسَاجِدَ كَثِيرَةٍ</td><td>fatḥa au lieu de kasra</td></tr>
  <tr><td>Avec ال</td><td class="ac">دَخَلْتُ فِي المَسَاجِدِ</td><td>la règle tombe : kasra normale</td></tr>
  <tr><td>Annexé (muḍāf)</td><td class="ac">دَخَلْتُ فِي مَسَاجِدِ المَدِينَةِ</td><td>la règle tombe aussi</td></tr>
</tbody></table></div>
<div class="hadith"><div class="a">وَجُرَّ بِالفَتْحَةِ مَا لَا يَنْصَرِفْ ۞ مَا لَمْ يُضَفْ أَوْ يَكُ بَعْدَ «أَلْ» رَدِفْ</div><div class="f">« Mets au cas indirect avec la fatḥa le nom diptote, tant qu'il n'est pas annexé ou qu'il ne suit pas l'article. »</div><div class="src">Ibn Mālik, al-Alfiyya — un grand grammairien andalou qui a résumé toute la grammaire en mille vers ; le professeur conseille de les apprendre.</div></div>
<h3 class="sub">Exercice de traduction</h3>
<details class="sol"><summary>Les élèves sont dans la classe.</summary><div class="ar" style="font-size:1.25rem">التَّلَامِيذُ فِي الفَصْلِ.</div></details>
<details class="sol"><summary>J'ai vu les élèves.</summary><div class="ar" style="font-size:1.25rem">رَأَيْتُ التَّلَامِيذَ.</div></details>
<details class="sol"><summary>Iras-tu au village pendant les vacances ?</summary><div class="ar" style="font-size:1.25rem">هَلْ سَتَذْهَبُ إِلَى القَرْيَةِ فِي العُطْلَةِ؟</div></details>
<details class="sol"><summary>Nous écrivons la leçon au tableau.</summary><div class="ar" style="font-size:1.25rem">نَكْتُبُ الدَّرْسَ عَلَى السَّبُّورَةِ.</div></details>
<details class="sol"><summary>J'ai vu la belle voiture de Fāṭima.</summary><div class="ar" style="font-size:1.25rem">رَأَيْتُ سَيَّارَةَ فَاطِمَةَ الجَمِيلَةَ.</div><p class="faint">فَاطِمَةَ : nom propre féminin → diptote (fatḥa au lieu de kasra).</p></details>
<details class="sol"><summary>Les deux mosquées sont belles.</summary><div class="ar" style="font-size:1.25rem">المَسْجِدَانِ جَمِيلَانِ.</div></details>
<details class="sol"><summary>Nous n'avons pas compris cette langue.</summary><div class="ar" style="font-size:1.25rem">لَمْ نَفْهَمْ هٰذِهِ اللُّغَةَ.</div></details>
<details class="sol"><summary>Hier, les musulmans se sont réunis au village.</summary><div class="ar" style="font-size:1.25rem">أَمْسِ، اِجْتَمَعَ المُسْلِمُونَ فِي القَرْيَةِ.</div></details>`},

/* ---------------------------------------------------------------- 4 */
{n:4, t:'La phrase simple : verbe, sujet, complément', ar:'الجُمْلَةُ البَسِيطَةُ', html:`
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th>Phrase</th><th class="ac">Verbe</th><th class="ac">Sujet</th><th class="ac">Complément</th></tr></thead><tbody>
  <tr><td>1 — passé</td><td class="ac">دَخَلَ</td><td class="ac">أَحْمَدُ</td><td class="ac">الفُنْدُقَ</td></tr>
  <tr><td>2 — présent</td><td class="ac">يُقَدِّمُ</td><td class="ac">الفُنْدُقُ</td><td class="ac">الطَّعَامَ</td></tr>
  <tr><td>3 — impératif</td><td class="ac">اِمْلَأْ</td><td class="ac">(caché : أَنْتَ)</td><td class="ac">البِطَاقَةَ</td></tr>
</tbody></table></div>
<p class="faint" style="font-size:.86rem">« Aḥmad est entré dans l'hôtel » · « L'hôtel sert la nourriture » · « Remplis la fiche ! »</p>
<h3 class="sub">Les règles</h3>
<div class="rule">
  <div>Le verbe est au <b>passé</b> (action terminée), au <b>présent</b> (en cours ou à venir) ou à l'<b>impératif</b> (demande). C'est souvent le <b>contexte</b> qui fixe le temps : <span class="arword">أَذْهَبُ إِلَى الجَامِعَةِ غَدًا</span> — « demain » indique le futur.</div>
  <div>Après le verbe vient un nom <b>marfū‘</b> qui désigne celui qui a fait l'action : le <b>sujet</b> (<span class="arword">الفَاعِلُ</span>).</div>
  <div>Le sujet est <b>caché</b> (<span class="arword">مُسْتَتِرٌ</span>) dans deux cas : quand quelque chose <b>avant</b> le verbe désigne déjà l'auteur, et avec l'<b>impératif</b> au masculin singulier (<span class="arword">اُكْتُبْ</span>).</div>
  <div>Le verbe et son sujet peuvent être suivis d'un nom <b>manṣūb</b> qui subit l'action : le <b>complément d'objet</b> (<span class="arword">المَفْعُولُ بِهِ</span>), qui n'est pas obligatoire.</div>
</div>
<div class="warn"><div class="ct">Le sujet ne précède jamais le verbe</div><p>Dans <span class="arword">زَيْدٌ قَامَ</span> « Zayd s'est levé », <span class="arword">زَيْدٌ</span> n'est <b>pas</b> le sujet : c'est un <b>mubtada’</b>, et le sujet de <span class="arword">قَامَ</span> est un pronom caché (هُوَ).</p></div>
<div class="breakdown"><div class="bd-phrase">أَكْرَمَ مُحَمَّدٌ زَيْدًا</div><div class="bd-words">
  <div class="bd-word r-action"><span class="w">أَكْرَمَ</span><span class="role">verbe</span><span class="fr">a honoré</span></div>
  <div class="bd-word r-sujet"><span class="w">مُحَمَّدٌ</span><span class="role">sujet · marfū‘</span><span class="fr">celui qui agit</span></div>
  <div class="bd-word r-cod"><span class="w">زَيْدًا</span><span class="role">complément · manṣūb</span><span class="fr">celui qui subit</span></div>
</div></div>`},

/* ---------------------------------------------------------------- 5 */
{n:5, t:'Le miel est une guérison', ar:'فِي العَسَلِ شِفَاءٌ', html:`
<div class="txt"><div class="tt">فِي العَسَلِ شِفَاءٌ (مُلَخَّصٌ)</div><div class="body">شَعَرَ عَامِرٌ بِآلَامٍ فِي بَطْنِهِ، وَلَمْ يَذْهَبْ إِلَى الطَّبِيبِ. فَحَكَى لَهُ صَدِيقُهُ حَازِمٌ قِصَّةَ الصَّحَابِيِّ الَّذِي اشْتَكَى مِنْ بَطْنِهِ، فَأَمَرَ الرَّسُولُ ﷺ أَخَاهُ أَنْ يَسْقِيَهُ عَسَلًا، فَشُفِيَ. فَقَرَّرَ عَامِرٌ أَنْ يَشْتَرِيَ العَسَلَ مِنَ السُّوقِ.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>‘Āmir avait des douleurs au ventre et n'était pas allé chez le médecin. Son ami Ḥāzim lui raconta l'histoire du Compagnon qui se plaignait du ventre : le Messager ﷺ ordonna à son frère de lui faire boire du miel, et il guérit. ‘Āmir décida d'acheter du miel au marché.</div></details>
<div class="txt"><div class="body">فِيهِ شِفَاءٌ لِّلنَّاسِ</div><div class="src">« Il y a en lui (le miel) une guérison pour les gens. » — An-Naḥl, 69</div></div>
<h3 class="sub">Vocabulaire</h3>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Explication</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">آلَامٌ</td><td class="ac">وَجَعٌ شَدِيدٌ</td><td>douleurs aiguës</td></tr>
  <tr><td class="ac">اِشْتَكَى</td><td class="ac">شَعَرَ بِالأَلَمِ وَأَخْبَرَ</td><td>se plaindre (d'un mal)</td></tr>
  <tr><td class="ac">عَالَجَهُ</td><td class="ac">دَاوَاهُ</td><td>il l'a soigné</td></tr>
  <tr><td class="ac">سَقَاهُ</td><td class="ac">جَعَلَهُ يَشْرَبُ</td><td>il lui a donné à boire</td></tr>
  <tr><td class="ac">شُفِيَ</td><td class="ac">مِنْ شَفَى يَشْفِي</td><td>il a été guéri</td></tr>
  <tr><td class="ac">مَحَلَّاتٌ</td><td class="ac">جَمْعُ مَحَلٍّ</td><td>boutiques</td></tr>
  <tr><td class="ac">السُّوقُ المَرْكَزِيُّ</td><td></td><td>le marché central</td></tr>
  <tr><td class="ac">دَوَاءٌ</td><td></td><td>médicament</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : l'alif et la hamza</h3>
<div class="roads">
  <div class="road verb"><div class="top">ا</div><div class="q">l'<b>alif</b> est une <b>voyelle longue</b> : il allonge le son, ne porte jamais de voyelle</div><div class="ex">قَالَ · بَابٌ</div></div>
  <div class="road nom"><div class="top">أ · ء</div><div class="q">la <b>hamza</b> est une <b>consonne</b> : elle accepte les voyelles</div><div class="ex">أَكَلَ · سَأَلَ · مَاءٌ</div></div>
</div>
<h3 class="sub">Règle : les prépositions</h3>
<p>Elles mettent le nom au <b>cas indirect</b> (kasra) : <span class="arword">مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِـ، لِـ</span>. Ex. : <span class="arword">أَشْعُرُ بِآلَامٍ فِي بَطْنِي</span>.</p>
<div class="clair"><div class="ct">Expressions du dialogue</div><p><span class="arword">سُبْحَانَ اللهِ</span> (étonnement), <span class="arword">شَفَاكَ اللهُ</span> (qu'Allah te guérisse), <span class="arword">جَزَاكَ اللهُ خَيْرًا</span> (qu'Allah te récompense en bien).</p></div>`},

/* ---------------------------------------------------------------- 6 */
{n:6, t:'Zaynab et Maryam, deux amies', ar:'زَيْنَبُ وَمَرْيَمُ صَدِيقَتَانِ', html:`
<div class="txt"><div class="tt">زَيْنَبُ وَمَرْيَمُ (مُلَخَّصٌ)</div><div class="body">زَيْنَبُ وَمَرْيَمُ صَدِيقَتَانِ، تَسْكُنَانِ فِي حَيٍّ وَاحِدٍ وَتَدْرُسَانِ فِي جَامِعَةٍ وَاحِدَةٍ. زَيْنَبُ نَحِيفَةٌ وَتُرِيدُ أَنْ تَزِيدَ وَزْنَهَا، وَمَرْيَمُ سَمِينَةٌ وَتُرِيدُ أَنْ يَنْقُصَ وَزْنُهَا. حَاوَلَتَا كَثِيرًا، وَلٰكِنَّهُمَا لَمْ تَنْجَحَا.</div><div class="src">Résumé rédigé pour l'appli.</div></div>
<details class="sol"><summary>Traduction</summary><div>Zaynab et Maryam sont deux amies ; elles habitent le même quartier et étudient dans la même université. Zaynab est mince et veut prendre du poids ; Maryam est grosse et veut perdre du poids. Elles ont beaucoup essayé, mais n'ont pas réussi.</div></details>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">حَيٌّ = مَحَلَّةٌ</td><td>quartier</td><td class="ac">تَتَشَابَهَانِ</td><td>elles se ressemblent</td></tr>
  <tr><td class="ac">نَحِيفٌ</td><td>mince</td><td class="ac">سَمِينٌ</td><td>gros</td></tr>
  <tr><td class="ac">وَزْنٌ</td><td>poids</td><td class="ac">زَادَ / نَقَصَ</td><td>augmenter / diminuer</td></tr>
  <tr><td class="ac">حَاوَلَ</td><td>essayer</td><td class="ac">مَارَسَ الرِّيَاضَةَ</td><td>pratiquer le sport</td></tr>
  <tr><td class="ac">المُرَبَّى</td><td>la confiture</td><td class="ac">ظَلَّ = بَقِيَ</td><td>rester, demeurer</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : le lā de négation + présent</h3>
<p><span class="arword">لَا</span> devant un présent <b>nie</b> l'action sans changer la fin du verbe : il reste <b>marfū‘</b>.</p>
<div class="exs">
  <div class="ex1"><span class="a">زَيْنَبُ لَا تُحِبُّ الأَكْلَ</span><span class="f">Zaynab n'aime pas manger.</span></div>
  <div class="ex1"><span class="a">مَرْيَمُ لَا تَسْتَطِيعُ أَنْ تَتْرُكَ الحَلْوَى</span><span class="f">Maryam ne peut pas laisser les sucreries.</span></div>
</div>
<div class="warn"><div class="ct">À ne pas confondre</div><p><span class="arword">لَا تَأْكُلُ</span> « elle ne mange pas » (négation, ḍamma) ≠ <span class="arword">لَا تَأْكُلْ</span> « ne mange pas ! » (interdiction, sukūn).</p></div>`},

/* ---------------------------------------------------------------- 7 */
{n:7, t:'Chez le médecin : les temps du verbe', ar:'عِنْدَ الطَّبِيبِ', html:`
<div class="dlg">
  <div class="ln"><span class="who">Médecin</span><span class="a">الضَّغْطُ مُرْتَفِعٌ، وَالسُّكَّرِيُّ أَيْضًا</span><span class="f">La tension est élevée, le diabète aussi.</span></div>
  <div class="ln"><span class="who">Patient</span><span class="a">تَنَاوَلْتُ الدَّوَاءَ، وَلٰكِنِّي لَمْ أَتَّبِعِ الحِمْيَةَ</span><span class="f">J'ai pris le médicament, mais je n'ai pas suivi le régime.</span></div>
  <div class="ln"><span class="who">Médecin</span><span class="a">لَا بُدَّ مِنَ الحِمْيَةِ وَالرِّيَاضَةِ، الدَّوَاءُ وَحْدَهُ لَا يَكْفِي</span><span class="f">Le régime et le sport sont indispensables ; le médicament seul ne suffit pas.</span></div>
  <div class="ln"><span class="who">Patient</span><span class="a">سَأَتَّبِعُ الحِمْيَةَ، إِنْ شَاءَ اللهُ</span><span class="f">Je suivrai le régime, si Allah le veut.</span></div>
</div>
<p class="faint" style="font-size:.84rem">Dialogue de révision rédigé avec le vocabulaire de la leçon.</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">الضَّغْطُ</td><td>la tension</td></tr>
  <tr><td class="ac">السُّكَّرِيُّ</td><td>le diabète</td></tr>
  <tr><td class="ac">الحِمْيَةُ</td><td>le régime (suivre une méthode de vie)</td></tr>
  <tr><td class="ac">الدُّهُونُ · النَّشَوِيَّاتُ · السُّكَّرِيَّاتُ</td><td>les graisses · les féculents · les sucres</td></tr>
  <tr><td class="ac">لَا بُدَّ</td><td>il faut absolument</td></tr>
  <tr><td class="ac">يَكْفِي</td><td>suffire</td></tr>
  <tr><td class="ac">حَالَتُكَ خَطِيرَةٌ</td><td>ton état est grave</td></tr>
  <tr><td class="ac">قَابِلْنِي</td><td>viens me voir</td></tr>
</tbody></table></div>
<h3 class="sub">Règle : le temps du verbe <span class="ar">زَمَنُ الفِعْلِ</span></h3>
<div class="schema cols-3">
  <div class="scard r-cod"><div class="top">مَاضٍ</div><div class="mid">Passé</div><div class="ex">تَنَاوَلْتُ الدَّوَاءَ</div></div>
  <div class="scard r-sujet"><div class="top">مُضَارِعٌ</div><div class="mid">Présent</div><div class="ex">أَتَنَاوَلُ الدَّوَاءَ</div></div>
  <div class="scard r-info"><div class="top">سَـ / سَوْفَ + مُضَارِعٌ</div><div class="mid">Futur</div><div class="ex">سَأَتَنَاوَلُ الدَّوَاءَ</div></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Le présent seul peut déjà exprimer le futur ; <span class="arword">سَـ</span> et <span class="arword">سَوْفَ</span> le rendent explicite. Choisis le temps selon le <b>contexte</b>.</p></div>`},
