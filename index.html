(Cours 4)","cat":"conj","t":"qcm"},{"id":"s2-b27","c":4,"d":"m","q":"À quel pronom correspond la forme كَتَبْتِ (katabti) ?","o":["أنتَ (toi, masc.)","أنتِ (toi, fém.)","هي (elle)","أنا (je)"],"a":[1],"j":"كَتَبْتِ (katabti) = « tu as écrit » au féminin → أنتِ. (Cours 4)","cat":"conj","t":"qcm"},{"id":"s2-b28","c":4,"d":"m","q":"À quel pronom correspond la forme كَتَبوا (katabū) ?","o":["هم (ils)","هنّ (elles)","نحن (nous)","أنتم (vous)"],"a":[0],"j":"كَتَبوا (katabū) = « ils ont écrit » → هم. (Cours 4)","cat":"conj","t":"qcm"},{"id":"s2-b29","c":4,"d":"m","q":"Comment dit-on « elle a écrit » (هي) au passé ?","o":["كَتَبَتْ (katabat)","كَتَبَ (kataba)","كَتَبْنَ (katabna)","كَتَبْتِ (katabti)"],"a":[0],"j":"Au passé, le féminin singulier ajoute un ت final : كَتَبَتْ (katabat). (Cours 4)","cat":"conj","t":"qcm"},{"id":"s2-b30","c":4,"d":"d","q":"Comment dit-on « elles ont écrit » (هنّ) au passé ?","o":["كَتَبْنَ (katabna)","كَتَبوا (katabū)","كَتَبْتُنَّ (katabtunna)","كَتَبَتْ (katabat)"],"a":[0],"j":"هنّ → كَتَبْنَ (katabna). كَتَبوا = هم ; كَتَبْتُنَّ = أنتنّ. (Cours 4)","cat":"conj","t":"qcm"},{"id":"s2-b31","c":4,"d":"d","q":"Vrai ou faux — Au passé, la forme كَتَبَ (kataba) correspond à « il a écrit » (هو).","o":["Vrai","Faux"],"a":[0],"j":"Vrai : كَتَبَ = « il a écrit » (هو), forme de base du passé. (Cours 4)","cat":"conj","t":"vf"},{"id":"s2-b32","c":4,"d":"d","q":"Vrai ou faux — « كَتَبْتَ » et « كَتَبْتِ » correspondent au même pronom.","o":["Vrai","Faux"],"a":[1],"j":"Faux : كَتَبْتَ (fatḥa) = أنتَ (masc.) et كَتَبْتِ (kasra) = أنتِ (fém.). (Cours 4)","cat":"conj","t":"vf"},{"id":"s2-b33","c":5,"d":"f","q":"Combien de types de verbes existe-t-il pour exprimer le temps en arabe ?","o":["2","3","4","5"],"a":[1],"j":"Trois : passé (māḍī), présent/futur (muḍāriʿ), impératif (amr). (Cours 5)","cat":"conj","t":"qcm"},{"id":"s2-b34","c":5,"d":"f","q":"Comment s'appelle la transformation d'une forme verbale à une autre ?","o":["نحو (naḥw)","تصريف (taṣrīf)","إضافة (iḍāfa)","تنوين (tanwīn)"],"a":[1],"j":"Le passage d'une forme à une autre s'appelle taṣrīf. (Cours 5)","cat":"conj","t":"qcm"},{"id":"s2-b35","c":5,"d":"m","q":"Pour former le présent/futur (muḍāriʿ), on ajoute un préfixe parmi :","o":["م / ل / ب","س / ش / ص","أ / ن / ي / ت (abrégé « anaytu »)","ق / ر / ط"],"a":[2],"j":"On ajoute hamza, nūn, yāʼ ou tāʼ (abrégé « anaytu »). (Cours 5)","cat":"conj","t":"qcm"},{"id":"s2-b36","c":5,"d":"m","q":"Quel repère de voyelle finale est associé au présent/futur (muḍāriʿ) à l'état de base ?","o":["fatḥa","ḍamma","sukūn","kasra"],"a":[1],"j":"Repères : passé → fatḥa, présent/futur → ḍamma, impératif → sukūn. (Cours 5)","cat":"conj","t":"qcm"},{"id":"s2-b37","c":5,"d":"m","q":"Lesquelles de ces associations « repère → type de verbe » sont exactes ?","o":["fatḥa → passé","ḍamma → présent/futur","sukūn → impératif","kasra → passé"],"a":[0,1,2],"j":"Passé → fatḥa, présent/futur → ḍamma, impératif → sukūn. La kasra n'est pas le repère du passé. (Cours 5)","cat":"conj","t":"qcm"},{"id":"s2-b38","c":5,"d":"d","q":"Vrai ou faux — On forme le présent/futur à partir du passé, et l'impératif à partir du présent/futur.","o":["Vrai","Faux"],"a":[0],"j":"Vrai : c'est le principe du taṣrīf (passé → présent/futur → impératif). (Cours 5)","cat":"conj","t":"vf"},{"id":"s2-b39","c":5,"d":"d","q":"Quelle série « passé → présent → impératif » est correcte ?","o":["كَتَبَ → يَكْتُبُ → اُكْتُبْ","كَتَبَ → كَتَبَ → يَكْتُبُ","يَكْتُبُ → كَتَبَ → اُكْتُبْ","اُكْتُبْ → يَكْتُبُ → كَتَبَ"],"a":[0],"j":"kataba (passé) → yaktubu (présent) → uktub (impératif). (Cours 5)","cat":"conj","t":"qcm"},{"id":"s2-b40","c":6,"d":"f","q":"Pour nier au passé, le cours utilise :","o":["هل (hal)","ما (mā)","إنّ (inna)","لن (lan)"],"a":[1],"j":"La négation du passé se fait avec « ما + verbe au passé ». (Cours 6)","cat":"conj","t":"qcm"},{"id":"s2-b41","c":6,"d":"f","q":"Le fāʿil (sujet) d'une phrase verbale prend généralement :","o":["la ḍamma","la fatḥa","la kasra","le sukūn"],"a":[0],"j":"Le fāʿil est marfūʿ → ḍamma ; le mafʿūl bihi est manṣūb → fatḥa. (Cours 6)","cat":"gram","t":"qcm"},{"id":"s2-b42","c":6,"d":"m","q":"Le complément d'objet (مفعول به) prend généralement :","o":["la ḍamma","la fatḥa","la kasra","le sukūn"],"a":[1],"j":"Le mafʿūl bihi est manṣūb et prend la fatḥa. (Cours 6)","cat":"gram","t":"qcm"},{"id":"s2-b43","c":6,"d":"m","q":"Vrai ou faux — Quand le verbe est placé avant un sujet pluriel, il ne s'accorde pas en nombre.","o":["Vrai","Faux"],"a":[0],"j":"Vrai : verbe avant sujet pluriel → pas d'accord en nombre (خَرَجَ الطُّلابُ). (Cours 6)","cat":"conj","t":"vf"},{"id":"s2-b44","c":6,"d":"d","q":"Vrai ou faux — Pour « les étudiants sont sortis », la phrase « خَرَجَ الطُّلابُ » (verbe d'abord) est correcte.","o":["Vrai","Faux"],"a":[0],"j":"Vrai : le verbe précédant le sujet pluriel reste au singulier → خَرَجَ الطُّلابُ. (Cours 6)","cat":"conj","t":"vf"},{"id":"s2-b45","c":6,"d":"d","q":"Vrai ou faux — Quand le verbe précède le sujet pluriel, la forme correcte est « خَرَجُوا الطُّلابُ ».","o":["Vrai","Faux"],"a":[1],"j":"Faux : si le verbe précède, il ne porte pas la marque du pluriel → on dit خَرَجَ الطُّلابُ. (Cours 6)","cat":"conj","t":"vf"},{"id":"s2-b46","c":6,"d":"d","q":"Vrai ou faux — Dans « فَتَحَ الطالِبُ البابَ », le complément البابَ est correctement au manṣūb (fatḥa).","o":["Vrai","Faux"],"a":[0],"j":"Vrai : البابَ est mafʿūl bihi → manṣūb (fatḥa) ; الطالِبُ est fāʿil → ḍamma. (Cours 6)","cat":"gram","t":"vf"},{"id":"s2-b47","c":7,"d":"f","q":"Quel est le présent (muḍāriʿ) de ذَهَبَ (dhahaba, « il est allé ») ?","o":["يَذهَبُ (yadhhabu)","ذَهَبَ (dhahaba)","اِذهَبْ (idhhab)","يَذهَبْنَ (yadhhabna)"],"a":[0],"j":"dhahaba (passé) → yadhhabu (présent : il va). (Cours 7)","cat":"conj","t":"qcm"},{"id":"s2-b48","c":7,"d":"f","q":"Vrai ou faux — أبحَثُ (abḥathu, « je cherche ») est un verbe au présent (muḍāriʿ).","o":["Vrai","Faux"],"a":[0],"j":"Vrai : abḥathu est un muḍāriʿ (action présente). (Cours 7)","cat":"conj","t":"vf"},{"id":"s2-b49","c":7,"d":"m","q":"Comment dit-on « elles vont » (هنّ) au présent ?","o":["يَذهَبْنَ (yadhhabna)","يَذهَبونَ (yadhhabūna)","تَذهَبينَ (tadhhabīna)","يَذهَبُ (yadhhabu)"],"a":[0],"j":"Pluriel féminin → يَذهَبْنَ (yadhhabna), avec nūn an-niswa. (Cours 7)","cat":"conj","t":"qcm"},{"id":"s2-b50","c":7,"d":"m","q":"Comment dit-on « ils vont » (هم) au présent ?","o":["يَذهَبونَ (yadhhabūna)","يَذهَبْنَ (yadhhabna)","تَذهَبونَ (tadhhabūna)","يَذهَبُ (yadhhabu)"],"a":[0],"j":"Pluriel masculin → يَذهَبونَ (yadhhabūna), avec wāw al-jamāʿa. (Cours 7)","cat":"conj","t":"qcm"},{"id":"s2-b51","c":7,"d":"m","q":"Quels marqueurs de préfixe le présent associe-t-il selon la personne ?","o":["ي (yāʼ) pour le masculin singulier (هو)","ت (tāʼ) pour le féminin singulier (هي)","ن (nūn) pour « nous » (نحن)","أ (hamza) pour « je » (أنا)"],"a":[0,1,2,3],"j":"Les préfixes : ي (هو), ت (هي/أنتَ), ن (نحن), أ (أنا). (Cours 7)","cat":"conj","t":"qcm"},{"id":"s2-b52","c":7,"d":"d","q":"À quel pronom correspond تَذهَبينَ (tadhhabīna) ?","o":["أنتِ (toi, fém.)","أنتَ (toi, masc.)","هي (elle)","أنتم (vous)"],"a":[0],"j":"تَذهَبينَ (tadhhabīna) = « tu vas » au féminin → أنتِ. (Cours 7)","cat":"conj","t":"qcm"},{"id":"s2-b53","c":7,"d":"d","q":"Vrai ou faux — La forme يَذهَبونَ (yadhhabūna) correspond au pluriel féminin (هنّ).","o":["Vrai","Faux"],"a":[1],"j":"Faux : يَذهَبونَ = pluriel masculin (هم). Le pluriel féminin est يَذهَبْنَ (هنّ). (Cours 7)","cat":"conj","t":"vf"},{"id":"s2-b54","c":8,"d":"f","q":"À partir de quelle forme construit-on l'impératif (amr) ?","o":["Du nom","Du passé","Du présent/futur (muḍāriʿ)","De l'adjectif"],"a":[2],"j":"L'impératif se forme à partir du muḍāriʿ. (Cours 8)","cat":"conj","t":"qcm"},{"id":"s2-b55","c":8,"d":"f","q":"Quel est l'impératif de يَكْتُبُ (yaktubu) ?","o":["اُكْتُبْ (uktub)","كَتَبَ (kataba)","يَكْتُبُ (yaktubu)","كاتِب (kātib)"],"a":[0],"j":"yaktubu → uktub (écris). (Cours 8)","cat":"conj","t":"qcm"},{"id":"s2-b56","c":8,"d":"m","q":"Quelle marque finale caractérise l'impératif selon le cours ?","o":["la fatḥa","la ḍamma","le sukūn","la kasra"],"a":[2],"j":"L'impératif se termine par un sukūn (اُكْتُبْ). (Cours 8)","cat":"conj","t":"qcm"},{"id":"s2-b57","c":8,"d":"m","q":"Si, après suppression du préfixe, le mot commence par une consonne sans voyelle, on ajoute :","o":["un alif long","une hamzat al-waṣl (hamza de liaison)","un wāw","un yāʼ"],"a":[1],"j":"On ajoute une hamzat al-waṣl au début pour pouvoir prononcer le mot. (Cours 8)","cat":"conj","t":"qcm"},{"id":"s2-b58","c":8,"d":"m","q":"Quelles transformations « présent → impératif » sont correctes ?","o":["يَشرَبُ → اِشرَبْ (bois)","يَغسِلُ → اِغسِلْ (lave)","يَدخُلُ → اُدخُلْ (entre)","يَكتُبُ → كَتَبَ"],"a":[0,1,2],"j":"yashrabu→ishrab, yaghsilu→ighsil, yadkhulu→udkhul. كَتَبَ est un passé, pas un impératif. (Cours 8)","cat":"conj","t":"qcm"},{"id":"s2-b59","c":8,"d":"d","q":"Vrai ou faux — L'impératif peut s'employer avec « je » et « nous ».","o":["Vrai","Faux"],"a":[1],"j":"Faux : l'impératif est une demande adressée à l'interlocuteur ; il n'existe pas pour je/nous. (Cours 8)","cat":"conj","t":"vf"},{"id":"s2-b60","c":8,"d":"d","q":"Vrai ou faux — L'impératif de يَشرَبُ (il boit) est كَتَبَ.","o":["Vrai","Faux"],"a":[1],"j":"Faux : l'impératif de yashrabu est اِشرَبْ (ishrab). (Cours 8)","cat":"conj","t":"vf"},{"id":"s2-b61","c":9,"d":"f","q":"Que signifie مُهندِس (muhandis) ?","o":["Médecin","Architecte / ingénieur","Pharmacien","Enseignant"],"a":[1],"j":"muhandis = architecte / ingénieur. (Cours 9)","cat":"vocab","t":"qcm"},{"id":"s2-b62","c":9,"d":"f","q":"Quel marqueur rend le futur explicite ?","o":["سـ (sa-) ou سوف (sawfa)","لم (lam)","ما (mā)","لا (lā)"],"a":[0],"j":"Les marqueurs du futur sont le préfixe سـ (sa-) et سوف (sawfa). (Cours 9)","cat":"conj","t":"qcm"},{"id":"s2-b63","c":9,"d":"m","q":"Comment forme-t-on le possessif de 1ʳᵉ personne (« mon… ») ?","o":["en ajoutant ـِي (-ī) à la fin du nom","en ajoutant l'article الـ","en ajoutant un tanwīn","en ajoutant ـكَ (-ka)"],"a":[0],"j":"On ajoute ـِي : عَمَلِي (mon travail), كِتابِي (mon livre). (Cours 9)","cat":"gram","t":"qcm"},{"id":"s2-b64","c":9,"d":"m","q":"Après كَم (kam), dans quel cas se met le nom qui suit ?","o":["nominatif (marfūʿ)","accusatif / manṣūb (fatḥa)","génitif (majrūr)","duel"],"a":[1],"j":"Le nom après كَم est manṣūb (fatḥa). (Cours 9)","cat":"adad","t":"qcm"},{"id":"s2-b65","c":9,"d":"m","q":"Lesquelles de ces correspondances « domaine → métier » sont exactes ?","o":["طِبّ (ṭibb) → طبيب (ṭabīb)","صَيدلة (ṣaydala) → صيدليّ (ṣaydaliyy)","هَندسة (handasa) → مهندس (muhandis)","تربية (tarbiya) → طبيب (ṭabīb)"],"a":[0,1,2],"j":"ṭibb→ṭabīb, ṣaydala→ṣaydaliyy, handasa→muhandis. تربية (éducation) → معلّم (enseignant), pas ṭabīb. (Cours 9)","cat":"vocab","t":"qcm"},{"id":"s2-b66","c":9,"d":"d","q":"Quelle forme exprime correctement « mon travail » ?","o":["عَمَلِي (ʿamalī)","عَمَلُكَ (ʿamaluka)","العَمَل (al-ʿamal)","عَمَلٌ (ʿamalun)"],"a":[0],"j":"« mon travail » = عَمَلِي (ʿamalī), avec le possessif ـِي. (Cours 9)","cat":"gram","t":"qcm"},{"id":"s2-b67","c":10,"d":"f","q":"Que signifie مَكتبة (maktaba) ?","o":["Bureau","Bibliothèque","Laboratoire","Salle de classe"],"a":[1],"j":"maktaba = bibliothèque ; mukhtabar = laboratoire. (Cours 10)","cat":"vocab","t":"qcm"},{"id":"s2-b68","c":10,"d":"f","q":"Quel mot signifie « école » ?","o":["مَدرسة (madrasa)","جامعة (jāmiʿa)","مكتبة (maktaba)","صَفّ (ṣaff)"],"a":[0],"j":"madrasa = école ; jāmiʿa = université. (Cours 10)","cat":"vocab","t":"qcm"},{"id":"s2-b69","c":10,"d":"m","q":"Quel jour de la semaine correspond à السَّبت (as-sabt) ?","o":["Samedi","Vendredi","Lundi","Dimanche"],"a":[0],"j":"as-sabt = samedi ; al-jumuʿa = vendredi ; al-aḥad = dimanche. (Cours 10)","cat":"vocab","t":"qcm"},{"id":"s2-b70","c":10,"d":"m","q":"Quel mot signifie « voiture » ?","o":["سَيّارة (sayyāra)","حافلة (ḥāfila)","مَدرسة (madrasa)","بَيت (bayt)"],"a":[0],"j":"sayyāra = voiture ; ḥāfila = bus. (Cours 10)","cat":"vocab","t":"qcm"},{"id":"s2-b71","c":10,"d":"m","q":"Quelles correspondances de repères temporels sont exactes ?","o":["يَوم (yawm) = jour","شَهر (shahr) = mois","سَنة (sana) = année","قَرن (qarn) = semaine"],"a":[0,1,2],"j":"yawm=jour, shahr=mois, sana=année. قَرن (qarn) = siècle, pas semaine (semaine = أسبوع usbūʿ). (Cours 10)","cat":"vocab","t":"qcm"},{"id":"s2-b72","c":10,"d":"d","q":"Que signifie اِستِراحة (istirāḥa) dans le contexte scolaire ?","o":["La récréation / pause","Le laboratoire","L'examen","L'emploi du temps"],"a":[0],"j":"istirāḥa = pause / récréation ; mukhtabar = laboratoire ; ikhtibār = examen. (Cours 10)","cat":"vocab","t":"qcm"},{"id":"s2-b73","c":11,"d":"f","q":"Quels sont les deux piliers d'une phrase nominale ?","o":["مبتدأ + خبر (mubtadaʼ + khabar)","فعل + فاعل","فعل + مفعول به","حرف + اسم"],"a":[0],"j":"La jumla ismiyya repose sur al-mubtadaʼ et al-khabar. (Cours 11)","cat":"gram","t":"qcm"},{"id":"s2-b74","c":11,"d":"f","q":"En règle générale, le mubtadaʼ est :","o":["défini (معرفة)","indéfini (نكرة)","toujours un verbe","toujours une préposition"],"a":[0],"j":"Le mubtadaʼ est généralement défini (maʿrifa). (Cours 11)","cat":"gram","t":"qcm"},{"id":"s2-b75","c":11,"d":"m","q":"Dans une phrase nominale simple au singulier, mubtadaʼ et khabar sont :","o":["tous deux marfūʿ (ḍamma)","tous deux manṣūb (fatḥa)","tous deux majrūr (kasra)","l'un marfūʿ, l'autre majrūr"],"a":[0],"j":"Au singulier, le mubtadaʼ et le khabar sont tous deux marfūʿ (ḍamma). (Cours 11)","cat":"gram","t":"qcm"},{"id":"s2-b76","c":11,"d":"m","q":"Selon le cours, le khabar peut être :","o":["uniquement un nom","uniquement une phrase verbale","un nom, une phrase, ou une quasi-phrase (shibh jumla)","uniquement un mot d'interrogation"],"a":[2],"j":"Le khabar peut être un nom, une phrase nominale/verbale, ou une quasi-phrase. (Cours 11)","cat":"gram","t":"qcm"},{"id":"s2-b77","c":11,"d":"m","q":"Vrai ou faux — Une phrase nominale commence par un verbe.","o":["Vrai","Faux"],"a":[1],"j":"Faux : la phrase nominale commence par un nom ; c'est la phrase verbale qui commence par un verbe. (Cours 11)","cat":"gram","t":"vf"},{"id":"s2-b78","c":11,"d":"d","q":"Que rend l'إضافة (iḍāfa, annexion) à un nom défini ?","o":["Elle rend le nom défini","Elle rend le nom indéfini","Elle transforme le nom en verbe","Elle supprime le khabar"],"a":[0],"j":"Un nom annexé à un défini devient défini (ex. « le livre de Zayd »). (Cours 11)","cat":"gram","t":"qcm"},{"id":"s2-b79","c":11,"d":"d","q":"Lesquelles de ces affirmations sur la phrase nominale sont vraies ?","o":["Le mubtadaʼ est généralement défini","Le khabar complète le sens du mubtadaʼ","On peut omettre un élément si le contexte le rend évident","Le khabar est facultatif dans tous les cas"],"a":[0,1,2],"j":"Mubtadaʼ défini ; khabar complète le sens ; ellipse possible selon le contexte. Mais le khabar n'est pas facultatif « dans tous les cas ». (Cours 11)","cat":"gram","t":"qcm"},{"id":"s2-b80","c":12,"d":"f","q":"Comment dit-on « j'écris » (أنا) au présent ?","o":["أكتُبُ (aktubu)","تكتُبُ (taktubu)","نكتُبُ (naktubu)","يكتُبُ (yaktubu)"],"a":[0],"j":"أنا → أكتُبُ (aktubu). (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b81","c":12,"d":"f","q":"Que désigne نون النِّسوة (nūn an-niswa) ?","o":["La marque du pluriel féminin","La marque du duel","La marque du masculin singulier","La marque de l'interrogation"],"a":[0],"j":"nūn an-niswa = marque du pluriel féminin (يكتُبْنَ, يذهَبْنَ). (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b82","c":12,"d":"m","q":"À quel pronom correspond تَكتُبينَ (taktubīna) ?","o":["أنتِ (toi, fém. sing.)","أنتَ (toi, masc.)","أنتم (vous, masc.)","هنّ (elles)"],"a":[0],"j":"تَكتُبينَ = « tu écris » féminin singulier → أنتِ. (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b83","c":12,"d":"m","q":"À quel pronom correspond يَكتُبونَ (yaktubūna) ?","o":["هم (ils)","هنّ (elles)","أنتم (vous)","نحن (nous)"],"a":[0],"j":"يَكتُبونَ = pluriel masculin → هم. (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b84","c":12,"d":"m","q":"Comment dit-on « vous écrivez » au féminin pluriel (أنتنّ) ?","o":["تَكتُبْنَ (taktubna)","تَكتُبونَ (taktubūna)","تَكتُبينَ (taktubīna)","يَكتُبْنَ (yaktubna)"],"a":[0],"j":"أنتنّ → تَكتُبْنَ (taktubna). يَكتُبْنَ = هنّ (elles). (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b85","c":12,"d":"d","q":"À quel pronom correspond يَكتُبْنَ (yaktubna) ?","o":["هنّ (elles)","أنتنّ (vous, fém.)","هم (ils)","نحن (nous)"],"a":[0],"j":"يَكتُبْنَ (préfixe ي) = 3ᵉ personne féminin pluriel → هنّ. (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b86","c":12,"d":"d","q":"Comment appelle-t-on l'ensemble de formes verbales que le professeur nomme « les cinq verbes » ?","o":["الأفعال الخمسة (al-afʿāl al-khamsa)","الأفعال الماضية","الأفعال الناقصة","الأفعال المجرّدة"],"a":[0],"j":"Ce sont les al-afʿāl al-khamsa (« les cinq verbes »). (Cours 12)","cat":"conj","t":"qcm"},{"id":"s2-b87","c":12,"d":"d","q":"Vrai ou faux — تَكتُبُ (taktubu) peut signifier « tu écris (masc.) » ou « elle écrit ».","o":["Vrai","Faux"],"a":[0],"j":"Vrai : تَكتُبُ correspond à la fois à أنتَ (tu, masc.) et à هي (elle). (Cours 12)","cat":"conj","t":"vf"},{"id":"s2-b88","c":13,"d":"f","q":"Quelle différence centrale entre les deux types de hamza ?","o":["L'une se prononce toujours, l'autre tombe en liaison","L'une est masculine, l'autre féminine","L'une existe seulement au pluriel","Elles ne concernent que les nombres"],"a":[0],"j":"hamzat al-qaṭʿ se prononce toujours ; hamzat al-waṣl tombe en liaison. (Cours 13)","cat":"gram","t":"qcm"},{"id":"s2-b89","c":13,"d":"f","q":"Quel « test » permet de reconnaître la hamza de liaison ?","o":["Ajouter « et » en français","Ajouter وَ (wa) avant le mot","Mettre le mot au pluriel","Changer l'ordre des mots"],"a":[1],"j":"On ajoute وَ (wa) avant le mot : si la hamza disparaît à l'oral, c'est une hamzat al-waṣl. (Cours 13)","cat":"gram","t":"qcm"},{"id":"s2-b90","c":13,"d":"m","q":"À quel type de hamza appartient l'article défini الـ (al-) ?","o":["hamzat al-qaṭʿ (coupure)","hamzat al-waṣl (liaison)","aucune des deux","les deux à la fois"],"a":[1],"j":"L'article défini relève de la hamzat al-waṣl : enchaîné, il ne se prononce pas séparément. (Cours 13)","cat":"gram","t":"qcm"},{"id":"s2-b91","c":13,"d":"m","q":"Vrai ou faux — L'article défini الـ relève de la hamza de coupure (qaṭʿ).","o":["Vrai","Faux"],"a":[1],"j":"Faux : l'article الـ relève de la hamzat al-waṣl (liaison). (Cours 13)","cat":"gram","t":"vf"},{"id":"s2-b92","c":13,"d":"m","q":"Quel mot signifie « petit pèlerinage » ?","o":["عُمرة (ʿumra)","حَجّ (ḥajj)","طَواف (ṭawāf)","سَعي (saʿy)"],"a":[0],"j":"ʿumra = petit pèlerinage ; ḥajj = grand pèlerinage. (Cours 13)","cat":"vocab","t":"qcm"},{"id":"s2-b93","c":13,"d":"d","q":"Quelles correspondances de vocabulaire du pèlerinage sont exactes ?","o":["طَواف (ṭawāf) = tours autour de la Kaaba","سَعي (saʿy) = parcours entre Ṣafā et Marwa","إحرام (iḥrām) = état/vêtements du pèlerin","حَجّ (ḥajj) = ablutions"],"a":[0,1,2],"j":"ṭawāf = circumambulation, saʿy = parcours Ṣafā-Marwa, iḥrām = état du pèlerin. ḥajj = grand pèlerinage, pas ablutions. (Cours 13)","cat":"vocab","t":"qcm"},{"id":"s2-b94","c":13,"d":"d","q":"Que signifie l'outil d'interrogation كَيف (kayfa) ?","o":["Comment ?","Où ?","Quand ?","Combien ?"],"a":[0],"j":"kayfa = comment ; ayna = où ; matā = quand. (Cours 13)","cat":"vocab","t":"qcm"},{"id":"s2-b95","c":14,"d":"f","q":"L'interdiction « ne… pas » s'exprime principalement par :","o":["لا الناهية (lā an-nāhiya) avant le présent","l'impératif seul","un nom au pluriel","une question de lieu"],"a":[0],"j":"On emploie la لا الناهية placée avant le muḍāriʿ. (Cours 14)","cat":"conj","t":"qcm"},{"id":"s2-b96","c":14,"d":"m","q":"Quand le présent est précédé par la لا d'interdiction, il devient :","o":["majzūm (sukūn final)","manṣūb (fatḥa)","marfūʿ (ḍamma)","un nom"],"a":[0],"j":"Après la lā an-nāhiya, le muḍāriʿ devient majzūm (sukūn). (Cours 14)","cat":"conj","t":"qcm"},{"id":"s2-b97","c":14,"d":"m","q":"Quelle différence majeure entre les deux لا ?","o":["L'une interdit, l'autre nie simplement","Elles ont exactement le même effet","La négation ne s'emploie qu'avec les noms propres","L'interdiction se met après le verbe"],"a":[0],"j":"lā an-nāhiya interdit (verbe majzūm) ; lā an-nāfiya nie simplement. (Cours 14)","cat":"conj","t":"qcm"},{"id":"s2-b98","c":14,"d":"m","q":"Vrai ou faux — Il ne faut pas confondre l'impératif (« fais ! ») et l'interdiction (« ne fais pas ! »).","o":["Vrai","Faux"],"a":[0],"j":"Vrai : le cours insiste sur cette distinction (amr vs nahy). (Cours 14)","cat":"conj","t":"vf"},{"id":"s2-b99","c":14,"d":"d","q":"Vrai ou faux — La phrase « لا تَخرُجْ » (ne sors pas) est correctement au majzūm (sukūn).","o":["Vrai","Faux"],"a":[0],"j":"Vrai : après لا الناهية, le verbe est majzūm → تَخرُجْ avec sukūn. (Cours 14)","cat":"conj","t":"vf"},{"id":"s2-b100","c":14,"d":"d","q":"Vrai ou faux — Après la لا d'interdiction, on dit « لا تَخرُجُ » avec une ḍamma.","o":["Vrai","Faux"],"a":[1],"j":"Faux : la لا الناهية rend le verbe majzūm → لا تَخرُجْ (sukūn), pas de ḍamma. (Cours 14)","cat":"conj","t":"vf"},{"id":"s2-b101","c":15,"d":"f","q":"Le verbe au présent « manṣūb » prend une marque finale :","o":["ḍamma","sukūn","fatḥa","kasra"],"a":[2],"j":"Le muḍāriʿ manṣūb prend une fatḥa finale (يَكتُبَ). (Cours 15)","cat":"conj","t":"qcm"},{"id":"s2-b102","c":15,"d":"f","q":"Quel outil exprime « pour… » (la cause) et entraîne le naṣb ?","o":["la لام التعليل (lām de cause)","la négation simple","l'interdiction","le duel"],"a":[0],"j":"La lām at-taʿlīl (« pour… ») entraîne le naṣb du présent. (Cours 15)","cat":"conj","t":"qcm"},{"id":"s2-b103","c":15,"d":"m","q":"Quels sont les trois états possibles du verbe au présent ?","o":["marfūʿ (ḍamma)","manṣūb (fatḥa)","majzūm (sukūn)","majrūr (kasra)"],"a":[0,1,2],"j":"Le présent peut être marfūʿ, manṣūb ou majzūm. Le majrūr concerne le nom, pas le verbe. (Cours 15)","cat":"conj","t":"qcm"},{"id":"s2-b104","c":15,"d":"m","q":"Comment le cours explique-t-il أنْ المَصدرية (an al-maṣdariyya) ?","o":["un outil qu'on peut remplacer par un maṣdar (nom d'action)","un outil qui met le verbe au passé","un outil réservé aux noms propres","un outil de pluralisation"],"a":[0],"j":"أنْ devant le présent provoque le naṣb et peut souvent être remplacé par un maṣdar. (Cours 15)","cat":"conj","t":"qcm"},{"id":"s2-b105","c":15,"d":"d","q":"Vrai ou faux — Après أنْ (an), on écrit أنْ يَكتُبُ avec une ḍamma.","o":["Vrai","Faux"],"a":[1],"j":"Faux : أنْ rend le présent manṣūb → أنْ يَكتُبَ avec une fatḥa. (Cours 15)","cat":"conj","t":"vf"},{"id":"s2-b106","c":15,"d":"d","q":"Quelle forme est correcte après أنْ (an) ?","o":["أنْ يَكتُبَ (an yaktuba)","أنْ يَكتُبُ (an yaktubu)","أنْ يَكتُبْ (an yaktub)","أنْ كَتَبَ (an kataba)"],"a":[0],"j":"أنْ → naṣb → fatḥa : أنْ يَكتُبَ (an yaktuba). (Cours 15)","cat":"conj","t":"qcm"},{"id":"s2-b107","c":16,"d":"f","q":"Quelle particule met le présent au « manṣūb » ?","o":["أنْ (an)","هل (hal)","ما (mā)","الـ (al-)"],"a":[0],"j":"أنْ placé avant le présent impose le manṣūb. (Cours 16)","cat":"conj","t":"qcm"},{"id":"s2-b108","c":16,"d":"m","q":"Pour les cinq verbes (الأفعال الخمسة), le manṣūb se marque par :","o":["la suppression du نون (nūn)","l'ajout d'un نون","le maintien de la ḍamma","le doublement de la dernière lettre"],"a":[0],"j":"Pour les cinq verbes, le manṣūb se voit par la suppression du nūn final. (Cours 16)","cat":"conj","t":"qcm"},{"id":"s2-b109","c":16,"d":"m","q":"Que devient le pluriel féminin en نون النسوة (ex. يَذهَبْنَ) après أنْ ?","o":["il reste inchangé","il change comme les autres","on ajoute un alif","on met une ḍamma"],"a":[0],"j":"Avec nūn an-niswa, le verbe finit déjà par sukūn : la forme ne change pas (أنْ يَذهَبْنَ). (Cours 16)","cat":"conj","t":"qcm"},{"id":"s2-b110","c":16,"d":"m","q":"Sur quoi un حرف الجرّ (ḥarf al-jarr) influence-t-il ?","o":["le nom qui suit (majrūr, kasra)","le verbe qui suit","uniquement les adjectifs","uniquement le duel"],"a":[0],"j":"Le ḥarf al-jarr met le nom suivant au cas majrūr (kasra). (Cours 16)","cat":"gram","t":"qcm"},{"id":"s2-b111","c":16,"d":"d","q":"Vrai ou faux — Pour les cinq verbes, تَذهَبونَ devient أنْ تَذهَبوا (suppression du نون) après أنْ.","o":["Vrai","Faux"],"a":[0],"j":"Vrai : pour les cinq verbes, le naṣb supprime le نون → أنْ تَذهَبوا. (Cours 16)","cat":"conj","t":"vf"},{"id":"s2-b112","c":16,"d":"d","q":"Vrai ou faux — Après أنْ, le pluriel féminin يَذهَبْنَ devient يَذهَبوا.","o":["Vrai","Faux"],"a":[1],"j":"Faux : le نون النسوة reste inchangé → أنْ يَذهَبْنَ (et non yadhhabū). (Cours 16)","cat":"conj","t":"vf"},{"id":"s2-b113","c":17,"d":"f","q":"À quoi sert لَم (lam) ?","o":["nier le futur","nier le passé","poser une question","relier deux phrases"],"a":[1],"j":"لَم + verbe au présent exprime une négation du passé (« il n'a pas… »). (Cours 17)","cat":"conj","t":"qcm"},{"id":"s2-b114","c":17,"d":"f","q":"À quoi sert لَن (lan) ?","o":["nier le futur","nier le passé","poser une question","exprimer l'ordre"],"a":[0],"j":"لَن est la négation du futur (« il ne… pas, au futur »). (Cours 17)","cat":"conj","t":"qcm"},{"id":"s2-b115","c":17,"d":"m","q":"Après لَم (lam), le verbe au présent devient :","o":["majzūm (sukūn)","manṣūb (fatḥa)","marfūʿ (ḍamma)","majrūr (kasra)"],"a":[0],"j":"لَم relève du jazm : le verbe devient majzūm (sukūn). (Cours 17)","cat":"conj","t":"qcm"},{"id":"s2-b116","c":17,"d":"m","q":"Comment le cours explique-t-il لَمّا (lammā, « pas encore ») ?","o":["une non-réalisation jusqu'au présent, mais possible plus tard","une interdiction","une négation du futur uniquement","une affirmation renforcée"],"a":[0],"j":"« pas encore » : l'action n'est pas réalisée jusqu'à maintenant, mais pourrait l'être ensuite. (Cours 17)","cat":"conj","t":"qcm"},{"id":"s2-b117","c":17,"d":"m","q":"Quelles affirmations sont correctes selon le cours ?","o":["لَن nie le futur, لَم nie le passé","une phrase verbale commence par un verbe","une phrase nominale commence par un nom","marfūʿ est associé à la fatḥa"],"a":[0,1,2],"j":"لَن (futur) / لَم (passé) ; phrase verbale = verbe d'abord ; nominale = nom d'abord. marfūʿ est associé à la ḍamma, pas à la fatḥa. (Cours 17)","cat":"gram","t":"qcm"},{"id":"s2-b118","c":17,"d":"d","q":"Vrai ou faux — Après لَم, on écrit لَم يَكتُبْ (sukūn).","o":["Vrai","Faux"],"a":[0],"j":"Vrai : لَم rend le verbe majzūm → لَم يَكتُبْ avec un sukūn. (Cours 17)","cat":"conj","t":"vf"},{"id":"s2-b119","c":18,"d":"f","q":"En arabe, le mot (الكلمة) se divise en :","o":["nom (اسم), verbe (فعل), particule (حرف)","sujet, verbe, complément","passé, présent, impératif","singulier, duel, pluriel"],"a":[0],"j":"La kalima se répartit en ism (nom), fiʿl (verbe) et ḥarf (particule). (Cours 18)","cat":"gram","t":"qcm"},{"id":"s2-b120","c":18,"d":"f","q":"Après une particule de jarr, le nom devient :","o":["au cas indirect / majrūr (kasra)","sujet au nominatif","complément direct","verbe au passé"],"a":[0],"j":"Après un ḥarf al-jarr, le nom est majrūr et prend la kasra. (Cours 18)","cat":"gram","t":"qcm"},{"id":"s2-b121","c":18,"d":"m","q":"Parmi ces mots, lequel est une particule de jarr (ḥarf) ?","o":["فِي (fī)","سُورة (sūra)","قَلَم (qalam)","ذَهَبَ (dhahaba)"],"a":[0],"j":"فِي est un ḥarf al-jarr ; sūra et qalam sont des noms, dhahaba est un verbe. (Cours 18)","cat":"gram","t":"qcm"},{"id":"s2-b122","c":18,"d":"m","q":"Lesquels de ces éléments sont des حروف الجرّ (particules de jarr) ?","o":["مِن (min)","إلى (ilā)","عَلى (ʿalā)","كَتَبَ (kataba)"],"a":[0,1,2],"j":"min, ilā, ʿalā (et fī, bi, ʿan) sont des ḥurūf al-jarr. كَتَبَ est un verbe. (Cours 18)","cat":"gram","t":"qcm"},{"id":"s2-b123","c":18,"d":"d","q":"Selon le cours, qu'est-ce qui suit un حرف (particule) ?","o":["un nom (qui devient majrūr)","un autre حرف","un verbe au passé","rien"],"a":[0],"j":"« On ne met pas un ḥarf après un ḥarf » : après un ḥarf al-jarr vient un nom, qui devient majrūr. (Cours 18)","cat":"gram","t":"qcm"},{"id":"s2-b124","c":18,"d":"d","q":"Vrai ou faux — On peut placer une particule (حرف) directement après une autre particule (حرف).","o":["Vrai","Faux"],"a":[1],"j":"Faux : après un ḥarf vient un nom, pas un autre ḥarf. (Cours 18)","cat":"gram","t":"vf"},{"id":"s2-b125","c":19,"d":"f","q":"Le duel (التثنية) se forme en ajoutant au singulier :","o":["alif+nūn (ـانِ) ou yāʼ+nūn (ـيْنِ) selon la fonction","uniquement un yāʼ","uniquement un wāw","un tāʼ marbūṭa"],"a":[0],"j":"Nominatif : ـانِ (alif+nūn) ; accusatif/génitif : ـيْنِ (yāʼ+nūn). (Cours 19)","cat":"gram","t":"qcm"},{"id":"s2-b126","c":19,"d":"f","q":"Quel est le duel de كِتاب (kitāb, « livre ») au nominatif ?","o":["كِتابانِ (kitābān)","كُتُب (kutub)","كِتابات (kitābāt)","كِتابُون (kitābūn)"],"a":[0],"j":"Duel nominatif → كِتابانِ (kitābān). كُتُب est le pluriel. (Cours 19)","cat":"gram","t":"qcm"},{"id":"s2-b127","c":19,"d":"m","q":"Avec combien d'éléments l'épithète (النَّعت) s'accorde-t-elle avec le nom ?","o":["uniquement le genre","uniquement le nombre","cas, genre, nombre, défini/indéfini","uniquement défini/indéfini"],"a":[2],"j":"Le naʿt s'accorde sur 4 axes : cas, genre, nombre, défini/indéfini. (Cours 19)","cat":"gram","t":"qcm"},{"id":"s2-b128","c":19,"d":"m","q":"Si le nom qualifié est au duel, l'épithète doit être :","o":["au duel","au singulier","au pluriel","inchangée"],"a":[0],"j":"Accord obligatoire en nombre : nom au duel → épithète au duel. (Cours 19)","cat":"gram","t":"qcm"},{"id":"s2-b129","c":19,"d":"m","q":"Vrai ou faux — Le duel de طالِب (ṭālib) est طُلّاب (ṭullāb).","o":["Vrai","Faux"],"a":[1],"j":"Faux : طُلّاب est le pluriel. Le duel est طالِبانِ (ṭālibān). (Cours 19)","cat":"gram","t":"vf"},{"id":"s2-b130","c":19,"d":"d","q":"Quelle terminaison de duel s'emploie au génitif (majrūr) et à l'accusatif (manṣūb) ?","o":["ـيْنِ (yāʼ + nūn)","ـانِ (alif + nūn)","ـُونَ (wāw + nūn)","ـات (tāʼ)"],"a":[0],"j":"Génitif/accusatif → ـيْنِ (yāʼ+nūn) ; nominatif → ـانِ (alif+nūn). (Cours 19)","cat":"gram","t":"qcm"},{"id":"s2-b131","c":19,"d":"d","q":"Vrai ou faux — Si le nom est défini, son épithète doit aussi être définie.","o":["Vrai","Faux"],"a":[0],"j":"Vrai : l'épithète s'accorde sur défini/indéfini avec le nom. (Cours 19)","cat":"gram","t":"vf"},{"id":"s2-b132","c":19,"d":"d","q":"Quel mot signifie « nouveau » ?","o":["جَديد (jadīd)","جَيِّد (jayyid)","صَغير (ṣaghīr)","كَبير (kabīr)"],"a":[0],"j":"jadīd = nouveau ; jayyid = bon ; ṣaghīr = petit ; kabīr = grand. (Cours 19)","cat":"vocab","t":"qcm"},{"id":"s2-b133","c":8,"d":"f","q":"الأَمرُ مِن «كَتَبَ» : اُكْتُبْ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : l'impératif de كَتَبَ est اُكْتُبْ. (Cours 8)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b134","c":8,"d":"m","q":"الأَمرُ مِن «خَرَجَ» : يَخْرُجُ","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : يَخْرُجُ est le présent. L'impératif de خَرَجَ est اُخْرُجْ. (Cours 8)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b135","c":8,"d":"f","q":"الأَمرُ مِن «شَرِبَ» : اِشْرَبْ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : l'impératif de شَرِبَ est اِشْرَبْ. (Cours 8)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b136","c":8,"d":"m","q":"الأَمرُ مِن «دَخَلَ» : دَخَلَ","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : دَخَلَ est le passé. L'impératif est اُدْخُلْ. (Cours 8)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b137","c":8,"d":"m","q":"الأَمرُ مِن «نَزَلَ» : يَنْزِلُ","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : يَنْزِلُ est le présent. L'impératif est اِنْزِلْ. (Cours 8)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b138","c":8,"d":"f","q":"الأَمرُ مِن «جَلَسَ» : اِجْلِسْ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : l'impératif de جَلَسَ est اِجْلِسْ. (Cours 8)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b139","c":7,"d":"f","q":"«رَكَعَ» مُضارِعُهُ يَرْكَعُ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : le présent de رَكَعَ est يَرْكَعُ. (Cours 7)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b140","c":7,"d":"f","q":"«كَتَبَ» مُضارِعُهُ يَكْتُبُ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : le présent de كَتَبَ est يَكْتُبُ. (Cours 7)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b141","c":7,"d":"m","q":"«شَرِبَ» مُضارِعُهُ يَكْتُبُ","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : le présent de شَرِبَ est يَشْرَبُ (يَكْتُبُ vient de كَتَبَ). (Cours 7)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b142","c":7,"d":"m","q":"«خَرَجَ» مُضارِعُهُ اُخْرُجْ","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : اُخْرُجْ est l'impératif. Le présent de خَرَجَ est يَخْرُجُ. (Cours 7)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b143","c":7,"d":"d","q":"«سَأَلَ» مُضارِعُهُ يَسْأَلُ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : le présent de سَأَلَ est يَسْأَلُ. (Cours 7)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b144","c":5,"d":"m","q":"«تَذْهَبُ إلى المَدْرَسةِ» : الفِعلُ هُنا يَدُلُّ على الماضِي","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : تَذْهَبُ est un muḍāriʿ (présent/futur), pas un passé. (Cours 5)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b145","c":5,"d":"f","q":"«كَتَبَ الدَّرسَ» : الفِعلُ هُنا يَدُلُّ على الماضِي","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : كَتَبَ est un fiʿl māḍī (passé). (Cours 5)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b146","c":5,"d":"m","q":"«اُكْتُبْ دَرْسَكَ» : هذا فِعلُ أمْرٍ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : اُكْتُبْ est un impératif (fiʿl al-amr). (Cours 5)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b147","c":5,"d":"d","q":"«ذَهَبَ» : الفِعلُ هُنا يَدُلُّ على المُضارِع","o":["صَواب","خَطَأ"],"a":[1],"j":"Faux : ذَهَبَ est un passé (māḍī) ; le présent serait يَذْهَبُ. (Cours 5)","cat":"conj","keep":true,"t":"qcm"},{"id":"s2-b148","c":3,"d":"f","q":"«السَّمَكُ» نَوعٌ مِنَ الطَّعامِ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : السَّمَك (le poisson) est un aliment. (Cours 3)","cat":"vocab","keep":true,"t":"qcm"},{"id":"s2-b149","c":8,"d":"f","q":"«العَقْرَبُ» حَيَوانٌ","o":["صَواب","خَطَأ"],"a":[0],"j":"Vrai : العَقْرَب (le scorpion) est un animal. (Cours 8)","cat": m)","<span class=\"ar\">النافية</span> nie simplement"]},{"l":"⚠ Piège","items":["Ne pas confondre <b>amr</b> (« fais ! ») et <b>nahy</b> (« ne fais pas ! »)"]}]},{"c":15,"t":"Le présent au naṣb (fatḥa)","ar":"المضارع المنصوب","br":[{"l":"◌ La marque","items":["Présent manṣūb → <b>fatḥa</b> : <span class=\"ar\">يَكْتُبَ</span>"]},{"l":"أن Les outils","items":["<span class=\"ar\">أن</span> (souvent = un maṣdar)","<span class=\"ar\">لام التعليل</span> « pour… »"]},{"l":"☰ 3 états","items":["marfūʿ (ḍamma) · manṣūb (fatḥa) · majzūm (sukūn)"]}]},{"c":16,"t":"Outils du naṣb, cinq verbes, jarr","ar":"أدوات النصب وحروف الجر","br":[{"l":"أن Naṣb","items":["<span class=\"ar\">أن</span> / <span class=\"ar\">لن</span> → présent <b>manṣūb</b>"]},{"l":"٥ Cinq verbes","items":["Au naṣb, on <b>supprime le نون</b> : <span class=\"ar\">تذهبونَ → أن تذهبوا</span>","<span class=\"ar\">نون النسوة</span> reste <b>inchangé</b>"]},{"l":"جر Ḥarf al-jarr","items":["Le ḥarf jarr met le nom au <b>majrūr</b> (kasra)"]}]},{"c":17,"t":"Nier le passé, le futur, « pas encore »","ar":"نفي الماضي (لم)","br":[{"l":"لم لَم","items":["<span class=\"ar\">لم</span> + présent = négation du <b>passé</b> → majzūm (sukūn)","Ex. <span class=\"ar\">لم يَكْتُبْ</span>"]},{"l":"لن لَن / لَمّا","items":["<span class=\"ar\">لن</span> = négation du <b>futur</b>","<span class=\"ar\">لمّا</span> = « pas encore »"]},{"l":"☰ 3 états","items":["Le présent est marfūʿ / manṣūb / majzūm selon l'outil"]}]},{"c":18,"t":"Catégories du mot et particules de jarr","ar":"أقسام الكلمة وحروف الجر","br":[{"l":"⚐ Le mot","items":["<span class=\"ar\">اسم</span> (nom) · <span class=\"ar\">فعل</span> (verbe) · <span class=\"ar\">حرف</span> (particule)"]},{"l":"جر Ḥurūf al-jarr","items":["<span class=\"ar\">في · من · إلى · عن · على · بـ</span>","→ le nom suivant devient <b>majrūr</b> (kasra)"]},{"l":"! Règle","items":["Après un <b>ḥarf</b> vient un <b>nom</b> (pas un autre ḥarf)"]}]},{"c":19,"t":"Le duel et l'épithète","ar":"المثنى والنعت","br":[{"l":"٢ Le duel","items":["Nominatif → <span class=\"ar\">ـانِ</span> : <span class=\"ar\">كِتابانِ</span>","Gén./acc. → <span class=\"ar\">ـيْنِ</span> : <span class=\"ar\">كِتابَيْنِ</span>"]},{"l":"✎ L'épithète (naʿt)","items":["S'accorde sur <b>4</b> points : cas, genre, nombre, défini/indéfini","<span class=\"ar\">كِتابٌ جَديدٌ</span> · <span class=\"ar\">سيّارةٌ جَديدةٌ</span>"]},{"l":"◆ Adjectifs","items":["<span class=\"ar\">جديد</span>/<span class=\"ar\">قديم</span> · <span class=\"ar\">كبير</span>/<span class=\"ar\">صغير</span>"]}]}]},"s3":{"lessons":[{"id":"s3-zero","n":"zero","annex":true,"tag":"Base","t":"Comprendre la grammaire de zéro","ar":"خلاصة مبسّطة","html":"<p class=\"lead\">Ici, on explique <b>tout simplement</b>, comme à quelqu'un qui débute. Chaque couleur = un rôle dans la phrase. Garde cette légende en tête :</p>\n      <div class=\"legend\">\n        <span class=\"lg r-action\">le verbe = l'action</span>\n        <span class=\"lg r-sujet\">qui fait / de qui on parle</span>\n        <span class=\"lg r-cod\">ce qui subit</span>\n        <span class=\"lg r-info\">l'info qu'on donne</span>\n        <span class=\"lg r-outil\">petit mot outil</span>\n        <span class=\"lg r-annexe\">le possédé</span>\n      </div>\n\n      <h3 class=\"sub\">Étape 1 · Deux sortes de phrases <span class=\"ar\">نوعان</span></h3>\n      <p>En arabe, pour savoir de quelle phrase il s'agit, on regarde <b>seulement le premier mot</b>.</p>\n      <div class=\"roads\">\n        <div class=\"road nom\"><div class=\"top\">جملة اسمية</div><div class=\"q\">commence par un <b>nom</b></div><div class=\"ex\">البيتُ كبيرٌ</div><div class=\"q\" style=\"margin-top:6px\">« La maison est grande »</div></div>\n        <div class=\"road verb\"><div class=\"top\">جملة فعلية</div><div class=\"q\">commence par un <b>verbe</b></div><div class=\"ex\">كتبَ الطالبُ</div><div class=\"q\" style=\"margin-top:6px\">« L'étudiant a écrit »</div></div>\n      </div>\n\n      <h3 class=\"sub\">Étape 2 · Les 3 briques de la langue <span class=\"ar\">اسم · فعل · حرف</span></h3>\n      <div class=\"schema cols-3\">\n        <div class=\"scard r-sujet\"><div class=\"top\">اِسم</div><div class=\"mid\">Le nom</div><div class=\"fr-s\">une chose, une personne, une idée</div><div class=\"ex\">بيت · أحمد · كتاب</div></div>\n        <div class=\"scard r-action\"><div class=\"top\">فِعل</div><div class=\"mid\">Le verbe</div><div class=\"fr-s\">une action dans le temps</div><div class=\"ex\">أكلَ · يكتبُ · اِذهبْ</div></div>\n        <div class=\"scard r-outil\"><div class=\"top\">حَرف</div><div class=\"mid\">Le petit mot</div><div class=\"fr-s\">un outil qui ne veut rien dire seul</div><div class=\"ex\">في · مِن · هل</div></div>\n      </div>\n\n      <h3 class=\"sub\">Étape 3 · La phrase nominale, mot à mot <span class=\"ar\">مبتدأ + خبر</span></h3>\n      <p>On <b>parle de quelqu'un/quelque chose</b> (المبتدأ), puis on <b>donne une info</b> dessus (الخبر).</p>\n      <div class=\"breakdown\">\n        <div class=\"bd-phrase\">البيتُ كبيرٌ</div>\n        <div class=\"bd-words\">\n          <div class=\"bd-word r-sujet\"><span class=\"w\">البيتُ</span><span class=\"role\">de quoi on parle</span><span class=\"fr\">المبتدأ · مرفوع (voyelle ُ)</span></div>\n          <div class=\"bd-word r-info\"><span class=\"w\">كبيرٌ</span><span class=\"role\">l'info qu'on donne</span><span class=\"fr\">الخبر · مرفوع (voyelle ٌ)</span></div>\n        </div>\n      </div>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>« La maison / est grande ». Les deux mots portent la voyelle <b>ُ</b> (mot-vedette). On ne met <b>pas</b> de verbe « être » : il est sous-entendu.</p></div>\n\n      <h3 class=\"sub\">Étape 4 · La phrase verbale, mot à mot <span class=\"ar\">فعل + فاعل + مفعول</span></h3>\n      <p>Une <b>action</b> (الفعل), <b>celui qui la fait</b> (الفاعل), et parfois <b>ce qui la subit</b> (المفعول به).</p>\n      <div class=\"breakdown\">\n        <div class=\"bd-phrase\">كتبَ الطالبُ الدرسَ</div>\n        <div class=\"bd-words\">\n          <div class=\"bd-word r-action\"><span class=\"w\">كتبَ</span><span class=\"role\">l'action « a écrit »</span><span class=\"fr\">فعل ماضٍ</span></div>\n          <div class=\"bd-word r-sujet\"><span class=\"w\">الطالبُ</span><span class=\"role\">qui fait l'action</span><span class=\"fr\">الفاعل · مرفوع (voyelle ُ)</span></div>\n          <div class=\"bd-word r-cod\"><span class=\"w\">الدرسَ</span><span class=\"role\">ce qui subit</span><span class=\"fr\">المفعول به · منصوب (voyelle َ)</span></div>\n        </div>\n      </div>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>« A écrit / l'étudiant / la leçon » = « l'étudiant a écrit la leçon ». En arabe le verbe vient <b>en premier</b>, et le sujet <b>après</b>.</p></div>\n\n      <h3 class=\"sub\">Étape 5 · Les 4 « voyelles » <span class=\"ar\">الحركات</span></h3>\n      <p>Le <b>dernier signe</b> d'un mot change selon son rôle. C'est ça, l'<b>إعراب</b> : une petite voyelle qui montre le métier du mot.</p>\n      <div class=\"hats\">\n        <div class=\"hat h-raf\"><div class=\"v\">ــُ</div><div class=\"nm\">مرفوع</div><div class=\"say\">« je suis la vedette » — le sujet, ce dont on parle</div></div>\n        <div class=\"hat h-nasb\"><div class=\"v\">ــَ</div><div class=\"nm\">منصوب</div><div class=\"say\">« je subis / je complète » — le complément</div></div>\n        <div class=\"hat h-jarr\"><div class=\"v\">ــِ</div><div class=\"nm\">مجرور</div><div class=\"say\">« je viens après un petit mot » — après une préposition</div></div>\n        <div class=\"hat h-jazm\"><div class=\"v\">ــْ</div><div class=\"nm\">مجزوم</div><div class=\"say\">« verbe coupé net » — présent après لم، لا…</div></div>\n      </div>\n\n      <h3 class=\"sub\">Étape 6 · Le dico des petits mots <span class=\"ar\">معاني الأدوات</span></h3>\n\n      <p><b>a) Les prépositions</b> — <span class=\"arword\">حروف الجرّ</span> · le mot juste après prend la voyelle <b>ِ</b> (مجرور).</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th class=\"ac\">Mot</th><th>Sens en français</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Mot\">مِنْ</td><td data-label=\"Sens en français\">de, à partir de</td><td class=\"ac\" data-label=\"Exemple\">خرجتُ مِن البيتِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">إلى</td><td data-label=\"Sens en français\">vers, à</td><td class=\"ac\" data-label=\"Exemple\">ذهبتُ إلى المدرسةِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">عَنْ</td><td data-label=\"Sens en français\">au sujet de, loin de</td><td class=\"ac\" data-label=\"Exemple\">سألتُ عن الدرسِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">على</td><td data-label=\"Sens en français\">sur</td><td class=\"ac\" data-label=\"Exemple\">الكتابُ على الطاولةِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">في</td><td data-label=\"Sens en français\">dans, en</td><td class=\"ac\" data-label=\"Exemple\">أنا في البيتِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">بِـ</td><td data-label=\"Sens en français\">avec, par (moyen)</td><td class=\"ac\" data-label=\"Exemple\">كتبتُ بالقلمِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">كَـ</td><td data-label=\"Sens en français\">comme (comparaison)</td><td class=\"ac\" data-label=\"Exemple\">أنتَ كالأسدِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لِـ</td><td data-label=\"Sens en français\">pour, à (appartenance)</td><td class=\"ac\" data-label=\"Exemple\">الكتابُ لِمحمدٍ</td></tr>\n        </tbody>\n      </table></div>\n\n      <p><b>b) Les outils qui donnent la voyelle <span class=\"arword\">َ</span></b> — <span class=\"arword\">النواصب</span> (devant le présent).</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-coral\">\n        <thead><tr><th class=\"ac\">Mot</th><th>Sens en français</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Mot\">أنْ</td><td data-label=\"Sens en français\">que (+ verbe)</td><td class=\"ac\" data-label=\"Exemple\">أريدُ أنْ أتعلّمَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لنْ</td><td data-label=\"Sens en français\">ne… jamais (futur)</td><td class=\"ac\" data-label=\"Exemple\">لنْ أنسى</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">كي / لكي</td><td data-label=\"Sens en français\">pour que</td><td class=\"ac\" data-label=\"Exemple\">جئتُ كي أتعلّمَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">حتّى</td><td data-label=\"Sens en français\">jusqu'à ce que</td><td class=\"ac\" data-label=\"Exemple\">اجتهدْ حتّى تنجحَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لِـ (التعليل)</td><td data-label=\"Sens en français\">afin de</td><td class=\"ac\" data-label=\"Exemple\">سافرتُ لِأتعلّمَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">إذَن</td><td data-label=\"Sens en français\">alors, donc</td><td class=\"ac\" data-label=\"Exemple\">إذَن أُكرِمَك</td></tr>\n        </tbody>\n      </table></div>\n\n      <p><b>c) Les outils qui donnent la voyelle <span class=\"arword\">ْ</span></b> — <span class=\"arword\">الجوازم</span> (devant le présent).</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sage\">\n        <thead><tr><th class=\"ac\">Mot</th><th>Sens en français</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Mot\">لمْ</td><td data-label=\"Sens en français\">ne… pas (passé)</td><td class=\"ac\" data-label=\"Exemple\">لمْ يكتبْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لمّا</td><td data-label=\"Sens en français\">ne… pas encore</td><td class=\"ac\" data-label=\"Exemple\">لمّا يخرجْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لا الناهية</td><td data-label=\"Sens en français\">ne… pas ! (interdiction)</td><td class=\"ac\" data-label=\"Exemple\">لا تكذبْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لِـ (الأمر)</td><td data-label=\"Sens en français\">que… (ordre)</td><td class=\"ac\" data-label=\"Exemple\">لِيكتبْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">إنْ</td><td data-label=\"Sens en français\">si (condition)</td><td class=\"ac\" data-label=\"Exemple\">إنْ تدرسْ تنجحْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">مَن</td><td data-label=\"Sens en français\">quiconque, celui qui</td><td class=\"ac\" data-label=\"Exemple\">مَن يجتهدْ ينجحْ</td></tr>\n        </tbody>\n      </table></div>\n\n      <p><b>d) Les mots pour poser une question</b> — <span class=\"arword\">أدوات الاستفهام</span>.</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-gold\">\n        <thead><tr><th class=\"ac\">Mot</th><th>Sens en français</th><th>On demande…</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Mot\">هل / أ</td><td data-label=\"Sens en français\">est-ce que ?</td><td data-label=\"On demande…\">oui / non</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">مَن</td><td data-label=\"Sens en français\">qui ?</td><td data-label=\"On demande…\">une personne</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">ما / ماذا</td><td data-label=\"Sens en français\">quoi ? qu'est-ce que ?</td><td data-label=\"On demande…\">une chose</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">متى</td><td data-label=\"Sens en français\">quand ?</td><td data-label=\"On demande…\">le temps</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">أين</td><td data-label=\"Sens en français\">où ?</td><td data-label=\"On demande…\">le lieu</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">كيف</td><td data-label=\"Sens en français\">comment ?</td><td data-label=\"On demande…\">la manière</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">كم</td><td data-label=\"Sens en français\">combien ?</td><td data-label=\"On demande…\">le nombre</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">لماذا</td><td data-label=\"Sens en français\">pourquoi ?</td><td data-label=\"On demande…\">la cause</td></tr>\n          <tr><td class=\"ac\" data-label=\"Mot\">أيّ</td><td data-label=\"Sens en français\">quel ? lequel ?</td><td data-label=\"On demande…\">au choix</td></tr>\n        </tbody>\n      </table></div>\n\n      <p><b>e) Les mots qui bousculent la phrase nominale</b> — <span class=\"arword\">كان و إنّ</span>. Ils se posent devant « مبتدأ + خبر » et changent les voyelles.</p>\n\n      <p style=\"margin-bottom:4px\"><b>كان وأخواتها</b> — elles gardent le sujet en <b>ُ</b> (اسم كان) et mettent l'info en <b>َ</b> (خبر كان).</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th class=\"ac\">Sœur</th><th>Sens en français</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Sœur\">كان</td><td data-label=\"Sens en français\">était (dans le passé)</td><td class=\"ac\" data-label=\"Exemple\">كان الجوُّ لطيفًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">صار</td><td data-label=\"Sens en français\">devint (transformation)</td><td class=\"ac\" data-label=\"Exemple\">صار الطينُ خزفًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">أصبح</td><td data-label=\"Sens en français\">devint / le matin</td><td class=\"ac\" data-label=\"Exemple\">أصبح الأمرُ سهلًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">أمسى</td><td data-label=\"Sens en français\">devint / le soir</td><td class=\"ac\" data-label=\"Exemple\">أمسى العاملُ متعبًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">أضحى</td><td data-label=\"Sens en français\">devint / en matinée</td><td class=\"ac\" data-label=\"Exemple\">أضحى الجوُّ حارًّا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">ظلَّ</td><td data-label=\"Sens en français\">resta (toute la journée)</td><td class=\"ac\" data-label=\"Exemple\">ظلَّ زيدٌ واقفًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">بات</td><td data-label=\"Sens en français\">passa la nuit à…</td><td class=\"ac\" data-label=\"Exemple\">بات الطفلُ نائمًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">ليس</td><td data-label=\"Sens en français\">ne… pas (négation)</td><td class=\"ac\" data-label=\"Exemple\">ليس المطرُ شديدًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">مازال · مابرح · مافتئ · ماانفكّ</td><td data-label=\"Sens en français\">ne cessa de / continua à</td><td class=\"ac\" data-label=\"Exemple\">مازال محمدٌ مجتهدًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">مادام</td><td data-label=\"Sens en français\">tant que, aussi longtemps que</td><td class=\"ac\" data-label=\"Exemple\">اجلسْ مادام زيدٌ جالسًا</td></tr>\n        </tbody>\n      </table></div>\n\n      <p style=\"margin-bottom:4px\"><b>إنّ وأخواتها</b> — elles font l'<b>inverse</b> : le sujet passe en <b>َ</b> (اسم إنّ) et l'info garde le <b>ُ</b> (خبر إنّ).</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th class=\"ac\">Sœur</th><th>Sens en français</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Sœur\">إنّ</td><td data-label=\"Sens en français\">certes, en effet (affirmation forte)</td><td class=\"ac\" data-label=\"Exemple\">إنّ اللهَ غفورٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">أنّ</td><td data-label=\"Sens en français\">que (le fait que)</td><td class=\"ac\" data-label=\"Exemple\">علمتُ أنّ الحقَّ واضحٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">كأنّ</td><td data-label=\"Sens en français\">comme si (comparaison)</td><td class=\"ac\" data-label=\"Exemple\">كأنّ العلمَ نورٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">لكنّ</td><td data-label=\"Sens en français\">mais (rectification)</td><td class=\"ac\" data-label=\"Exemple\">التلميذُ ذكيٌّ لكنّهُ كسولٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">ليت</td><td data-label=\"Sens en français\">si seulement (souhait · تمنّي)</td><td class=\"ac\" data-label=\"Exemple\">ليت الشبابَ عائدٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Sœur\">لعلّ</td><td data-label=\"Sens en français\">peut-être, espérons que (ترجّي)</td><td class=\"ac\" data-label=\"Exemple\">لعلّ الفرجَ قريبٌ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>Retiens l'effet <b>croisé</b> : <b>كان</b> touche l'info (le خبر prend la voyelle <b>َ</b>), tandis que <b>إنّ</b> touche le sujet (l'اسم prend la voyelle <b>َ</b>). L'autre mot, lui, garde la voyelle <b>ُ</b>.</p></div>\n\n      <h3 class=\"sub\">Étape 7 · L'analyse pas à pas <span class=\"ar\">الإعراب خطوة بخطوة</span></h3>\n      <p>Analyser (faire l'<b>إعراب</b>), c'est dire pour chaque mot : <b>quel métier</b> il fait et <b>quelle voyelle</b> il porte.</p>\n      <div class=\"breakdown\">\n        <div class=\"bd-phrase\">لَنْ أشربَ القهوةَ</div>\n        <div class=\"bd-words\">\n          <div class=\"bd-word r-outil\"><span class=\"w\">لَنْ</span><span class=\"role\">petit mot « ne… jamais »</span><span class=\"fr\">حرف نصب → donne la voyelle َ</span></div>\n          <div class=\"bd-word r-action\"><span class=\"w\">أشربَ</span><span class=\"role\">l'action « boire »</span><span class=\"fr\">مضارع منصوب (voyelle َ à cause de لن)</span></div>\n          <div class=\"bd-word r-cod\"><span class=\"w\">القهوةَ</span><span class=\"role\">ce qui subit</span><span class=\"fr\">مفعول به · منصوب (voyelle َ)</span></div>\n        </div>\n      </div>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>« Je ne boirai jamais le café ». Le petit mot <b>لن</b> pose une voyelle <b>َ</b> sur le verbe qui le suit.</p></div>\n\n      <h3 class=\"sub\">Étape 8 · Toutes les notions en bref <span class=\"ar\">كلّ الدروس</span></h3>\n      <p>Un mini-résumé de <b>chaque</b> notion vue cette année, avec un exemple.</p>\n\n      <p style=\"margin:.6em 0 .2em\"><b>Le nom</b> — <span class=\"arword\">الاسم</span></p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-rose\">\n        <thead><tr><th class=\"ac\">Notion</th><th>En clair</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Notion\">المعرفة</td><td data-label=\"En clair\">nom précis, connu (7 sortes)</td><td class=\"ac\" data-label=\"Exemple\">محمّد · هذا · الكتاب</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">النكرة</td><td data-label=\"En clair\">nom vague, indéfini (souvent تنوين)</td><td class=\"ac\" data-label=\"Exemple\">رجلٌ · كتابٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الضمير</td><td data-label=\"En clair\">pronom (je, tu, il…), isolé ou collé</td><td class=\"ac\" data-label=\"Exemple\">أنا · ـهُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الاسم الموصول</td><td data-label=\"En clair\">« celui qui / que » + une phrase</td><td class=\"ac\" data-label=\"Exemple\">الّذي نجحَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">النعت</td><td data-label=\"En clair\">l'adjectif : suit le nom (genre, nombre, voyelle, défini)</td><td class=\"ac\" data-label=\"Exemple\">طالبٌ مجتهدٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">المذكّر / المؤنّث</td><td data-label=\"En clair\">masculin / féminin (marques ة · ى · اء)</td><td class=\"ac\" data-label=\"Exemple\">طالب / طالبة</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">المثنّى</td><td data-label=\"En clair\">le duel (deux) : ـانِ (رفع) · ـَينِ (نصب/جرّ)</td><td class=\"ac\" data-label=\"Exemple\">طالبانِ · طالبَينِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الجمع</td><td data-label=\"En clair\">le pluriel (3+) : ـون/ـين · ـات · ou brisé</td><td class=\"ac\" data-label=\"Exemple\">مسلمون · كتب</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الأعداد ٣–١٠</td><td data-label=\"En clair\">genre inversé + معدود pluriel مجرور</td><td class=\"ac\" data-label=\"Exemple\">ثلاثةُ كتبٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الأسماء الخمسة</td><td data-label=\"En clair\">أب أخ حم فو ذو : و / ا / ي quand annexés</td><td class=\"ac\" data-label=\"Exemple\">أبو محمدٍ</td></tr>\n        </tbody>\n      </table></div>\n\n      <p style=\"margin:.6em 0 .2em\"><b>Le verbe</b> — <span class=\"arword\">الفعل</span></p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th class=\"ac\">Notion</th><th>En clair</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Notion\">الماضي</td><td data-label=\"En clair\">action finie (passé) — toujours مبنيّ</td><td class=\"ac\" data-label=\"Exemple\">كتَبَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">المضارع</td><td data-label=\"En clair\">action présente / future — معرب</td><td class=\"ac\" data-label=\"Exemple\">يكتبُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الأمر</td><td data-label=\"En clair\">un ordre — toujours مبنيّ</td><td class=\"ac\" data-label=\"Exemple\">اُكتُبْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الفعل الصحيح</td><td data-label=\"En clair\">racine sans lettre malade (ا · و · ي)</td><td class=\"ac\" data-label=\"Exemple\">كتَبَ · سألَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">الفعل المعتلّ</td><td data-label=\"En clair\">racine avec ا/و/ي (مثال · أجوف · ناقص)</td><td class=\"ac\" data-label=\"Exemple\">وعدَ · قال · رمى</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">اللازم</td><td data-label=\"En clair\">verbe sans complément (pas de COD)</td><td class=\"ac\" data-label=\"Exemple\">جلسَ · نامَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Notion\">المتعدّي</td><td data-label=\"En clair\">verbe avec complément (مفعول به منصوب)</td><td class=\"ac\" data-label=\"Exemple\">كتبَ الدرسَ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">La méthode en 4 questions <span class=\"ar\">الطريقة</span></h3>\n      <div class=\"recap sky\">\n        <div class=\"rt\">Pour chaque mot, demande-toi…</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\">\n          <li><b>C'est quoi ?</b> un nom (اسم), un verbe (فعل), ou un petit mot (حرف) ?</li>\n          <li><b>Il fait quoi</b> dans la phrase ? (celui qui parle, l'info, l'action, ce qui subit…)</li>\n          <li><b>Donc quelle voyelle ?</b> ُ · َ · ِ · ْ</li>\n          <li><b>J'écris</b> l'analyse : « … مرفوع / منصوب / مجرور، وعلامته … ».</li>\n        </ol>\n      </div>"},{"id":"s3-1","n":1,"t":"La phrase nominale & verbale","ar":"الجُملة الاسميّة والفعليّة","html":"<p class=\"lead\">En arabe, toute phrase (<span class=\"arword\">الجُملة</span>) est <strong class=\"hl\">soit nominale, soit verbale</strong>. C'est le premier mot qui décide.</p>\n\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Phrase nominale</span>Elle commence par un <em class=\"term\">nom</em> (اسم صريح), un <em class=\"term\">مصدر مؤوّل</em>, ou une <em class=\"term\">حرف مشبّه بالفعل</em> (inna et ses sœurs). Elle se compose d'un <b>مبتدأ</b> et d'un <b>خبر</b>.</div>\n        <div class=\"arb\"><span class=\"tag\">الجملة الاسمية</span>هي الّتي صَدْرُها اسمٌ صريحٌ، أو مَصدرٌ مُؤوَّلٌ، أو حرفٌ مُشبَّهٌ بالفعل. تتكوّن من مُبتدأ وخبر.</div>\n      </div>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Phrase verbale</span>Elle commence par un <em class=\"term\">verbe complet</em> (تامّ) ou <em class=\"term\">incomplet</em> (ناقص, comme كان). Elle se compose d'un <b>verbe</b> et d'un <b>sujet</b> (فاعل).</div>\n        <div class=\"arb\"><span class=\"tag\">الجملة الفعلية</span>هي الّتي صَدْرُها فِعلٌ تامٌّ أو ناقصٌ. تتكوّن من فِعلٍ وفاعلٍ.</div>\n      </div>\n\n      <div class=\"recap gold\">\n        <div class=\"rt\">À retenir</div>\n        <p>Les verbes <span class=\"arword\">أخَذَ / طَفِقَ / جَعَلَ</span> suivis d'un verbe au présent expriment le <b>début d'une action</b> (= commencer). Ils fonctionnent comme كان et ses sœurs.</p>\n        <p style=\"margin:0\">Quand le verbe est placé <b>avant</b> son sujet, il ne s'accorde <b>pas en nombre</b> avec lui.</p>\n      </div>\n\n<div class=\"clair\"><div class=\"ct\">En clair</div><p>Pour classer une phrase, ne regarde que le <b>premier mot</b>. Un nom (ou إنّ, ou أنْ + verbe) → <b>جملة اسمية</b>. Un verbe → <b>جملة فعلية</b>. Le reste de la phrase ne change rien à ce classement.</p></div>\n      <h3 class=\"sub\">Nominale vs verbale <span class=\"ar\">مقارنة</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-rose\">\n        <thead><tr><th>Critère</th><th class=\"ac\">جملة اسمية</th><th class=\"ac\">جملة فعلية</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Critère\">Commence par</td><td class=\"ac\" data-label=\"جملة اسمية\">اسم (صريح · مؤوّل · حرف مشبّه)</td><td class=\"ac\" data-label=\"جملة فعلية\">فعل (تامّ أو ناقص)</td></tr>\n          <tr><td data-label=\"Critère\">Se compose de</td><td class=\"ac\" data-label=\"جملة اسمية\">مبتدأ + خبر</td><td class=\"ac\" data-label=\"جملة فعلية\">فعل + فاعل</td></tr>\n          <tr><td data-label=\"Critère\">1<sup>er</sup> élément</td><td class=\"ac\" data-label=\"جملة اسمية\">مرفوع</td><td class=\"ac\" data-label=\"جملة فعلية\">فعل</td></tr>\n          <tr><td data-label=\"Critère\">Exemple</td><td class=\"ac\" data-label=\"جملة اسمية\">البيتُ كبيرٌ</td><td class=\"ac\" data-label=\"جملة فعلية\">كتبَ الطالبُ الدرسَ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">Comment reconnaître le type ? <span class=\"ar\">كيف نميّز؟</span></h3>\n      <div class=\"tree\">\n        <div class=\"root\">ما أوّلُ كلمةٍ في الجملةِ؟</div>\n        <div class=\"branch\">\n          <div class=\"leaf\"><div class=\"h\">اسم</div><div class=\"d\">nom, pronom, démonstratif, إنّ…</div><div class=\"e\">→ جملة اسمية</div></div>\n          <div class=\"leaf\"><div class=\"h\">فعل</div><div class=\"d\">verbe complet ou ناقص</div><div class=\"e\">→ جملة فعلية</div></div>\n          <div class=\"leaf\" style=\"border-color:var(--gold)\"><div class=\"h\">كان</div><div class=\"d\">même si un nom suit, كان reste un verbe</div><div class=\"e\">→ جملة فعلية</div></div>\n        </div>\n      </div>\n\n      <h3 class=\"sub\">Les 6 règles de la phrase verbale <span class=\"ar\">قواعد الجملة الفعلية</span></h3>\n      <ol style=\"padding-inline-start:20px;margin:6px 0\">\n        <li>Tout verbe a un sujet (pas d'action sans acteur).</li>\n        <li>Le sujet vient <b>toujours après</b> le verbe.</li>\n        <li>Le sujet est de 2 types : un <b>nom</b> (ism dhâhir) ou un <b>pronom</b> (damîr).</li>\n        <li>Le pronom peut, dans certains cas, être <b>sous-entendu</b> (mustatir).</li>\n        <li>Il n'y a <b>qu'un seul</b> sujet.</li>\n        <li>Le sujet est <b>مرفوع</b> (prend une ضمّة).</li>\n      </ol>\n\n      <h3 class=\"sub\">Le verbe au passé <span class=\"ar\">الفِعل الماضي — دائمًا مبنيّ</span></h3>\n      <p>Le فاعل du fi'l ماضٍ est soit un <b>nom apparent</b> (مبنيّ 'alâ-l-fath), soit un <b>pronom</b>. Le fi'l ماضٍ est toujours <em class=\"term\">مبنيّ</em> : sa terminaison dépend du pronom qui s'y attache.</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-rose\">\n        <thead><tr><th>Construit sur…</th><th>Quand ?</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Construit sur…\">al-fath <span class=\"arword\">الفَتح</span></td><td data-label=\"Quand ?\">rien ne s'y attache, ou tâ' at-ta'nîth sâkina, ou ألف الاثنين</td><td class=\"ac\" data-label=\"Exemple\">كَتَبَ / كَتَبَتْ / كَتَبَا</td></tr>\n          <tr><td data-label=\"Construit sur…\">السكون <span class=\"arword\">السُّكون</span></td><td data-label=\"Quand ?\">attaché à un pronom de رفع mobile (tâ' الفاعل, nâ, نون النسوة)</td><td class=\"ac\" data-label=\"Exemple\">كَتَبْتُ / كَتَبْنَا</td></tr>\n          <tr><td data-label=\"Construit sur…\">ad-damm <span class=\"arword\">الضَّمّ</span></td><td data-label=\"Quand ?\">attaché à واو الجماعة</td><td class=\"ac\" data-label=\"Exemple\">كَتَبُوا</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"note\">Les arabes évitent 4 syllabes vocalisées d'affilée → كَتَبَ + تُ devient كَتَبْتُ (سكون) pour alléger la prononciation.</div>\n\n      <h3 class=\"sub\">Les 3 têtes de la phrase nominale <span class=\"ar\">أنواع صدر الجملة الاسمية</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-rose\">\n        <thead><tr><th>Type de tête</th><th>Détail</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Type de tête\">Nom explicite <span class=\"arword\">اسم صريح</span></td><td data-label=\"Détail\">nom simple, pronoms personnels, démonstratifs</td><td class=\"ac\" data-label=\"Exemple\">اللهُ غفورٌ · هذه مدرسةٌ</td></tr>\n          <tr><td data-label=\"Type de tête\">مصدر مؤوّل <span class=\"arword\">مصدر مؤوّل</span></td><td data-label=\"Détail\">أنْ + verbe (le verbe remplace un nom)</td><td class=\"ac\" data-label=\"Exemple\">وأنْ تصوموا خيرٌ لكم</td></tr>\n          <tr><td data-label=\"Type de tête\">حرف مشبّه <span class=\"arword\">حرف مشبّه بالفعل</span></td><td data-label=\"Détail\">inna et ses sœurs (fonctionnent comme un verbe)</td><td class=\"ac\" data-label=\"Exemple\">إنّ اللهَ غفورٌ رحيمٌ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"recap rose\">\n        <div class=\"rt\">Le مصدر مؤوّل — المصدر المؤوّل</div>\n        <p style=\"margin:0\">Dans <span class=\"arword\">﴿وأنْ تصوموا خيرٌ لكم﴾</span>, le groupe <b>أنْ تصوموا</b> remplace le nom <b>صيامُكم</b> — c'est pour cela qu'il compte comme un nom (donc phrase nominale).</p>\n      </div>\n\n      <h3 class=\"sub\">Vocabulaire du cours <span class=\"ar\">مفردات</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th>Français</th><th class=\"ac\">Arabe</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Français\">Sonner</td><td class=\"ac\" data-label=\"Arabe\">رَنَّ</td></tr>\n          <tr><td data-label=\"Français\">Ou plus</td><td class=\"ac\" data-label=\"Arabe\">أوْ أكثَرُ</td></tr>\n          <tr><td data-label=\"Français\">S'ennuyer, être blasé</td><td class=\"ac\" data-label=\"Arabe\">سَئِمَ</td></tr>\n          <tr><td data-label=\"Français\">Anarchie, désordre, chaos</td><td class=\"ac\" data-label=\"Arabe\">فَوْضى</td></tr>\n          <tr><td data-label=\"Français\">Rendre visite (à un malade)</td><td class=\"ac\" data-label=\"Arabe\">عادَ &gt; يَعودُ &gt; عِيادةٌ</td></tr>\n          <tr><td data-label=\"Français\">Visiter (courtoisie, un lieu)</td><td class=\"ac\" data-label=\"Arabe\">زارَ &gt; يَزورُ &gt; زِيارةٌ</td></tr>\n          <tr><td data-label=\"Français\">Combien</td><td class=\"ac\" data-label=\"Arabe\">كَمْ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"note\">Exercice type : transformer le مصدر en مؤوّل → أنْ نكنُسَ = كَنْسُنا · أنْ تكتبوا = كتابتُكم.</div>"},{"id":"s3-2","n":2,"t":"Le sujet & le prédicat : les règles","ar":"المبتدأ والخبر","html":"<div class=\"ar-big\" style=\"text-align:center\">مُحَمَّدٌ &nbsp; طالِبٌ</div>\n      <p style=\"text-align:center;color:var(--ink-soft);margin-top:-6px\"><b>مبتدأ</b> &nbsp;·&nbsp; <b>خبر</b></p>\n\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Le مبتدأ</span>C'est le mot qui commence la phrase nominale. Il est <b>toujours مرفوع</b> (ضمّة). C'est un اسم صريح, un مصدر مؤوّل ou une حرف مشبّه. La base : il est <em class=\"term\">معرفة</em> (défini).</div>\n        <div class=\"arb\"><span class=\"tag\">المبتدأ</span>هو الاسمُ الّذي نَتَحدّثُ عنه، وهو مرفوعٌ. الأصلُ فيه أن يكون معرفةً.</div>\n      </div>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Le خبر</span>Ce qui vient après le مبتدأ et donne une <b>information</b> sur lui. Il s'accorde en <b>genre et nombre</b> avec le مبتدأ.</div>\n        <div class=\"arb\"><span class=\"tag\">الخبر</span>هو الحديثُ الّذي تَتِمُّ به الفائدةُ، ويُطابقُ المبتدأَ في الجنس والعدد.</div>\n      </div>\n\n      <h3 class=\"sub\">L'ordre entre le مبتدأ et le خبر <span class=\"ar\">الترتيب بينهما</span></h3>\n      <p class=\"lead\">La base : <b>le مبتدأ précède le خبر</b> — <span class=\"arword\">الأصلُ يُقدَّمُ المبتدأُ على الخبر</span>. Mais il existe des cas obligatoires et des cas permis.</p>\n\n      <div class=\"recap rose\">\n        <div class=\"rt\">المبتدأ obligatoirement avant — وجوب تقديم المبتدأ</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\">\n          <li>Le مبتدأ est un <b>اسم استفهام</b> (nom interrogatif).</li>\n          <li>المبتدأ <b>et</b> خبر sont tous deux <b>معرفة</b>.</li>\n          <li>Le خبر est une <b>جملة فعلية</b>.</li>\n        </ol>\n      </div>\n      <div class=\"recap sky\">\n        <div class=\"rt\">الخبر obligatoirement avant — وجوب تقديم الخبر</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\">\n          <li>Le خبر est un <b>اسم استفهام</b>.</li>\n          <li>Le خبر est <b>شبه جملة</b> et le مبتدأ est <b>نكرة</b>. <span class=\"arword\">في الفصلِ طالبٌ</span></li>\n        </ol>\n      </div>\n      <div class=\"recap sage\">\n        <div class=\"rt\">Avancer le خبر est permis — جواز تقديم الخبر</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\">\n          <li>Quand il n'y a <b>ni ambiguïté ni confusion</b>.</li>\n          <li>الخبر شبه جملة + مبتدأ <b>معرفة</b>.</li>\n          <li>الخبر = ism فاعل précédé d'un اسم استفهام.</li>\n        </ol>\n      </div>\n\n      <h3 class=\"sub\">Quand le مبتدأ peut être indéfini <span class=\"ar\">المبتدأ النكرة</span></h3>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>Normalement une phrase ne commence pas par un mot indéfini (dire « une voiture. » ne veut rien dire). Mais si on annonce d'abord <b>où</b> (عندي = chez moi) ou <b>à qui</b> (لي = à moi), l'information passe devant et le nom indéfini peut suivre : <b>عندي سيّارةٌ</b> = « chez moi, une voiture ».</p></div>\n      <p class=\"lead\">La base : le مبتدأ est <b>معرفة</b>. Deux exceptions permettent un مبتدأ <em class=\"term\">نكرة</em> :</p>\n      <div class=\"recap coral\">\n        <div class=\"rt\">Cas 1 · le خبر (شبه جملة) précède</div>\n        <p>Quand le خبر est un <b>ظرف</b> ou un <b>جار ومجرور</b> placé avant le مبتدأ :</p>\n        <div class=\"pills\">\n          <span class=\"pill\">عِنْدي <b>سيّارةٌ</b></span>\n          <span class=\"pill\">لي <b>أخٌ</b></span>\n        </div>\n        <p style=\"margin:.5em 0 0\">Ici <span class=\"arword\">عند</span> et <span class=\"arword\">اللام</span> sont des <b>خبر mouqaddam</b> ; les noms qui suivent (سيّارة، أخ) sont des <b>مبتدأ retardés</b>, مرفوع بالضمّة.</p>\n      </div>\n      <div class=\"recap mauve\">\n        <div class=\"rt\">Cas 2 · le مبتدأ est un اسم استفهام</div>\n        <p style=\"margin:0\">Les interrogatifs <span class=\"arword\">ما · مَن · كم · لِمَن · ماذا</span> restent indéfinis par nature, même comme مبتدأ, et sont suivis de leur خبر : <span class=\"arword\">مَن مريضٌ؟ · كم طالبًا في الفصلِ؟</span></p>\n      </div>\n\n      <h3 class=\"sub\">La suppression <span class=\"ar\">الحذف</span></h3>\n      <p>On peut supprimer le مبتدأ seul, le خبر seul, ou <b>les deux</b>, s'ils sont connus.</p>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">المبتدأ supprimé</span>« ما اسمُك؟ » → « حامدٌ » &nbsp;(= اسمي حامدٌ)</div>\n        <div class=\"fr\"><span class=\"tag\">الخبر supprimé</span>« مَن فاهمٌ؟ » → « أنا » &nbsp;(= أنا فاهمٌ)</div>\n      </div>\n      <div class=\"recap sage\">\n        <div class=\"rt\">Les deux supprimés</div>\n        <p style=\"margin:0\">« أطالبٌ أنتَ؟ » → « نعم » &nbsp;(= أنا طالبٌ) — مبتدأ <b>et</b> خبر omis.</p>\n      </div>"},{"id":"s3-3","n":3,"t":"Analyse de la phrase nominale","ar":"إعراب الجملة الاسمية","html":"<p class=\"lead\">La phrase nominale se compose de <b>deux noms</b> : un <em class=\"term\">مبتدأ</em> (مرفوع, ضمّة) et un <em class=\"term\">خبر</em> (مرفوع, ضمّة) — <span class=\"arword\">تتكوّنُ من اسمَين</span>.</p>\n\n      <div class=\"tree\">\n        <div class=\"root\">أنواع خبر المبتدأ</div>\n        <div class=\"branch\">\n          <div class=\"leaf\"><div class=\"h\">مُفرَد</div><div class=\"d\">un seul mot</div><div class=\"e\">المدرسةُ جميلةٌ</div></div>\n          <div class=\"leaf\"><div class=\"h\">جُملة</div><div class=\"d\">phrase (verbale ou nominale)</div><div class=\"e\">الأولادُ يلعبونَ</div></div>\n          <div class=\"leaf\"><div class=\"h\">شِبه جُملة</div><div class=\"d\">groupe prép. ou circonstanciel</div><div class=\"e\">الكتابُ فوقَ الطاولةِ</div></div>\n        </div>\n      </div>\n\n<div class=\"clair\"><div class=\"ct\">En clair</div><p>Le <b>خبر</b> n'est pas forcément un seul mot ! Ça peut être une phrase entière ou un groupe avec préposition. Dans tous les cas, il répond à la question : « qu'est-ce qu'on dit du <b>مبتدأ</b> ? »</p></div>\n      <h3 class=\"sub\">Les types de خبر en détail <span class=\"ar\">أنواع الخبر</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th>Type</th><th class=\"ac\">Exemple</th><th>Analyse (إعراب)</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Type\">Mot simple <span class=\"arword\">مفرد</span></td><td class=\"ac\" data-label=\"Exemple\">المدرسةُ جميلةٌ</td><td data-label=\"Analyse (إعراب)\">خبر مرفوع, 'alâma = ضمّة</td></tr>\n          <tr><td data-label=\"Type\">جملة fi'liyya <span class=\"arword\">جملة فعلية</span></td><td class=\"ac\" data-label=\"Exemple\">الأولادُ يلعبونَ في الساحةِ</td><td data-label=\"Analyse (إعراب)\">الجملة الفعلية fî mahalli رفع خبر</td></tr>\n          <tr><td data-label=\"Type\">جملة ismiyya <span class=\"arword\">جملة اسمية</span></td><td class=\"ac\" data-label=\"Exemple\">الكذبُ جِبْلَتُهُ قصيرةٌ</td><td data-label=\"Analyse (إعراب)\">الجملة الاسمية fî mahalli رفع خبر</td></tr>\n          <tr><td data-label=\"Type\">Jâr wa مجرور <span class=\"arword\">جار ومجرور</span></td><td class=\"ac\" data-label=\"Exemple\">الطالبُ في الصفِّ</td><td data-label=\"Analyse (إعراب)\">شبه جملة fî mahalli رفع خبر</td></tr>\n          <tr><td data-label=\"Type\">ظرفية <span class=\"arword\">ظرفية</span></td><td class=\"ac\" data-label=\"Exemple\">الكتابُ فوقَ الطاولةِ</td><td data-label=\"Analyse (إعراب)\">شبه جملة ظرفية fî mahalli رفع خبر</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"note\">Astuce du prof : maîtriser la phrase simple en changeant le خبر à chaque fois (nom seul, verbe+sujet, jâr مجرور…) — c'est comme ça que la maîtrise vient.</div>\n\n      <h3 class=\"sub\">Exemple d'إعراب complet <span class=\"ar\">نموذج إعراب</span></h3>\n      <div class=\"irab\">\n        <div class=\"phrase\">كَلامُهُ عَجيبٌ</div>\n        <div class=\"row\"><b>كلامُ</b> : مبتدأ مرفوعٌ، وعلامةُ رفعِه الضمّةُ الظاهرةُ على آخره، وهو مضافٌ.</div>\n        <div class=\"row\"><b>ـهُ</b> : ضميرٌ متّصلٌ مبنيٌّ في محلِّ جرٍّ مضافٌ إليه.</div>\n        <div class=\"row\"><b>عجيبٌ</b> : خبرٌ مرفوعٌ، وعلامةُ رفعِه الضمّةُ الظاهرةُ على آخره (خبر مفرد).</div>\n      </div>\n      <div class=\"irab\">\n        <div class=\"phrase\">المَدْرَسةُ جَميلةٌ</div>\n        <div class=\"row\"><b>المدرسةُ</b> : مبتدأ مرفوعٌ، وعلامةُ رفعِه الضمّةُ الظاهرةُ على آخره.</div>\n        <div class=\"row\"><b>جميلةٌ</b> : خبرٌ مرفوعٌ، وعلامةُ رفعِه الضمّةُ الظاهرةُ على آخره.</div>\n      </div>\n      <div class=\"recap sky\">\n        <div class=\"rt\">À noter</div>\n        <p style=\"margin:0\">Quand le خبر est جار ومجرور, le nom après la préposition porte une <b>كسرة</b> (مجرور) : <span class=\"arword\">الطالبُ في الصفِّ</span> → في حرف جرّ, الصفِّ مجرور.</p>\n      </div>"},{"id":"s3-4","n":4,"t":"Les chiffres de 3 à 10","ar":"الأعداد المفردة","html":"<div class=\"ar-big\" style=\"text-align:center\">ثَلاثَةُ طُلّابٍ &nbsp;·&nbsp; ثَلاثُ طالِباتٍ</div>\n\n      <div class=\"recap gold\">\n        <div class=\"rt\">La règle d'or</div>\n        <p><b>العَدَد</b> (le nombre) : <em class=\"term\">contraire</em> du dénombré en genre — <span class=\"arword\">يُخالِفُ المعدودَ في التذكير والتأنيث</span>.</p>\n        <p style=\"margin:0\"><b>التمييز</b> (le spécificatif) : pluriel مجرور, analysé <em class=\"term\">مضاف إليه</em> — <span class=\"arword\">جمعٌ مجرورٌ ويُعرَبُ مضافًا إليه</span>.</p>\n      </div>\n\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Genre inversé</span>Si le dénombré est <b>féminin</b> → le chiffre est <b>masculin</b>, et inversement.</div>\n        <div class=\"fr\"><span class=\"tag\">Toujours pluriel</span>Le dénombré (de 3 à 10) est <b>toujours au pluriel</b>.</div>\n      </div>\n\n      <h3 class=\"sub\">Le nombre &amp; le dénombré, en détail <span class=\"ar\">العدد والمعدود</span></h3>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Le nombre · العدد</span>Genre <b>contraire</b> du dénombré · c'est le <b>مضاف</b> · variable (معرب) : peut être مرفوع, منصوب ou مجرور selon ce qui précède.</div>\n        <div class=\"fr\"><span class=\"tag\">Le dénombré · المعدود</span>C'est le <b>مضاف إليه</b> · toujours <b>pluriel</b>, <b>indéfini</b> (تنوين) et <b>مجرور</b> (كسرة à la fin).</div>\n      </div>\n      <div class=\"tbl-wrap\"><table class=\"grid th-gold\">\n        <thead><tr><th>Français</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Français\">Dix étudiantes</td><td class=\"ac\" data-label=\"Exemple\">عَشْرُ طالباتٍ</td></tr>\n          <tr><td data-label=\"Français\">Il a 4 frères</td><td class=\"ac\" data-label=\"Exemple\">له أربعةُ إخوةٍ</td></tr>\n          <tr><td data-label=\"Français\">J'ai vu 3 filles</td><td class=\"ac\" data-label=\"Exemple\">رأيتُ ثلاثَ بناتٍ</td></tr>\n          <tr><td data-label=\"Français\">Il a salué 7 hommes</td><td class=\"ac\" data-label=\"Exemple\">سلّمَ على سبعةِ رجالٍ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"pills\">\n        <span class=\"pill\">٣ ثلاثة</span><span class=\"pill\">٤ أربعة</span><span class=\"pill\">٥ خمسة</span><span class=\"pill\">٦ ستّة</span>\n        <span class=\"pill\">٧ سبعة</span><span class=\"pill\">٨ ثمانية</span><span class=\"pill\">٩ تسعة</span><span class=\"pill\">١٠ عشرة</span>\n      </div>\n      <div class=\"note\">Nb : les noms de couleurs ne prennent jamais de تنوين.</div>\n\n      <h3 class=\"sub\">L'inversion du genre en tableau <span class=\"ar\">مخالفة العدد للمعدود</span></h3>\n      <p>Avec un dénombré <b>masculin</b>, le chiffre porte la <span class=\"arword\">ة</span> ; avec un dénombré <b>féminin</b>, il la perd.</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-gold\">\n        <thead><tr><th class=\"ac\">Nombre</th><th class=\"ac\">+ معدود مذكّر</th><th class=\"ac\">+ معدود مؤنّث</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Nombre\">3</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">ثلاثةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">ثلاثُ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">4</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">أربعةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">أربعُ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">5</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">خمسةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">خمسُ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">6</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">ستّةُ أولادٍ<
