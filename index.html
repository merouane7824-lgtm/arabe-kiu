<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arabe KIU · S1 à S4</title>
<meta name="description" content="Application d'apprentissage de l'arabe : leçons, quiz, flashcards et outils pour les semestres 1 à 4.">
<meta name="theme-color" content="#faf7f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arabe KIU">
<meta name="application-name" content="Arabe KIU">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* =====================================================================
   ARABE · KIU — design system
   Palette crème & or (QCM S2/S3) + couleurs « cahier » (rose, mauve,
   sauge, or, ciel, corail) — Amiri pour l'arabe.
   ===================================================================== */
:root{
  --bg:#faf7f0; --bg-dot:#ebe2d2; --card:#fffdf8; --card-2:#f6efe2; --card-3:#efe5d3;
  --ink:#2b2620; --ink-soft:#625a4e; --ink-faint:#968c7c;
  --line:#e7dccb; --line-2:#dccfba;
  --gold:#b8902f; --gold-soft:#e7c976; --gold-bg:#f7eed8;
  --rose:#e4b3b3; --rose-deep:#c08080; --rose-bg:#fbeeee;
  --mauve:#b394ae; --mauve-deep:#8e6e8c; --mauve-bg:#f4edf3;
  --sage:#9db088; --sage-deep:#6f8a5c; --sage-bg:#eef3e8;
  --sky:#8fb4c4; --sky-deep:#5f8ea3; --sky-bg:#eaf2f5;
  --coral:#e5917a; --coral-deep:#c9654c; --coral-bg:#fbede7;
  --golden:#d6a75a; --golden-deep:#b08236; --golden-bg:#faf2e2;
  --ok:#3f7d55; --ok-bg:#e5f1e8; --ko:#b0492f; --ko-bg:#f8e3dc;
  --irab-bg:#2e2824; --irab-ink:#f3eadd; --irab-hi:#f6d98b; --irab-k:#e8a2a2;
  --shadow:0 1px 2px rgba(60,45,20,.05),0 8px 24px rgba(60,45,20,.07);
  --shadow-soft:0 2px 10px rgba(60,45,20,.07);
  --r:16px;
  --ar-scale:1;
  --acc:var(--gold); --acc-deep:var(--gold); --acc-bg:var(--gold-bg);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181512; --bg-dot:#26211b; --card:#221e19; --card-2:#2a251f; --card-3:#332d25;
    --ink:#f1eadf; --ink-soft:#c3b8a7; --ink-faint:#8f8576;
    --line:#3a3229; --line-2:#4a4034;
    --gold:#d9b25a; --gold-soft:#8a6d2c; --gold-bg:#2f2717;
    --rose:#8a5a5a; --rose-deep:#e0a0a0; --rose-bg:#2e2121;
    --mauve:#76596f; --mauve-deep:#d1b1cc; --mauve-bg:#2a2229;
    --sage:#5c6e4c; --sage-deep:#a9c491; --sage-bg:#212a1c;
    --sky:#4c6c7a; --sky-deep:#9cc5d6; --sky-bg:#1b262b;
    --coral:#8a4f40; --coral-deep:#f0a58f; --coral-bg:#2e1f1a;
    --golden:#8a6d2c; --golden-deep:#e8c27a; --golden-bg:#2b2416;
    --ok:#7cc493; --ok-bg:#1d2e22; --ko:#ef9a82; --ko-bg:#35211b;
    --irab-bg:#0f0d0b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-soft:0 2px 10px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181512; --bg-dot:#26211b; --card:#221e19; --card-2:#2a251f; --card-3:#332d25;
  --ink:#f1eadf; --ink-soft:#c3b8a7; --ink-faint:#8f8576;
  --line:#3a3229; --line-2:#4a4034;
  --gold:#d9b25a; --gold-soft:#8a6d2c; --gold-bg:#2f2717;
  --rose:#8a5a5a; --rose-deep:#e0a0a0; --rose-bg:#2e2121;
  --mauve:#76596f; --mauve-deep:#d1b1cc; --mauve-bg:#2a2229;
  --sage:#5c6e4c; --sage-deep:#a9c491; --sage-bg:#212a1c;
  --sky:#4c6c7a; --sky-deep:#9cc5d6; --sky-bg:#1b262b;
  --coral:#8a4f40; --coral-deep:#f0a58f; --coral-bg:#2e1f1a;
  --golden:#8a6d2c; --golden-deep:#e8c27a; --golden-bg:#2b2416;
  --ok:#7cc493; --ok-bg:#1d2e22; --ko:#ef9a82; --ko-bg:#35211b;
  --irab-bg:#0f0d0b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-soft:0 2px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}
/* accent par semestre */
.acc-s1{--acc:var(--sage);--acc-deep:var(--sage-deep);--acc-bg:var(--sage-bg)}
.acc-s2{--acc:var(--sky);--acc-deep:var(--sky-deep);--acc-bg:var(--sky-bg)}
.acc-s3{--acc:var(--mauve);--acc-deep:var(--mauve-deep);--acc-bg:var(--mauve-bg)}
.acc-s4{--acc:var(--coral);--acc-deep:var(--coral-deep);--acc-bg:var(--coral-bg)}
.acc-gold{--acc:var(--gold-soft);--acc-deep:var(--gold);--acc-bg:var(--gold-bg)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.1px);
  background-size:22px 22px;
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
button{font:inherit;color:inherit}
a{color:var(--acc-deep)}
h1,h2,h3,h4{margin:0}
p{margin:0 0 .65em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.ar,.arword,.ac,.a,.pill,.ar-big{font-family:'Amiri',serif}
.ar{direction:rtl;unicode-bidi:isolate}
.arword{direction:rtl;unicode-bidi:isolate;font-weight:700;font-size:calc(1.08em * var(--ar-scale))}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------- TOP BAR ---------------- */
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:860px;margin:0 auto;padding:9px 12px;display:flex;align-items:center;gap:10px;min-height:56px}
.iconbtn{width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.iconbtn:hover{border-color:var(--gold-soft)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.tb-title b{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-ar{font-family:'Amiri',serif;font-size:1.35rem;color:var(--gold);direction:rtl;white-space:nowrap}
@media(max-width:420px){.tb-ar{display:none}}
.progress{height:4px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .35s}

/* ---------------- BOTTOM NAV ---------------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{border:0;background:none;cursor:pointer;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.68rem;color:var(--ink-faint);letter-spacing:.02em}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--gold)}
.bnav .dot{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;border-radius:9px;background:var(--ko);color:#fff;
  font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bnav button{position:relative}

/* ---------------- GENERIC ---------------- */
.section-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--card);
  border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:.92rem;transition:.15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold-soft)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.acc{background:var(--acc-deep);color:#fff;border-color:var(--acc-deep)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.8rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:.72rem;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-soft);white-space:nowrap}
.chip.acc{background:var(--acc-bg);color:var(--acc-deep);border-color:var(--acc)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.ko{background:var(--ko-bg);color:var(--ko);border-color:transparent}
.chip.plain{background:var(--card-2);color:var(--ink-soft);border-color:var(--line)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc-deep);border-radius:9px;transition:width .4s}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:.86rem;z-index:200;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-soft)}
.empty .big{font-family:'Amiri',serif;font-size:2.4rem;color:var(--gold);direction:rtl}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------------- HOME ---------------- */
.hero{padding:30px 0 6px;text-align:center}
.hero .bism{font-family:'Amiri',serif;font-size:1.25rem;color:var(--gold);direction:rtl}
.hero .kicker{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin-top:14px}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.3rem,8vw,3.3rem);line-height:1.02;margin:.15em 0 .2em}
.hero h1 em{color:var(--gold);font-style:italic;white-space:nowrap}
.hero .arbig{font-family:'Amiri',serif;font-size:clamp(1.9rem,7vw,2.6rem);direction:rtl;color:var(--mauve-deep);line-height:1.5}
.hero .sub{color:var(--ink-soft);max-width:520px;margin:6px auto 0;font-size:.97rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:left}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;color:var(--gold);display:block;line-height:1.2}
.stat small{font-size:.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

.today{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.today{grid-template-columns:1fr}}
.tcard{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  display:flex;gap:14px;align-items:center;transition:.15s}
.tcard:hover{transform:translateY(-2px);border-color:var(--gold-soft)}
.tcard .ic{width:46px;height:46px;flex:0 0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--acc-bg);color:var(--acc-deep)}
.tcard .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tcard h3{font-size:1rem;margin:0 0 2px}
.tcard p{margin:0;font-size:.84rem;color:var(--ink-soft)}
.tcard .n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--acc-deep);font-size:1.2rem}

.sems{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.sems{grid-template-columns:1fr}}
.sem{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.18s;padding:0;display:flex;flex-direction:column}
.sem:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(60,45,20,.12)}
.sem .band{background:var(--acc-deep);color:#fff;padding:14px 16px 12px;position:relative;overflow:hidden}
.sem .band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.06) 10px 20px)}
.sem .band .no{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.18em;opacity:.9}
.sem .band h3{font-family:'Cormorant Garamond',serif;font-size:1.55rem;line-height:1.1;margin-top:2px}
.sem .band .ar{position:absolute;right:14px;top:8px;font-size:1.9rem;opacity:.95;z-index:1}
.sem .body{padding:13px 16px 15px}
.sem .body p{font-size:.85rem;color:var(--ink-soft);margin:0 0 10px}
.sem .meta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-faint);margin-top:6px}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.tools{grid-template-columns:repeat(2,1fr)}}
.tool{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:3px}
.tool:hover{border-color:var(--gold-soft);transform:translateY(-1px)}
.tool .g{font-family:'Amiri',serif;font-size:1.5rem;color:var(--gold);line-height:1.1;direction:rtl;text-align:left}
.tool b{font-size:.9rem}
.tool span{font-size:.76rem;color:var(--ink-soft);line-height:1.35}
.method{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;counter-reset:st}
@media(max-width:620px){.method{grid-template-columns:1fr 1fr}}
.method div{background:var(--card);border:1px dashed var(--line-2);border-radius:13px;padding:11px 12px;font-size:.82rem;color:var(--ink-soft);position:relative}
.method div b{display:block;color:var(--ink);font-size:.88rem;margin-bottom:2px}
.method div::before{counter-increment:st;content:counter(st);position:absolute;top:-9px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---------------- SEMESTER ---------------- */
.semhead{margin:18px 0 0;border-radius:20px;background:var(--acc-deep);color:#fff;padding:20px 20px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.semhead::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(255,255,255,.06) 12px 24px);pointer-events:none}
.semhead .no{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.2em;opacity:.9}
.semhead h2{font-family:'Cormorant Garamond',serif;font-size:2rem;line-height:1.05;margin:4px 0}
.semhead .ar{font-size:2rem;position:absolute;right:18px;top:12px;opacity:.95}
.semhead p{margin:4px 0 12px;opacity:.92;font-size:.9rem;max-width:560px}
.semhead .bar{background:rgba(255,255,255,.25)}.semhead .bar>i{background:#fff}
.semhead .meta{display:flex;gap:16px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:.72rem;margin-top:8px;opacity:.95}
.tabs{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink-soft)}
.tabs button.on{background:var(--acc-deep);border-color:var(--acc-deep);color:#fff}
.llist{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.litem{cursor:pointer;display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;text-align:left;transition:.15s;width:100%}
.litem:hover{border-color:var(--acc);transform:translateX(2px)}
.litem .num{flex:0 0 auto;width:36px;height:36px;border-radius:11px;background:var(--acc-bg);color:var(--acc-deep);font-family:'IBM Plex Mono',monospace;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:.86rem;border:1px solid var(--acc)}
.litem.done .num{background:var(--acc-deep);color:#fff}
.litem .lb{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.litem .lb b{font-size:.93rem}
.litem .lb .ar{font-size:calc(1rem * var(--ar-scale));color:var(--ink-soft);text-align:left}
.litem .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint)}
.groupt{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-deep);margin:16px 0 0}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:560px){.modes{grid-template-columns:1fr}}
.mode{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;transition:.15s}
.mode:hover{transform:translateY(-2px);border-color:var(--acc)}
.mode .ico{width:38px;height:38px;border-radius:11px;background:var(--acc-bg);color:var(--acc-deep);display:flex;align-items:center;justify-content:center}
.mode .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode h3{font-size:1rem;margin-top:4px}
.mode p{margin:0;font-size:.84rem;color:var(--ink-soft)}
.mode .meta{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--acc-deep)}
.mode.wide{grid-column:1/-1}
select.sel,input.inp{font:inherit;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 12px;font-size:.9rem;max-width:100%}
input.inp:focus,select.sel:focus{outline:2px solid var(--gold-soft);outline-offset:1px}

/* ---------------- LESSON (cahier) ---------------- */
.lhead{margin:20px 0 6px}
.washi{position:relative;display:inline-flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:9px 20px;border-radius:4px;
  transform:rotate(-.6deg);box-shadow:var(--shadow-soft);background:var(--acc-deep);max-width:100%}
.washi::before,.washi::after{content:"";position:absolute;top:50%;width:14px;height:120%;transform:translateY(-50%);opacity:.35;
  background:repeating-linear-gradient(45deg,#fff0,#fff0 3px,rgba(255,255,255,.6) 3px,rgba(255,255,255,.6) 6px)}

.fc .back{transform:rotateY(180deg);background:var(--card-2)}
.fc .big{font-family:'Amiri',serif;direction:rtl;font-size:calc(2.8rem * var(--ar-scale));line-height:1.5;color:var(--ink);font-weight:700}
.fc .frbig{font-family:'Cormorant Garamond',serif;font-size:2rem;line-height:1.15;font-weight:700}
.fc .tr{font-style:italic;color:var(--acc-deep);font-size:.95rem;margin-top:4px}
.fc .meta{font-size:.84rem;color:var(--ink-soft);margin-top:10px;line-height:1.5}
.fc .meta .ar{font-size:calc(1.15rem * var(--ar-scale))}
.fc .hint{position:absolute;bottom:18px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.fc .lesson{position:absolute;top:18px;left:20px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--ink-faint);letter-spacing:.06em}
.fc .say{position:absolute;top:12px;right:14px;z-index:3}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.grades button{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:11px 6px;cursor:pointer;font-weight:700;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:1px}
.grades button small{font-weight:400;font-size:.68rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}
.grades .g0{border-color:var(--ko);color:var(--ko)}.grades .g1{border-color:var(--golden);color:var(--golden-deep)}.grades .g2{border-color:var(--ok);color:var(--ok)}
.grades button:hover{background:var(--card-2)}
.vtable{width:100%;border-collapse:collapse;margin-top:10px}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.vrow .a{font-family:'Amiri',serif;direction:rtl;font-size:calc(1.3rem * var(--ar-scale));font-weight:700;min-width:96px;text-align:right}
.vrow .f{font-size:.9rem;line-height:1.35}
.vrow .f small{display:block;color:var(--ink-faint);font-size:.76rem}
.vrow .f .t{color:var(--acc-deep);font-style:italic;font-size:.78rem}
.lvl{display:inline-flex;gap:2px}
.lvl i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--acc-deep)}
.saybtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.saybtn svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.saybtn:hover{border-color:var(--gold-soft)}

/* ---------------- MINDMAPS ---------------- */
.mmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.mm{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-soft)}
.mm .h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.mm .h .n{width:28px;height:28px;border-radius:9px;background:var(--acc-deep);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:.76rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mm .h b{font-size:.95rem;line-height:1.2}
.mm .h .ar{margin-inline-start:auto;font-size:calc(1.05rem * var(--ar-scale));color:var(--acc-deep)}
.mm .br{border-left:3px solid var(--acc);padding:3px 0 3px 10px;margin:7px 0}
.mm .br .l{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--acc-deep)}
.mm .br ul{margin:2px 0 0;padding-left:16px;font-size:.85rem}
.mm .br li{margin:1px 0}
.mm .br .ar{font-size:calc(1.08em * var(--ar-scale))}
.mm .simple{margin:0;padding-left:16px;font-size:.86rem}
.mm .simple li{margin:3px 0}

/* ---------------- TOOLS ---------------- */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px;direction:rtl}
.abc button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:.12s}
.abc button:hover,.abc button.on{border-color:var(--gold);background:var(--gold-bg)}
.abc .g{font-family:'Amiri',serif;font-size:2rem;line-height:1.35}
.abc small{font-size:.66rem;color:var(--ink-soft);direction:ltr}
.abc .tags{display:flex;gap:3px;margin-top:2px}
.abc .tags i{width:7px;height:7px;border-radius:50%}
.tag-sol{background:var(--golden-deep)}.tag-lun{background:var(--sky-deep)}.tag-nc{background:var(--coral-deep)}
.ldetail{margin-top:14px}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl;margin:12px 0}
.forms div{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.forms .g{font-family:'Amiri',serif;font-size:2.3rem;line-height:1.4}
.forms small{font-size:.7rem;color:var(--ink-soft);direction:ltr;display:block}
.conj{width:100%;border-collapse:collapse;font-size:.9rem}
.conj th,.conj td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
.conj thead th{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;background:var(--card-2)}
.conj td.p{font-family:'Amiri',serif;font-size:calc(1.08rem * var(--ar-scale));color:var(--ink-soft);direction:rtl;white-space:nowrap}
.conj td.v{font-family:'Amiri',serif;font-size:calc(1.32rem * var(--ar-scale));direction:rtl;white-space:nowrap;cursor:pointer}
.conj td.v .pre{color:var(--sky-deep)}.conj td.v .suf{color:var(--coral-deep)}.conj td.v .hw{color:var(--sage-deep)}
.conj tr.sep td{background:var(--card-2);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:4px}
.conjwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 13px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--bg)}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.numgrid div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.numgrid .d{font-family:'Amiri',serif;font-size:1.6rem;color:var(--gold);min-width:34px;text-align:center}
.numgrid .w{font-family:'Amiri',serif;font-size:calc(1.1rem * var(--ar-scale));direction:rtl;line-height:1.3}
.numgrid small{display:block;font-size:.68rem;color:var(--ink-faint)}
.bigans{font-family:'Amiri',serif;direction:rtl;font-size:calc(2.2rem * var(--ar-scale));text-align:center;font-weight:700;margin:12px 0;line-height:1.6}
.bigans .n{color:var(--coral-deep)}.bigans .m{color:var(--sky-deep)}

/* ---------------- SHEET / SETTINGS ---------------- */
.sheet-bg{position:fixed;inset:0;background:rgba(20,15,10,.4);z-index:150;opacity:0;visibility:hidden;transition:.25s}
.sheet-bg.show{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.7,.3,1);max-width:620px;margin:0 auto;max-height:86vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin-bottom:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow b{font-size:.92rem}.setrow small{display:block;color:var(--ink-soft);font-size:.78rem}
.switch{width:46px;height:27px;border-radius:20px;background:var(--line-2);position:relative;cursor:pointer;border:0;flex:0 0 auto;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--gold)}.switch.on::after{left:22px}

/* search */
.sres{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sres button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sres button .k{font-family:'IBM Plex Mono',monospace;font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc-deep);background:var(--acc-bg);border-radius:6px;padding:2px 6px;flex:0 0 auto}
.sres button .a{font-family:'Amiri',serif;direction:rtl;font-size:1.15rem;margin-inline-start:auto}
.prog-sem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prog-sem .n{width:40px;height:40px;border-radius:12px;background:var(--acc-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat i.on{background:var(--gold)}
.foot{text-align:center;margin:44px 0 10px;padding-top:20px;border-top:2px dashed var(--line);color:var(--ink-faint);font-size:.78rem}
.foot .ar{font-size:1.3rem;color:var(--mauve-deep);display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.bnav,.lnav,.donebar,.inlineq{display:none!important}body{background:#fff;padding:0}}

/* ---- compléments : textes, solutions, objectifs ---- */
.txt{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;position:relative}
.txt .tt{font-family:'Amiri',serif;direction:rtl;text-align:center;font-size:calc(1.35rem * var(--ar-scale));font-weight:700;color:var(--acc-deep);margin-bottom:6px}
.txt .body{font-family:'Amiri',serif;direction:rtl;text-align:right;font-size:calc(1.3rem * var(--ar-scale));line-height:2.1}
.txt .src{font-size:.74rem;color:var(--ink-faint);text-align:left;margin-top:6px}
details.sol{margin:8px 0;border:1px dashed var(--line-2);border-radius:12px;padding:8px 12px;background:var(--card)}
details.sol summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--acc-deep);list-style:none}
details.sol summary::before{content:"▸ ";}
details.sol[open] summary::before{content:"▾ ";}
details.sol>div{margin-top:8px}
.objbox{background:var(--acc-bg);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;margin:12px 0 0;font-size:.88rem}
.objbox b{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-deep)}
.objbox ul{margin:4px 0 0;padding-left:18px}
.hadith{border-right:4px solid var(--golden);background:var(--golden-bg);border-radius:12px;padding:12px 16px;margin:14px 0}
.hadith .a{font-family:'Amiri',serif;direction:rtl;text-align:right;font-size:calc(1.35rem * var(--ar-scale));line-height:2}
.hadith .f{font-size:.88rem;color:var(--ink-soft);font-style:italic}
.hadith .src{font-size:.74rem;color:var(--ink-faint);margin-top:4px}
@media(max-width:560px){
  table.grid:has(td[data-label]){min-width:0;display:block;border:none;background:transparent}
  table.grid:has(td[data-label]) thead{display:none}
  table.grid:has(td[data-label]) tbody{display:block}
  table.grid:has(td[data-label]) tbody tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;margin:0 0 10px;padding:3px 2px}
  table.grid:has(td[data-label]) td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:none;border-bottom:1px dashed var(--line);padding:7px 12px;text-align:right}
  table.grid:has(td[data-label]) td::before{content:attr(data-label);flex:0 0 36%;text-align:left;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.03em;color:var(--sky-deep);text-transform:uppercase;unicode-bidi:plaintext}
  table.grid:has(td[data-label]) tbody tr td:last-child{border-bottom:none}
  .tbl-wrap:has(td[data-label]){border:none;overflow:visible}
}
/* correctifs mise en page */
.modes>*{min-width:0}
.mode .row select.sel{flex:1 1 180px;min-width:0;width:100%}
select.sel{text-overflow:ellipsis}
.semhead h2{padding-right:120px}
.sem .band h3{padding-right:90px}
@media(max-width:520px){
  .semhead .ar{position:static;display:block;text-align:right;font-size:1.7rem;line-height:1.4;margin:-4px 0 2px}
  .semhead h2{padding-right:0;font-size:1.75rem}
}
/* dark : texte foncé sur les bandeaux pastel */
:root[data-theme="dark"] :is(.washi .cno,.washi h2,.washi .ar,.semhead,.sem .band,.btn.acc,.tabs button.on,.litem.done .num,.mm .h .n,.rule>div::before,.prog-sem .n,.method div::before){color:#1b1612}
:root[data-theme="dark"] .washi .cno{background:rgba(0,0,0,.12)}
:root[data-theme="dark"] .semhead .bar>i{background:#1b1612}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) :is(.washi .cno,.washi h2,.washi .ar,.semhead,.sem .band,.btn.acc,.tabs button.on,.litem.done .num,.mm .h .n,.rule>div::before,.prog-sem .n,.method div::before){color:#1b1612}
  :root:not([data-theme="light"]) .washi .cno{background:rgba(0,0,0,.12)}
  :root:not([data-theme="light"]) .semhead .bar>i{background:#1b1612}
}
.qtext.rtl,.revitem .q.rtl{direction:rtl;text-align:right;font-family:'Amiri',serif;font-size:calc(1.3rem * var(--ar-scale));font-weight:700;line-height:1.9}
.fc .back .arsmall{font-family:'Amiri',serif;direction:rtl;font-size:calc(1.6rem * var(--ar-scale));color:var(--acc-deep);margin-bottom:4px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.sem .band .ar,.semhead .ar{position:static!important;display:inline;font-size:1.45rem;line-height:1.3;margin:0;text-align:right}
.semhead .ar{font-size:1.75rem}
.semhead h2,.sem .band h3{padding-right:0!important;position:relative;z-index:1}
table.grid thead th.ac,table.grid thead th.a{font-family:'DM Sans','Amiri',sans-serif;font-size:.8rem}
.card .row>.sel,.card .row>.inp{min-width:0;max-width:100%;flex:1 1 160px}
.vrow{grid-template-columns:auto minmax(0,1fr) auto}
.vrow .f{overflow-wrap:anywhere}
@media(max-width:600px){
  table.grid{min-width:0}
  table.grid th,table.grid td{padding:7px 7px;font-size:.86rem}
  table.grid .ac,table.grid .a{font-size:calc(1.06rem * var(--ar-scale))}
}
/* bandeau installation iPhone */
.card.install{margin:14px 0 4px;border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 7%,var(--card))}
.card.install .iconbtn{flex:none;width:32px;height:32px;font-size:.9rem}

</style>
</head>

<script>
/* =====================================================================
   OUTILS : alphabet, verbes, nombres, pronoms
   ===================================================================== */
window.TOOLS = {};
TOOLS.letters = [
 {l:'ا', n:'أَلِف', tr:'alif', sun:0, nc:1, tip:'Support de la voyelle longue ā, ou de la hamza (أ). Ne s’attache jamais à la lettre suivante.', ex:'أَسَدٌ', extr:'asadun', exfr:'un lion'},
 {l:'ب', n:'بَاء', tr:'bā’', sun:0, tip:'« b » français. Un point en dessous.', ex:'بَيْتٌ', extr:'baytun', exfr:'une maison'},
 {l:'ت', n:'تَاء', tr:'tā’', sun:1, tip:'« t » français. Deux points au-dessus.', ex:'تُفَّاحٌ', extr:'tuffāḥun', exfr:'des pommes'},
 {l:'ث', n:'ثَاء', tr:'thā’', sun:1, tip:'« th » anglais de think : la langue sort légèrement entre les dents. Trois points.', ex:'ثَعْلَبٌ', extr:'tha‘labun', exfr:'un renard'},
 {l:'ج', n:'جِيم', tr:'jīm', sun:0, tip:'« dj » (comme dans jupe/gemme). Point au milieu, en dessous.', ex:'جَمَلٌ', extr:'jamalun', exfr:'un chameau'},
 {l:'ح', n:'حَاء', tr:'ḥā’', sun:0, tip:'« h » soufflé du milieu de la gorge, comme un soupir chaud. Aucun point.', ex:'حِصَانٌ', extr:'ḥiṣānun', exfr:'un cheval'},
 {l:'خ', n:'خَاء', tr:'khā’', sun:0, tip:'« kh » rauque, comme la jota espagnole ou le « ch » de Bach. Point au-dessus.', ex:'خُبْزٌ', extr:'khubzun', exfr:'du pain'},
 {l:'د', n:'دَال', tr:'dāl', sun:1, nc:1, tip:'« d » français. Ne s’attache pas à la lettre suivante.', ex:'دَرْسٌ', extr:'darsun', exfr:'une leçon'},
 {l:'ذ', n:'ذَال', tr:'dhāl', sun:1, nc:1, tip:'« th » anglais de that : langue entre les dents, son vibrant. Ne s’attache pas à gauche.', ex:'ذِئْبٌ', extr:'dhi’bun', exfr:'un loup'},
 {l:'ر', n:'رَاء', tr:'rā’', sun:1, nc:1, tip:'« r » roulé (bout de la langue). Ne s’attache pas à gauche.', ex:'رَجُلٌ', extr:'rajulun', exfr:'un homme'},
 {l:'ز', n:'زَاي', tr:'zāy', sun:1, nc:1, tip:'« z » français. Ne s’attache pas à gauche.', ex:'زَرَافَةٌ', extr:'zarāfatun', exfr:'une girafe'},
 {l:'س', n:'سِين', tr:'sīn', sun:1, tip:'« s » français (jamais « z »).', ex:'سَمَكٌ', extr:'samakun', exfr:'du poisson'},
 {l:'ش', n:'شِين', tr:'shīn', sun:1, tip:'« ch » de chat. Trois points.', ex:'شَمْسٌ', extr:'shamsun', exfr:'un soleil'},
 {l:'ص', n:'صَاد', tr:'ṣād', sun:1, tip:'« s » emphatique : bouche arrondie, langue plaquée, son « lourd ».', ex:'صَدِيقٌ', extr:'ṣadīqun', exfr:'un ami'},
 {l:'ض', n:'ضَاد', tr:'ḍād', sun:1, tip:'« d » emphatique, son le plus propre à l’arabe (« la langue du ḍād »).', ex:'ضِفْدَعٌ', extr:'ḍifda‘un', exfr:'une grenouille'},
 {l:'ط', n:'طَاء', tr:'ṭā’', sun:1, tip:'« t » emphatique, lourd et appuyé.', ex:'طَبِيبٌ', extr:'ṭabībun', exfr:'un médecin'},
 {l:'ظ', n:'ظَاء', tr:'ẓā’', sun:1, tip:'« th » de that, mais emphatique (lourd).', ex:'ظَلَامٌ', extr:'ẓalāmun', exfr:'l’obscurité'},
 {l:'ع', n:'عَيْن', tr:'‘ayn', sun:0, tip:'Son guttural du fond de la gorge (contraction du pharynx). N’existe pas en français.', ex:'عَيْنٌ', extr:'‘aynun', exfr:'un œil'},
 {l:'غ', n:'غَيْن', tr:'ghayn', sun:0, tip:'« r » grasseyé parisien. Point au-dessus.', ex:'غُرْفَةٌ', extr:'ghurfatun', exfr:'une chambre'},
 {l:'ف', n:'فَاء', tr:'fā’', sun:0, tip:'« f » français. Un point au-dessus.', ex:'فِيلٌ', extr:'fīlun', exfr:'un éléphant'},
 {l:'ق', n:'قَاف', tr:'qāf', sun:0, tip:'« k » frappé au fond de la gorge (luette). Deux points.', ex:'قَمَرٌ', extr:'qamarun', exfr:'une lune'},

TOOLS.pronomsHTML = `
<div class="lbody" style="margin-top:16px">
  <h3 class="sub" style="margin-top:0">Les pronoms isolés <span class="ar">الضَّمَائِرُ المُنْفَصِلَةُ</span></h3>
  <p>Ils s'écrivent <b>seuls</b> et servent surtout de sujet d'une phrase nominale : <span class="arword">أَنَا طَالِبٌ</span> « je suis étudiant ».</p>
  <div class="tbl-wrap"><table class="grid th-sage"><thead><tr><th>Personne</th><th class="ac">Singulier</th><th class="ac">Duel</th><th class="ac">Pluriel</th></tr></thead><tbody>
    <tr><td>Locuteur (1ʳᵉ)</td><td class="ac">أَنَا <small class="faint">je</small></td><td class="ac" colspan="2">نَحْنُ <small class="faint">nous (2 ou +)</small></td></tr>
    <tr><td>Interlocuteur masc. (2ᵉ)</td><td class="ac">أَنْتَ <small class="faint">tu</small></td><td class="ac" rowspan="2">أَنْتُمَا <small class="faint">vous deux</small></td><td class="ac">أَنْتُمْ <small class="faint">vous</small></td></tr>
    <tr><td>Interlocuteur fém. (2ᵉ)</td><td class="ac">أَنْتِ <small class="faint">tu</small></td><td class="ac">أَنْتُنَّ <small class="faint">vous (f.)</small></td></tr>
    <tr><td>Absent masc. (3ᵉ)</td><td class="ac">هُوَ <small class="faint">il</small></td><td class="ac" rowspan="2">هُمَا <small class="faint">eux/elles deux</small></td><td class="ac">هُمْ <small class="faint">ils</small></td></tr>
    <tr><td>Absent fém. (3ᵉ)</td><td class="ac">هِيَ <small class="faint">elle</small></td><td class="ac">هُنَّ <small class="faint">elles</small></td></tr>
  </tbody></table></div>
  <div class="clair"><div class="ct">En clair</div><p><b>أَنَا</b> et <b>نَحْنُ</b> ne changent pas selon le genre. Au <b>duel</b>, une seule forme pour le masculin et le féminin : <b>أَنْتُمَا</b> et <b>هُمَا</b>.</p></div>

  <h3 class="sub">Les pronoms suffixes <span class="ar">الضَّمَائِرُ المُتَّصِلَةُ</span></h3>
  <p>Ils se <b>collent</b> à la fin d'un mot. Sur un <b>nom</b> → possession (« mon livre »). Sur un <b>verbe</b> → complément (« il m'a vu »). Sur une <b>préposition</b> → « pour moi, avec lui ».</p>
  <div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th>Sens</th><th class="ac">Suffixe</th><th class="ac">+ كِتَاب</th><th class="ac">+ verbe / particule</th></tr></thead><tbody>
    <tr><td>mon / me</td><td class="ac">ـِي / ـنِي</td><td class="ac">كِتَابِي</td><td class="ac">سَأَلَنِي · لِي</td></tr>
    <tr><td>ton (m.)</td><td class="ac">ـكَ</td><td class="ac">كِتَابُكَ</td><td class="ac">سَأَلَكَ · لَكَ</td></tr>
    <tr><td>ton (f.)</td><td class="ac">ـكِ</td><td class="ac">كِتَابُكِ</td><td class="ac">سَأَلَكِ · لَكِ</td></tr>
    <tr><td>son (à lui)</td><td class="ac">ـهُ</td><td class="ac">كِتَابُهُ</td><td class="ac">سَأَلَهُ · لَهُ</td></tr>
    <tr><td>son (à elle)</td><td class="ac">ـهَا</td><td class="ac">كِتَابُهَا</td><td class="ac">سَأَلَهَا · لَهَا</td></tr>
    <tr><td>votre (à vous deux)</td><td class="ac">ـكُمَا</td><td class="ac">كِتَابُكُمَا</td><td class="ac">لَكُمَا</td></tr>
    <tr><td>leur (à eux deux)</td><td class="ac">ـهُمَا</td><td class="ac">كِتَابُهُمَا</td><td class="ac">لَهُمَا</td></tr>
    <tr><td>notre / nous</td><td class="ac">ـنَا</td><td class="ac">كِتَابُنَا</td><td class="ac">سَأَلَنَا · لَنَا</td></tr>
    <tr><td>votre (m.)</td><td class="ac">ـكُمْ</td><td class="ac">كِتَابُكُمْ</td><td class="ac">لَكُمْ</td></tr>
    <tr><td>votre (f.)</td><td class="ac">ـكُنَّ</td><td class="ac">كِتَابُكُنَّ</td><td class="ac">لَكُنَّ</td></tr>
    <tr><td>leur (m.)</td><td class="ac">ـهُمْ</td><td class="ac">كِتَابُهُمْ</td><td class="ac">لَهُمْ</td></tr>
    <tr><td>leur (f.)</td><td class="ac">ـهُنَّ</td><td class="ac">كِتَابُهُنَّ</td><td class="ac">لَهُنَّ</td></tr>
  </tbody></table></div>
  <div class="warn"><div class="ct">Attention</div><p>Le suffixe <span class="arword">ـِي</span> (mon) est toujours précédé d'une <b>kasra</b> : <span class="arword">قَلَمِي</span>. Avec un verbe, « me » devient <span class="arword">ـنِي</span> : <span class="arword">سَأَلَنِي</span> « il m'a demandé ».</p></div>
  <div class="clair"><div class="ct">Le pronom caché</div><p>Dans <span class="arword">ذَهَبَ</span> « il est parti », le sujet <b>هُوَ</b> n'est pas écrit : c'est un pronom <b>caché</b> (<span class="arword">ضَمِيرٌ مُسْتَتِرٌ</span>).</p></div>

  <h3 class="sub">Les démonstratifs <span class="ar">أَسْمَاءُ الإِشَارَةِ</span></h3>
  <div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th></th><th class="ac">Proche (ceci)</th><th class="ac">Lointain (cela)</th></tr></thead><tbody>
    <tr><td>Masc. singulier</td><td class="ac">هٰذَا</td><td class="ac">ذٰلِكَ</td></tr>
    <tr><td>Fém. singulier</td><td class="ac">هٰذِهِ</td><td class="ac">تِلْكَ</td></tr>
    <tr><td>Masc. duel</td><td class="ac">هٰذَانِ</td><td class="ac">ذَانِكَ</td></tr>
    <tr><td>Fém. duel</td><td class="ac">هَاتَانِ</td><td class="ac">تَانِكَ</td></tr>
    <tr><td>Pluriel (humains)</td><td class="ac">هٰؤُلَاءِ</td><td class="ac">أُولٰئِكَ</td></tr>
  </tbody></table></div>
  <div class="clair"><div class="ct">Astuce</div><p>Un pluriel de <b>choses</b> (non doués de raison) s'accorde au <b>féminin singulier</b> : <span class="arword">هٰذِهِ مَدَارِسُ</span> « ce sont des écoles ».</p></div>
</div>`;
