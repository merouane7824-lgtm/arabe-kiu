i","Faux"],"a":[1],"j":"Le pronom est grammaticalement considéré comme appartenant à la catégorie des noms.","cat":"vf"},{"id":"s3-v2","c":1,"d":"f","t":"vf","q":"Une phrase verbale peut commencer par un verbe complet ou incomplet.","o":["Vrai","Faux"],"a":[0],"j":"Ce sont les deux cas présentés pour la phrase verbale.","cat":"vf"},{"id":"s3-v3","c":1,"d":"m","t":"vf","q":"Une phrase nominale arabe au présent doit toujours comporter un équivalent explicite du verbe français « être ».","o":["Vrai","Faux"],"a":[1],"j":"Le cours montre qu’« ‘Umar est absent » peut être nominale sans équivalent explicite de « être » au présent.","cat":"vf"},{"id":"s3-v4","c":1,"d":"m","t":"vf","q":"Une construction verbale peut parfois être interprétée grammaticalement comme un nom d’action.","o":["Vrai","Faux"],"a":[0],"j":"C’est le principe de la construction interprétée comme un nom d’action (al-maṣdar al-mu’awwal).","cat":"vf"},{"id":"s3-v5","c":1,"d":"m","t":"vf","q":"Connaître les règles suffit : il n’est pas nécessaire de répondre aux exercices.","o":["Vrai","Faux"],"a":[1],"j":"Le professeur insiste au contraire sur la nécessité de pratiquer à chaque occasion.","cat":"vf"},{"id":"s3-v6","c":2,"d":"f","t":"vf","q":"Le mubtada est ce à propos de quoi on donne une information.","o":["Vrai","Faux"],"a":[0],"j":"C’est la définition fondamentale donnée dans le cours.","cat":"vf"},{"id":"s3-v7","c":2,"d":"m","t":"vf","q":"Le khabar est toujours constitué d’un seul mot.","o":["Vrai","Faux"],"a":[1],"j":"Le khabar peut être un élément simple, une phrase complète ou un shibhu jumla.","cat":"vf"},{"id":"s3-v8","c":2,"d":"f","t":"vf","q":"La règle de base veut que le mubtada soit défini.","o":["Vrai","Faux"],"a":[0],"j":"C’est le principe général, même si des exceptions existent.","cat":"vf"},{"id":"s3-v9","c":2,"d":"m","t":"vf","q":"Le khabar peut parfois être placé avant le mubtada.","o":["Vrai","Faux"],"a":[0],"j":"L’inversion est possible et devient même obligatoire dans certaines constructions.","cat":"vf"},{"id":"s3-v10","c":2,"d":"m","t":"vf","q":"Il est impossible de supprimer simultanément le mubtada et le khabar.","o":["Vrai","Faux"],"a":[1],"j":"Les deux peuvent être sous-entendus lorsque leur contenu est entièrement connu grâce au contexte.","cat":"vf"},{"id":"s3-v11","c":2,"d":"m","t":"vf","q":"Un mubtada féminin exige, dans la règle d’accord étudiée, un khabar au féminin.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur insiste sur l’accord en genre entre les deux éléments.","cat":"vf"},{"id":"s3-v12","c":3,"d":"m","t":"vf","q":"Dans l’i‘rāb, la terminaison du mot est particulièrement importante.","o":["Vrai","Faux"],"a":[0],"j":"La dernière voyelle varie notamment en fonction de la fonction grammaticale.","cat":"vf"},{"id":"s3-v13","c":3,"d":"m","t":"vf","q":"Le mubtada peut être marfū‘ ou majrūr selon la phrase.","o":["Vrai","Faux"],"a":[1],"j":"Le professeur rappelle que le mubtada est toujours marfū‘.","cat":"vf"},{"id":"s3-v14","c":3,"d":"m","t":"vf","q":"Le khabar peut être constitué d’une phrase verbale entière.","o":["Vrai","Faux"],"a":[0],"j":"Une phrase verbale complète peut remplir la fonction de khabar.","cat":"vf"},{"id":"s3-v15","c":3,"d":"m","t":"vf","q":"Dans une phrase verbale, le sujet est toujours écrit sous la forme d’un nom séparé.","o":["Vrai","Faux"],"a":[1],"j":"Le sujet peut être un pronom sous-entendu.","cat":"vf"},{"id":"s3-v16","c":3,"d":"m","t":"vf","q":"Une construction préposition + nom au cas indirect peut constituer un khabar.","o":["Vrai","Faux"],"a":[0],"j":"C’est l’une des formes du shibhu jumla.","cat":"vf"},{"id":"s3-v17","c":3,"d":"f","t":"vf","q":"Mémoriser les règles sans les appliquer suffit à maîtriser la grammaire.","o":["Vrai","Faux"],"a":[1],"j":"Le professeur insiste sur la nécessité de pratiquer et de produire des phrases correctes.","cat":"vf"},{"id":"s3-v18","c":4,"d":"m","t":"vf","q":"Avec les nombres de 3 à 10, un nom féminin entraîne l’emploi d’un nombre sous sa forme masculine.","o":["Vrai","Faux"],"a":[0],"j":"Le nombre prend le genre opposé au nom compté.","cat":"vf"},{"id":"s3-v19","c":4,"d":"m","t":"vf","q":"Le nom compté reste toujours au singulier après les nombres de 3 à 10.","o":["Vrai","Faux"],"a":[1],"j":"Le professeur insiste au contraire sur l’emploi du pluriel.","cat":"vf"},{"id":"s3-v20","c":4,"d":"m","t":"vf","q":"Il faut se fier au genre français du mot pour choisir la forme du nombre arabe.","o":["Vrai","Faux"],"a":[1],"j":"Il faut considérer le genre grammatical du mot arabe.","cat":"vf"},{"id":"s3-v21","c":4,"d":"f","t":"vf","q":"Le cours utilise les étudiants et les étudiantes pour montrer les deux sens de l’opposition de genre.","o":["Vrai","Faux"],"a":[0],"j":"Les deux séries permettent de comparer directement noms masculins et féminins.","cat":"vf"},{"id":"s3-v22","c":4,"d":"f","t":"vf","q":"Un adjectif qualificatif doit suivre le cas grammatical du nom qu’il qualifie.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur le rappelle avec les exemples des couleurs.","cat":"vf"},{"id":"s3-v23","c":4,"d":"m","t":"vf","q":"Connaître le pluriel des noms est important pour maîtriser les nombres de 3 à 10.","o":["Vrai","Faux"],"a":[0],"j":"Sans le pluriel, il devient difficile de construire correctement la quantité.","cat":"vf"},{"id":"s3-v24","c":5,"d":"m","t":"vf","q":"En arabe, une seule forme du nom relatif suffit pour tous les genres et tous les nombres.","o":["Vrai","Faux"],"a":[1],"j":"Plusieurs formes existent selon le genre et le nombre.","cat":"vf"},{"id":"s3-v25","c":5,"d":"d","t":"vf","q":"Le nom relatif masculin duel possède des formes différentes selon son cas grammatical.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur distingue notamment le raf‘ du naṣb et du jarr.","cat":"vf"},{"id":"s3-v26","c":5,"d":"f","t":"vf","q":"La proposition relative peut être une phrase verbale.","o":["Vrai","Faux"],"a":[0],"j":"Elle peut notamment être verbale ou nominale.","cat":"vf"},{"id":"s3-v27","c":5,"d":"m","t":"vf","q":"Le nom relatif peut être suivi simplement d’un nom isolé, sans proposition.","o":["Vrai","Faux"],"a":[1],"j":"Le professeur insiste sur la nécessité d’une proposition qui complète le sens.","cat":"vf"},{"id":"s3-v28","c":5,"d":"m","t":"vf","q":"Le pronom de rappel peut parfois être sous-entendu.","o":["Vrai","Faux"],"a":[0],"j":"Il peut être explicitement cité ou sous-entendu.","cat":"vf"},{"id":"s3-v29","c":5,"d":"f","t":"vf","q":"Les noms relatifs étudiés appartiennent aux noms définis.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur les classe parmi les noms définis (al-ma‘ārif).","cat":"vf"},{"id":"s3-v30","c":6,"d":"m","t":"vf","q":"Tous les mots arabes changent obligatoirement de terminaison selon leur fonction.","o":["Vrai","Faux"],"a":[1],"j":"Certains mots sont invariables (mabnī).","cat":"vf"},{"id":"s3-v31","c":6,"d":"f","t":"vf","q":"Le verbe à l’inaccompli peut exprimer le présent ou le futur.","o":["Vrai","Faux"],"a":[0],"j":"Le contexte permet de déterminer s’il exprime le présent ou le futur.","cat":"vf"},{"id":"s3-v32","c":6,"d":"m","t":"vf","q":"Après une particule de naṣb, un verbe ordinaire peut passer d’une ḍamma finale à une fatḥa.","o":["Vrai","Faux"],"a":[0],"j":"C’est la transformation principale montrée dans les exemples.","cat":"vf"},{"id":"s3-v33","c":6,"d":"d","t":"vf","q":"Pour les cinq verbes, le naṣb se marque par le maintien du nūn.","o":["Vrai","Faux"],"a":[1],"j":"Le nūn est supprimé au naṣb.","cat":"vf"},{"id":"s3-v34","c":6,"d":"f","t":"vf","q":"L’épithète doit suivre le nom qualifié dans son genre et son nombre.","o":["Vrai","Faux"],"a":[0],"j":"Le genre et le nombre font partie des quatre accords.","cat":"vf"},{"id":"s3-v35","c":6,"d":"m","t":"vf","q":"Une épithète indéfinie peut qualifier un nom défini sans changer.","o":["Vrai","Faux"],"a":[1],"j":"L’épithète suit également le nom dans son caractère défini ou indéfini.","cat":"vf"},{"id":"s3-v36","c":7,"d":"m","t":"vf","q":"Tous les noms sans article défini sont nécessairement indéfinis.","o":["Vrai","Faux"],"a":[1],"j":"Un nom propre, un pronom ou un démonstratif peut être défini sans article.","cat":"vf"},{"id":"s3-v37","c":7,"d":"f","t":"vf","q":"Un pronom est considéré comme défini.","o":["Vrai","Faux"],"a":[0],"j":"Les pronoms constituent la première catégorie de noms définis présentée.","cat":"vf"},{"id":"s3-v38","c":7,"d":"f","t":"vf","q":"Un démonstratif fait partie des noms définis.","o":["Vrai","Faux"],"a":[0],"j":"Les démonstratifs désignent un référent déterminé.","cat":"vf"},{"id":"s3-v39","c":7,"d":"m","t":"vf","q":"L’annexion à un nom indéfini suffit toujours à rendre le premier terme défini.","o":["Vrai","Faux"],"a":[1],"j":"Le premier terme reste indéfini si le second l’est également ; il est seulement précisé.","cat":"vf"},{"id":"s3-v40","c":7,"d":"f","t":"vf","q":"Un nom propre est défini.","o":["Vrai","Faux"],"a":[0],"j":"Les noms propres sont définis.","cat":"vf"},{"id":"s3-v41","c":7,"d":"m","t":"vf","q":"Si l’on rend défini un nom accompagné d’une épithète, l’épithète doit aussi respecter cette détermination.","o":["Vrai","Faux"],"a":[0],"j":"L’épithète suit le nom qualifié dans son caractère défini ou indéfini.","cat":"vf"},{"id":"s3-v42","c":8,"d":"m","t":"vf","q":"Kāna fonctionne exactement comme n’importe quel verbe avec un sujet ordinaire.","o":["Vrai","Faux"],"a":[1],"j":"C’est un verbe particulier qui entre dans une phrase nominale.","cat":"vf"},{"id":"s3-v43","c":8,"d":"f","t":"vf","q":"Le nom de kāna est au nominatif.","o":["Vrai","Faux"],"a":[0],"j":"Kāna et ses sœurs mettent leur nom au nominatif.","cat":"vf"},{"id":"s3-v44","c":8,"d":"m","t":"vf","q":"L’attribut de kāna reste toujours au nominatif.","o":["Vrai","Faux"],"a":[1],"j":"L’attribut passe à l’accusatif lorsqu’il est directement fléchi.","cat":"vf"},{"id":"s3-v45","c":8,"d":"f","t":"vf","q":"Laysa appartient aux verbes fonctionnant comme kāna.","o":["Vrai","Faux"],"a":[0],"j":"Laysa suit la règle de kāna et sert à exprimer la négation.","cat":"vf"},{"id":"s3-v46","c":8,"d":"m","t":"vf","q":"L’attribut de kāna peut être un groupe prépositionnel.","o":["Vrai","Faux"],"a":[0],"j":"Un groupe prépositionnel peut occuper la fonction d’attribut.","cat":"vf"},{"id":"s3-v47","c":8,"d":"m","t":"vf","q":"Le nom de kāna peut parfois être représenté par un pronom sous-entendu.","o":["Vrai","Faux"],"a":[0],"j":"Le contexte peut permettre de comprendre le pronom remplissant cette fonction.","cat":"vf"},{"id":"s3-v48","c":9,"d":"f","t":"vf","q":"Tous les noms arabes sont invariables.","o":["Vrai","Faux"],"a":[1],"j":"La majorité des noms sont au contraire variables.","cat":"vf"},{"id":"s3-v49","c":9,"d":"m","t":"vf","q":"La fatḥa est la marque originelle de l’accusatif.","o":["Vrai","Faux"],"a":[0],"j":"La fatḥa est la marque originelle de l’accusatif.","cat":"vf"},{"id":"s3-v50","c":9,"d":"d","t":"vf","q":"Le génitif peut s’appliquer indifféremment aux noms et aux verbes.","o":["Vrai","Faux"],"a":[1],"j":"Le génitif concerne les noms ; l’apocopé concerne les verbes.","cat":"vf"},{"id":"s3-v51","c":9,"d":"m","t":"vf","q":"Un nom peut être variable tout en utilisant une marque autre que ḍamma, fatḥa ou kasra.","o":["Vrai","Faux"],"a":[0],"j":"Certaines catégories utilisent des marques secondaires.","cat":"vf"},{"id":"s3-v52","c":9,"d":"m","t":"vf","q":"Les pronoms changent systématiquement de terminaison selon leur fonction.","o":["Vrai","Faux"],"a":[1],"j":"Les pronoms font partie des noms invariables.","cat":"vf"},{"id":"s3-v53","c":9,"d":"m","t":"vf","q":"Une erreur de flexion peut entraîner un contresens.","o":["Vrai","Faux"],"a":[0],"j":"La flexion participe à l’identification des fonctions grammaticales et donc du sens.","cat":"vf"},{"id":"s3-v54","c":10,"d":"f","t":"vf","q":"Un nom peut être au jussif.","o":["Vrai","Faux"],"a":[1],"j":"Le jussif concerne les verbes et non les noms.","cat":"vf"},{"id":"s3-v55","c":10,"d":"m","t":"vf","q":"Un verbe peut devenir au jussif après un outil de condition.","o":["Vrai","Faux"],"a":[0],"j":"Plusieurs outils conditionnels (in, man, mā…) provoquent le jussif.","cat":"vf"},{"id":"s3-v56","c":10,"d":"m","t":"vf","q":"« Lam » et « lammā » ont exactement la même nuance de sens.","o":["Vrai","Faux"],"a":[1],"j":"« Lammā » conserve l’idée que l’action peut encore se produire.","cat":"vf"},{"id":"s3-v57","c":10,"d":"d","t":"vf","q":"Tous les verbes au jussif prennent nécessairement un sukūn visible.","o":["Vrai","Faux"],"a":[1],"j":"La marque peut aussi être la suppression d’une lettre faible ou du nūn.","cat":"vf"},{"id":"s3-v58","c":10,"d":"m","t":"vf","q":"Un verbe coordonné à un verbe au jussif peut suivre son état grammatical.","o":["Vrai","Faux"],"a":[0],"j":"C’est l’un des cas explicitement étudiés dans le cours.","cat":"vf"},{"id":"s3-v59","c":10,"d":"m","t":"vf","q":"La suppression du nūn peut être une marque du jussif.","o":["Vrai","Faux"],"a":[0],"j":"C’est la marque utilisée pour les cinq verbes.","cat":"vf"},{"id":"s3-v60","c":11,"d":"f","t":"vf","q":"Tous les pronoms arabes sont des pronoms isolés.","o":["Vrai","Faux"],"a":[1],"j":"Les pronoms sont divisés en pronoms isolés et pronoms attachés.","cat":"vf"},{"id":"s3-v61","c":11,"d":"m","t":"vf","q":"Dans les constructions possessives étudiées, le pronom attaché vient après le nom.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur insiste sur cette différence avec le français.","cat":"vf"},{"id":"s3-v62","c":11,"d":"m","t":"vf","q":"Ana et le suffixe de première personne renvoient au locuteur, mais fonctionnent différemment.","o":["Vrai","Faux"],"a":[0],"j":"L’un est isolé tandis que l’autre est attaché à un mot.","cat":"vf"},{"id":"s3-v63","c":11,"d":"m","t":"vf","q":"Antum et antunna désignent exactement le même type d’interlocuteurs.","o":["Vrai","Faux"],"a":[1],"j":"Antum correspond au masculin pluriel et antunna au féminin pluriel.","cat":"vf"},{"id":"s3-v64","c":11,"d":"f","t":"vf","q":"Le sujet initial d’une phrase nominale peut être au pluriel.","o":["Vrai","Faux"],"a":[0],"j":"Le cours travaille précisément la transformation du sujet initial au pluriel.","cat":"vf"},{"id":"s3-v65","c":11,"d":"d","t":"vf","q":"Dans les exercices, un pluriel non humain peut être repris par hādhihi.","o":["Vrai","Faux"],"a":[0],"j":"C’est la construction répétée dans les exercices sur les objets et choses non humaines.","cat":"vf"},{"id":"s3-v66","c":12,"d":"m","t":"vf","q":"Le duel utilise toujours la ḍamma, la fatḥa et la kasra.","o":["Vrai","Faux"],"a":[1],"j":"Le duel utilise des marques de remplacement (alif / yā’).","cat":"vf"},{"id":"s3-v67","c":12,"d":"f","t":"vf","q":"Un duel au nominatif prend l’alif comme marque de flexion.","o":["Vrai","Faux"],"a":[0],"j":"L’alif remplace la ḍamma au nominatif.","cat":"vf"},{"id":"s3-v68","c":12,"d":"m","t":"vf","q":"L’accusatif et le génitif du duel possèdent la même marque.","o":["Vrai","Faux"],"a":[0],"j":"Ils sont tous deux marqués par le yā’.","cat":"vf"},{"id":"s3-v69","c":12,"d":"m","t":"vf","q":"Tout mot qui désigne deux éléments est nécessairement un véritable duel.","o":["Vrai","Faux"],"a":[1],"j":"Certains mots désignant deux sont seulement rattachés grammaticalement au duel.","cat":"vf"},{"id":"s3-v70","c":12,"d":"d","t":"vf","q":"Certains mots sont rattachés au duel sans être formés à partir d’un singulier de même forme.","o":["Vrai","Faux"],"a":[0],"j":"C’est précisément la définition des mots rattachés au duel.","cat":"vf"},{"id":"s3-v71","c":12,"d":"d","t":"vf","q":"Le professeur considère la construction coranique évoquée comme une faute grammaticale.","o":["Vrai","Faux"],"a":[1],"j":"Il insiste sur l’absence de faute et mentionne plusieurs explications grammaticales.","cat":"vf"},{"id":"s3-v72","c":13,"d":"m","t":"vf","q":"Un verbe transitif ne peut jamais prendre plus d’un complément.","o":["Vrai","Faux"],"a":[1],"j":"Certains verbes transitifs peuvent en prendre davantage.","cat":"vf"},{"id":"s3-v73","c":13,"d":"f","t":"vf","q":"Le verbe « écrire » est présenté comme transitif.","o":["Vrai","Faux"],"a":[0],"j":"Il prend directement un complément d’objet.","cat":"vf"},{"id":"s3-v74","c":13,"d":"m","t":"vf","q":"Le verbe « voyager » prend directement le lieu comme complément d’objet.","o":["Vrai","Faux"],"a":[1],"j":"Il est intransitif et se construit avec une préposition.","cat":"vf"},{"id":"s3-v75","c":13,"d":"m","t":"vf","q":"Le présent peut servir à exprimer le futur selon la construction.","o":["Vrai","Faux"],"a":[0],"j":"Certaines particules rendent explicitement le sens futur.","cat":"vf"},{"id":"s3-v76","c":13,"d":"d","t":"vf","q":"Ahmed envoie son télégramme à son père en Tanzanie.","o":["Vrai","Faux"],"a":[0],"j":"C’est le contexte du texte étudié.","cat":"vf"},{"id":"s3-v77","c":13,"d":"f","t":"vf","q":"Le professeur recommande de revenir au texte pour retrouver et formuler les réponses.","o":["Vrai","Faux"],"a":[0],"j":"Ce retour au texte est présenté comme un exercice essentiel de compréhension.","cat":"vf"},{"id":"s3-v78","c":14,"d":"m","t":"vf","q":"Les prépositions étudiées entrent sur les verbes.","o":["Vrai","Faux"],"a":[1],"j":"La règle donnée est que les prépositions entrent sur les noms.","cat":"vf"},{"id":"s3-v79","c":14,"d":"f","t":"vf","q":"Le nom suivant une préposition est au cas indirect.","o":["Vrai","Faux"],"a":[0],"j":"C’est la règle centrale du cours.","cat":"vf"},{"id":"s3-v80","c":14,"d":"d","t":"vf","q":"Le cas indirect est toujours matériellement marqué par une kasra, sans exception.","o":["Vrai","Faux"],"a":[1],"j":"La kasra est la marque originelle, mais d’autres marques peuvent la remplacer.","cat":"vf"},{"id":"s3-v81","c":14,"d":"m","t":"vf","q":"Le yā’ peut remplacer la kasra pour le duel.","o":["Vrai","Faux"],"a":[0],"j":"C’est la règle rappelée pour le duel.","cat":"vf"},{"id":"s3-v82","c":14,"d":"d","t":"vf","q":"Le professeur affirme que la distinction prophète/messager ne fait l’objet d’aucune discussion.","o":["Vrai","Faux"],"a":[1],"j":"Il précise au contraire qu’il existe beaucoup de discussions sur cette distinction.","cat":"vf"},{"id":"s3-v83","c":14,"d":"m","t":"vf","q":"Le professeur recommande de repérer les prépositions lorsqu’on lit et vocalise un texte.","o":["Vrai","Faux"],"a":[0],"j":"Ce repérage permet de déterminer correctement le cas et la terminaison du nom.","cat":"vf"},{"id":"s3-v84","c":15,"d":"d","t":"vf","q":"Les pèlerins passent le neuvième jour à ‘Arafāt jusqu’au coucher du soleil.","o":["Vrai","Faux"],"a":[0],"j":"C’est l’étape du pèlerinage décrite dans le texte.","cat":"vf"},{"id":"s3-v85","c":15,"d":"d","t":"vf","q":"Le trajet Ṣafā→Marwa puis le retour à Ṣafā ne comptent ensemble que pour un seul trajet.","o":["Vrai","Faux"],"a":[1],"j":"Ṣafā vers Marwa compte pour un trajet et le retour pour un deuxième.","cat":"vf"},{"id":"s3-v86","c":15,"d":"m","t":"vf","q":"Tous les noms féminins arabes portent obligatoirement une marque visible du féminin.","o":["Vrai","Faux"],"a":[1],"j":"Certains féminins n’ont aucune marque visible (ex. « soleil »).","cat":"vf"},{"id":"s3-v87","c":15,"d":"f","t":"vf","q":"Le mot désignant le soleil est traité comme féminin malgré l’absence de marque apparente.","o":["Vrai","Faux"],"a":[0],"j":"C’est l’un des exemples principaux donnés par le professeur.","cat":"vf"},{"id":"s3-v88","c":15,"d":"d","t":"vf","q":"Tout mot terminé extérieurement comme un féminin est nécessairement féminin, y compris les noms propres.","o":["Vrai","Faux"],"a":[1],"j":"Des noms masculins comme Ḥamza ou Mu‘āwiya montrent qu’il existe des exceptions.","cat":"vf"},{"id":"s3-v89","c":15,"d":"m","t":"vf","q":"Le passage d’une phrase au féminin peut entraîner une modification du verbe et de l’adjectif.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur insiste sur la nécessité de respecter les accords.","cat":"vf"},{"id":"s3-v90","c":16,"d":"m","t":"vf","q":"Tout verbe contenant visuellement un alif est nécessairement faible.","o":["Vrai","Faux"],"a":[1],"j":"Il faut vérifier si l’alif appartient réellement à la racine.","cat":"vf"},{"id":"s3-v91","c":16,"d":"d","t":"vf","q":"La hamza est considérée comme une lettre faible dans cette classification.","o":["Vrai","Faux"],"a":[1],"j":"Un verbe avec hamza peut être sain et mahmūz.","cat":"vf"},{"id":"s3-v92","c":16,"d":"m","t":"vf","q":"Un verbe sain peut comporter un redoublement.","o":["Vrai","Faux"],"a":[0],"j":"Il appartient alors à la catégorie du muḍa‘‘af.","cat":"vf"},{"id":"s3-v93","c":16,"d":"d","t":"vf","q":"Wajada appartient à la catégorie du mithāl.","o":["Vrai","Faux"],"a":[0],"j":"Sa première radicale est faible.","cat":"vf"},{"id":"s3-v94","c":16,"d":"d","t":"vf","q":"Qāla appartient à la catégorie de l’ajwaf.","o":["Vrai","Faux"],"a":[0],"j":"Sa lettre faible occupe la position centrale.","cat":"vf"},{"id":"s3-v95","c":16,"d":"m","t":"vf","q":"Les verbes faibles peuvent subir davantage de transformations pendant la conjugaison.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur insiste sur leurs transformations au présent et à l’impératif.","cat":"vf"},{"id":"s3-v96","c":17,"d":"f","t":"vf","q":"Tous les noms arabes changent de terminaison selon leur fonction.","o":["Vrai","Faux"],"a":[1],"j":"Certains mots sont invariables (mabnī) et conservent la même forme.","cat":"vf"},{"id":"s3-v97","c":17,"d":"d","t":"vf","q":"Les cinq noms utilisent toujours le wāw, l’alif et le yā’, quelles que soient les circonstances.","o":["Vrai","Faux"],"a":[1],"j":"La flexion particulière ne s’applique que lorsque ses conditions sont réunies.","cat":"vf"},{"id":"s3-v98","c":17,"d":"m","t":"vf","q":"Au nominatif, le wāw remplace la ḍamma lorsque les conditions sont réunies.","o":["Vrai","Faux"],"a":[0],"j":"C’est la marque secondaire du nominatif étudiée dans ce cours.","cat":"vf"},{"id":"s3-v99","c":17,"d":"m","t":"vf","q":"Un des cinq noms employé au duel suit la règle du duel.","o":["Vrai","Faux"],"a":[0],"j":"La condition du singulier n’est alors plus remplie.","cat":"vf"},{"id":"s3-v100","c":17,"d":"f","t":"vf","q":"L’annexion fait partie des conditions de la règle des cinq noms.","o":["Vrai","Faux"],"a":[0],"j":"L’annexion (iḍāfa) est une condition essentielle.","cat":"vf"},{"id":"s3-v101","c":17,"d":"d","t":"vf","q":"Un mot au diminutif continue à suivre la flexion particulière des cinq noms.","o":["Vrai","Faux"],"a":[1],"j":"La forme diminutive revient à une autre flexion.","cat":"vf"},{"id":"s3-v102","c":18,"d":"d","t":"vf","q":"Le pharmacien ausculte le malade avant de lui prescrire son traitement.","o":["Vrai","Faux"],"a":[1],"j":"C’est le médecin qui ausculte et prescrit ; le pharmacien délivre les médicaments.","cat":"vf"},{"id":"s3-v103","c":18,"d":"f","t":"vf","q":"Le malade retourne à l’hôpital après une semaine.","o":["Vrai","Faux"],"a":[0],"j":"Il revient pour une seconde consultation.","cat":"vf"},{"id":"s3-v104","c":18,"d":"m","t":"vf","q":"Dans plusieurs verbes ajwaf, la lettre faible disparaît au jussif.","o":["Vrai","Faux"],"a":[0],"j":"C’est l’un des phénomènes grammaticaux principaux du cours.","cat":"vf"},{"id":"s3-v105","c":18,"d":"d","t":"vf","q":"La forme « nimtu » appartient au verbe signifiant « dormir ».","o":["Vrai","Faux"],"a":[0],"j":"Elle correspond à « j’ai dormi » dans le modèle étudié.","cat":"vf"},{"id":"s3-v106","c":18,"d":"f","t":"vf","q":"Le professeur recommande de se limiter à l’apprentissage théorique des règles.","o":["Vrai","Faux"],"a":[1],"j":"Il insiste au contraire sur la conjugaison pratique et la construction de phrases.","cat":"vf"},{"id":"s3-v107","c":18,"d":"m","t":"vf","q":"L’impératif de certains verbes creux entraîne la disparition de la lettre faible.","o":["Vrai","Faux"],"a":[0],"j":"Les exemples qum, zur, ṣum et tub illustrent ce phénomène.","cat":"vf"},{"id":"s3-v108","c":19,"d":"f","t":"vf","q":"Le verbe nāqiṣ possède nécessairement sa lettre faible au début.","o":["Vrai","Faux"],"a":[1],"j":"La lettre faible du nāqiṣ est située à la fin.","cat":"vf"},{"id":"s3-v109","c":19,"d":"d","t":"vf","q":"Dans certains verbes, l’alif final correspond à l’origine à un yā’.","o":["Vrai","Faux"],"a":[0],"j":"Le yā’ réapparaît dans certaines conjugaisons comme ataytu ou jaraytu.","cat":"vf"},{"id":"s3-v110","c":19,"d":"d","t":"vf","q":"Le wāw d’origine peut réapparaître dans certaines conjugaisons.","o":["Vrai","Faux"],"a":[0],"j":"Le professeur donne notamment des formes comme da‘awtu et shakawtu.","cat":"vf"},{"id":"s3-v111","c":19,"d":"m","t":"vf","q":"Le « lā » d’interdiction laisse toujours intacte la lettre faible finale.","o":["Vrai","Faux"],"a":[1],"j":"Il impose le jussif et la lettre faible est supprimée dans les modèles concernés.","cat":"vf"},{"id":"s3-v112","c":19,"d":"m","t":"vf","q":"Le professeur établit un lien entre le présent jussif et l’impératif.","o":["Vrai","Faux"],"a":[0],"j":"Une transformation observée au jussif se retrouve également à l’impératif.","cat":"vf"},{"id":"s3-v113","c":19,"d":"f","t":"vf","q":"Les cours et les règles suffisent à eux seuls pour maîtriser une langue.","o":["Vrai","Faux"],"a":[1],"j":"Le professeur insiste sur la lecture, l’écriture, l’écoute et la conversation.","cat":"vf"}],"vocab":[{"c":1,"ar":"الجُمْلَةُ","tr":"al-jumlatu","fr":"la phrase"},{"c":1,"ar":"الجُمْلَةُ الِاسْمِيَّةُ","tr":"al-jumlatu al-ismiyyatu","fr":"la phrase nominale, dont le commencement est grammaticalement nominal"},{"c":1,"ar":"الجُمْلَةُ الفِعْلِيَّةُ","tr":"al-jumlatu al-fi‘liyyatu","fr":"la phrase verbale, qui commence par un verbe"},{"c":1,"ar":"الِاسْمُ","tr":"al-ismu","fr":"le nom, catégorie grammaticale qui comprend notamment les noms, certains pronoms et les démonstratifs"},{"c":1,"ar":"الفِعْلُ","tr":"al-fi‘lu","fr":"le verbe"},{"c":1,"ar":"المُبْتَدَأُ","tr":"al-mubtada’u","fr":"le premier élément fondamental d’une phrase nominale simple"},{"c":1,"ar":"الخَبَرُ","tr":"al-khabaru","fr":"l’information apportée à propos du premier élément de la phrase nominale"},{"c":1,"ar":"الفَاعِلُ","tr":"al-fā‘ilu","fr":"le sujet qui accomplit l’action d’un verbe complet"},{"c":1,"ar":"المَصْدَرُ","tr":"al-maṣdaru","fr":"le nom d’action"},{"c":1,"ar":"المَصْدَرُ المُؤَوَّلُ","tr":"al-maṣdaru al-mu’awwalu","fr":"une construction verbale interprétée grammaticalement comme un nom d’action"},{"c":1,"ar":"الفِعْلُ التَّامُّ","tr":"al-fi‘lu at-tāmmu","fr":"le verbe complet fonctionnant notamment avec un sujet"},{"c":1,"ar":"الفِعْلُ النَّاقِصُ","tr":"al-fi‘lu an-nāqiṣu","fr":"le verbe incomplet qui entre dans une construction comportant un nom et une information"},{"c":2,"ar":"المُبْتَدَأُ","tr":"al-mubtada’u","fr":"élément de la phrase nominale à propos duquel une information est donnée"},{"c":2,"ar":"الخَبَرُ","tr":"al-khabaru","fr":"information donnée à propos du mubtada et complétant le sens de la phrase nominale"},{"c":2,"ar":"الإِعْرَابُ","tr":"al-i‘rābu","fr":"variation de la terminaison d’un mot selon sa fonction grammaticale"},{"c":2,"ar":"مَرْفُوعٌ","tr":"marfū‘un","fr":"au cas du raf‘, cas grammatical du mubtada et du khabar selon la règle étudiée"},{"c":2,"ar":"المَعْرِفَةُ","tr":"al-ma‘rifatu","fr":"nom défini, forme normalement requise pour le mubtada"},{"c":2,"ar":"النَّكِرَةُ","tr":"an-nakiratu","fr":"nom indéfini, possible comme mubtada dans certains cas particuliers"},{"c":2,"ar":"المَصْدَرُ المُؤَوَّلُ","tr":"al-maṣdaru al-mu’awwalu","fr":"construction verbale interprétée grammaticalement comme un nom d’action"},{"c":2,"ar":"اسْمُ الِاسْتِفْهَامِ","tr":"ismu al-istifhāmi","fr":"nom interrogatif pouvant notamment remplir la fonction de mubtada ou de khabar"},{"c":2,"ar":"مُفْرَدٌ","tr":"mufradun","fr":"khabar constitué d’un élément qui n’est pas lui-même une phrase"},{"c":2,"ar":"جُمْلَةٌ","tr":"jumlatun","fr":"phrase pouvant elle-même remplir la fonction de khabar"},{"c":2,"ar":"شِبْهُ جُمْلَةٍ","tr":"shibhu jumlatin","fr":"construction ressemblant à une phrase, notamment un circonstanciel ou une construction prépositionnelle"},{"c":2,"ar":"التَّاءُ المَرْبُوطَةُ","tr":"at-tā’u al-marbūṭatu","fr":"terminaison caractéristique de nombreux noms féminins selon la règle de base rappelée dans le cours"},{"c":3,"ar":"الإِعْرَابُ","tr":"al-i‘rābu","fr":"analyse de la flexion grammaticale d’un mot selon sa fonction dans la phrase"},{"c":3,"ar":"الجُمْلَةُ الِاسْمِيَّةُ","tr":"al-jumlatu al-ismiyyatu","fr":"phrase nominale construite fondamentalement autour d’un mubtada et d’un khabar"},{"c":3,"ar":"المُبْتَدَأُ","tr":"al-mubtada’u","fr":"élément au raf‘ à propos duquel une information est donnée"},{"c":3,"ar":"الخَبَرُ","tr":"al-khabaru","fr":"élément au raf‘ qui fournit l’information concernant le mubtada"},{"c":3,"ar":"مَرْفُوعٌ","tr":"marfū‘un","fr":"placé au cas grammatical du raf‘"},{"c":3,"ar":"الضَّمَّةُ","tr":"aḍ-ḍammatu","fr":"marque du raf‘ rencontrée dans de nombreux exemples de ce cours"},{"c":3,"ar":"مُقَدَّمٌ","tr":"muqaddamun","fr":"élément antéposé, placé avant sa position habituelle"},{"c":3,"ar":"مُؤَخَّرٌ","tr":"mu’akhkharun","fr":"élément postposé, placé après sa position habituelle"},{"c":3,"ar":"مُفْرَدٌ","tr":"mufradun","fr":"dans ce chapitre, khabar qui n’est ni une phrase ni un shibhu jumla"},{"c":3,"ar":"الجُمْلَةُ الفِعْلِيَّةُ","tr":"al-jumlatu al-fi‘liyyatu","fr":"phrase verbale pouvant elle-même remplir la fonction de khabar"},{"c":3,"ar":"شِبْهُ جُمْلَةٍ","tr":"shibhu jumlatin","fr":"construction ressemblant à une phrase, notamment un circonstanciel ou une construction prépositionnelle"},{"c":3,"ar":"الجَارُّ وَالمَجْرُورُ","tr":"al-jārru wa-l-majrūru","fr":"construction composée d’une préposition et du nom qu’elle place au cas indirect"},{"c":4,"ar":"عَدَدٌ","tr":"‘adadun","fr":"nombre ; le cours étudie principalement les règles des nombres de 3 à 10\\"},{"c":4,"ar":"مَعْدُودٌ","tr":"ma‘dūdun","fr":"élément compté ; son genre détermine la forme du nombre employé"},{"c":4,"ar":"المُبْتَدَأُ","tr":"al-mubtada’u","fr":"élément de la phrase nominale à propos duquel une information est donnée"},{"c":4,"ar":"الخَبَرُ","tr":"al-khabaru","fr":"élément apportant l’information concernant le mubtada"},{"c":4,"ar":"شِبْهُ جُمْلَةٍ","t ْعِلَّةِ","tr":"ḥadhfu ḥarfi al-‘illati","fr":"suppression de la lettre faible dans certaines formes du verbe défectueux"},{"c":19,"ar":"حَذْفُ النُّونِ","tr":"ḥadhfu an-nūni","fr":"suppression du nūn dans certaines formes des cinq verbes"},{"c":19,"ar":"اِلْتِقَاءُ السَّاكِنَيْنِ","tr":"iltiqā’u as-sākinayni","fr":"rencontre de deux éléments portant un sukūn, phénomène évité dans les exemples étudiés"},{"c":19,"ar":"شَكْوَى","tr":"shakwā","fr":"plainte, terme rencontré dans le dialogue familial"}],"mind":[{"c":1,"t":"Deux natures de phrase","items":["Phrase nominale : commence par un élément nominal","Phrase verbale : commence par un verbe","Nominale : nom explicite / maṣdar mu’awwal / particule ressemblant au verbe","Pronom & démonstratif = noms → peuvent ouvrir une nominale","Nominale simple = mubtada + khabar","Verbale : verbe complet (tāmm) ou incomplet (nāqiṣ)","Verbe + sujet pluriel explicite → verbe au singulier","Au présent, pas d’équivalent obligatoire de « être »"]},{"c":2,"t":"Mubtada & Khabar","items":["Mubtada = ce dont on parle ; khabar = l’information","Les deux sont marfū‘ (raf‘)","Règle de base : mubtada défini","Mubtada indéfini possible (khabar antéposé, interrogatif…)","Ordre : mubtada avant khabar (inversion possible/obligatoire)","Suppression possible : mubtada, khabar ou les deux","Khabar : mufrad / phrase / shibhu jumla","Accord en genre ET en nombre"]},{"c":3,"t":"L’i‘rāb de la nominale","items":["I‘rāb = fonction grammaticale + flexion","Mubtada & khabar : marfū‘ (souvent ḍamma apparente)","La terminaison varie selon la fonction","Khabar : mufrad / phrase nominale / phrase verbale / shibhu jumla","Shibhu jumla = circonstanciel ou jār + majrūr","Verbe → chercher son sujet ; mubtada → chercher son khabar","Phrase entière en khabar : analyser l’interne puis l’ensemble"]},{"c":4,"t":"Nombres 3 à 10","items":["Nombre & nom compté = genres OPPOSÉS","Nom masculin → nombre au féminin","Nom féminin → nombre au masculin","Nom compté : pluriel + majrūr (kasra)","Se fier au genre du mot ARABE, pas au français","Connaître le pluriel du nom est indispensable","« Kam ? » (combien) : nom au singulier + naṣb","Plusieurs couleurs = mamnū‘ min aṣ-ṣarf (pas de tanwīn)"]},{"c":5,"t":"Nom relatif (mawṣūl)","items":["Nom relatif = sens complété par une proposition (ṣila)","Forme selon genre & nombre de l’antécédent","Sing. : alladhī (m.) / allatī (f.)","Pluriel : alladhīna (m.) / allātī (f.)","Duel : formes différentes au raf‘ vs naṣb/jarr","Man = doués de raison ; mā = non doués de raison","‘Ā’id = pronom de rappel (exprimé ou sous-entendu)","Les relatifs sont des noms définis"]},{"c":6,"t":"Inaccompli au naṣb & na‘t","items":["Mu‘rab = terminaison variable ; mabnī = invariable","Muḍāri‘ : présent ou futur selon le contexte","État de base : raf‘ avec ḍamma","Particules de naṣb → fatḥa (verbes ordinaires)","« Lan » = négation du futur + naṣb","Cinq verbes : naṣb ET jazm = suppression du nūn","Na‘t (épithète) suit le nom : cas, genre, nombre, détermination"]},{"c":7,"t":"Défini & indéfini","items":["Défini = déterminé ; indéfini (nakira) = non déterminé","Concerne les noms, pas les verbes","Sept catégories de définis","Définis : pronoms, noms propres, démonstratifs, relatifs…","L’article « al- » rend défini","Annexé à un défini → devient défini","Annexé à un indéfini → reste indéfini (mais précisé)","L’épithète suit le nom dans sa détermination"]},{"c":8,"t":"Kāna et ses sœurs","items":["Kāna & sœurs entrent sur la phrase nominale","Ancien mubtada → ism kāna (nominatif)","Ancien khabar → khabar kāna (accusatif si fléchi)","Kāna = état passé","Ṣāra = devenir / transformation","Laysa = négation ; mā zāla = continuité","Bāta / aṣbaḥa… = état selon le moment","Attribut : mot isolé, phrase verbale ou groupe prépositionnel"]},{"c":9,"t":"Flexion & invariabilité","items":["I‘rāb = terminaison change ; binā’ = terminaison stable","Majorité des noms = variables","Cas des noms : raf‘, naṣb, jarr","Jarr propre aux noms ; jazm propre aux verbes","Marques originelles : ḍamma, fatḥa, kasra (+ sukūn)","Marques secondaires possibles (cinq noms, duel…)","Invariables : pronoms, démonstratifs (sauf duel), interrogatifs…","Une erreur de flexion → contresens"]},{"c":10,"t":"Le jussif (jazm)","items":["Jazm propre au verbe muḍāri‘","Māḍī & impératif = invariables","« Lam » = négation du passé + jussif","« Lammā » = pas encore (peut se produire)","Outils conditionnels : in, man, mā, aynamā, ḥaythumā, matā","Verbe coordonné / jawāb al-ṭalab peuvent être au jussif","Marques : sukūn / suppression lettre faible / suppression nūn"]},{"c":11,"t":"Pronoms & accord pluriel","items":["Pronoms = noms définis","Isolés (munfaṣil) vs attachés (muttaṣil)","Suffixe possessif placé APRÈS le nom","Le pronom attaché s’accorde : personne, genre, nombre","Antum = « vous » masc. plur. ; antunna = fém. plur.","Passage singulier→pluriel : adapter toute la phrase","Pluriel non humain repris par hādhihi (fém. sing.)"]},{"c":12,"t":"Le duel (muthannā)","items":["Duel formé à partir d’un singulier","Nominatif → alif","Accusatif → yā’","Génitif → yā’ (même marque que l’accusatif)","Véritable duel : à partir d’un singulier de même forme","Mulḥaq bil-muthannā : suit la flexion sans être un vrai duel","Kilā / kiltā (annexés à un pronom duel) = rattachés","Déterminer la fonction avant de choisir alif ou yā’"]},{"c":13,"t":"Transitif & intransitif","items":["Texte : la poste et l’envoi d’un télégramme","Liaisons : wa / fa / thumma (nuances)","Thumma = succession avec intervalle","Transitif (muta‘addī) : prend un maf‘ūl bihi direct","Ex. transitifs : écrire, acheter, lire","Intransitif (lāzim) : pas de COD direct","Ex. intransitifs : aller, voyager, arriver, se réveiller","Prépositions relient les intransitifs à leur complément"]},{"c":14,"t":"Coran & prépositions","items":["Trois catégories de mots : nom, verbe, particule (ḥarf)","Prépositions = particules ; entrent sur les NOMS","Nom après préposition = majrūr (cas indirect)","Prépositions : min, ilā, ‘an, ‘alā, fī, bi, ka, li","Marque originelle du jarr = kasra (marques secondaires possibles)","Duel au jarr → yā’","Révélation du Coran sur 23 ans","Abū Bakr charge Zayd ibn Thābit du rassemblement"]},{"c":15,"t":"La Mecque & le genre","items":["La Mecque : ville ancienne (époque d’Ibrāhīm)","Ṭawāf autour de la Kaaba ; Ṣafā↔Marwa = 7 trajets","Stations : ‘Arafāt → Muzdalifa → Minā","9ᵉ jour à ‘Arafāt jusqu’au coucher du soleil","Tout nom est masculin ou féminin","Masculin : pas de marque spécifique en général","Féminin : tā’ marbūṭa / alif maqṣūra / alif mamdūda","Féminin réel (ḥaqīqī) vs grammatical (majāzī)"]},{"c":16,"t":"Verbe sain & verbe faible","items":["Naḥw = syntaxe ; ṣarf = morphologie","Lettres faibles : alif, wāw, yā’","Sain (ṣaḥīḥ) : pas de lettre faible radicale","Sain = sālim / mahmūz / muḍa‘‘af","La hamza n’est PAS une lettre faible ici","Faible (mu‘tall) : au moins une lettre faible","Mithāl (1ʳᵉ) / ajwaf (2ᵉ) / nāqiṣ (3ᵉ)","Lafīf : deux lettres faibles (maqrūn / mafrūq)"]},{"c":17,"t":"Les cinq noms","items":["Mabnī = invariable ; mu‘rab = variable","Les cinq noms : ab, akh, ḥam, fū, dhū (parfois +han)","Nominatif → wāw","Accusatif → alif","Génitif → yā’","Conditions : en annexion (iḍāfa) et au singulier","Diminutif → autre flexion","Annexé au yā’ du locuteur → autre analyse"]},{"c":18,"t":"Verbe creux (ajwaf)","items":["Texte : médecin, hôpital, traitement, pharmacie","La guérison vient d’Allah","Ajwaf : lettre faible au MILIEU de la racine","Lam + jussif → lettre faible disparaît (yaqum, yazur)","Impératif : qum, zur (lettre faible supprimée)","Conjugaison change selon la personne : nāma → nimtu","Travailler passé, présent, impératif, toutes personnes","Modèles + exercices indispensables"]},{"c":19,"t":"Verbe défectueux final (nāqiṣ)","items":["Cours 19 = dernière leçon du niveau 3","Nāqiṣ : lettre faible à la FIN (alif, wāw ou yā’)","Alif final disparaît devant le tā’ du féminin (passé)","Lettre d’origine réapparaît (yā’ ou wāw) à certaines personnes","Jussif : lettre faible finale supprimée","« Lā » d’interdiction impose le jussif","Impératif : lettre faible également supprimée","Parallèle avec la suppression du nūn des cinq verbes"]}]}};

    const quiz = (A.quiz || []).concat((D.quiz || []).map(q => Object.assign({id: id + '-x' + q.c + '-' + h(q.q)}, q)));
    quiz.forEach(q => { if (!q.t) q.t = (q.o.length === 2 && /^vrai/i.test(q.o[0])) ? 'vf' : 'qcm'; if (!Array.isArray(q.a)) q.a = [q.a]; });

    });
    const mind = D.mind || A.mind || [];

  });
})();

function vocabRows(list){

function filteredVocab(sem, q, c){
  const nq = norm(q);
  return SEMS.find(s => s.id === sem).vocab.filter(v => (!c || lessonKey(v.sem, v.c) === c) && (!nq || norm(v.fr).includes(nq) || norm(v.ar).includes(nq) || norm(v.tr).includes(nq)));
}
function bindVocabList(){
  const L = $('#vlist'); if (!L) return; const sem = L.dataset.sem;
  const upd = () => { L.innerHTML = vocabRows(filteredVocab(sem, $('#vq').value, $('#vc').value)); };
  $('#vq').addEventListener('input', upd); $('#vc').addEventListener('change', upd); upd();
}
function semMind(sm){

function mindCard(sm, m, noLink){

/* ---------------- QUIZ ---------------- */
function isVF(q){ return q.t === 'vf' || (q.o.length === 2 && /^vrai/i.test(q.o[0]) && /^faux/i.test(q.o[1])); }
function prepQ(q){
  const idx = q.o.map((_,i) => i);
  const order = isVF(q) || q.keep ? idx : shuffle(idx);
  return {q, order};
}
function qCardHTML(q, i, inline){
  const vf = isVF(q);
  const order = vf || q.keep ? q.o.map((_,k)=>k) : shuffle(q.o.map((_,k)=>k));
  const allAr = q.o.every(o => AR_RE.test(o) && !/[a-zA-Zàéèç]{3,}/.test(o));
  return `<div class="qcard" data-qid="${q.id}" data-inline="${inline?1:0}" data-order="${order.join(',')}">
    <div class="qhead"><span class="badge">Cours ${q.c}</span>${q.d ? `<span class="badge ${q.d}">${({f:'facile',m:'moyen',d:'difficile'})[q.d]||''}</span>` : ''}${vf ? '<span class="badge">vrai / faux</span>' : ''}${q.a.length>1 ? '<span class="badge">plusieurs réponses</span>' : ''}</div>
    ${arRatio(q.q) > .6 ? `<div class="qtext rtl">${esc(q.q)}</div>` : `<div class="qtext">${fmtQ(q.q)}</div>`}
    <div class="opts ${vf?'vfrow':''}">${order.map((oi,k) => `<button class="opt ${allAr?'arabic':''}" data-act="ans" data-oi="${oi}"><span class="k">${vf ? (oi===0?'V':'F') : 'ABCDEF'[k]}</span><span class="tx">${fmtQ(q.o[oi])}</span></button>`).join('')}</div>
    ${q.a.length>1 ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-act="validate">Valider ma sélection</button></div>` : ''}
    <div class="feedback"></div>
  </div>`;
}
function arRatio(s){ s = String(s).replace(/<[^>]+>/g,''); const ar = (s.match(/[\u0621-\u064A]/g)||[]).length, la = (s.match(/[A-Za-zÀ-ÿ]/g)||[]).length; return ar+la ? ar/(ar+la) : 0; }
function fmtQ(s){
  // isole les segments arabes pour un bon rendu bidi
  s = String(s);
  if (/<span/.test(s)) return s;
  return esc(s).replace(/([؀-ۿ][؀-ۿً-ٰٟ\s،؟ـ]*[؀-ۿً-ٰٟـ]|[؀-ۿ])/g, '<span class="ar">$1</span>');
}
function recordAnswer(q, ok){
  const r = S.q[q.id] || (S.q[q.id] = {ok:0, ko:0});
  if (ok){ r.ok++; delete S.errs[q.id]; } else { r.ko++; S.errs[q.id] = 1; }
  markDay(); save();
}
function revealCard(card, picked){
  const q = QBY[card.dataset.qid];
  const ok = picked.length === q.a.length && picked.every(x => q.a.includes(x));
  $$('.opt', card).forEach(b => {
    const oi = +b.dataset.oi; b.disabled = true;
    if (q.a.includes(oi)) b.classList.add('good');
    else if (picked.includes(oi)) b.classList.add('bad');
  });
  const vb = $('[data-act="validate"]', card); if (vb) vb.remove();
  const fb = $('.feedback', card);
  const l = LESSONS[lessonKey(q.sem, q.c)];
  const good = q.a.map(i => fmtQ(q.o[i])).join(' · ');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'ko');
  fb.innerHTML = `<b class="v">${ok ? pick(['Exact !','Bien vu !','Parfait.','Bonne réponse.','Très bien !']) : pick(['Pas tout à fait.','Raté — on retient !','Presque…','Erreur notée, elle reviendra.'])}</b>
    ${ok ? '' : `<div>Bonne réponse : <b>${good}</b></div>`}${q.j ? `<div style="margin-top:4px">${fmtQ(q.j)}</div>` : ''}
    ${card.dataset.inline !== '1' && l ? `<div style="margin-top:6px"><a href="#/l/${l.id}" data-act="leavequiz">Revoir le cours ${q.c}</a></div>` : ''}`;
  recordAnswer(q, ok);
  return ok;
}
const pick = a => a[Math.floor(Math.random()*a.length)];

function startQuiz(title, qs, mode, back, lessonId){
  if (!qs.length){ toast('Aucune question disponible ici'); return; }
  QS = {title, qs, mode, back, lessonId, i:0, res:[], start:Date.now(), limit: mode==='exam' ? 3600 : 0, per: mode==='speed' ? 30 : 0, answered:false};
  go('#/quiz');
}
function viewQuiz(){
  const s = QS; if (s.i >= s.qs.length) return viewQuizEnd();
  const q = s.qs[s.i];
  const sm = semOf(q.sem);
  return `${topbar({title:s.title, sub:`Question ${s.i+1} / ${s.qs.length}`, back:s.back, acc:'acc-'+sm.id, prog: Math.round(100*s.i/s.qs.length),
    right:`<span class="chip acc timer" id="qtimer">${s.limit ? fmtTime(s.limit) : (s.per ? s.per+' s' : '✓ '+s.res.filter(r=>r.ok).length)}</span>`})}
  <div class="wrap screen acc-${sm.id}">
    ${qCardHTML(q, s.i, false)}
    ${s.per ? `<div class="speedbar"><i id="sbar" style="width:100%"></i></div>` : ''}
    <div class="qfoot"><span class="qmeta">${s.mode==='exam' ? 'Mode examen · correction détaillée à la fin' : `Score : <b>${s.res.filter(r=>r.ok).length}</b> / ${s.res.length}`}</span>
      <div class="row"><button class="btn sm ghost" data-act="qquit">Terminer</button><button class="btn acc" id="qnext" data-act="qnext" ${s.answered?'':'disabled'}>Suivante ${I.next}</button></div></div>
  </div>`;
}
function fmtTime(sec){ sec = Math.max(0, sec|0); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function startQuizTimers(){
  const s = QS; if (!s || s.i >= s.qs.length) return;
  s.answered = false;
  if (s.limit){
    timers.push(setInterval(() => { const left = s.limit - (Date.now()-s.start)/1000; const t = $('#qtimer'); if (t){ t.textContent = fmtTime(left); t.classList.toggle('warn', left < 300); } if (left <= 0){ s.i = s.qs.length; render(); } }, 1000));
  }
  if (s.per){
    const t0 = Date.now();
    timers.push(setInterval(() => { if (s.answered) return; const left = s.per - (Date.now()-t0)/1000; const t = $('#qtimer'), b = $('#sbar');
      if (t){ t.textContent = Math.ceil(Math.max(0,left)) + ' s'; t.classList.toggle('warn', left < 8); } if (b) b.style.width = Math.max(0, 100*left/s.per) + '%';
      if (left <= 0){ const card = $('.qcard'); if (card && !s.answered){ s.answered = true; const q = s.qs[s.i]; revealCard(card, []); s.res.push({q, ok:false, picked:[], timeout:true}); const n = $('#qnext'); if (n) n.disabled = false; } } }, 250));
  }
}
function viewQuizEnd(){
  const s = QS; clearTimers();
  const ok = s.res.filter(r => r.ok).length, n = s.res.length || 1, pct = Math.round(100*ok/n);
  if (s.lessonId){ S.best[s.lessonId] = Math.max(S.best[s.lessonId]||0, pct); save(); }
  const wrong = s.res.filter(r => !r.ok);
  const C = 2*Math.PI*64;
  const msg = pct >= 90 ? 'Excellent, mā shā’ Allāh !' : pct >= 70 ? 'Très bon travail' : pct >= 50 ? 'Bien, continue !' : 'On recommence, ça va venir';
  const sm = semOf(s.qs[0].sem);
  return `${topbar({title:'Résultats', sub:s.title, back:s.back, acc:'acc-'+sm.id})}
  <div class="wrap screen acc-${sm.id}">
    <div class="result"><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="64" stroke="var(--line)" stroke-width="12" fill="none"/>
      <circle cx="75" cy="75" r="64" stroke="var(--acc-deep)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <div class="v"><b>${pct}%</b><small>${ok} / ${s.res.length}</small></div></div>
      <h2>${msg}</h2><p class="muted">Temps : ${fmtTime((Date.now()-s.start)/1000)}${s.res.length < s.qs.length ? ` · ${s.qs.length - s.res.length} question(s) non traitée(s)` : ''}</p>
      <div class="row" style="justify-content:center;margin-top:8px">
        ${wrong.length ? `<button class="btn acc" data-act="qretry">${I.redo} Refaire mes ${wrong.length} erreur${wrong.length>1?'s':''}</button>` : ''}
        <button class="btn" data-go="${s.back}">Retour</button></div></div>
    ${wrong.length ? `<div class="section-label">À retenir (${wrong.length})</div><div class="revlist">${wrong.map(r => `<div class="revitem">${arRatio(r.q.q) > .6 ? `<div class="q rtl">${esc(r.q.q)}</div>` : `<div class="q">${fmtQ(r.q.q)}</div>`}
      <div class="ans">✓ ${r.q.a.map(i => fmtQ(r.q.o[i])).join(' · ')}</div>${r.picked.length ? `<div class="yours">✗ Ta réponse : ${r.picked.map(i => fmtQ(r.q.o[i])).join(' · ')}</div>` : (r.timeout?'<div class="yours">⏱ Temps écoulé</div>':'')}
      ${r.q.j ? `<div class="j">${fmtQ(r.q.j)}</div>` : ''}</div>`).join('')}</div>` : ''}
  </div>`;
}

/* ---------------- FLASHCARDS (Leitner) ---------------- */
function buildDeck(pool, max){
  const d = today();
  const due = shuffle(pool.filter(v => S.srs[v.id] && S.srs[v.id].due <= d));
  const fresh = pool.filter(v => !S.srs[v.id]);
  const out = due.slice(0, max);
  if (out.length < max) out.push(...fresh.slice(0, Math.min(max - out.length, Math.max(10, max - out.length))));
  return out.slice(0, max);
}
function startCards(title, cards, back){

  FC = {title, cards, i:0, flip:false, back, n:{0:0,1:0,2:0}, total:cards.length, again:{}};

/* --- conjugueur --- */
const F = 'َ', D = 'ُ', K = 'ِ', SK = 'ْ', SH = 'ّ';
const V = {a:F, u:D, i:K};
const PRON = [['هُوَ','il'],['هِيَ','elle'],['هُمَا','eux deux (m.)'],['هُمَا','elles deux'],['هُمْ','ils'],['هُنَّ','elles'],['أَنْتَ','tu (m.)'],['أَنْتِ','tu (f.)'],['أَنْتُمَا','vous deux'],['أَنْتُمْ','vous (m.)'],['أَنْتُنَّ','vous (f.)'],['أَنَا','je'],['نَحْنُ','nous']];
const sp = (c, s) => `<span class="${c}">${s}</span>`;
function conj(vb, tense){
  const [f, e, l] = vb.r; const pv = V[vb.pv], mv = V[vb.mv];
  if (tense === 'madi'){

    const suf = [[l+F,''],[l+F,'تْ'],[l+F,'ا'],[l+F,'تَا'],[l+D,'وا'],[l+SK,'نَ'],[l+SK,'تَ'],[l+SK,'تِ'],[l+SK,'تُمَا'],[l+SK,'تُمْ'],[l+SK,'تُنَّ'],[l+SK,'تُ'],[l+SK,'نَا']];
    return suf.map(s => st + s[0] + (s[1] ? sp('suf', s[1]) : ''));
  }
  if (tense === 'amr'){
    const h = vb.mv === 'u' ? 'اُ' : 'اِ'; const st = sp('hw', h) + f + SK + e + mv;
    const r = [null,null,null,null,null,null, st+l+SK, st+l+K+sp('suf','ي'), st+l+F+sp('suf','ا'), st+l+D+sp('suf','وا'), st+l+SK+sp('suf','نَ'), null, null];
    return r;
  }
  const pre = ['يَ','تَ','يَ','تَ','يَ','يَ','تَ','تَ','تَ','تَ','تَ','أَ','نَ'];
  const stem = i => sp('pre', pre[i]) + f + SK + e + mv + l;
  const end = {
    raf:[D,D,[F,'انِ'],[F,'انِ'],[D,'ونَ'],[SK,'نَ'],D,[K,'ينَ'],[F,'انِ'],[D,'ونَ'],[SK,'نَ'],D,D],
    nasb:[F,F,[F,'ا'],[F,'ا'],[D,'وا'],[SK,'نَ'],F,[K,'ي'],[F,'ا'],[D,'وا'],[SK,'نَ'],F,F],
    jazm:[SK,SK,[F,'ا'],[F,'ا'],[D,'وا'],[SK,'نَ'],SK,[K,'ي'],[F,'ا'],[D,'وا'],[SK,'نَ'],SK,SK]
  }[tense];
  return end.map((x,i) => Array.isArray(x) ? stem(i) + x[0] + sp('suf', x[1]) : stem(i) + x);
}

    qs.push({id:'cj-'+k, sem:'s2', c:t==='madi'?4:t==='amr'?8:t==='raf'?7:15, t:'qcm', keep:true, q:`Conjugue <span class="ar">${vb.p}</span> (${vb.fr}) — <b>${TN[t][1]}</b>${part} — avec <span class="ar">${PRON[i][0]}</span> (${PRON[i][1]})`, o, a:[o.indexOf(forms[i])], j:`${TN[t][2]}`});
  }
  qs.forEach(q => { QBY[q.id] = q; });
  startQuiz('Conjugue !', qs, 'tool', '#/outils/conjugueur');
}
/* --- nombres --- */
function toolNum(){
  const N = TOOLS.numbers || []; const O = TOOLS.ordinals || [];
  return `<div class="card" style="margin-top:16px"><h3 class="sub" style="margin-top:0">Lire les nombres <span class="ar">الأَعْدَاد</span></h3>
    <div class="numgrid">${N.map(n => `<div data-act="say" data-t="${esc(n[1])}"><span class="d">${n[2]}</span><span><span class="w">${n[1]}</span><small>${n[0]} · ${n[3]||''}</small></span></div>`).join('')}</div>
    <h3 class="sub">Les ordinaux <span class="ar">العَدَدُ التَّرْتِيبِيُّ</span></h3>
    <p class="muted" style="font-size:.88rem">De 2 à 10, un seul schème : <span class="arword">فَاعِل</span>. L'ordinal est un <b>adjectif</b> (نَعْت) : il suit le nom et s'accorde avec lui (genre, cas, défini).</p>
    <div class="numgrid">${O.map(n => `<div data-act="say" data-t="${esc(n[1])}"><span class="d">${n[0]}</span><span><span class="w">${n[1]}</span><small>fém. <span class="ar">${n[2]}</span></small></span></div>`).join('')}</div></div>
  <div class="section-label">Générateur d'accord</div>
  <div class="card"><p class="muted" style="font-size:.88rem;margin-top:0">Choisis un nombre et un nom : l'outil applique la règle du cours. <b>3 à 10</b> : le nombre prend le <b>genre opposé</b> du nom, et le nom compté est au <b>pluriel majrūr</b>. <b>11 à 19</b> : le nom est au <b>singulier manṣūb</b>.</p>
    <div class="row"><select class="sel" id="nn">${Array.from({length:17},(_,i)=>i+3).map(i => `<option value="${i}">${i}</option>`).join('')}</select>
      <select class="sel grow" id="nw">${(TOOLS.counted||[]).map((w,i) => `<option value="${i}">${w.s} — ${w.fr} (${w.g==='m'?'masc.':'fém.'})</option>`).join('')}</select></div>
    <div class="bigans" id="nres"></div><div id="nexp" class="muted" style="font-size:.88rem"></div></div>
  <div class="modes"><button class="mode wide" data-act="numquiz"><div class="ico">${I.quiz}</div><h3>Quiz d'accord</h3><p>Choisis la bonne forme : ثَلَاثَةُ ou ثَلَاثُ ? طالبًا ou طُلَّابٍ ?</p><span class="meta">12 questions générées</span></button></div>`;
}
const NUM_M = {3:'ثَلَاثَةُ',4:'أَرْبَعَةُ',5:'خَمْسَةُ',6:'سِتَّةُ',7:'سَبْعَةُ',8:'ثَمَانِيَةُ',9:'تِسْعَةُ',10:'عَشَرَةُ'};
const NUM_F = {3:'ثَلَاثُ',4:'أَرْبَعُ',5:'خَمْسُ',6:'سِتُّ',7:'سَبْعُ',8:'ثَمَانِي',9:'تِسْعُ',10:'عَشْرُ'};
const U_M = {3:'ثَلَاثَةَ',4:'أَرْبَعَةَ',5:'خَمْسَةَ',6:'سِتَّةَ',7:'سَبْعَةَ',8:'ثَمَانِيَةَ',9:'تِسْعَةَ'};
const U_F = {3:'ثَلَاثَ',4:'أَرْبَعَ',5:'خَمْسَ',6:'سِتَّ',7:'سَبْعَ',8:'ثَمَانِيَ',9:'تِسْعَ'};
function numPhrase(n, w){
  if (n <= 10){ const num = w.g === 'm' ? NUM_M[n] : NUM_F[n];
    return {html:`<span class="n">${num}</span> <span class="m">${w.pg}</span>`, txt:`${num} ${w.pg}`, exp:`Nom ${w.g==='m'?'masculin':'féminin'} → nombre au ${w.g==='m'?'féminin (avec ة)':'masculin (sans ة)'} ; nom compté au pluriel majrūr (complément du nom).`}; }
  let num;
  if (n === 11) num = w.g==='m' ? 'أَحَدَ عَشَرَ' : 'إِحْدَى عَشْرَةَ';
  else if (n === 12) num = w.g==='m' ? 'اثْنَا عَشَرَ' : 'اثْنَتَا عَشْرَةَ';
  else num = w.g==='m' ? `${U_M[n-10]} عَشَرَ` : `${U_F[n-10]} عَشْرَةَ`;
  const exp = n <= 12 ? 'Pour 11 et 12, les deux parties s\'accordent avec le nom.' : 'De 13 à 19 : l\'unité prend le genre opposé, la dizaine (عَشَر/عَشْرَة) s\'accorde avec le nom.';
  return {html:`<span class="n">${num}</span> <span class="m">${w.sa}</span>`, txt:`${num} ${w.sa}`, exp: exp + ' Nom au singulier manṣūb (tamyīz). Les deux parties sont invariables (fatḥa), sauf اثنا/اثنتا.'};
}
function drawNum(){ const n = +$('#nn').value; const w = TOOLS.counted[+$('#nw').value]; const r = numPhrase(n, w); $('#nres').innerHTML = r.html; $('#nres').dataset.t = r.txt; $('#nexp').innerHTML = r.exp + ` <button class="btn sm" data-act="say" data-t="${esc(r.txt)}">${SAY_ICON} écouter</button>`; }
function numQuiz(){
  const W = TOOLS.counted; const qs = [];
  for (let k = 0; k < 12; k++){
    const w = pick(W); const n = k < 7 ? 3 + Math.floor(Math.random()*8) : 11 + Math.floor(Math.random()*9);
    const good = numPhrase(n, w).txt; const wo = Object.assign({}, w, {g: w.g==='m'?'f':'m'});
    const bad1 = numPhrase(n, wo).txt.replace(wo.pg, w.pg).replace(wo.sa, w.sa);
    const alt = n <= 10 ? `${(w.g==='m'?NUM_M:NUM_F)[n]} ${w.sa}` : numPhrase(n, w).txt.replace(w.sa, w.pg);
    const alt2 = n <= 10 ? `${(w.g==='m'?NUM_F:NUM_M)[n]} ${w.sa}` : numPhrase(n, wo).txt.replace(wo.sa, w.pg);
    const o = shuffle([...new Set([good, bad1, alt, alt2])]);
    qs.push({id:'nb-'+k, sem:'s2', c:n<=10?3:13, t:'qcm', keep:true, q:`Comment dit-on « ${n} ${w.frp} » ?`, o, a:[o.indexOf(good)], j:numPhrase(n, w).exp});
  }
  qs.forEach(q => { QBY[q.id] = q; });
  startQuiz('Quiz d\'accord des nombres', qs, 'tool', '#/outils/nombres');
}
function bindTool(name){
  if (name === 'conjugueur'){ $('#cv').addEventListener('change', drawConj); $$('#ct button').forEach(b => b.addEventListener('click', () => { $$('#ct button').forEach(x => x.classList.toggle('on', x===b)); drawConj(); })); drawConj(); }
  if (name === 'nombres'){ $('#nn').addEventListener('change', drawNum); $('#nw').addEventListener('change', drawNum); drawNum(); }
}

/* ---------------- réglages ---------------- */
function openSettings(){
  const sh = $('#sheet'); const s = S.set;
  sh.innerHTML = `<h3>Réglages</h3>
    <div class="setrow"><span><b>Thème</b><small>Clair, sombre ou automatique</small></span><div class="seg">${[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(t => `<button data-set="theme" data-v="${t[0]}" class="${s.theme===t[0]?'on':''}">${t[1]}</button>`).join('')}</div></div>
    <div class="setrow"><span><b>Taille de l'arabe</b><small>Pour lire confortablement les voyelles</small></span><div class="seg">${[[1,'A'],[1.18,'A+'],[1.36,'A++']].map(t => `<button data-set="ar" data-v="${t[0]}" class="${+s.ar===t[0]?'on':''}">${t[1]}</button>`).join('')}</div></div>
    <div class="setrow"><span><b>Toucher pour écouter</b><small>Touche un mot arabe dans une leçon pour l'entendre</small></span><button class="switch ${s.tap?'on':''}" data-set="tap"></button></div>
    <div class="setrow"><span><b>Translittération</b><small>Afficher la transcription sur le recto des flashcards</small></span><button class="switch ${s.tr?'on':''}" data-set="tr"></button></div>
    <div class="setrow"><span><b>Sens des flashcards</b><small>Arabe → français ou l'inverse</small></span><div class="seg"><button data-set="dir" data-v="ar" class="${s.dir==='ar'?'on':''}">AR → FR</button><button data-set="dir" data-v="fr" class="${s.dir==='fr'?'on':''}">FR → AR</button></div></div>
    <div class="setrow"><span><b>Tester l'audio</b><small>${arVoice ? 'Voix : '+esc(arVoice.name) : 'Aucune voix arabe détectée pour l\'instant'}</small></span><button class="btn sm" data-act="say" data-t="السَّلَامُ عَلَيْكُمْ">${SAY_ICON} Écouter</button></div>
    <div class="row" style="margin-top:14px"><button class="btn primary grow" data-act="closesheet">Fermer</button></div>`;
  $('#sheetbg').classList.add('show'); sh.classList.add('show');
}
function closeSheet(){ $('#sheetbg').classList.remove('show'); $('#sheet').classList.remove('show'); }

/* ---------------- événements ---------------- */
document.addEventListener('click', e => {
  const hit = e.target.closest('[data-act],[data-go]');
  const actEl = hit && hit.dataset.act ? hit : null;
  const goEl = hit && !actEl ? hit : null;
  if (actEl){
    const a = actEl.dataset.act; const ds = actEl.dataset;
    if (a === 'say'){ e.stopPropagation(); say(ds.t || actEl.textContent); return; }
    if (a === 'ans'){ const card = actEl.closest('.qcard'); const q = QBY[card.dataset.qid];
      if (q.a.length > 1){ actEl.classList.toggle('sel'); return; }
      if (card.dataset.done) return; card.dataset.done = 1; const ok = revealCard(card, [+ds.oi]);
      if (card.dataset.inline !== '1' && QS){ QS.res.push({q, ok, picked:[+ds.oi]}); QS.answered = true; const n = $('#qnext'); if (n){ n.disabled = false; n.focus({preventScroll:true}); } }
      return; }
    if (a === 'validate'){ const card = actEl.closest('.qcard'); const q = QBY[card.dataset.qid]; const picked = $$('.opt.sel', card).map(b => +b.dataset.oi);
      if (!picked.length){ toast('Sélectionne au moins une réponse'); return; } card.dataset.done = 1; const ok = revealCard(card, picked);
      if (card.dataset.inline !== '1' && QS){ QS.res.push({q, ok, picked}); QS.answered = true; const n = $('#qnext'); if (n) n.disabled = false; } return; }
    if (a === 'qnext'){ QS.i++; render(); return; }
    if (a === 'qquit'){ QS.qs = QS.qs.slice(0, QS.res.length); QS.i = QS.qs.length; render(); return; }
    if (a === 'qretry'){ const w = QS.res.filter(r => !r.ok).map(r => r.q); startQuiz(QS.title + ' · erreurs', shuffle(w), 'errs', QS.back, null); return; }
    if (a === 'leavequiz'){ return; }
    if (a === 'qlesson'){ const id = ds.id || $('#selc').value; const l = LESSONS[id]; startQuiz(`Cours ${l.n} — ${l.t}`, lessonQs(l).slice(), 'lesson', '#/l/'+id, id); return; }
    if (a === 'qsem'){ const sm = semOf(ds.sem); let qs = sm.quiz.slice(), t = '';
      if (ds.m === 'full') t = 'QCM complet';
      else if (ds.m === 'exam'){ qs = shuffle(qs).slice(0, 60); t = 'Examen'; }
      else if (ds.m === 'speed'){ qs = shuffle(qs).slice(0, 30); t = 'Speed'; }
      else if (ds.m === 'errs'){ qs = shuffle(qs.filter(q => S.errs[q.id])); t = 'Mes erreurs'; }
      else if (ds.m === 'cat'){ qs = shuffle(qs.filter(q => q.cat === ds.cat)); t = (sm.cats.find(c => c[0]===ds.cat)||[])[1]; }
      startQuiz(`S${sm.n} · ${t}`, qs, ds.m === 'cat' ? 'full' : ds.m, location.hash || '#/'); return; }
    if (a === 'fc'){ const sm = semOf(ds.sem); startCards(`Flashcards S${sm.n}`, buildDeck(sm.vocab, 20), location.hash || '#/'); return; }
    if (a === 'fclesson'){ const l = LESSONS[ds.id]; startCards(`Cours ${l.n} · vocabulaire`, shuffle(lessonVocab(l)), '#/l/'+ds.id); return; }
    if (a === 'fcfilter'){ const list = filteredVocab(ds.sem, $('#vq').value, $('#vc').value); startCards('Flashcards · sélection', shuffle(list).slice(0, 40), location.hash); return; }
    if (a === 'flip'){ if (e.target.closest('.saybtn')) return; FC.flip = !FC.flip; $('#fc').classList.toggle('flip', FC.flip); $('#grades').classList.toggle('hidden', !FC.flip); const hn = $('#fchint'); if (hn) hn.textContent = FC.flip ? 'Sois honnête : c\'est ce qui rend la révision efficace.' : 'Essaie de répondre de tête, puis retourne la carte.'; return; }
    if (a === 'grade'){ grade(+ds.g); return; }
    if (a === 'fcdir'){ S.set.dir = S.set.dir === 'ar' ? 'fr' : 'ar'; save(); FC.flip = false; render(); toast(S.set.dir === 'ar' ? 'Recto : arabe' : 'Recto : français'); return; }
    if (a === 'revcards'){ const pool = Object.values(VBY); const due = shuffle(pool.filter(v => S.srs[v.id] && S.srs[v.id].due <= today())).slice(0, 40);
      const lastSem = S.last && LESSONS[S.last] ? LESSONS[S.last].sem : 's1'; const fresh = semOf(lastSem).vocab.filter(v => !S.srs[v.id]).slice(0, due.length >= 30 ? 0 : 10);
      startCards('Révision du jour', due.concat(fresh), '#/revision'); return; }
    if (a === 'reverrs'){ startQuiz('Mes erreurs', shuffle(Object.keys(S.errs).map(id => QBY[id]).filter(Boolean)).slice(0, 40), 'errs', '#/revision'); return; }
    if (a === 'revmix'){ const seen = Object.keys(S.seen); let pool = Object.values(QBY).filter(q => seen.includes(lessonKey(q.sem, q.c)) && !/^(abc|sun|cj|nb)-/.test(q.id)); if (pool.length < 10) pool = SEMS[0].quiz; startQuiz('Quiz express', shuffle(pool).slice(0, 10), 'mix', '#/revision'); return; }
    if (a === 'done'){ if (S.done[ds.id]) delete S.done[ds.id]; else { S.done[ds.id] = Date.now(); toast('Leçon acquise ✓'); } markDay(); save(); render(); return; }
    if (a === 'letter'){ $$('.abc button').forEach(b => b.classList.toggle('on', b === actEl)); $('#ldetail').innerHTML = letterDetail(+ds.i); say(TOOLS.letters[+ds.i].n); return; }
    if (a === 'abcquiz'){ abcQuiz(ds.k); return; }
    if (a === 'conjquiz'){ conjQuiz(); return; }
    if (a === 'numquiz'){ numQuiz(); return; }
    if (a === 'settings'){ openSettings(); return; }
    if (a === 'noinstall'){ S.set.noInstall = true; save(); render(); return; }
    if (a === 'closesheet'){ closeSheet(); return; }
    if (a === 'export'){ const txt = JSON.stringify(S), name = 'arabe-kiu-progression.json';
      const dl = () => { const blob = new Blob([txt], {type:'application/json'}); const u = URL.createObjectURL(blob); const ae = document.createElement('a'); ae.href = u; ae.download = name; document.body.appendChild(ae); ae.click(); ae.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); };
      try { const f = new File([txt], name, {type:'application/json'}); if (navigator.canShare && navigator.canShare({files:[f]})) { navigator.share({files:[f], title:'Progression Arabe KIU'}).catch(err => { if (err && err.name !== 'AbortError') dl(); }); return; } } catch(err){}
      dl(); return; }
    if (a === 'reset'){ if (confirm('Effacer toute ta progression (leçons, quiz, flashcards) ?')){ const set = S.set; S = DEF(); S.set = set; save(); render(); toast('Progression réinitialisée'); } return; }
  }
  if (goEl){ e.preventDefault(); go(goEl.dataset.go); return; }
  const setEl = e.target.closest('[data-set]');
  if (setEl){ const k = setEl.dataset.set; if (k === 'tap' || k === 'tr') S.set[k] = !S.set[k]; else S.set[k] = k === 'ar' ? +setEl.dataset.v : setEl.dataset.v; save(); applySettings(); openSettings(); if (location.hash.startsWith('#/cards')) render(); return; }
  if (e.target.id === 'sheetbg'){ closeSheet(); return; }
  // toucher pour écouter dans les leçons
  if (S.set.tap){
    const zone = e.target.closest('#lbody, .inlineq, .mm, .numgrid, .conj');
    if (zone && !e.target.closest('button, a, input, select')){
      const el = e.target.closest('.ar, .arword, .ac, .a, .pill, .bd-phrase, .w, .top, .ex, .h, .e, .phrase, .row, .arb, .g, .leaf, .root, td');
      if (el && AR_RE.test(el.textContent)){ say(el.textContent); }
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'impfile'){ const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); S = Object.assign(DEF(), o); S.set = Object.assign(DEF().set, o.set||{}); save(); applySettings(); render(); toast('Progression importée ✓'); } catch(err){ toast('Fichier invalide'); } };
    rd.readAsText(f); }
});
document.addEventListener('keydown', e => {
  if (!location.hash.startsWith('#/quiz') && !location.hash.startsWith('#/cards')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (location.hash.startsWith('#/cards') && FC){ if (e.key === ' '){ e.preventDefault(); $('#fc') && $('#fc').click(); } if (FC.flip && ['1','2','3'].includes(e.key)) grade(+e.key - 1); return; }
  const card = $('.qcard'); if (!card) return;
  if (/^[1-6]$/.test(e.key)){ const b = $$('.opt', card)[+e.key-1]; if (b && !b.disabled) b.click(); }
  if (e.key === 'Enter'){ const n = $('#qnext'); if (n && !n.disabled) n.click(); }
});

render();
})();
