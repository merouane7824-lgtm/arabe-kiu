/td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">ستُّ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">7</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">سبعةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">سبعُ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">8</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">ثمانيةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">ثمانِ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">9</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">تسعةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">تسعُ بناتٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Nombre\">10</td><td class=\"ac\" data-label=\"+ معدود مذكّر\">عشرةُ أولادٍ</td><td class=\"ac\" data-label=\"+ معدود مؤنّث\">عشرُ بناتٍ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"recap gold\">\n        <div class=\"rt\">Récapitulatif du cours 4</div>\n        <div class=\"schema cols-2\" style=\"margin-top:8px\">\n          <div class=\"scard\" style=\"border-color:var(--gold)\"><div class=\"top\">العدد</div><div class=\"fr-s\">genre inversé · مضاف · variable</div></div>\n          <div class=\"scard\" style=\"border-color:var(--sage)\"><div class=\"top\">المعدود</div><div class=\"fr-s\">pluriel · indéfini · مجرور (مضاف إليه)</div></div>\n        </div>\n      </div>\n\n      <h3 class=\"sub\">Le nom interrogatif كَم <span class=\"ar\">اسم استفهام</span></h3>\n      <p><span class=\"arword\">كَم</span> interroge sur <b>le nombre</b> (عن العدد). Son تمييز est au singulier منصوب : <span class=\"arword\">كَمْ طالبًا في الفصلِ؟</span></p>"},{"id":"s3-5","n":5,"t":"Le pronom relatif","ar":"الاسم الموصول","html":"<div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Définition</span>Le nom relatif est un nom <b>dont le sens n'est complet</b> qu'avec une phrase qui le suit, appelée <em class=\"term\">صلة الموصول</em>.</div>\n        <div class=\"arb\"><span class=\"tag\">التعريف</span>الاسمُ الموصولُ اسمٌ لا يَتِمُّ معناه إلّا بجملةٍ تأتي بعدَه تُسمّى صِلةَ الموصول.</div>\n      </div>\n\n      <div class=\"tbl-wrap\"><table class=\"grid th-coral\">\n        <thead><tr><th class=\"ac\">Relatif</th><th>Emploi</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Relatif\">الّذي</td><td data-label=\"Emploi\">masculin singulier</td><td class=\"ac\" data-label=\"Exemple\">الّذي ساعدني</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">الّتي</td><td data-label=\"Emploi\">féminin singulier</td><td class=\"ac\" data-label=\"Exemple\">الّتي كتبت الروايةَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">اللّذانِ / اللّذَينِ</td><td data-label=\"Emploi\">duel masculin (رفع / نصب/جرّ)</td><td class=\"ac\" data-label=\"Exemple\">اللّذانِ حضرا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">اللّتانِ / اللّتَينِ</td><td data-label=\"Emploi\">duel féminin (رفع / نصب/جرّ)</td><td class=\"ac\" data-label=\"Exemple\">اللّتانِ خرجتا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">الّذين</td><td data-label=\"Emploi\">pluriel masculin raisonnable</td><td class=\"ac\" data-label=\"Exemple\">الّذين يجتهدون</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">اللّاتي / اللّائي</td><td data-label=\"Emploi\">pluriel féminin</td><td class=\"ac\" data-label=\"Exemple\">اللّاتي يتعلّمن</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">مَن</td><td data-label=\"Emploi\">le raisonnable (sing/duel/pluriel)</td><td class=\"ac\" data-label=\"Exemple\">شكرتُ مَن علّمني</td></tr>\n          <tr><td class=\"ac\" data-label=\"Relatif\">ما</td><td data-label=\"Emploi\">le non-raisonnable</td><td class=\"ac\" data-label=\"Exemple\">ما عندَك جميلٌ</td></tr>\n        </tbody>\n      </table></div>\n\n      <div class=\"recap coral\">\n        <div class=\"rt\">صلة الموصول — صلة الموصول</div>\n        <p style=\"margin:0\">C'est la phrase qui suit le relatif pour le <b>définir</b>, compléter son sens et préciser l'intention. Elle peut être nominale, verbale ou شبه جملة.</p>\n      </div>\n\n      <h3 class=\"sub\">Le pronom de retour <span class=\"ar\">عائد الموصول</span></h3>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Définition</span>Un pronom <b>absent</b> (غائب) qui relie la صلة au relatif. Il peut être <b>visible</b> ou <b>supprimé</b> (mahdhûf).</div>\n        <div class=\"arb\"><span class=\"tag\">التعريف</span>ضميرٌ غائبٌ يربطُ جملةَ الصلةِ بالاسمِ الموصولِ ؛ قد يكونُ ظاهرًا أو محذوفًا.</div>\n      </div>\n      <div class=\"pills\">\n        <span class=\"pill\">قرأتُ الكتابَ الّذي اشتريتُ<b>ـهُ</b> — عائد ظاهر</span>\n        <span class=\"pill\">اِفعَلْ ما تريدُ (تريدُ<b>ـهُ</b>) — عائد محذوف</span>\n      </div>\n\n      <h3 class=\"sub\">Le duel relatif est معرب <span class=\"ar\">اللذان / اللتان</span></h3>\n      <p>Tous les relatifs sont <b>مبنيّ</b>, <b>sauf le duel</b> qui est معرب (sa terminaison change) :</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-coral\">\n        <thead><tr><th class=\"ac\">Cas</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Cas\">رفع</td><td class=\"ac\" data-label=\"Exemple\">الطالبانِ اللّذانِ حضرا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">نصب</td><td class=\"ac\" data-label=\"Exemple\">رأيتُ الطالبَينِ اللّذَينِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">جرّ</td><td class=\"ac\" data-label=\"Exemple\">سلّمتُ على الطالبَينِ اللّذَينِ</td></tr>\n        </tbody>\n      </table></div>"},{"id":"s3-6","n":6,"t":"Le présent & l'épithète","ar":"المضارع المنصوب والنعت","html":"<p class=\"lead\">De base, le verbe au présent est <em class=\"term\">مرفوع</em> (par la ضمّة, ou par ثبوت النون pour les 5 verbes). Il devient <b>منصوب</b> quand il est précédé d'une particule de نصب comme <span class=\"arword\">أنْ</span> et <span class=\"arword\">لنْ</span>.</p>\n\n      <div class=\"irab\">\n        <div class=\"phrase\">لَنْ أَشْرَبَ القَهوةَ</div>\n        <div class=\"row\"><b>لن</b> : حرفُ نصبٍ ونفيٍ واستقبالٍ، مبنيٌّ على السكون، لا محلَّ له من الإعراب.</div>\n        <div class=\"row\"><b>أشربَ</b> : فعلٌ مضارعٌ منصوبٌ، وعلامةُ نصبِه الفتحةُ الظاهرةُ على آخره، والفاعلُ ضميرٌ مستترٌ تقديرُه «أنا».</div>\n        <div class=\"row\"><b>القهوةَ</b> : مفعولٌ به منصوبٌ، وعلامةُ نصبِه الفتحةُ الظاهرةُ على آخره.</div>\n      </div>\n\n      <div class=\"recap sage\">\n        <div class=\"rt\">Marque du نصب</div>\n        <p style=\"margin:0\">Le مضارع منصوب : par la <b>فتحة</b>, ou par la <b>suppression du نون</b> pour les 5 verbes — واو الجماعة (<span class=\"arword\">أنتم / هم</span>), ياء المخاطبة (<span class=\"arword\">أنتِ</span>), ألف الاثنين (<span class=\"arword\">أنتما / هما</span>).</p>\n      </div>\n\n<div class=\"clair\"><div class=\"ct\">En clair</div><p>Un outil de <b>نصب</b> placé devant le présent le force à finir par une <b>فتحة</b> (au lieu de la ضمّة). Et si le verbe finit déjà par un نون (les 5 verbes), on <b>enlève</b> ce نون au lieu de mettre une فتحة.</p></div>\n      <h3 class=\"sub\">Les نواصب &amp; leurs exemples <span class=\"ar\">النواصب</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sage\">\n        <thead><tr><th class=\"ac\">Particule</th><th>Sens</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Particule\">أنْ</td><td data-label=\"Sens\">que</td><td class=\"ac\" data-label=\"Exemple\">يجبُ أنْ يتوجّهَ المسلمُ إلى اللهِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">لنْ</td><td data-label=\"Sens\">négation du futur</td><td class=\"ac\" data-label=\"Exemple\">لنْ يَنفَدَ ماءُ زمزمَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">كي</td><td data-label=\"Sens\">afin que</td><td class=\"ac\" data-label=\"Exemple\">فجّرَ اللهُ زمزمَ كي يشربَ منها إسماعيلُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">لام التعليل</td><td data-label=\"Sens\">afin de</td><td class=\"ac\" data-label=\"Exemple\">تعودُ هاجرُ لِتفعلَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">حتّى</td><td data-label=\"Sens\">afin que / jusqu'à</td><td class=\"ac\" data-label=\"Exemple\">حتّى يُجيبَ اللهُ لِدعائِك</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">إذَن</td><td data-label=\"Sens\">donc, alors</td><td class=\"ac\" data-label=\"Exemple\">إذَن أُكرِمَك</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"irab\">\n        <div class=\"phrase\">تُريدونَ أنْ تَسمَعوا الأخبارَ</div>\n        <div class=\"row\"><b>أنْ</b> : حرفُ نصبٍ ومصدرٍ مبنيٌّ على السكونِ.</div>\n        <div class=\"row\"><b>تسمَعوا</b> : فعلٌ مضارعٌ منصوبٌ بأنْ، وعلامةُ نصبِه <b>حذفُ النونِ</b> لأنه من الأفعال الخمسة.</div>\n      </div>\n      <div class=\"note\">Rappel : quand le verbe منصوب porte un نون (5 verbes), on le supprime → أنْ تشربوا ← تشربونَ.</div>\n\n      <h3 class=\"sub\">Le quألفicatif <span class=\"ar\">النَّعت</span></h3>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Définition</span>Le نعت exprime une <b>qualité</b> de l'être ou de l'objet qu'il quألفie, appelé <em class=\"term\">المنعوت</em>. Il se place <b>toujours après</b> lui.</div>\n        <div class=\"arb\"><span class=\"tag\">النعت</span>يُعبّرُ عن صفةٍ في المنعوتِ، ويأتي بعدَه دائمًا.</div>\n      </div>\n      <div class=\"recap gold\">\n        <div class=\"rt\">Le نعت s'accorde en 4 choses</div>\n        <div class=\"schema cols-2\" style=\"margin-top:8px\">\n          <div class=\"scard\"><div class=\"mid\">1 · Le genre</div><div class=\"ex\">الطالبُ المجتهدُ</div><div class=\"fr-s\">الطالبةُ المجتهدةُ</div></div>\n          <div class=\"scard\"><div class=\"mid\">2 · La définition</div><div class=\"ex\">الطالبُ المجتهدُ</div><div class=\"fr-s\">محمدٌ طالبٌ مجتهدٌ (نكرة)</div></div>\n          <div class=\"scard\"><div class=\"mid\">3 · La déclinaison</div><div class=\"ex\">القلمُ على المكتبِ الصغيرِ</div><div class=\"fr-s\">مجرور + مجرور</div></div>\n          <div class=\"scard\"><div class=\"mid\">4 · Le nombre</div><div class=\"ex\">الطلابُ الجُددُ مجتهدونَ</div><div class=\"fr-s\">jam' + jam'</div></div>\n        </div>\n      </div>\n      <div class=\"recap sage\">\n        <div class=\"rt\">La règle complète — النعت يتبع المنعوت</div>\n        <p style=\"margin:0\">Le نعت suit le منعوت en <b>4 axes</b> qui couvrent 8 états : la <b>flexion</b> (إعراب), le <b>genre</b> (masc./fém.), le <b>nombre</b> (singulier / duel / pluriel) et la <b>définition</b> (défini / indéfini).</p>\n        <div class=\"pills\" style=\"margin-top:8px\">\n          <span class=\"pill\">الكتابُ المفيدُ</span>\n          <span class=\"pill\">مدرستانِ جيّدتانِ</span>\n          <span class=\"pill\">رأى الرجالَ المجتهدينَ</span>\n        </div>\n      </div>\n      <div class=\"note\">Attention : la même forme (مجتهد) peut être نعت OU خبر selon la structure → رأيتُ طالبًا مجتهدًا (نعت) / الطالبُ مجتهدٌ (خبر).</div>"},{"id":"s3-7","n":7,"t":"Le défini & l'indéfini","ar":"المعرفة والنكرة","html":"<div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">معرفة · défini</span>Ce qui désigne quelque chose de <b>précis</b> (comme محمّد، أنت، هذا).</div>\n        <div class=\"fr\"><span class=\"tag\">نكرة · indéfini</span>Ce qui désigne quelque chose de <b>non précis</b> (comme رجل، كتاب). Souvent avec تنوين au singulier.</div>\n      </div>\n\n      <h3 class=\"sub\">Les 7 catégories de défini <span class=\"ar\">أقسام المعرفة سبعة</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-rose\">\n        <thead><tr><th>#</th><th>Catégorie</th><th class=\"ac\">Exemples</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"#\">1</td><td data-label=\"Catégorie\">Le pronom <span class=\"arword\">الضمير</span></td><td class=\"ac\" data-label=\"Exemples\">أنا، أنتَ، هو، التاء، الواو</td></tr>\n          <tr><td data-label=\"#\">2</td><td data-label=\"Catégorie\">Le nom propre <span class=\"arword\">العَلَم</span></td><td class=\"ac\" data-label=\"Exemples\">أحمد، الهند، مكّة</td></tr>\n          <tr><td data-label=\"#\">3</td><td data-label=\"Catégorie\">Le démonstratif <span class=\"arword\">اسم الإشارة</span></td><td class=\"ac\" data-label=\"Exemples\">هذا، ذلك، هذه، هؤلاء</td></tr>\n          <tr><td data-label=\"#\">4</td><td data-label=\"Catégorie\">Le relatif <span class=\"arword\">الاسم الموصول</span></td><td class=\"ac\" data-label=\"Exemples\">الّذي، الّذين، الّتي، ما</td></tr>\n          <tr><td data-label=\"#\">5</td><td data-label=\"Catégorie\">Le nom avec <span class=\"arword\">ال</span></td><td class=\"ac\" data-label=\"Exemples\">الكتاب، الرجل</td></tr>\n          <tr><td data-label=\"#\">6</td><td data-label=\"Catégorie\">L'annexé à un défini <span class=\"arword\">المضاف إلى معرفة</span></td><td class=\"ac\" data-label=\"Exemples\">كتابُ حامدٍ، كتابُ هذا</td></tr>\n          <tr><td data-label=\"#\">7</td><td data-label=\"Catégorie\">نكرة maqsûda bi-n-nidâ' <span class=\"arword\">النكرة المقصودة بالنداء</span></td><td class=\"ac\" data-label=\"Exemples\">يا وَلَدُ، يا شيخُ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"recap sage\">\n        <div class=\"rt\">L'annexion (إضافة) définit</div>\n        <p style=\"margin:0\">Le premier terme d'une إضافة devient <b>معرفة</b> s'il est attaché à un défini : <span class=\"arword\">كتابُ زيدٍ</span> → كتاب devient défini (« le livre de Zayd »).</p>\n      </div>"},{"id":"s3-8","n":8,"t":"كان et ses sœurs","ar":"كان وأخواتها","html":"<div class=\"recap mauve\">\n        <div class=\"rt\">Effet</div>\n        <p style=\"margin:0\"><span class=\"arword\">كان وأخواتها : تَرفعُ الاسمَ وتَنصبُ الخبرَ</span> — كان et ses sœurs rendent le <b>ism مرفوع</b> et le <b>خبر منصوب</b>.</p>\n      </div>\n\n      <div class=\"irab\">\n        <div class=\"phrase\">لَيسَ مُحمَّدٌ مَريضًا</div>\n        <div class=\"row\"><b>ليس</b> : فعلٌ ماضٍ ناقصٌ (فعل ناسخ).</div>\n        <div class=\"row\"><b>محمدٌ</b> : اسمُ «ليس» مرفوعٌ.</div>\n        <div class=\"row\"><b>مريضًا</b> : خبرُ «ليس» منصوبٌ.</div>\n      </div>\n\n      <div class=\"recap rose\">\n        <div class=\"rt\">ليس — la négation</div>\n        <p style=\"margin:0\"><span class=\"arword\">فِعلٌ ماضٍ ناقصٌ / تُفيدُ النفي</span> : c'est un verbe au passé incomplet (ناقص) qui signifie la <b>négation</b>.</p>\n      </div>\n\n<div class=\"clair\"><div class=\"ct\">En clair</div><p>كان et ses sœurs se posent <b>devant</b> une phrase nominale et en changent l'habillage : le مبتدأ garde sa ضمّة (il devient <b>اسم كان</b>), mais le خبر prend une فتحة (il devient <b>خبر كان</b>).</p></div>\n      <h3 class=\"sub\">Les sœurs de كان et leur sens <span class=\"ar\">أخوات كان</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th class=\"ac\">Le verbe</th><th>Signification</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">كان</td><td data-label=\"Signification\">verbe ناسخ de base : rend l'ism مرفوع et le خبر منصوب</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">أصبح</td><td data-label=\"Signification\">indique le moment du matin — دلّ على وقت الصباح</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">أمسى</td><td data-label=\"Signification\">indique le moment du soir — وقت المساء</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">أضحى</td><td data-label=\"Signification\">indique le moment de la matinée (duhâ)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">صار</td><td data-label=\"Signification\">indique la transformation — دلّ على التحوّل</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">ظلَّ</td><td data-label=\"Signification\">continuité tout au long du jour — الاستمرار طوال النهار</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">بات</td><td data-label=\"Signification\">continuité tout au long de la nuit — طوال الليل</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">ليس</td><td data-label=\"Signification\">négation du خبر — نفي الخبر</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">مازال / مابرح / مافتئ / ماانفكّ</td><td data-label=\"Signification\">indiquent la continuité — الاستمرار</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le verbe\">مادام</td><td data-label=\"Signification\">indique la durée d'un état</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">Exemple d'إعراب <span class=\"ar\">نموذج إعراب</span></h3>\n      <div class=\"irab\">\n        <div class=\"phrase\">أَصبَحَ الأمرُ سَهلًا</div>\n        <div class=\"row\"><b>أصبحَ</b> : فعلٌ ماضٍ ناقصٌ مبنيٌّ على الفتحِ.</div>\n        <div class=\"row\"><b>الأمرُ</b> : اسمُ «أصبح» مرفوعٌ، وعلامةُ رفعِه الضمّةُ الظاهرةُ على آخره.</div>\n        <div class=\"row\"><b>سهلًا</b> : خبرُ «أصبح» منصوبٌ، وعلامةُ نصبِه الفتحةُ الظاهرةُ على آخره.</div>\n      </div>\n      <div class=\"recap rose\">\n        <div class=\"rt\">Autres exemples — أمثلة</div>\n        <div class=\"pills\">\n          <span class=\"pill\">كان المسجدُ قريبًا</span>\n          <span class=\"pill\">مازال الجوُّ لطيفًا</span>\n          <span class=\"pill\">لا يزالُ محمدٌ مريضًا</span>\n          <span class=\"pill\">أمسَتْ فاطمةُ نائحةً</span>\n          <span class=\"pill\">باتَ متألّمًا</span>\n        </div>\n      </div>"},{"id":"s3-9","n":9,"t":"Flexion & construction des noms","ar":"الإعراب والبناء في الأسماء","html":"<div class=\"recap sky\">\n        <div class=\"rt\">La règle — القاعدة</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\" class=\"ar\" dir=\"rtl\">\n          <li>تمتازُ الجملةُ العربيةُ باشتمالِها على كلماتٍ مُعرَبةٍ.</li>\n          <li>الإعرابُ يُغيّرُ أواخرَ الكلماتِ في الجملةِ بحسبِ المعنى.</li>\n          <li>المُعرَباتُ هي الأسماءُ والفعلُ المضارعُ.</li>\n          <li>عَلاماتُ الإعرابِ : الفتحةُ للنصبِ، والكسرةُ للجرِّ، والضمّةُ للرفعِ، والسكونُ للجزمِ.</li>\n          <li>لا تُجزَمُ الأسماءُ ولا يُجَرُّ الفعلُ.</li>\n        </ol>\n      </div>\n\n      <h3 class=\"sub\">معرب ou مبنيّ ? <span class=\"ar\">مُعرَب أو مبنيّ</span></h3>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p><b>معرب</b> = un mot dont la dernière voyelle <b>change</b> selon son rôle dans la phrase (comme un caméléon). <b>مبنيّ</b> = un mot dont la fin ne bouge <b>jamais</b>, quel que soit son rôle (هذا، أنا، الّذي…).</p></div>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">معرب · معرب</span>La terminaison <b>change</b> selon la fonction — تَغيّرُ آخرِه بسببِ العامل.<br>جاء المدرسُ / سألتُ المدرسَ / سلّمتُ على المدرسِ</div>\n        <div class=\"fr\"><span class=\"tag\">مبنيّ · مبنيّ</span>La terminaison <b>ne change pas</b> — لا يتغيّرُ آخرُه.<br>الّذي، هذا، أنا…</div>\n      </div>\n\n      <h3 class=\"sub\">Les noms مبنيّ <span class=\"ar\">المبنيّ من الأسماء</span></h3>\n      <p>Tous les noms sont معرب <b>sauf</b> ces catégories :</p>\n      <div class=\"pills\">\n        <span class=\"pill\">الضمائر <b>هو، هم، أنت، أنا</b></span>\n        <span class=\"pill\">أسماء الإشارة <b>هذا، هذه، ذلك</b></span>\n        <span class=\"pill\">الأسماء الموصولة <b>الّذي، الّتي</b></span>\n        <span class=\"pill\">أسماء الاستفهام <b>مَن، أين، متى، كيف</b></span>\n        <span class=\"pill\">بعض الظروف <b>إذا، الآن، حيثُ، أمسِ</b></span>\n        <span class=\"pill\">أسماء الأفعال <b>آمين، أُفٍّ، آه</b></span>\n        <span class=\"pill\">الأعداد المركّبة <b>أحد عشرَ… (١١–١٩)</b></span>\n      </div>\n      <div class=\"recap gold\">\n        <div class=\"rt\">Les حروف et certains verbes</div>\n        <p style=\"margin:0\">Tous les <b>حروف</b> (prépositions, etc.) sont مبنيّ. Les verbes au <b>passé</b> et à l'<b>impératif</b> sont aussi مبنيّ.</p>\n      </div>\n\n      <h3 class=\"sub\">Les marques secondaires <span class=\"ar\">العلامات الفرعية</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th>Type de nom</th><th>رفع</th><th>نصب</th><th>جرّ</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Type de nom\">Jam' مؤنّث سالم <span class=\"arword\">جمع المؤنث السالم</span></td><td class=\"ac\" data-label=\"رفع\">ـة</td><td class=\"ac\" data-label=\"نصب\">ـكسرة</td><td class=\"ac\" data-label=\"جرّ\">ـكسرة</td></tr>\n          <tr><td data-label=\"Type de nom\">Mamnû' min as-sarf <span class=\"arword\">الممنوع من الصرف</span></td><td class=\"ac\" data-label=\"رفع\">ضمة</td><td class=\"ac\" data-label=\"نصب\">فتحة</td><td class=\"ac\" data-label=\"جرّ\">فتحة (بدل الكسرة)</td></tr>\n          <tr><td data-label=\"Type de nom\">Les 5 noms <span class=\"arword\">الأسماء الخمسة</span></td><td class=\"ac\" data-label=\"رفع\">الواو</td><td class=\"ac\" data-label=\"نصب\">الألف</td><td class=\"ac\" data-label=\"جرّ\">الياء</td></tr>\n        </tbody>\n      </table></div>\n\n      <div class=\"recap gold\">\n        <div class=\"rt\">Deux exclusivités à retenir</div>\n        <p style=\"margin:0\">Le <b>جزم</b> ne concerne que les <b>verbes</b> ; le <b>جرّ</b> ne concerne que les <b>noms</b> — <span class=\"arword\">لا تُجزَمُ الأسماءُ ولا يُجَرُّ الفعلُ</span>.</p>\n      </div>\n      <div class=\"note\">Ibn Jinnî définit l'إعراب comme « montrer le changement de sens par une modification de la forme » — الإبانةُ عن المعاني بالألفاظ.</div>"},{"id":"s3-10","n":10,"t":"Le présent apocopé","ar":"المضارع المجزوم","html":"<p class=\"lead\">Nouvelle catégorie : <em class=\"term\">الجوازم</em> (<span class=\"arword\">الجوازم</span>). Placées devant un verbe au présent (مرفوع de base), elles le rendent <b>مجزوم</b> : les marques du رفع sont supprimées (remplacées par un سكون, ou par la suppression du نون).</p>\n\n      <div class=\"tree\">\n        <div class=\"root\">أدوات الجزم نوعان</div>\n        <div class=\"branch\">\n          <div class=\"leaf\"><div class=\"h\">أدوات نفي</div><div class=\"d\">particules de négation</div><div class=\"e\">لَمْ &nbsp;·&nbsp; لَمَّا</div></div>\n          <div class=\"leaf\"><div class=\"h\">أدوات شرط</div><div class=\"d\">particules de condition</div><div class=\"e\">إنْ · أينما · حيثما · متى</div></div>\n        </div>\n      </div>\n\n      <div class=\"recap sage\">\n        <div class=\"rt\">La marque du جزم — علامة الجزم</div>\n        <div class=\"tbl-wrap\" style=\"margin-top:8px\"><table class=\"grid th-sage\">\n          <thead><tr><th>Type de verbe</th><th>Marque</th><th class=\"ac\">Exemple</th></tr></thead>\n          <tbody>\n            <tr><td data-label=\"Type de verbe\">Sain <span class=\"arword\">صحيح الآخر</span></td><td data-label=\"Marque\">سكون</td><td class=\"ac\" data-label=\"Exemple\">لم يكتُبْ</td></tr>\n            <tr><td data-label=\"Type de verbe\">Défectueux <span class=\"arword\">معتلّ الآخر</span></td><td data-label=\"Marque\">chute de la lettre de علّة</td><td class=\"ac\" data-label=\"Exemple\">لم يَدْعُ / لم يَرْمِ</td></tr>\n            <tr><td data-label=\"Type de verbe\">Les 5 verbes <span class=\"arword\">الأفعال الخمسة</span></td><td data-label=\"Marque\">chute du نون</td><td class=\"ac\" data-label=\"Exemple\">لم يكتبوا / لم تكتبي</td></tr>\n          </tbody>\n        </table></div>\n      </div>\n\n      <h3 class=\"sub\">Le جزم conditionne deux verbes <span class=\"ar\">الجوازم تجزم فعلين</span></h3>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>Les جوازم de condition relient <b>deux actions</b> : « <b>si</b> tu fais X, <b>alors</b> Y arrive ». Les deux verbes deviennent مجزوم. Ex : <b>إنْ تدرسْ تنجحْ</b> = si tu étudies, tu réussis.</p></div>\n      <p>On l'emploie pour <b>conditionner un verbe par l'action d'un autre</b>. « Si tu manges, je mange » — si le premier existe, le second existe.</p>\n      <div class=\"pills\">\n        <span class=\"pill\"><b>أداة الشرط</b> = outil de condition</span>\n        <span class=\"pill\"><b>فعل الشرط</b> = verbe qui conditionne</span>\n        <span class=\"pill\"><b>جواب الشرط</b> = la conséquence</span>\n      </div>\n      <div class=\"ar-big\" style=\"text-align:center;font-size:1.35rem\">إنْ تَكتُبْ أَكتُبْ</div>"},{"id":"s3-11","n":11,"t":"Pronoms isolés & suffixés","ar":"الضمائر المنفصلة والمتّصلة","html":"<div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Isolés · منفصلة</span>Les pronoms personnels <b>indépendants</b> — الضمائر المُنفصِلة (أنا، أنتَ، هو…).</div>\n        <div class=\"fr\"><span class=\"tag\">Suffixés · متّصلة</span>Les pronoms personnels <b>attachés</b> à un nom, verbe ou حرف — الضمائر المُتّصِلة (ـي، ـكَ، ـه…).</div>\n      </div>\n\n      <div class=\"tbl-wrap\"><table class=\"grid th-gold\">\n        <thead><tr><th class=\"ac\">Personne</th><th class=\"ac\">Isolé — منفصل</th><th class=\"ac\">Suffixé — متّصل</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Personne\">1<sup>re</sup> sing.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">أنا</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـِي</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">2<sup>e</sup> masc.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">أنتَ</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـكَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">2<sup>e</sup> fém.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">أنتِ</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـكِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">3<sup>e</sup> masc.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">هو</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـهُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">3<sup>e</sup> fém.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">هي</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـها</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">1<sup>re</sup> plur.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">نحن</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـنا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">2<sup>e</sup> masc. plur.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">أنتم</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـكم</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">2<sup>e</sup> fém. plur.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">أنتنّ</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـكنّ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">3<sup>e</sup> masc. plur.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">هم</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـهم</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">3<sup>e</sup> fém. plur.</td><td class=\"ac\" data-label=\"Isolé — منفصل\">هنّ</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـهنّ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Personne\">duel</td><td class=\"ac\" data-label=\"Isolé — منفصل\">هما / أنتما</td><td class=\"ac\" data-label=\"Suffixé — متّصل\">ـهما / ـكما</td></tr>\n        </tbody>\n      </table></div>\n\n      <div class=\"ar-big\" style=\"text-align:center;font-size:1.4rem\">قَلَمٌ + أنا = قَلَمِي &nbsp;|&nbsp; قَلَمٌ + هو = قَلَمُهُ</div>\n      <div class=\"recap gold\">\n        <div class=\"rt\">À noter</div>\n        <p style=\"margin:0\">Le pronom <span class=\"arword\">ـِي</span> est <b>toujours précédé d'une كسرة</b>.</p>\n      </div>"},{"id":"s3-12","n":12,"t":"Le duel","ar":"المُثنّى","html":"<div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Définition</span>Un mot qui indique <b>deux</b> par l'ajout de <b>ألف + نون</b> (رفع) ou <b>ياء + نون</b> (نصب/جرّ) à la fin. Cet ajout remplace le عطف.<br>جاء طالبٌ وطالبٌ → جاء طالبانِ</div>\n        <div class=\"fr\"><span class=\"tag\">حكم المثنّى</span>مرفوع par l'<b>ألف</b> : حضر طالبانِ.<br>منصوب / مجرور par le <b>ياء</b> : رأيتُ طالبَينِ، مررتُ بطالبَينِ.</div>\n      </div>\n\n      <h3 class=\"sub\">Les conditions du duel <span class=\"ar\">شروط ما يُثنّى</span></h3>\n      <ol style=\"padding-inline-start:20px;margin:6px 0\" class=\"ar\" dir=\"rtl\">\n        <li>الإفرادُ : فلا يُثنّى المثنّى ولا الجمعُ.</li>\n        <li>الإعرابُ : فلا يُثنّى المبنيُّ.</li>\n        <li>التنكيرُ : فلا يُثنّى العَلَمُ إلّا بعدَ تنكيرِه.</li>\n        <li>اتفاقُ اللفظِ والمعنى (وأمّا نحو «الأبوان» فمِن باب التغليب).</li>\n        <li>أن يكونَ له نظيرٌ في الوجودِ : فلا يُثنّى الشمسُ ولا القمرُ.</li>\n        <li>عدمُ الاستغناءِ بتثنيتِه عن تثنيةٍ أخرى.</li>\n      </ol>\n\n      <div class=\"recap mauve\">\n        <div class=\"rt\">L'annexé au duel — الملحق بالمثنّى</div>\n        <p><b>a)</b> <span class=\"arword\">اثنانِ / اثنتانِ</span> : traités comme le duel, qu'ils soient annexés ou non.</p>\n        <p style=\"margin:0\"><b>b)</b> <span class=\"arword\">كِلا / كِلتا</span> : à condition d'être annexés à un <b>pronom</b> (كلاهما). Annexés à un nom apparent, ils sont analysés par des <b>harakât estimées</b> sur الألف.</p>\n      </div>\n      <div class=\"note\">Question du prof : comment expliquer « إنّ هذانِ لَساحرانِ » ? → cas particulier de lecture.</div>"},{"id":"s3-13","n":13,"t":"Transitif & intransitif","ar":"اللازم والمتعدّي","html":"<div class=\"schema cols-2\">\n        <div class=\"scard\" style=\"border-color:var(--coral)\"><div class=\"top\">المتعدّي</div><div class=\"mid\">Transitif</div><div class=\"fr-s\">a besoin d'un maf'ûl bih (COD)</div><div class=\"ex\">شَرِبَ · كَتَبَ</div></div>\n        <div class=\"scard\" style=\"border-color:var(--sage)\"><div class=\"top\">اللازم</div><div class=\"mid\">Intransitif</div><div class=\"fr-s\">pas de COD</div><div class=\"ex\">نَزَلَ · جَلَسَ · رَجَعَ</div></div>\n      </div>\n\n      <div class=\"recap coral\">\n        <div class=\"rt\">La règle — القاعدة</div>\n        <p style=\"margin:0\"><span class=\"arword\">مِنَ الأفعالِ ما يَتعدّى إلى مفعولٍ به منصوبٍ ويُسمّى المتعدّيَ، ومنها ما لا يَتعدّى إلّا بحرفِ الجرِّ ويُسمّى اللازمَ.</span></p>\n      </div>\n\n      <h3 class=\"sub\">Distinguer ف et ثمّ <span class=\"ar\">الفرق بين «فـ» و«ثمّ»</span></h3>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">الفاء · fâ'</span>Enchaînement <b>immédiat</b> et rapproché, sans délai.</div>\n        <div class=\"fr\"><span class=\"tag\">ثمّ · thumma</span>Enchaînement avec un <b>délai / espacement</b> (tarâkhî).</div>\n      </div>"},{"id":"s3-14","n":14,"t":"Les prépositions","ar":"حروف الجرّ","html":"<div class=\"recap sky\">\n        <div class=\"rt\">La règle — القاعدة</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\" class=\"ar\" dir=\"rtl\">\n          <li>مِنَ الحروفِ ما يُسمّى حروفَ الجرِّ.</li>\n          <li>حروفُ الجرِّ تدخلُ على الأسماءِ ولا تدخلُ على غيرِها.</li>\n          <li>الاسمُ الّذي بعدَ حرفِ الجرِّ يُسمّى المجرورَ.</li>\n          <li>حرفُ الجرِّ والاسمُ بعدَه لا يَستقلّانِ في الفهمِ إلّا معَ غيرِهما.</li>\n        </ol>\n      </div>\n\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th class=\"ac\">Le حرف</th><th>Sens de base</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">مِنْ</td><td data-label=\"Sens de base\">provenance, partie de</td><td class=\"ac\" data-label=\"Exemple\">رجعتُ من السفرِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">إلى</td><td data-label=\"Sens de base\">direction, vers</td><td class=\"ac\" data-label=\"Exemple\">ذهبتُ إلى المسجدِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">عَنْ</td><td data-label=\"Sens de base\">loin de, à propos de</td><td class=\"ac\" data-label=\"Exemple\">رجعَ عن خطئِه</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">على</td><td data-label=\"Sens de base\">sur</td><td class=\"ac\" data-label=\"Exemple\">على الطاولةِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">في</td><td data-label=\"Sens de base\">lieu / temps (dans)</td><td class=\"ac\" data-label=\"Exemple\">في البيتِ، في الصباحِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">البـاء (بـ)</td><td data-label=\"Sens de base\">avec, par, grâce à</td><td class=\"ac\" data-label=\"Exemple\">قطعتُ اللحمَ بالسكّينِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">الكاف (كـ)</td><td data-label=\"Sens de base\">comme (comparaison)</td><td class=\"ac\" data-label=\"Exemple\">أنتَ كالأسدِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le حرف\">اللام (لـ)</td><td data-label=\"Sens de base\">appartenance, pour</td><td class=\"ac\" data-label=\"Exemple\">الكتابُ لِمحمدٍ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"note\">Les prépositions se construisent sur les noms qui deviennent مجرور : في المدرسةِ، من المسجدِ…</div>"},{"id":"s3-15","n":15,"t":"Le masculin & le féminin","ar":"المذكّر والمؤنّث","html":"<div class=\"recap rose\">\n        <div class=\"rt\">La règle — القاعدة</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\" class=\"ar\" dir=\"rtl\">\n          <li>الاسمُ إمّا مذكّرٌ أو مؤنّثٌ.</li>\n          <li>المذكّرُ : ما خلا مِن علاماتِ التأنيثِ أو دلَّ على ذكرٍ.</li>\n          <li>المؤنّثُ : ما دلَّ على أنثى أو كان به علامةُ تأنيثٍ في آخرِه.</li>\n          <li>علاماتُ التأنيثِ : التاءُ، والألفُ المقصورةُ، والألفُ الممدودةُ.</li>\n        </ol>\n      </div>\n\n      <div class=\"schema cols-2\">\n        <div class=\"scard\" style=\"border-color:var(--rose)\"><div class=\"top\">مؤنّث حقيقيّ</div><div class=\"mid\">Féminin « réel »</div><div class=\"fr-s\">un être vivant féminin</div><div class=\"ex\">زينب · فاطمة · امرأة</div></div>\n        <div class=\"scard\" style=\"border-color:var(--mauve)\"><div class=\"top\">مؤنّث مجازيّ</div><div class=\"mid\">Féminin « grammatical »</div><div class=\"fr-s\">objet/chose traité comme féminin</div><div class=\"ex\">سيّارة · شجرة</div></div>\n      </div>\n\n      <h3 class=\"sub\">Les marqueurs du féminin <span class=\"ar\">علامات التأنيث</span></h3>\n      <div class=\"pills\">\n        <span class=\"pill\">التاء المربوطة <b>ـة</b> — طالبة، مسلمة</span>\n        <span class=\"pill\">الألف المقصورة <b>ـى</b> — كُبرى، ذِكرى</span>\n        <span class=\"pill\">الألف الممدودة <b>ـاء</b> — صحراء، حسناء</span>\n      </div>"},{"id":"s3-16","n":16,"t":"Verbe sain & défectueux","ar":"الفعل الصحيح والمعتلّ","html":"<p class=\"lead\"><span class=\"arword\">الفعلُ قِسمانِ : صحيحٌ ومعتلٌّ</span> — le verbe se divise selon la <b>santé</b> (الصحّة) et la <b>défectuosité</b> (الاعتلال) de ses lettres.</p>\n      <div class=\"clair\"><div class=\"ct\">En clair</div><p>Un verbe est « malade » (<b>معتلّ</b>) si une de ses lettres de racine est ا، و، ي ; sinon il est « sain » (<b>صحيح</b>). La <b>position</b> de la lettre malade donne le nom : au début → مثال, au milieu → أجوف, à la fin → ناقص.</p></div>\n\n      <h3 class=\"sub\">Le verbe sain <span class=\"ar\">الفعل الصحيح</span></h3>\n      <p>Ses lettres <b>originelles</b> sont vides de lettres de علّة (<span class=\"arword\">ا · و · ي</span>). Trois types :</p>\n      <div class=\"tree\">\n        <div class=\"root\">الفعل الصحيح</div>\n        <div class=\"branch\">\n          <div class=\"leaf\"><div class=\"h\">سالم</div><div class=\"d\">exempt de hamza et de redoublement</div><div class=\"e\">نَهَضَ · شَرِبَ · ضَرَبَ</div></div>\n          <div class=\"leaf\"><div class=\"h\">مهموز</div><div class=\"d\">une de ses lettres est une hamza</div><div class=\"e\">أَكَلَ · سَأَلَ · قَرَأَ · مَلَأ</div></div>\n          <div class=\"leaf\"><div class=\"h\">مُضعَّف</div><div class=\"d\">une lettre redoublée (shadda)</div><div class=\"e\">فَرَّ · حَجَّ · زَلزَلَ</div></div>\n        </div>\n      </div>\n\n      <h3 class=\"sub\">Le verbe défectueux <span class=\"ar\">الفعل المعتلّ</span></h3>\n      <p>Une de ses lettres originelles est une lettre de علّة. Quatre types :</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sage\">\n        <thead><tr><th class=\"ac\">Type</th><th>Où est la علّة ?</th><th class=\"ac\">Exemples</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Type\">مِثال</td><td data-label=\"Où est la علّة ?\">en <b>1<sup>re</sup></b> position (fâ')</td><td class=\"ac\" data-label=\"Exemples\">وَجَدَ · وَعَدَ · وَثِقَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Type\">أجوَف</td><td data-label=\"Où est la علّة ?\">au <b>milieu</b> ('ayn)</td><td class=\"ac\" data-label=\"Exemples\">قالَ · مالَ · عادَ · باعَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Type\">ناقِص</td><td data-label=\"Où est la علّة ?\">en <b>dernier</b> (lâm)</td><td class=\"ac\" data-label=\"Exemples\">سعى · رمى · قضى · نما</td></tr>\n          <tr><td class=\"ac\" data-label=\"Type\">لفيف</td><td data-label=\"Où est la علّة ?\"><b>deux</b> lettres de علّة</td><td class=\"ac\" data-label=\"Exemples\">مفروق: وقى — مقرون: طوى، روى</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"recap gold\">\n        <div class=\"rt\">Le لفيف a deux sortes</div>\n        <p style=\"margin:0\"><b>مفروق</b> (séparé) : علّة en 1<sup>re</sup> et dernière position, séparées par une saine — <span class=\"arword\">وقى</span>.<br><b>مقرون</b> (joint) : deux علّة côte à côte au milieu et à la fin — <span class=\"arword\">طوى · روى</span>.</p>\n      </div>"},{"id":"s3-17","n":17,"t":"Les 5 noms","ar":"الأسماء الخمسة","html":"<div class=\"ar-big\" style=\"text-align:center;font-size:1.7rem\">أب &nbsp;·&nbsp; أخ &nbsp;·&nbsp; حم &nbsp;·&nbsp; فو &nbsp;·&nbsp; ذو</div>\n\n      <div class=\"tbl-wrap\"><table class=\"grid th-gold\">\n        <thead><tr><th class=\"ac\">Cas</th><th class=\"ac\">Marque</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Cas\">الرفع</td><td class=\"ac\" data-label=\"Marque\">الواو</td><td class=\"ac\" data-label=\"Exemple\">المسلمُ أخو المسلمِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">النصب</td><td class=\"ac\" data-label=\"Marque\">الألف</td><td class=\"ac\" data-label=\"Exemple\">إنّ أبا بكرٍ أوّلُ خليفةٍ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">جرّ — الجرّ</td><td class=\"ac\" data-label=\"Marque\">الياء</td><td class=\"ac\" data-label=\"Exemple\">لا يؤمنُ أحدُكم حتى يحبَّ لأخيهِ</td></tr>\n        </tbody>\n      </table></div>\n\n<div class=\"clair\"><div class=\"ct\">En clair</div><p>Ces 5 noms prennent des <b>lettres longues</b> (و / ا / ي) au lieu des voyelles — mais seulement quand ils sont <b>annexés</b> à un autre mot : أبو محمدٍ (annexé) alors que أبٌ tout seul reste normal.</p></div>\n      <h3 class=\"sub\">Les 4 conditions <span class=\"ar\">الشروط الأربعة</span></h3>\n      <ol style=\"padding-inline-start:20px;margin:6px 0\" class=\"ar\" dir=\"rtl\">\n        <li>أن تكونَ <b>مضافةً</b> ؛ فإن لم تُضَفْ أُعرِبت بالحركاتِ الظاهرةِ : «إنّ إبراهيمَ أخٌ».</li>\n        <li>أن تكونَ <b>مفردةً</b> ؛ فإن كانت مثنّاةً أُعرِبت إعرابَ المثنّى، وإن كانت جمعًا أُعرِبت إعرابَ الجمعِ.</li>\n        <li>أن تكونَ <b>مُكبَّرةً</b> لا مُصغَّرةً ؛ فإن صُغِّرت أُعرِبت بالحركاتِ الأصليةِ : «أُخَيّ، حُمَيّ».</li>\n        <li>ألّا تكونَ مضافةً إلى <b>ياءِ المتكلّمِ</b> ؛ وإلّا أُعرِبت بحركاتٍ مقدّرةٍ : «إنّ هذا أخي».</li>\n      </ol>\n\n      <div class=\"recap gold\">\n        <div class=\"rt\">Conditions particulières</div>\n        <p><b>فو</b> : doit être vidé du mîm (على «فو» لا «فم»), et non affecté à la ياء du locuteur.</p>\n        <p style=\"margin:0\"><b>ذو</b> : doit signifier <em class=\"term\">sâhib</em> (« possesseur de ») et être annexé à un <b>nom apparent</b>. On ne dit jamais ذوك / ذوه — « إنّ ربّك لَذو فضلٍ على الناسِ ».</p>\n      </div>"},{"id":"s3-18","n":18,"t":"Le présent défectueux","ar":"المضارع المعتلّ","html":"<p class=\"lead\">Quand le مضارع se termine par une lettre de علّة, son إعراب se fait souvent par des marques <b>estimées</b> (muqaddara) — ce cours prolonge les cours 10 et 16.</p>\n\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th class=\"ac\">Finale</th><th>رفع</th><th>نصب</th><th>جزم</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Finale\">ـا (ألف)<br>يخشى</td><td data-label=\"رفع\">ضمّة estimée</td><td data-label=\"نصب\">فتحة estimée</td><td data-label=\"جزم\">chute du ألف → يخشَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Finale\">ـو (واو)<br>يدعو</td><td data-label=\"رفع\">ضمّة estimée</td><td data-label=\"نصب\">فتحة apparente</td><td data-label=\"جزم\">chute du واو → يدعُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Finale\">ـي (ياء)<br>يرمي</td><td data-label=\"رفع\">ضمّة estimée</td><td data-label=\"نصب\">فتحة apparente</td><td data-label=\"جزم\">chute du ياء → يرمِ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"recap sky\">\n        <div class=\"rt\">Le point clé</div>\n        <p style=\"margin:0\">Au <b>جزم</b>, la marque du verbe défectueux est la <b>chute de la lettre de علّة</b> (حذف حرف العلّة) — pas le سكون.</p>\n      </div>"},{"id":"s3-19","n":19,"t":"Le verbe défectueux (ناقص)","ar":"الفعل الناقص / المنقوص","html":"<p class=\"lead\">Le verbe <em class=\"term\">ناقص</em> a sa <b>dernière lettre</b> comme lettre de علّة. Voici son comportement au passé, présent (مرفوع &amp; مجزوم) et à l'impératif.</p>\n\n      <div class=\"tbl-wrap\"><table class=\"grid th-coral\">\n        <thead><tr><th class=\"ac\">الماضي</th><th class=\"ac\">المضارع المرفوع</th><th class=\"ac\">المضارع المجزوم</th><th class=\"ac\">الأمر</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"الماضي\">بَكى</td><td class=\"ac\" data-label=\"المضارع المرفوع\">يَبكي</td><td class=\"ac\" data-label=\"المضارع المجزوم\">لم يَبكِ</td><td class=\"ac\" data-label=\"الأمر\">اِبكِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"الماضي\">مَشى</td><td class=\"ac\" data-label=\"المضارع المرفوع\">يَمشي</td><td class=\"ac\" data-label=\"المضارع المجزوم\">لم يَمشِ</td><td class=\"ac\" data-label=\"الأمر\">اِمشِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"الماضي\">كَوى</td><td class=\"ac\" data-label=\"المضارع المرفوع\">يَكوي</td><td class=\"ac\" data-label=\"المضارع المجزوم\">لم يَكوِ</td><td class=\"ac\" data-label=\"الأمر\">اِكوِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"الماضي\">دَعا</td><td class=\"ac\" data-label=\"المضارع المرفوع\">يَدعو</td><td class=\"ac\" data-label=\"المضارع المجزوم\">لم يَدعُ</td><td class=\"ac\" data-label=\"الأمر\">اُدعُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"الماضي\">نَسِيَ</td><td class=\"ac\" data-label=\"المضارع المرفوع\">يَنسى</td><td class=\"ac\" data-label=\"المضارع المجزوم\">لم يَنسَ</td><td class=\"ac\" data-label=\"الأمر\">اِنسَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"الماضي\">بَقِيَ</td><td class=\"ac\" data-label=\"المضارع المرفوع\">يَبقى</td><td class=\"ac\" data-label=\"المضارع المجزوم\">لم يَبقَ</td><td class=\"ac\" data-label=\"الأمر\">اِبقَ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"recap coral\">\n        <div class=\"rt\">À l'impératif &amp; au مجزوم</div>\n        <p style=\"margin:0\">On <b>supprime la lettre de علّة</b> finale (حُذفت لام الفعل المعتلّ في المضارع المجزوم وفي الأمر).</p>\n      </div>\n\n      <h3 class=\"sub\">Transformation vers le locuteur <span class=\"ar\">تحويل إلى المتكلّم</span></h3>\n      <div class=\"pills\">\n        <span class=\"pill\">حامدٌ بَكى ← أَمَةٌ بَكَتْ ← أنا <b>بَكَيْتُ</b></span>\n        <span class=\"pill\">حامدٌ دَعا ← أَمَةٌ دَعَتْ ← أنا <b>دَعَوْتُ</b></span>\n      </div>\n      <div class=\"note\">يَبكي أصله «يَبكيُ» ؛ حُذفت الضمّة ثم الحرف بسبب التقاء الساكنين — les arabes allègent la prononciation.</div>"},{"id":"s3-a1","n":"a1","annex":true,"tag":"Annexe","t":"Zoom : la construction du verbe","ar":"بناء الفعل وإعرابه","html":"<p class=\"lead\">Synthèse tirée du cours en direct et des notes manuscrites : quand le verbe est مبنيّ, معرب, et comment les 5 verbes et les particules l'affectent.</p>\n\n      <h3 class=\"sub\">Le مضارع معرب <span class=\"ar\">الفعل المضارع المُعرَب</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th class=\"ac\">Cas</th><th>Marque(s)</th><th class=\"ac\">Particules</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Cas\">الرفع</td><td data-label=\"Marque(s)\">ضمّة apparente / <b>ثبوت النون</b> (5 verbes)</td><td class=\"ac\" data-label=\"Particules\">(rien devant)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">النصب</td><td data-label=\"Marque(s)\">فتحة / <b>حذف النون</b> (5 verbes)</td><td class=\"ac\" data-label=\"Particules\">أنْ · لنْ · كي · حتّى · لام التعليل</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">الجزم</td><td data-label=\"Marque(s)\">سكون / chute de la علّة / <b>حذف النون</b></td><td class=\"ac\" data-label=\"Particules\">لم · لمّا · لام الأمر · لا الناهية · أدوات الشرط</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">Le مضارع مبنيّ <span class=\"ar\">الفعل المضارع المبنيّ</span></h3>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">مبنيّ على السكون</span>Quand il est attaché à <b>نون النسوة</b> — النساء يَكتُبْنَ.</div>\n        <div class=\"fr\"><span class=\"tag\">مبنيّ على الفتح</span>Quand il est attaché à <b>نون التوكيد</b> directement — لَيَكتُبَنَّ.</div>\n      </div>\n\n      <h3 class=\"sub\">L'impératif — toujours مبنيّ <span class=\"ar\">فعل الأمر دائمًا مبنيّ</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th>Construit sur…</th><th>Quand ?</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Construit sur…\">سكون</td><td data-label=\"Quand ?\">sain, rien ne s'y attache</td><td class=\"ac\" data-label=\"Exemple\">اُكتُبْ</td></tr>\n          <tr><td data-label=\"Construit sur…\">chute de la علّة</td><td data-label=\"Quand ?\">dernière lettre = علّة</td><td class=\"ac\" data-label=\"Exemple\">اُدعُ · اِرمِ</td></tr>\n          <tr><td data-label=\"Construit sur…\">chute du نون</td><td data-label=\"Quand ?\">attaché à wâw / ألف / ياء (5 verbes)</td><td class=\"ac\" data-label=\"Exemple\">اكتُبوا · اكتُبي</td></tr>\n          <tr><td data-label=\"Construit sur…\">فتحة</td><td data-label=\"Quand ?\">attaché à نون التوكيد</td><td class=\"ac\" data-label=\"Exemple\">اكتُبَنَّ</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"note\">L'impératif se construit sur ce qui rend son مضارع مجزوم — الأمر مبنيّ على ما يُجزَم به مضارعه.</div>\n\n      <h3 class=\"sub\">Les 5 verbes <span class=\"ar\">الأفعال الخمسة</span></h3>\n      <p>Tout مضارع dont le sujet est <b>واو الجماعة</b>, <b>ألف الاثنين</b> ou <b>ياء المخاطبة</b> :</p>\n      <div class=\"pills\">\n        <span class=\"pill\">أنتَ ← تكتُبانِ / تكتُبونَ</span>\n        <span class=\"pill\">أنتِ ← تكتُبينَ</span>\n        <span class=\"pill\">هما ← يكتُبانِ</span>\n        <span class=\"pill\">هم ← يكتُبونَ</span>\n      </div>\n      <div class=\"recap gold\">\n        <div class=\"rt\">Leur particularité</div>\n        <p style=\"margin:0\">Sujet <b>apparent</b> + ajout d'un نون : <b>présent</b> au رفع (ثبوت النون), <b>absent</b> au نصب et au جزم (حذف النون).</p>\n      </div>\n\n      <h3 class=\"sub\">Les نواصب &amp; leur sens <span class=\"ar\">النواصب</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th class=\"ac\">Particule</th><th>Sens / effet</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Particule\">أنْ</td><td data-label=\"Sens / effet\">حرف نصب + مصدر (causalité) : place le verbe à la fonction d'un nom — أن تصوموا = صيامُكم</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">لنْ</td><td data-label=\"Sens / effet\">حرف نصب + négation + futur : négation totale (dans cette vie) — لن تكتُبي</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">كي · لام التعليل · حتّى</td><td data-label=\"Sens / effet\">expriment la <b>cause / le but</b> — سافرتُ إلى مصرَ لأتعلّمَ العربيةَ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">Les جوازم &amp; leur sens <span class=\"ar\">الجوازم</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th class=\"ac\">Particule</th><th>Sens / effet</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Particule\">لا الناهية</td><td data-label=\"Sens / effet\">interdiction (que la personne cesse/ne fasse pas) — لا تكتُبْ. ⚠ à différencier de <b>لا النافية</b> qui ne rend pas مجزوم.</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">لَمْ</td><td data-label=\"Sens / effet\">négation dans le passé, négation totale — لم يكتُبْ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">لَمّا</td><td data-label=\"Sens / effet\">même sens que لم, mais on <b>attend encore</b> que l'action se produise</td></tr>\n          <tr><td class=\"ac\" data-label=\"Particule\">أدوات الشرط</td><td data-label=\"Sens / effet\">إنْ، متى، أينما، حيثما… : conditionnent deux verbes (voir cours 10)</td></tr>\n        </tbody>\n      </table></div>"},{"id":"s3-a2","n":"a2","annex":true,"tag":"Annexe","t":"Interrogation & النحت","ar":"أدوات الاستفهام والنحت","html":"<h3 class=\"sub\">Les particules interrogatives <span class=\"ar\">حروف الاستفهام</span></h3>\n      <div class=\"recap sage\">\n        <div class=\"rt\">Pas de fonction grammaticale — لا محلّ لها من الإعراب</div>\n        <p style=\"margin:0\"><span class=\"arword\">الهمزة · هَل</span> : interrogent sur <b>le contenu de la phrase</b> ; la réponse est <b>نعم</b> ou <b>لا</b>.</p>\n      </div>\n\n      <h3 class=\"sub\">Les noms interrogatifs <span class=\"ar\">أسماء الاستفهام</span></h3>\n      <p>Ils ont un <b>sens précis</b> et une fonction grammaticale (لها محلّ من الإعراب).</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sage\">\n        <thead><tr><th class=\"ac\">Le nom</th><th>Interroge sur…</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Le nom\">مَن</td><td data-label=\"Interroge sur…\">le raisonnable (الإنسان)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le nom\">ما / ماذا</td><td data-label=\"Interroge sur…\">le non-raisonnable (الحيوان، الأشياء، الأفكار)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le nom\">متى / أيّان</td><td data-label=\"Interroge sur…\">le temps (الزمن / الوقت)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le nom\">أين</td><td data-label=\"Interroge sur…\">le lieu (المكان)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le nom\">كيف</td><td data-label=\"Interroge sur…\">l'état ou le moyen (الحال أو الوسيلة)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le nom\">كم</td><td data-label=\"Interroge sur…\">le nombre (العدد)</td></tr>\n          <tr><td class=\"ac\" data-label=\"Le nom\">أيّ</td><td data-label=\"Interroge sur…\">selon ce à quoi il est annexé (عاقل، غير عاقل، مكان، زمان…)</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">النحت <span class=\"ar\">النَّحت</span></h3>\n      <div class=\"bi\">\n        <div class=\"fr\"><span class=\"tag\">Définition</span>La composition (<b>النحت</b>) réunit plusieurs mots en un seul, appelé <b>المنحوت</b> ; on peut même en dériver un verbe.</div>\n        <div class=\"arb\"><span class=\"tag\">مثال</span>يُصرَفُ مِن «كيف» : كَيَّفَ يُكيِّفُ.</div>\n      </div>"},{"id":"s3-rec","n":"rec","annex":true,"tag":"Mémo","t":"Récapitulatif général","ar":"الخلاصة","html":"<p class=\"lead\">Toutes les grandes règles du semestre réunies sur une seule fiche — à réviser d'un coup d'œil.</p>\n\n      <h3 class=\"sub\">La grammaire d'un coup d'œil <span class=\"ar\">خريطة ذهنية</span></h3>\n      <div class=\"tree\">\n        <div class=\"root\">الكلمة</div>\n        <div class=\"branch\">\n          <div class=\"leaf\"><div class=\"h\">اسم</div><div class=\"d\">معرب (غالبًا) أو مبنيّ</div><div class=\"e\">رفع · نصب · جرّ</div></div>\n          <div class=\"leaf\" style=\"border-color:var(--sage)\"><div class=\"h\">فعل</div><div class=\"d\">ماضٍ · مضارع · أمر</div><div class=\"e\">مبنيّ / معرب</div></div>\n          <div class=\"leaf\" style=\"border-color:var(--gold)\"><div class=\"h\">حرف</div><div class=\"d\">مبنيّ دائمًا</div><div class=\"e\">جرّ · نصب · جزم…</div></div>\n        </div>\n      </div>\n\n      <h3 class=\"sub\">1 · Les 3 types de phrase <span class=\"ar\">أنواع الجملة</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-rose\">\n        <thead><tr><th class=\"ac\">Type</th><th>Structure</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Type\">جملة اسمية</td><td data-label=\"Structure\">مبتدأ + خبر</td><td class=\"ac\" data-label=\"Exemple\">البيتُ كبيرٌ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Type\">جملة فعلية</td><td data-label=\"Structure\">فعل + فاعل (+ مفعول)</td><td class=\"ac\" data-label=\"Exemple\">كتبَ الطالبُ الدرسَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Type\">شبه جملة</td><td data-label=\"Structure\">جار ومجرور / ظرف</td><td class=\"ac\" data-label=\"Exemple\">في البيتِ · فوقَ الطاولةِ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">2 · Les marques d'i'râb de base <span class=\"ar\">علامات الإعراب الأصلية</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sky\">\n        <thead><tr><th class=\"ac\">Cas</th><th class=\"ac\">Marque</th><th>Emplois principaux</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Cas\">رفع</td><td class=\"ac\" data-label=\"Marque\">ضمّة</td><td data-label=\"Emplois principaux\">مبتدأ · خبر · فاعل · مضارع (base)</td><td class=\"ac\" data-label=\"Exemple\">يكتبُ الطالبُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">نصب</td><td class=\"ac\" data-label=\"Marque\">فتحة</td><td data-label=\"Emplois principaux\">مفعول به · خبر كان · مضارع بعد نواصب</td><td class=\"ac\" data-label=\"Exemple\">لن يكتبَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">جرّ</td><td class=\"ac\" data-label=\"Marque\">كسرة</td><td data-label=\"Emplois principaux\">بعد حرف الجرّ · مضاف إليه</td><td class=\"ac\" data-label=\"Exemple\">في البيتِ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Cas\">جزم</td><td class=\"ac\" data-label=\"Marque\">سكون</td><td data-label=\"Emplois principaux\">مضارع بعد جوازم</td><td class=\"ac\" data-label=\"Exemple\">لم يكتبْ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">3 · Les marques secondaires <span class=\"ar\">العلامات الفرعية</span></h3>\n      <p>Certaines catégories n'utilisent pas les voyelles simples mais des lettres ou la présence/chute du نون.</p>\n      <div class=\"tbl-wrap\"><table class=\"grid th-mauve\">\n        <thead><tr><th>Catégorie</th><th class=\"ac\">رفع</th><th class=\"ac\">نصب</th><th class=\"ac\">جرّ / جزم</th></tr></thead>\n        <tbody>\n          <tr><td data-label=\"Catégorie\">المثنّى</td><td class=\"ac\" data-label=\"رفع\">ألف</td><td class=\"ac\" data-label=\"نصب\">ياء</td><td class=\"ac\" data-label=\"جرّ / جزم\">ياء</td></tr>\n          <tr><td data-label=\"Catégorie\">جمع المذكّر السالم</td><td class=\"ac\" data-label=\"رفع\">واو</td><td class=\"ac\" data-label=\"نصب\">ياء</td><td class=\"ac\" data-label=\"جرّ / جزم\">ياء</td></tr>\n          <tr><td data-label=\"Catégorie\">جمع المؤنّث السالم</td><td class=\"ac\" data-label=\"رفع\">ضمّة</td><td class=\"ac\" data-label=\"نصب\">كسرة</td><td class=\"ac\" data-label=\"جرّ / جزم\">كسرة</td></tr>\n          <tr><td data-label=\"Catégorie\">الأسماء الخمسة</td><td class=\"ac\" data-label=\"رفع\">واو</td><td class=\"ac\" data-label=\"نصب\">ألف</td><td class=\"ac\" data-label=\"جرّ / جزم\">ياء</td></tr>\n          <tr><td data-label=\"Catégorie\">الممنوع من الصرف</td><td class=\"ac\" data-label=\"رفع\">ضمّة</td><td class=\"ac\" data-label=\"نصب\">فتحة</td><td class=\"ac\" data-label=\"جرّ / جزم\">فتحة</td></tr>\n          <tr><td data-label=\"Catégorie\">الأفعال الخمسة</td><td class=\"ac\" data-label=\"رفع\">ثبوت النون</td><td class=\"ac\" data-label=\"نصب\">حذف النون</td><td class=\"ac\" data-label=\"جرّ / جزم\">حذف النون</td></tr>\n          <tr><td data-label=\"Catégorie\">المضارع معتلّ الآخر</td><td class=\"ac\" data-label=\"رفع\">ضمّة مقدّرة</td><td class=\"ac\" data-label=\"نصب\">فتحة</td><td class=\"ac\" data-label=\"جرّ / جزم\">حذف حرف العلّة</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">4 · Le مضارع en 3 états <span class=\"ar\">إعراب المضارع</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-sage\">\n        <thead><tr><th class=\"ac\">État</th><th class=\"ac\">Outils</th><th>Marque</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"État\">مرفوع</td><td class=\"ac\" data-label=\"Outils\">(aucun devant)</td><td data-label=\"Marque\">ضمّة / ثبوت النون</td><td class=\"ac\" data-label=\"Exemple\">يكتبُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"État\">منصوب</td><td class=\"ac\" data-label=\"Outils\">أنْ · لنْ · كي · حتّى · لام التعليل · إذَن</td><td data-label=\"Marque\">فتحة / حذف النون</td><td class=\"ac\" data-label=\"Exemple\">لن يكتبَ</td></tr>\n          <tr><td class=\"ac\" data-label=\"État\">مجزوم</td><td class=\"ac\" data-label=\"Outils\">لم · لمّا · لام الأمر · لا الناهية · أدوات الشرط</td><td data-label=\"Marque\">سكون / حذف العلّة / حذف النون</td><td class=\"ac\" data-label=\"Exemple\">لم يكتبْ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">5 · Le verbe et le temps <span class=\"ar\">الفعل والزمن</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-gold\">\n        <thead><tr><th class=\"ac\">Temps</th><th>Construction</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Temps\">الماضي</td><td data-label=\"Construction\">مبنيّ (فتح · سكون · ضمّ)</td><td class=\"ac\" data-label=\"Exemple\">كتَبَ · كتبْتُ · كتبُوا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Temps\">المضارع</td><td data-label=\"Construction\">معرب — إلّا مع نون النسوة / التوكيد (مبنيّ)</td><td class=\"ac\" data-label=\"Exemple\">يكتبُ</td></tr>\n          <tr><td class=\"ac\" data-label=\"Temps\">الأمر</td><td data-label=\"Construction\">مبنيّ toujours</td><td class=\"ac\" data-label=\"Exemple\">اُكتُبْ</td></tr>\n        </tbody>\n      </table></div>\n\n      <h3 class=\"sub\">6 · Les deux groupes de نواسخ <span class=\"ar\">كان و إنّ</span></h3>\n      <div class=\"tbl-wrap\"><table class=\"grid th-coral\">\n        <thead><tr><th class=\"ac\">Groupe</th><th>Effet</th><th class=\"ac\">Exemple</th></tr></thead>\n        <tbody>\n          <tr><td class=\"ac\" data-label=\"Groupe\">كان وأخواتها</td><td data-label=\"Effet\">ترفع الاسم · تنصب الخبر</td><td class=\"ac\" data-label=\"Exemple\">كان الجوُّ لطيفًا</td></tr>\n          <tr><td class=\"ac\" data-label=\"Groupe\">إنّ وأخواتها</td><td data-label=\"Effet\">تنصب الاسم · ترفع الخبر</td><td class=\"ac\" data-label=\"Exemple\">إنّ الجوَّ لطيفٌ</td></tr>\n        </tbody>\n      </table></div>\n      <p style=\"margin:.6em 0 .2em\"><b>Sœurs de كان</b> :</p>\n      <div class=\"pills\">\n        <span class=\"pill\">كان</span><span class=\"pill\">صار</span><span class=\"pill\">أصبح</span><span class=\"pill\">أمسى</span><span class=\"pill\">أضحى</span>\n        <span class=\"pill\">ظلَّ</span><span class=\"pill\">بات</span><span class=\"pill\">ليس</span><span class=\"pill\">مازال</span><span class=\"pill\">مادام</span>\n      </div>\n      <p style=\"margin:.6em 0 .2em\"><b>Sœurs de إنّ</b> :</p>\n      <div class=\"pills\">\n        <span class=\"pill\">إنّ <b>certes</b></span><span class=\"pill\">أنّ <b>que</b></span><span class=\"pill\">كأنّ <b>comme si</b></span>\n        <span class=\"pill\">لكنّ <b>mais</b></span><span class=\"pill\">ليت <b>si seulement</b></span><span class=\"pill\">لعلّ <b>peut-être</b></span>\n      </div>\n      <div class=\"note\">Effet <b>inversé</b> : كان agit sur le خبر (نصب), إنّ agit sur l'اسم/المبتدأ (نصب).</div>\n\n      <h3 class=\"sub\">7 · Les 7 défini &amp; l'indéfini <span class=\"ar\">المعارف والنكرة</span></h3>\n      <div class=\"pills\">\n        <span class=\"pill\">الضمير</span><span class=\"pill\">العَلَم</span><span class=\"pill\">اسم الإشارة</span>\n        <span class=\"pill\">الاسم الموصول</span><span class=\"pill\">المعرّف بـ ال</span><span class=\"pill\">المضاف إلى معرفة</span>\n        <span class=\"pill\">النكرة المقصودة بالنداء</span>\n      </div>\n      <div class=\"note\">Si aucune de ces 7 marques n'est présente → le nom est نكرة (souvent avec تنوين).</div>\n\n      <h3 class=\"sub\">La méthode d'i'râb en 4 étapes <span class=\"ar\">خطوات الإعراب</span></h3>\n      <div class=\"recap coral\">\n        <div class=\"rt\">Méthode</div>\n        <ol style=\"padding-inline-start:20px;margin:4px 0\">\n          <li>Identifier le <b>type de mot</b> : اسم · فعل · حرف.</li>\n          <li>Déterminer sa <b>fonction</b> dans la phrase (مبتدأ، فاعل، مفعول…).</li>\n          <li>En déduire le <b>cas</b> : رفع · نصب · جرّ · جزم.</li>\n          <li>Donner la <b>marque</b> — أصلية (voyelle) ou فرعية — selon la catégorie du mot.</li>\n        </ol>\n      </div>"}],"quiz":[{"id":"s3-m0","c":1,"d":"f","t":"qcm","q":"Quelles sont les deux grandes catégories de phrases présentées dans le cours ?","o":["Phrase courte et phrase longue","Phrase nominale et phrase verbale","Phrase affirmative et phrase négative","Phrase simple et phrase interrogative"],"a":[1],"j":"Les deux catégories sont la phrase nominale et la phrase verbale.","cat":"qcm"},{"id":"s3-m1","c":1,"d":"m","t":"qcm","q":"Quel critère de base permet de déterminer la nature d’une phrase ?","o":["Sa longueur","Sa traduction française","Son commencement grammatical","Son nombre de mots"],"a":[2],"j":"On observe en premier lieu le commencement grammatical de la phrase.","cat":"qcm"},{"id":"s3-m2","c":1,"d":"m","t":"qcm","q":"Lequel de ces éléments peut commencer une phrase nominale ?","o":["Uniquement un nom propre","Uniquement un pronom","Un nom, une construction équivalente à un nom d’action ou certaines particules","Uniquement un adjectif"],"a":[2],"j":"Le cours présente trois grands cas pour la phrase nominale.","cat":"qcm"},{"id":"s3-m3","c":1,"d":"m","t":"qcm","q":"Lorsque le verbe précède un sujet nominal pluriel explicitement mentionné, quelle règle a été rappelée ?","o":["Le verbe doit obligatoirement être au pluriel","Le verbe reste au singulier","Le sujet disparaît","Le verbe devient un nom"],"a":[1],"j":"Dans cette construction, le verbe reste au singulier.","cat":"qcm"},{"id":"s3-m4","c":1,"d":"f","t":"qcm","q":"Quels sont les deux éléments fondamentaux d’une phrase nominale simple ?","o":["Le verbe et le sujet","Le sujet et le complément d’objet","Le mubtada et le khabar","Le verbe et l’adjectif"],"a":[2],"j":"Le mubtada et le khabar constituent les deux éléments fondamentaux présentés dans le cours.","cat":"qcm"},{"id":"s3-m5","c":1,"d":"m","t":"qcm","q":"Pourquoi le professeur recommande-t-il de répondre systématiquement aux questions des textes ?","o":["Uniquement pour apprendre le vocabulaire par cœur","Pour éviter d’étudier la grammaire","Pour pratiquer la construction de phrases et comprendre le fonctionnement de l’arabe","Uniquement pour apprendre les dialogues par cœur"],"a":[2],"j":"Les exercices transforment la connaissance théorique en pratique réelle de la langue.","cat":"qcm"},{"id":"s3-m6","c":2,"d":"f","t":"qcm","q":"Quelle est la fonction du khabar ?","o":["Il indique toujours une action passée","Il donne l’information à propos du mubtada","Il transforme la phrase en phrase verbale","Il désigne toujours une personne"],"a":[1],"j":"Le khabar fournit l’information à propos du mubtada.","cat":"qcm"},{"id":"s3-m7","c":2,"d":"m","t":"qcm","q":"Quel est le cas grammatical du mubtada et du khabar selon la règle étudiée ?","o":["Tous deux sont au raf‘","Le premier est au nasb et le second au jarr","Tous deux sont au jazm","Leur cas est toujours différent"],"a":[0],"j":"Les deux sont marfū‘ selon la règle fondamentale étudiée.","cat":"qcm"},{"id":"s3-m8","c":2,"d":"m","t":"qcm","q":"Quelle est la règle de base concernant la détermination du mubtada ?","o":["Il doit toujours être indéfini","Il doit normalement être défini","Il doit toujours être un nom propre","Il doit toujours comporter l’article défini"],"a":[1],"j":"La règle de base veut que le mubtada soit défini.","cat":"qcm"},{"id":"s3-m9","c":2,"d":"m","t":"qcm","q":"Quelles sont les trois grandes formes du khabar étudiées ?","o":["Passé, présent et futur","Masculin, féminin et duel","Mufrad, phrase et shibhu jumla","Nom propre, pronom et démonstratif"],"a":[2],"j":"Le khabar peut être mufrad, une phrase ou un shibhu jumla.","cat":"qcm"},{"id":"s3-m10","c":2,"d":"m","t":"qcm","q":"Dans quel cas un élément de la phrase nominale peut-il être supprimé ?","o":["Lorsqu’il est déjà suffisamment connu grâce au contexte","Uniquement lorsqu’il est au pluriel","Uniquement dans une question","Jamais"],"a":[0],"j":"Un élément connu peut être omis lorsque le contexte suffit à le comprendre.","cat":"qcm"},{"id":"s3-m11","c":2,"d":"m","t":"qcm","q":"Si le mubtada est au duel dans la règle d’accord étudiée, comment doit être le khabar ?","o":["Au singulier","Au pluriel","Au duel","Il doit être supprimé"],"a":[2],"j":"L’accord en nombre impose également le duel au khabar.","cat":"qcm"},{"id":"s3-m12","c":3,"d":"f","t":"qcm","q":"Quel est l’objectif principal de l’i‘rāb ?","o":["Traduire chaque mot en français","Déterminer les fonctions grammaticales et la flexion des mots","Transformer toutes les phrases nominales en phrases verbales","Mémoriser uniquement le vocabulaire"],"a":[1],"j":"L’i‘rāb consiste à déterminer les fonctions grammaticales et les marques de flexion.","cat":"qcm"},{"id":"s3-m13","c":3,"d":"m","t":"qcm","q":"Quel est le cas grammatical du mubtada et du khabar ?","o":["Tous deux sont toujours au jarr","Le mubtada est au nasb et le khabar au jarr","Tous deux sont au raf‘","Leur cas ne peut jamais être déterminé"],"a":[2],"j":"Le mubtada et le khabar sont tous deux marfū‘.","cat":"qcm"},{"id":"s3-m14","c":3,"d":"m","t":"qcm","q":"Que signifie « mufrad » lorsqu’on classe les formes du khabar dans ce cours ?","o":["Obligatoirement un mot au singulier","Un khabar qui n’est ni une phrase ni un shibhu jumla","Un nom obligatoirement masculin","Une phrase contenant un seul verbe"],"a":[1],"j":"Dans cette classification, mufrad signifie que le khabar n’est ni une phrase ni un shibhu jumla.","cat":"qcm"},{"id":"s3-m15","c":3,"d":"f","t":"qcm","q":"Lorsqu’un verbe apparaît dans une phrase, quel élément faut-il rechercher ?","o":["Son sujet","Un deuxième mubtada","Une préposition","Un nom interrogatif"],"a":[0],"j":"Le réflexe donné : lorsqu’il y a un verbe, il faut rechercher son sujet.","cat":"qcm"},{"id":"s3-m16","c":3,"d":"m","t":"qcm","q":"Lequel constitue un shibhu jumla ?","o":["Uniquement un adjectif","Uniquement une phrase verbale","Un circonstanciel ou une construction prépositionnelle","Uniquement un nom propre"],"a":[2],"j":"Le shibhu jumla comprend notamment le circonstanciel et la construction prépositionnelle.","cat":"qcm"},{"id":"s3-m17","c":3,"d":"d","t":"qcm","q":"Que faut-il faire lorsqu’une phrase nominale entière sert de khabar ?","o":["Ne pas analyser son contenu","Analyser ses éléments internes puis considérer l’ensemble comme khabar du premier mubtada","Transformer son premier mot en verbe","Supprimer le premier mubtada"],"a":[1],"j":"La phrase interne est analysée puis l’ensemble reçoit la fonction de khabar.","cat":"qcm"},{"id":"s3-m18","c":4,"d":"m","t":"qcm","q":"Avec les nombres de 3 à 10, si le nom compté est masculin, quelle forme doit prendre le nombre ?","o":["Masculine","Féminine","Toujours au duel","Le genre n’a aucune importance"],"a":[1],"j":"Avec un nom masculin, le nombre de 3 à 10 prend la forme féminine (opposition de genre).","cat":"qcm"},{"id":"s3-m19","c":4,"d":"d","t":"qcm","q":"Sous quelle forme apparaît le nom compté après un nombre de 3 à 10 dans les règles étudiées ?","o":["Singulier et au raf‘","Duel et au naṣb","Pluriel et au jarr","Singulier et au jarr"],"a":[2],"j":"Le nom compté est au pluriel et au cas indirect (majrūr, kasra).","cat":"qcm"},{"id":"s3-m20","c":4,"d":"m","t":"qcm","q":"Pour déterminer le genre du nombre, que faut-il examiner ?","o":["Le genre du mot français","Le genre grammatical du nom arabe compté","La longueur du mot","La place du verbe"],"a":[1],"j":"Il faut regarder le genre grammatical du mot arabe.","cat":"qcm"},{"id":"s3-m21","c":4,"d":"m","t":"qcm","q":"Que faut-il connaître pour répondre correctement à de nombreux exercices numériques ?","o":["Seulement le singulier du nom","Seulement la traduction française","Le genre et le pluriel du nom","Uniquement la forme du nombre"],"a":[2],"j":"Il faut notamment connaître le genre et le pluriel du nom.","cat":"qcm"},{"id":"s3-m22","c":4,"d":"f","t":"qcm","q":"Quel type de question exprime le mot « kam » ?","o":["Une interrogation sur le lieu","Une interrogation sur le temps","Une interrogation sur la quantité","Une interrogation sur l’identité"],"a":[2],"j":"« Kam » sert à demander une quantité : « combien ? ».","cat":"qcm"},{"id":"s3-m23","c":4,"d":"m","t":"qcm","q":"Pourquoi la pratique est-elle particulièrement importante dans ce chapitre ?","o":["Parce que les règles ne p
