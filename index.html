/* ---------------------------------------------------------------- 1 */
{n:1, t:'Pourquoi apprendre l’arabe ? La méthode', ar:'مُقَدِّمَةٌ فِي اللُّغَةِ العَرَبِيَّةِ', html:`
<p class="lead">L'arabe est la langue du <b>Coran</b>, de la <b>Sunna</b>, des invocations et de toute la <b>science religieuse</b>. Pour comprendre réellement sa religion — et pas seulement réciter — il faut entrer dans cette langue.</p>
<div class="txt"><div class="body">إِنَّا أَنزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَّعَلَّكُمْ تَعْقِلُونَ</div><div class="src">« Nous l'avons fait descendre, un Coran en arabe, afin que vous raisonniez. » — Yūsuf, 2 · Le cours cite aussi Ash-Shu‘arā’ 195 : <span class="ar">بِلِسَانٍ عَرَبِيٍّ مُّبِينٍ</span> « en une langue arabe très claire ».</div></div>

<h3 class="sub">Quel arabe apprend-on ? <span class="ar">الفُصْحَى</span></h3>
<div class="roads">
  <div class="road nom"><div class="top">العَرَبِيَّةُ الفُصْحَى</div><div class="q">L'arabe <b>littéraire / classique</b></div><div class="q">Langue du Coran, du hadith, des livres, des médias. Ses règles sont partagées par tous.</div></div>
  <div class="road verb"><div class="top">اللَّهَجَات</div><div class="q">Les <b>dialectes</b></div><div class="q">Marocain, égyptien, saoudien… Ils varient d'un pays à l'autre : ce n'est pas l'objet du cours.</div></div>
</div>

<h3 class="sub">Les 4 compétences <span class="ar">المَهَارَاتُ الأَرْبَعُ</span></h3>
<div class="schema cols-4">
  <div class="scard"><div class="top">الاِسْتِمَاعُ</div><div class="mid">Écouter</div><div class="fr-s">distinguer chaque son</div></div>
  <div class="scard"><div class="top">القِرَاءَةُ</div><div class="mid">Lire</div><div class="fr-s">d'abord des textes vocalisés</div></div>
  <div class="scard"><div class="top">الكَلَامُ</div><div class="mid">Parler</div><div class="fr-s">même avec peu de mots</div></div>
  <div class="scard"><div class="top">الكِتَابَةُ</div><div class="mid">Écrire</div><div class="fr-s">de droite à gauche</div></div>
</div>

<h3 class="sub">Pourquoi les sons sont si importants</h3>
<p>Changer un seul son peut <b>changer le sens</b>. Celui qui récite le Coran avec de telles fautes, sans chercher à les corriger, déforme le sens des mots.</p>
<div class="exs">
  <div class="ex1"><span class="a">أَحَدٌ</span><span class="t">aḥadun</span><span class="f">« Unique » (Qul huwa Llāhu aḥad)</span></div>
  <div class="ex1"><span class="a">أَسَدٌ</span><span class="t">asadun</span><span class="f">« un lion » — un seul son change tout !</span></div>
</div>

<h3 class="sub">Les conseils du Cheikh</h3>
<div class="rule">
  <div><b>Écouter avant de parler</b> — prendre modèle sur des émissions, des récitations, des dialogues.</div>
  <div><b>Essayer, même avec des erreurs</b> — mieux vaut parler, se tromper et corriger que se taire.</div>
  <div><b>Composer des phrases simples</b> au début, puis les enrichir petit à petit.</div>
  <div><b>Communiquer, même seul</b> — traduire dans sa tête les expressions du quotidien.</div>
  <div><b>Tenir un cahier de vocabulaire</b> : c'est ton dictionnaire personnel (dans cette appli : les flashcards).</div>
</div>
<div class="clair"><div class="ct">En clair</div><p>L'arabe n'est <b>pas</b> une langue difficile : il faut de la <b>motivation</b>, une <b>bonne méthode</b> et du <b>temps régulier</b>. Quelques minutes par jour valent mieux qu'une longue séance par mois.</p></div>

<h3 class="sub">Objectifs du niveau 1</h3>
<ul>
  <li>Reconnaître et prononcer correctement <b>tous les sons</b> de l'alphabet, surtout ceux absents du français.</li>
  <li>Acquérir une <b>base de vocabulaire</b> et connaître la syntaxe de la phrase simple.</li>
  <li>Lire un <b>texte vocalisé</b> et écrire des phrases courtes de droite à gauche.</li>
  <li>Utiliser l'arabe au quotidien (école, marché…), bien lire le <b>Coran et les hadiths</b>, et se familiariser avec les termes de la culture islamique.</li>
</ul>
<div class="recap sage"><div class="rt">Le savais-tu ?</div><p>L'arabe est une langue <b>sémitique</b> : la plupart des mots sont construits sur une <b>racine de trois consonnes</b> (ك ت ب → écrire, livre, bureau…). Tu verras cela au cours 14.</p></div>`},

/* ---------------------------------------------------------------- 2 */
{n:2, t:'L’alphabet arabe', ar:'الحُرُوفُ الهِجَائِيَّةُ', html:`
<p class="lead">L'alphabet arabe compte <b>28 lettres</b>, et ce sont <b>toutes des consonnes</b>. Les voyelles s'écrivent avec de petits signes (cours 3 et 4).</p>
<div class="schema cols-4">
  <div class="scard"><div class="top">٢٨</div><div class="mid">28 lettres</div><div class="fr-s">toutes consonnes</div></div>
  <div class="scard"><div class="top">←</div><div class="mid">Droite → gauche</div><div class="fr-s">on écrit et on lit à partir de la droite</div></div>
  <div class="scard"><div class="top">بـ ـبـ ـب</div><div class="mid">Lettres attachées</div><div class="fr-s">la forme change selon la position</div></div>
  <div class="scard"><div class="top">كتب</div><div class="mid">Pas de majuscule</div><div class="fr-s">et on écrit ce qu'on entend</div></div>
</div>

<h3 class="sub">Les 28 lettres <span class="ar">أ ب ت ث</span></h3>
<p class="faint" style="font-size:.84rem">Touche une lettre pour l'entendre. L'outil <a href="#/outils/alphabet">Alphabet</a> montre les 4 formes de chaque lettre.</p>
<div class="letters">
  ${'ا|alif ب|bā’ ت|tā’ ث|thā’ ج|jīm ح|ḥā’ خ|khā’ د|dāl ذ|dhāl ر|rā’ ز|zāy س|sīn ش|shīn ص|ṣād ض|ḍād ط|ṭā’ ظ|ẓā’ ع|‘ayn غ|ghayn ف|fā’ ق|qāf ك|kāf ل|lām م|mīm ن|nūn ه|hā’ و|wāw ي|yā’'.split(' ').map(x => { const [g,n] = x.split('|'); return '<div class="lt"><div class="g">'+g+'</div><small>'+n+'</small></div>'; }).join('')}
</div>

<h3 class="sub">Des familles de lettres : ce sont les points qui changent tout</h3>
<div class="tbl-wrap"><table class="grid th-sage"><thead><tr><th>Corps commun</th><th class="ac">Lettres</th><th>Comment les distinguer</th></tr></thead><tbody>
  <tr><td>Le « bateau »</td><td class="ac">ب ت ث</td><td>1 point dessous · 2 points dessus · 3 points dessus</td></tr>
  <tr><td>Le « crochet »</td><td class="ac">ج ح خ</td><td>point dedans · aucun point · point dessus</td></tr>
  <tr><td>Le petit angle</td><td class="ac">د ذ</td><td>sans point · avec un point</td></tr>
  <tr><td>La virgule</td><td class="ac">ر ز</td><td>sans point · avec un point</td></tr>
  <tr><td>Les dents</td><td class="ac">س ش</td><td>sans point · 3 points</td></tr>
  <tr><td>La boucle (emphatiques)</td><td class="ac">ص ض</td><td>sans point · avec un point</td></tr>
  <tr><td>La boucle haute</td><td class="ac">ط ظ</td><td>sans point · avec un point</td></tr>
  <tr><td>L'œil ouvert</td><td class="ac">ع غ</td><td>sans point · avec un point</td></tr>
  <tr><td>La tête ronde</td><td class="ac">ف ق</td><td>1 point (f) · 2 points (q)</td></tr>
</tbody></table></div>

<h3 class="sub">Les sons qui n'existent pas en français</h3>
<p>Le danger : remplacer un son arabe par le son français le plus proche. Il faut <b>écouter finement</b> puis <b>articuler exactement</b>.</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th class="ac">Lettre</th><th>Nom</th><th>Comment le prononcer</th></tr></thead><tbody>
  <tr><td class="ac">ث</td><td>thā’</td><td>« th » anglais de <i>think</i>, langue entre les dents</td></tr>
  <tr><td class="ac">ذ</td><td>dhāl</td><td>« th » anglais de <i>that</i></td></tr>
  <tr><td class="ac">ح</td><td>ḥā’</td><td>« h » soufflé, chaud, du milieu de la gorge</td></tr>
  <tr><td class="ac">خ</td><td>khā’</td><td>« kh » rauque (jota espagnole)</td></tr>
  <tr><td class="ac">ع</td><td>‘ayn</td><td>son guttural, contraction du fond de la gorge</td></tr>
  <tr><td class="ac">غ</td><td>ghayn</td><td>« r » grasseyé parisien</td></tr>
  <tr><td class="ac">ق</td><td>qāf</td><td>« k » frappé très au fond (≠ ك)</td></tr>
  <tr><td class="ac">ص ض ط ظ</td><td>emphatiques</td><td>s, d, t, dh « lourds » : langue plaquée, son grave. ض est la lettre propre à l'arabe (« la langue du ḍād »).</td></tr>
</tbody></table></div>

<h3 class="sub">Les 6 lettres qui ne s'attachent pas à la suivante <span class="ar">ا د ذ ر ز و</span></h3>
<p>Elles se collent à la lettre <b>d'avant</b>, jamais à celle <b>d'après</b>. Cela crée de petits « blancs » à l'intérieur des mots.</p>
<div class="pills"><span class="pill"><b>ا</b> alif</span><span class="pill"><b>د</b> dāl</span><span class="pill"><b>ذ</b> dhāl</span><span class="pill"><b>ر</b> rā’</span><span class="pill"><b>ز</b> zāy</span><span class="pill"><b>و</b> wāw</span></div>
<div class="exs">
  <div class="ex1"><span class="a">أَسَدٌ</span><span class="t">asadun</span><span class="f">« un lion » : أ ne s'attache pas à س, puis س s'attache à د</span></div>
  <div class="ex1"><span class="a">وَرْدَةٌ</span><span class="t">wardatun</span><span class="f">« une fleur » : و, ر et د ne s'attachent pas à gauche</span></div>
  <div class="ex1"><span class="a">يَدٌ</span><span class="t">yadun</span><span class="f">« une main »</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Une lettre arabe a jusqu'à <b>4 formes</b> : isolée, au début, au milieu, à la fin. Le <b>son ne change jamais</b> : seul le dessin s'adapte pour se coller aux voisines.</p></div>
<div class="note">Exercice : copie 10 lettres avec leurs formes début / milieu / fin et note si elles s'attachent à la suivante.</div>`},

/* ---------------------------------------------------------------- 3 */
{n:3, t:'Les voyelles courtes et le sukūn', ar:'الحَرَكَاتُ وَالسُّكُونُ', html:`
<p class="lead">Une <b>consonne</b> se forme avec un obstacle (lèvres, langue, gorge). Une <b>voyelle</b>, c'est l'air qui sort librement. En arabe, la consonne a <b>besoin d'une voyelle</b> pour être prononcée : ce sont les <span class="arword">حَرَكَات</span> (« mouvements »).</p>
<div class="hats">
  <div class="hat h-nasb"><div class="v">بَ</div><div class="nm">فَتْحَةٌ</div><div class="say"><b>fatḥa</b> · son « a » court · petit trait <b>au-dessus</b></div></div>
  <div class="hat h-raf"><div class="v">بُ</div><div class="nm">ضَمَّةٌ</div><div class="say"><b>ḍamma</b> · son « ou » court · petit wāw <b>au-dessus</b></div></div>
  <div class="hat h-jarr"><div class="v">بِ</div><div class="nm">كَسْرَةٌ</div><div class="say"><b>kasra</b> · son « i » court · petit trait <b>en dessous</b></div></div>
  <div class="hat h-jazm"><div class="v">بْ</div><div class="nm">سُكُونٌ</div><div class="say"><b>sukūn</b> · <b>aucune</b> voyelle : on ferme la syllabe</div></div>
</div>
<div class="warn"><div class="ct">Attention</div><p>Les voyelles courtes sont <b>courtes</b> : بَ se lit « ba », pas « baa ». Dis « su », « tu », pas « sou- » prolongé.</p></div>

<h3 class="sub">Entraîne-toi sur l'alphabet</h3>
<p>La consonne reste la même, seule la voyelle change :</p>
<div class="pills"><span class="pill">بَ بُ بِ بْ</span><span class="pill">تَ تُ تِ تْ</span><span class="pill">سَ سُ سِ سْ</span><span class="pill">قَ قُ قِ قْ</span><span class="pill">عَ عُ عِ عْ</span><span class="pill">خَ خُ خِ خْ</span></div>

<h3 class="sub">Le sukūn : fermer la syllabe</h3>
<div class="exs">
  <div class="ex1"><span class="a">أَمْ · إِمْ · أُمْ</span><span class="t">am · im · um</span><span class="f">on entend la fermeture sur م</span></div>
  <div class="ex1"><span class="a">كَلْبٌ</span><span class="t">kal-bun</span><span class="f">« un chien » : le sukūn sur ل évite « kala- »</span></div>
</div>

<h3 class="sub">Syllabe = consonne + voyelle</h3>
<div class="breakdown"><div class="bd-phrase">كِتَابٌ</div><div class="bd-words">
  <div class="bd-word r-action"><span class="w">كِ</span><span class="role">ki</span><span class="fr">ك + kasra</span></div>
  <div class="bd-word r-info"><span class="w">تَا</span><span class="role">tā</span><span class="fr">ت + fatḥa + alif (voyelle longue, cours 4)</span></div>
  <div class="bd-word r-sujet"><span class="w">بٌ</span><span class="role">bun</span><span class="fr">ب + tanwīn (cours 5)</span></div>
</div></div>

<h3 class="sub">Changer une voyelle change le mot</h3>
<div class="exs">
  <div class="ex1"><span class="a">كَتَبَ</span><span class="t">kataba</span><span class="f">« il a écrit »</span></div>
  <div class="ex1"><span class="a">كُتِبَ</span><span class="t">kutiba</span><span class="f">« il a été écrit » — mêmes consonnes, autres voyelles</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Fatḥa = <b>a</b> (dessus), ḍamma = <b>ou</b> (dessus), kasra = <b>i</b> (dessous), sukūn = <b>rien</b>. Maîtrise d'abord ba/bu/bi sur tout l'alphabet avant de lire des mots.</p></div>`},

/* ---------------------------------------------------------------- 4 */
{n:4, t:'Les voyelles longues et les salutations', ar:'حُرُوفُ المَدِّ', html:`
<p class="lead">Chaque voyelle courte a sa <b>voyelle longue</b>. On l'obtient en ajoutant une <b>lettre d'allongement</b> (حَرْفُ مَدٍّ) après la consonne. L'arabe a donc <b>6 voyelles</b> : 3 courtes et 3 longues.</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th>Voyelle courte</th><th class="ac">+ lettre</th><th class="ac">Exemple</th><th>Son</th></tr></thead><tbody>
  <tr><td>fatḥa (a)</td><td class="ac">ا alif</td><td class="ac">بَا</td><td><b>bā</b> — « a » long</td></tr>
  <tr><td>kasra (i)</td><td class="ac">ي yā’</td><td class="ac">بِي</td><td><b>bī</b> — « i » long</td></tr>
  <tr><td>ḍamma (u)</td><td class="ac">و wāw</td><td class="ac">بُو</td><td><b>bū</b> — « ou » long</td></tr>
</tbody></table></div>
<div class="recap sky"><div class="rt">Une équipe soudée</div><p>L'<b>alif</b> va toujours avec la <b>fatḥa</b>, le <b>yā’</b> avec la <b>kasra</b>, le <b>wāw</b> avec la <b>ḍamma</b>.</p></div>

<h3 class="sub">La règle d'or</h3>
<div class="rule">
  <div><b>On allonge quand la lettre d'allongement est écrite</b> — ne pas allonger est une faute de lecture.</div>
  <div><b>On n'allonge pas sans elle</b> — dire « rā » sans alif, c'est une faute.</div>
</div>
<p>Dans le Coran, respecte chaque allongement :</p>
<div class="pills"><span class="pill">العَ<b>ا</b>لَمِينَ</span><span class="pill">النَّ<b>ا</b>سِ</span><span class="pill">المَ<b>ا</b>عُ<b>و</b>نَ</span><span class="pill">صَ<b>ا</b>دِقِ<b>ي</b>نَ</span><span class="pill">التَّكَ<b>ا</b>ثُرُ</span></div>

<h3 class="sub">S'arrêter sur un mot : le waqf</h3>
<p>En arabe, on ne s'arrête <b>jamais sur une voyelle courte</b> : à la pause, on la remplace par un <b>sukūn</b>.</p>
<div class="exs"><div class="ex1"><span class="a">كَيْفَ الحَالُ ← كَيْفَ الحَالْ</span><span class="t">kayfa l-ḥāl</span><span class="f">en fin de phrase, on dit « l-ḥāl », pas « l-ḥālu »</span></div></div>

<h3 class="sub">Premier dialogue : se saluer <span class="ar">التَّحِيَّةُ</span></h3>
<div class="dlg">
  <div class="ln"><span class="who">Khālid</span><span class="a">السَّلَامُ عَلَيْكُمْ</span><span class="f">Que la paix soit sur vous.</span></div>
  <div class="ln"><span class="who">Bakr</span><span class="a">وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللهِ</span><span class="f">Et sur vous la paix et la miséricorde d'Allah.</span></div>
  <div class="ln"><span class="who">Khālid</span><span class="a">اِسْمِي خَالِدٌ، مَا اسْمُكَ؟</span><span class="f">Je m'appelle Khālid, comment t'appelles-tu ?</span></div>
  <div class="ln"><span class="who">Bakr</span><span class="a">اِسْمِي بَكْرٌ</span><span class="f">Je m'appelle Bakr.</span></div>
  <div class="ln"><span class="who">Khālid</span><span class="a">كَيْفَ الحَالُ؟</span><span class="f">Comment vas-tu ?</span></div>
  <div class="ln"><span class="who">Bakr</span><span class="a">أَنَا بِخَيْرٍ، وَالحَمْدُ لِلَّهِ</span><span class="f">Je vais bien, louange à Allah.</span></div>
</div>
<div class="warn"><div class="ct">Masculin / féminin</div><p>À un homme : <span class="arword">مَا اسْمُكَ؟</span> (ismu<b>ka</b>). À une femme : <span class="arword">مَا اسْمُكِ؟</span> (ismu<b>ki</b>). Si l'on demande <span class="arword">مَا اسْمُكِ؟</span>, la réponse est forcément un prénom féminin : <span class="arword">اِسْمِي فَاطِمَةُ</span>.</p></div>
<div class="clair"><div class="ct">En clair</div><p>« Lorsqu'on vous salue, rendez une salutation meilleure ou égale » (An-Nisā’ 86) : à <b>as-salāmu ‘alaykum</b>, on répond en ajoutant <b>wa raḥmatu-llāh</b>.</p></div>`},

/* ---------------------------------------------------------------- 5 */
{n:5, t:'Écrire selon la position et le tanwīn', ar:'التَّنْوِينُ', html:`
<p class="lead">Une même lettre change de <b>forme</b> selon sa place dans le mot, mais <b>jamais de son</b>. Ce cours introduit aussi le <b>tanwīn</b>, la marque de l'indéfini (« un, une »).</p>
<div class="tbl-wrap"><table class="grid th-sage"><thead><tr><th>Lettre</th><th class="ac">Isolée</th><th class="ac">Début</th><th class="ac">Milieu</th><th class="ac">Fin</th></tr></thead><tbody>
  <tr><td>bā’</td><td class="ac">ب</td><td class="ac">بـ</td><td class="ac">ـبـ</td><td class="ac">ـب</td></tr>
  <tr><td>mīm</td><td class="ac">م</td><td class="ac">مـ</td><td class="ac">ـمـ</td><td class="ac">ـم</td></tr>
  <tr><td>fā’</td><td class="ac">ف</td><td class="ac">فـ</td><td class="ac">ـفـ</td><td class="ac">ـف</td></tr>
  <tr><td>wāw (ne s'attache pas à gauche)</td><td class="ac">و</td><td class="ac">و</td><td class="ac">ـو</td><td class="ac">ـو</td></tr>
</tbody></table></div>
<div class="exs">
  <div class="ex1"><span class="a">بَيْتُنَا</span><span class="t">baytunā</span><span class="f">« notre maison » — ب au début</span></div>
  <div class="ex1"><span class="a">مَكْتَبَةٌ</span><span class="t">maktabatun</span><span class="f">« une bibliothèque » — ب au milieu</span></div>
  <div class="ex1"><span class="a">كُتُبٌ</span><span class="t">kutubun</span><span class="f">« des livres » — ب à la fin</span></div>
  <div class="ex1"><span class="a">حَاسُوبٌ</span><span class="t">ḥāsūbun</span><span class="f">« un ordinateur » — ب isolé car و ne s'attache pas</span></div>
</div>

<h3 class="sub">Le tanwīn <span class="ar">نُونُ التَّنْوِينِ</span></h3>
<p>Le tanwīn, c'est la voyelle courte <b>doublée</b> en fin de nom. On ne l'écrit pas avec un ن, mais on <b>entend un « n »</b>.</p>
<div class="hats c3">
  <div class="hat h-raf"><div class="v">بٌ</div><div class="nm">تَنْوِينُ الضَّمِّ</div><div class="say">« -oun » · boun</div></div>
  <div class="hat h-nasb"><div class="v">بًا</div><div class="nm">تَنْوِينُ الفَتْحِ</div><div class="say">« -an » · ban (+ alif écrit, non prononcé)</div></div>
  <div class="hat h-jarr"><div class="v">بٍ</div><div class="nm">تَنْوِينُ الكَسْرِ</div><div class="say">« -in » · bin</div></div>
</div>
<div class="warn"><div class="ct">Règle d'écriture</div><p>Avec le tanwīn <b>-an</b>, on ajoute un <b>alif</b> qui ne se prononce pas : <span class="arword">كِتَابًا</span>. Exception : pas d'alif après une tā’ marbūṭa (<span class="arword">سَيَّارَةً</span>).</p></div>
<h3 class="sub">Le tanwīn = « un / une »</h3>
<div class="exs">
  <div class="ex1"><span class="a">كِتَابٌ</span><span class="t">kitābun</span><span class="f">un livre</span></div>
  <div class="ex1"><span class="a">قَلَمٌ</span><span class="t">qalamun</span><span class="f">un stylo</span></div>
  <div class="ex1"><span class="a">مَسْجِدٌ</span><span class="t">masjidun</span><span class="f">une mosquée</span></div>
  <div class="ex1"><span class="a">رَجُلٌ · رَجُلًا · رَجُلٍ</span><span class="t">rajulun / -an / -in</span><span class="f">un homme (la fin change selon la fonction)</span></div>
</div>

<h3 class="sub">Les possessifs « mon » et « notre »</h3>
<p>En arabe, le possessif ne se met pas devant : il se <b>colle à la fin</b> du nom.</p>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th>Sens</th><th class="ac">Suffixe</th><th class="ac">Exemple</th><th>Traduction</th></tr></thead><tbody>
  <tr><td>mon / ma</td><td class="ac">ـِي</td><td class="ac">بَيْتِي · أُمِّي</td><td>ma maison · ma mère</td></tr>
  <tr><td>notre</td><td class="ac">ـنَا</td><td class="ac">بَيْتُنَا · أُمُّنَا</td><td>notre maison · notre mère</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p>Le tanwīn (<b>-un, -an, -in</b>) indique qu'un nom est <b>indéfini</b>. On le perd dès qu'on ajoute « le » (ال) ou un possessif : <span class="arword">بَيْتٌ</span> une maison → <span class="arword">بَيْتِي</span> ma maison.</p></div>
<div class="note">Conseil du Cheikh : écris chaque mot nouveau dans un carnet — c'est ton dictionnaire personnel.</div>`},

/* ---------------------------------------------------------------- 6 */
{n:6, t:'Hādhā / hādhihi : masculin et féminin', ar:'هٰذَا · هٰذِهِ', html:`
<p class="lead"><span class="arword">هٰذَا</span> et <span class="arword">هٰذِهِ</span> veulent dire « ceci / voici » (proche). On choisit selon le <b>genre du nom en arabe</b>.</p>
<div class="roads">
  <div class="road verb"><div class="top">هٰذَا</div><div class="q">hādhā · <b>masculin</b></div><div class="ex">هٰذَا بَيْتٌ</div><div class="q">Voici une maison.</div></div>
  <div class="road nom"><div class="top">هٰذِهِ</div><div class="q">hādhihi · <b>féminin</b></div><div class="ex">هٰذِهِ سَيَّارَةٌ</div><div class="q">Voici une voiture.</div></div>
</div>

<h3 class="sub">Reconnaître le genre</h3>
<div class="rule">
  <div>Le <b>masculin</b> n'a pas de marque particulière : <span class="arword">قَلَمٌ، بَابٌ، كِتَابٌ</span>.</div>
  <div>Le <b>féminin</b> se reconnaît le plus souvent au <b>tā’ marbūṭa</b> final <span class="arword">ة</span> (« t » fermé) : <span class="arword">طَاوِلَةٌ، شَجَرَةٌ، قِطَّةٌ</span>.</div>
  <div>Exceptions : certains noms sont féminins sans ة, comme <span class="arword">نَارٌ</span> (le feu) ; et le sens l'emporte pour les personnes : <span class="arword">أُمٌّ</span> (mère), <span class="arword">بِنْتٌ</span> (fille).</div>
</div>
<div class="warn"><div class="ct">Piège</div><p>Le genre français ne compte pas ! <b>Maison, mosquée, porte, chaise</b> sont <b>masculins</b> en arabe → <span class="arword">هٰذَا بَيْتٌ، هٰذَا مَسْجِدٌ، هٰذَا بَابٌ، هٰذَا كُرْسِيٌّ</span>. Et <span class="arword">بَيْتٌ</span> finit par un <b>t ouvert</b> (ت), pas par ة.</p></div>

<h3 class="sub">Exemples</h3>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">هٰذَا (masculin)</th><th class="ac">هٰذِهِ (féminin)</th></tr></thead><tbody>
  <tr><td class="ac">هٰذَا مِفْتَاحٌ <small class="faint">une clé</small></td><td class="ac">هٰذِهِ طَاوِلَةٌ <small class="faint">une table</small></td></tr>
  <tr><td class="ac">هٰذَا سَرِيرٌ <small class="faint">un lit</small></td><td class="ac">هٰذِهِ نَافِذَةٌ <small class="faint">une fenêtre</small></td></tr>
  <tr><td class="ac">هٰذَا أَسَدٌ <small class="faint">un lion</small></td><td class="ac">هٰذِهِ قِطَّةٌ <small class="faint">une chatte</small></td></tr>
  <tr><td class="ac">هٰذَا مُعَلِّمٌ <small class="faint">un enseignant</small></td><td class="ac">هٰذِهِ مُمَرِّضَةٌ <small class="faint">une infirmière</small></td></tr>
  <tr><td class="ac">هٰذَا عَلَمٌ <small class="faint">un drapeau</small></td><td class="ac">هٰذِهِ شَجَرَةٌ <small class="faint">un arbre</small></td></tr>
  <tr><td class="ac">هٰذَا خَالِدٌ <small class="faint">Khālid</small></td><td class="ac">هٰذِهِ سَارَةُ <small class="faint">Sāra</small></td></tr>
</tbody></table></div>

<h3 class="sub">Présenter sa famille</h3>
<div class="schema cols-3">
  <div class="scard"><div class="top">هٰذَا أَبِي</div><div class="fr-s">Voici mon père</div></div>
  <div class="scard"><div class="top">هٰذَا جَدِّي</div><div class="fr-s">Voici mon grand-père</div></div>
  <div class="scard"><div class="top">هٰذَا أَخِي</div><div class="fr-s">Voici mon frère</div></div>
  <div class="scard"><div class="top">هٰذِهِ أُمِّي</div><div class="fr-s">Voici ma mère</div></div>
  <div class="scard"><div class="top">هٰذِهِ جَدَّتِي</div><div class="fr-s">Voici ma grand-mère</div></div>
  <div class="scard"><div class="top">هٰذِهِ أُخْتِي</div><div class="fr-s">Voici ma sœur</div></div>
</div>
<h3 class="sub">Demander « qu'est-ce que c'est ? »</h3>
<div class="dlg">
  <div class="ln"><span class="who">Question</span><span class="a">مَا هٰذَا؟</span><span class="f">Qu'est-ce que c'est ? (masc.)</span></div>
  <div class="ln"><span class="who">Réponse</span><span class="a">هٰذَا قَلَمٌ</span><span class="f">C'est un stylo.</span></div>
  <div class="ln"><span class="who">Question</span><span class="a">مَا هٰذِهِ؟</span><span class="f">Qu'est-ce que c'est ? (fém.)</span></div>
  <div class="ln"><span class="who">Réponse</span><span class="a">هٰذِهِ شَجَرَةٌ</span><span class="f">C'est un arbre.</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Regarde la <b>fin du nom</b> : <span class="arword">ة</span> → <span class="arword">هٰذِهِ</span> ; pas de <span class="arword">ة</span> → <span class="arword">هٰذَا</span> (sauf exceptions). Et réutilise toujours le démonstratif dans ta réponse.</p></div>`},

/* ---------------------------------------------------------------- 7 */
{n:7, t:'Poser une question : mā, man, hal, a', ar:'أَدَوَاتُ الاِسْتِفْهَامِ', html:`
<p class="lead">Quatre petits mots suffisent pour poser tes premières questions. Deux demandent une <b>identification</b>, deux une <b>confirmation</b> (oui / non).</p>
<div class="roads">
  <div class="road verb"><div class="top">مَا</div><div class="q">« qu'est-ce que ? » · pour les <b>choses et animaux</b></div><div class="ex">مَا هٰذَا؟ هٰذَا جَمَلٌ</div><div class="q">C'est un chameau.</div></div>
  <div class="road nom"><div class="top">مَنْ</div><div class="q">« qui ? » · uniquement pour les <b>personnes</b></div><div class="ex">مَنْ هٰذَا؟ هٰذَا طَبِيبٌ</div><div class="q">C'est un médecin.</div></div>
</div>

<h3 class="sub">Questions oui / non : هَلْ et أَ</h3>
<p>On place <span class="arword">هَلْ</span> ou <span class="arword">أَ</span> devant la phrase. Les deux veulent dire « est-ce que » et se répondent par <span class="arword">نَعَمْ</span> (oui) ou <span class="arword">لَا</span> (non).</p>
<div class="dlg">
  <div class="ln"><span class="who">Q</span><span class="a">أَهٰذَا بَيْتٌ؟</span><span class="f">Est-ce une maison ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">لَا، هٰذَا مَسْجِدٌ</span><span class="f">Non, c'est une mosquée.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">هَلْ هٰذَا قَمِيصٌ؟</span><span class="f">Est-ce une chemise ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">نَعَمْ، هٰذَا قَمِيصٌ</span><span class="f">Oui, c'est une chemise.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">أَهٰذَا كَلْبٌ؟</span><span class="f">Est-ce un chien ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">لَا، هٰذَا قِطٌّ</span><span class="f">Non, c'est un chat.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">هَلْ أَنْتَ طَبِيبٌ؟</span><span class="f">Es-tu médecin ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">لَا، أَنَا طَالِبٌ</span><span class="f">Non, je suis étudiant.</span></div>
</div>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th class="ac">Outil</th><th>Sens</th><th>On attend…</th></tr></thead><tbody>
  <tr><td class="ac">مَا</td><td>Qu'est-ce que ?</td><td>le nom d'une chose / d'un animal</td></tr>
  <tr><td class="ac">مَنْ</td><td>Qui ?</td><td>une personne : nom, métier…</td></tr>
  <tr><td class="ac">هَلْ</td><td>Est-ce que ?</td><td><span class="ar">نَعَمْ</span> / <span class="ar">لَا</span> + la bonne phrase</td></tr>
  <tr><td class="ac">أَ</td><td>Est-ce que ? (collé au mot)</td><td><span class="ar">نَعَمْ</span> / <span class="ar">لَا</span> + la bonne phrase</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p><span class="arword">مَا هٰذَا؟</span> = « Qu'est-ce que c'est ? » (tu ne sais pas). <span class="arword">أَهٰذَا…؟</span> = « Est-ce bien… ? » (tu veux une confirmation). Après <span class="arword">لَا</span>, donne toujours la phrase correcte.</p></div>`},

/* ---------------------------------------------------------------- 8 */
{n:8, t:'Les pronoms isolés, se présenter, chiffres 0–10', ar:'الضَّمَائِرُ المُنْفَصِلَةُ', html:`
<p class="lead">Les <span class="arword">ضَمَائِر</span> sont les pronoms. Il en existe deux familles : les <b>isolés</b> (écrits seuls) et les <b>suffixes</b> (collés au mot). Commençons par les isolés.</p>
<div class="tbl-wrap"><table class="grid th-sage"><thead><tr><th class="ac">Pronom</th><th>Sens</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td class="ac">أَنَا</td><td>je (m. et f.)</td><td class="ac">أَنَا طَالِبٌ · أَنَا طَالِبَةٌ</td></tr>
  <tr><td class="ac">أَنْتَ</td><td>tu (homme)</td><td class="ac">أَنْتَ مُهَنْدِسٌ</td></tr>
  <tr><td class="ac">أَنْتِ</td><td>tu (femme)</td><td class="ac">أَنْتِ مُهَنْدِسَةٌ</td></tr>
  <tr><td class="ac">هُوَ</td><td>il</td><td class="ac">هُوَ مُدَرِّسٌ</td></tr>
  <tr><td class="ac">هِيَ</td><td>elle</td><td class="ac">هِيَ مُدَرِّسَةٌ</td></tr>
</tbody></table></div>
<div class="warn"><div class="ct">Ne pas confondre</div><p><span class="arword">هٰذَا / هٰذِهِ</span> montrent (« voici »), <span class="arword">هُوَ / هِيَ</span> remplacent (« il / elle »). Le métier se met au féminin avec <span class="arword">ة</span> : <span class="arword">طَبِيبٌ ← طَبِيبَةٌ</span>.</p></div>

<h3 class="sub">Se présenter <span class="ar">التَّعَارُفُ</span></h3>
<div class="dlg">
  <div class="ln"><span class="who">Q</span><span class="a">مَنْ أَنْتَ؟</span><span class="f">Qui es-tu ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَنَا أَحْمَدُ</span><span class="f">Je suis Aḥmad.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">مِنْ أَيْنَ أَنْتَ؟</span><span class="f">D'où viens-tu ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَنَا مِنْ فَرَنْسَا</span><span class="f">Je viens de France.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">مَا جِنْسِيَّتُكَ؟</span><span class="f">Quelle est ta nationalité ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَنَا مَغْرِبِيٌّ</span><span class="f">Je suis marocain.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">أَيْنَ تَسْكُنُ؟</span><span class="f">Où habites-tu ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَسْكُنُ فِي بَارِيسَ</span><span class="f">J'habite à Paris.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">كَمْ عُمْرُكَ؟</span><span class="f">Quel âge as-tu ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">عُمْرِي خَمْسٌ وَعِشْرُونَ سَنَةً</span><span class="f">J'ai 25 ans.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">مَاذَا تَعْمَلُ؟</span><span class="f">Que fais-tu (comme travail) ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">أَنَا مُهَنْدِسٌ</span><span class="f">Je suis ingénieur.</span></div>
</div>
<p>À une femme : <span class="arword">مَنْ أَنْتِ؟ مَا جِنْسِيَّتُكِ؟ أَيْنَ تَسْكُنِينَ؟ كَمْ عُمْرُكِ؟ مَاذَا تَعْمَلِينَ؟</span></p>

<h3 class="sub">La nationalité : le yā’ de relation <span class="ar">يَاءُ النِّسْبَةِ</span></h3>
<p>On ajoute <span class="arword">ـِيٌّ</span> au nom du pays (sans ال) pour former l'adjectif, et <span class="arword">ـِيَّةٌ</span> au féminin.</p>
<div class="exs">
  <div class="ex1"><span class="a">فَرَنْسَا ← فَرَنْسِيٌّ / فَرَنْسِيَّةٌ</span><span class="f">France → français / française</span></div>
  <div class="ex1"><span class="a">المَغْرِبُ ← مَغْرِبِيٌّ</span><span class="f">Maroc → marocain</span></div>
  <div class="ex1"><span class="a">الجَزَائِرُ ← جَزَائِرِيَّةٌ</span><span class="f">Algérie → algérienne</span></div>
  <div class="ex1"><span class="a">السُّعُودِيَّةُ ← سُعُودِيٌّ</span><span class="f">Arabie saoudite → saoudien</span></div>
</div>

<h3 class="sub">Les chiffres de 0 à 10 <span class="ar">الأَعْدَادُ</span></h3>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Chiffre</th><th class="ac">En lettres</th><th>Lecture</th></tr></thead><tbody>
  <tr><td class="ac">٠ · 0</td><td class="ac">صِفْرٌ</td><td>ṣifr</td></tr><tr><td class="ac">١ · 1</td><td class="ac">وَاحِدٌ</td><td>wāḥid</td></tr>
  <tr><td class="ac">٢ · 2</td><td class="ac">اِثْنَانِ</td><td>ithnān</td></tr><tr><td class="ac">٣ · 3</td><td class="ac">ثَلَاثَةٌ</td><td>thalātha</td></tr>
  <tr><td class="ac">٤ · 4</td><td class="ac">أَرْبَعَةٌ</td><td>arba‘a</td></tr><tr><td class="ac">٥ · 5</td><td class="ac">خَمْسَةٌ</td><td>khamsa</td></tr>
  <tr><td class="ac">٦ · 6</td><td class="ac">سِتَّةٌ</td><td>sitta</td></tr><tr><td class="ac">٧ · 7</td><td class="ac">سَبْعَةٌ</td><td>sab‘a</td></tr>
  <tr><td class="ac">٨ · 8</td><td class="ac">ثَمَانِيَةٌ</td><td>thamāniya</td></tr><tr><td class="ac">٩ · 9</td><td class="ac">تِسْعَةٌ</td><td>tis‘a</td></tr>
  <tr><td class="ac">١٠ · 10</td><td class="ac">عَشَرَةٌ</td><td>‘ashara</td></tr>
</tbody></table></div>
<div class="recap sky"><div class="rt">Pour aller plus loin</div><p>Les nombres 3 à 10 ont un accord « inversé » : <span class="arword">ثَلَاثَةُ رِجَالٍ</span> (3 hommes) mais <span class="arword">ثَلَاثُ نِسَاءٍ</span> (3 femmes). Règle détaillée au S2 et dans l'outil <a href="#/outils/nombres">Nombres</a>.</p></div>`},

/* ---------------------------------------------------------------- 9 */
{n:9, t:'La chadda, lettres solaires et lunaires, le défini', ar:'الشَّدَّةُ · الحُرُوفُ الشَّمْسِيَّةُ وَالقَمَرِيَّةُ', html:`
<h3 class="sub" style="margin-top:0">La chadda <span class="ar">الشَّدَّةُ ّ</span></h3>
<p>La chadda est un petit signe en forme de « w » posé <b>sur</b> la lettre. Elle signifie que la consonne est <b>doublée</b> : on la prononce deux fois (une fois avec sukūn, une fois avec sa voyelle). Elle n'apparaît <b>jamais en début de mot</b>.</p>
<div class="exs">
  <div class="ex1"><span class="a">مَدَّ</span><span class="t">mad-da</span><span class="f">= مَدْدَ — et non « mada »</span></div>
  <div class="ex1"><span class="a">أُمِّي</span><span class="t">um-mī</span><span class="f">ma mère</span></div>
  <div class="ex1"><span class="a">مُعَلِّمٌ</span><span class="t">mu‘al-limun</span><span class="f">un enseignant</span></div>
  <div class="ex1"><span class="a">كُلُّ</span><span class="t">kul-lu</span><span class="f">tout, chaque (≠ kulu)</span></div>
</div>

<h3 class="sub">De l'indéfini au défini <span class="ar">النَّكِرَةُ ← المَعْرِفَةُ</span></h3>
<p>Pour dire « le / la / les », on ajoute <span class="arword">ال</span> au début et on <b>retire le tanwīn</b> : les deux ne vont <b>jamais</b> ensemble.</p>
<div class="schema cols-2">
  <div class="scard"><div class="top">كِتَابٌ ← الكِتَابُ</div><div class="fr-s">un livre → le livre</div></div>
  <div class="scard"><div class="top">بَيْتٌ ← البَيْتُ</div><div class="fr-s">une maison → la maison</div></div>
</div>

<h3 class="sub">Lettres lunaires et solaires</h3>
<p>Le « l » de <span class="arword">ال</span> se prononce ou non selon la <b>première lettre</b> du mot.</p>
<div class="roads">
  <div class="road verb"><div class="top">القَمَرِيَّةُ ☾</div><div class="q">Lettres <b>lunaires</b> (14) : on <b>entend</b> « al »</div><div class="ex">الْقَمَرُ · al-qamaru</div><div class="q">le ل porte un sukūn</div></div>
  <div class="road nom"><div class="top">الشَّمْسِيَّةُ ☀</div><div class="q">Lettres <b>solaires</b> (14) : le « l » <b>disparaît</b>, la lettre suivante est doublée</div><div class="ex">الشَّمْسُ · ash-shamsu</div><div class="q">la lettre porte une chadda</div></div>
</div>
<p style="margin:12px 0 4px"><b>Les 14 lettres lunaires ☾</b></p>
<div class="pills">${'أ ب ج ح خ ع غ ف ق ك م ه و ي'.split(' ').map(x => '<span class="pill">'+x+'</span>').join('')}</div>
<p style="margin:10px 0 4px"><b>Les 14 lettres solaires ☀</b></p>
<div class="pills">${'ت ث د ذ ر ز س ش ص ض ط ظ ل ن'.split(' ').map(x => '<span class="pill"><b>'+x+'</b></span>').join('')}</div>
<div class="recap gold"><div class="rt">Astuce mnémotechnique</div><p>Toutes les lettres <b>lunaires</b> sont dans la phrase : <span class="arword">اِبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ</span> (« Recherche ton pèlerinage et crains qu'il soit vain »). Si la lettre n'y est pas, elle est solaire !</p></div>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Indéfini</th><th class="ac">Défini</th><th>Lecture</th></tr></thead><tbody>
  <tr><td class="ac">بَيْتٌ وَاسِعٌ</td><td class="ac">الْبَيْتُ الْوَاسِعُ</td><td>al-baytu l-wāsi‘u ☾ — la maison spacieuse</td></tr>
  <tr><td class="ac">عَصِيرٌ لَذِيذٌ</td><td class="ac">الْعَصِيرُ اللَّذِيذُ</td><td>al-‘aṣīru l-ladhīdhu — le jus délicieux</td></tr>
  <tr><td class="ac">فُنْدُقٌ جَدِيدٌ</td><td class="ac">الْفُنْدُقُ الْجَدِيدُ</td><td>al-funduqu l-jadīdu ☾ — l'hôtel neuf</td></tr>
  <tr><td class="ac">دَرْسٌ صَعْبٌ</td><td class="ac">الدَّرْسُ الصَّعْبُ</td><td>ad-darsu ṣ-ṣa‘bu ☀ — la leçon difficile</td></tr>
  <tr><td class="ac">رَجُلٌ ذَكِيٌّ</td><td class="ac">الرَّجُلُ الذَّكِيُّ</td><td>ar-rajulu dh-dhakiyyu ☀ — l'homme intelligent</td></tr>
  <tr><td class="ac">شَمْسٌ سَاطِعَةٌ</td><td class="ac">الشَّمْسُ السَّاطِعَةُ</td><td>ash-shamsu s-sāṭi‘atu ☀ — le soleil éclatant</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p>Si tu <b>entends</b> « al » → lettre lunaire. Si tu <b>n'entends pas</b> le « l » et que la lettre suivante est <b>doublée</b> → lettre solaire. Entraîne-toi avec le quiz « Solaire ou lunaire ? » de l'outil <a href="#/outils/alphabet">Alphabet</a>.</p></div>`},

/* ---------------------------------------------------------------- 10 */
{n:10, t:'Où ? Situer dans l’espace, nombres 11–20', ar:'أَيْنَ؟ · ظُرُوفُ المَكَانِ', html:`
<p class="lead"><span class="arword">أَيْنَ</span> (ayna) veut dire « <b>où ?</b> ». On y répond avec un <b>lieu</b> : un adverbe de lieu ou une préposition suivi d'un nom.</p>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Arabe</th><th>Lecture</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">هُنَا</td><td>hunā</td><td>ici</td></tr>
  <tr><td class="ac">هُنَاكَ</td><td>hunāka</td><td>là-bas</td></tr>
  <tr><td class="ac">أَمَامَ</td><td>amāma</td><td>devant</td></tr>
  <tr><td class="ac">خَلْفَ / وَرَاءَ</td><td>khalfa / warā’a</td><td>derrière</td></tr>
  <tr><td class="ac">فَوْقَ</td><td>fawqa</td><td>au-dessus, sur</td></tr>
  <tr><td class="ac">تَحْتَ</td><td>taḥta</td><td>sous, en dessous</td></tr>
  <tr><td class="ac">يَمِينَ / يَسَارَ</td><td>yamīna / yasāra</td><td>à droite / à gauche</td></tr>
  <tr><td class="ac">دَاخِلَ / خَارِجَ</td><td>dākhila / khārija</td><td>à l'intérieur / à l'extérieur de</td></tr>
  <tr><td class="ac">بِجَانِبِ</td><td>bi-jānibi</td><td>à côté de</td></tr>
  <tr><td class="ac">بَيْنَ</td><td>bayna</td><td>entre</td></tr>
</tbody></table></div>

<h3 class="sub">La règle d'or : le nom qui suit prend la kasra</h3>
<p>Ces adverbes se terminent par une fatḥa et forment une <b>annexion</b> avec le nom qui suit : ce nom est <b>majrūr</b> (voyelle <b>i</b>).</p>
<div class="breakdown"><div class="bd-phrase">الكِتَابُ فَوْقَ الطَّاوِلَةِ</div><div class="bd-words">
  <div class="bd-word r-sujet"><span class="w">الكِتَابُ</span><span class="role">de quoi on parle</span><span class="fr">le livre</span></div>
  <div class="bd-word r-outil"><span class="w">فَوْقَ</span><span class="role">adverbe de lieu</span><span class="fr">sur (finit par fatḥa)</span></div>
  <div class="bd-word r-annexe"><span class="w">الطَّاوِلَةِ</span><span class="role">nom qui suit → kasra</span><span class="fr">la table</span></div>
</div></div>
<div class="dlg">
  <div class="ln"><span class="who">Q</span><span class="a">أَيْنَ الوَلَدُ؟</span><span class="f">Où est l'enfant ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">الوَلَدُ تَحْتَ الطَّاوِلَةِ</span><span class="f">L'enfant est sous la table.</span></div>
  <div class="ln"><span class="who">R</span><span class="a">الوَلَدُ خَلْفَ الكُرْسِيِّ</span><span class="f">L'enfant est derrière la chaise.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">أَيْنَ المُدَرِّسُ؟</span><span class="f">Où est le professeur ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">المُدَرِّسُ فِي الفَصْلِ</span><span class="f">Le professeur est dans la classe.</span></div>
  <div class="ln"><span class="who">Q</span><span class="a">أَيْنَ البَيْتُ؟</span><span class="f">Où est la maison ?</span></div>
  <div class="ln"><span class="who">R</span><span class="a">البَيْتُ بَيْنَ المَسْجِدِ وَالمَدْرَسَةِ</span><span class="f">La maison est entre la mosquée et l'école.</span></div>
</div>
<div class="warn"><div class="ct">Attention à la liaison</div><p>Lettre solaire : <span class="arword">تَحْتَ الطَّاوِلَةِ</span> se lit « taḥta ṭ-ṭāwilati ». Lettre lunaire : <span class="arword">فَوْقَ الْمَاءِ</span> se lit « fawqa l-mā’i ».</p></div>

<h3 class="sub">Le mot et la phrase <span class="ar">الكَلِمَةُ وَالكَلَامُ</span></h3>
<p>Un <b>mot</b> (<span class="arword">كَلِمَةٌ</span>) peut être un nom, un verbe ou une particule. Une <b>phrase</b> (<span class="arword">كَلَامٌ</span>) assemble des mots avec un sens complet. En arabe, on commence très souvent par le <b>verbe</b> :</p>
<div class="exs">
  <div class="ex1"><span class="a">كَتَبَ زَيْدٌ</span><span class="t">kataba Zaydun</span><span class="f">Zayd a écrit.</span></div>
  <div class="ex1"><span class="a">خَرَجَ مُحَمَّدٌ</span><span class="t">kharaja Muḥammadun</span><span class="f">Muḥammad est sorti.</span></div>
  <div class="ex1"><span class="a">سَافَرَ أَبِي</span><span class="t">sāfara abī</span><span class="f">Mon père est parti en voyage.</span></div>
  <div class="ex1"><span class="a">كَتَبَتْ أُمِّي</span><span class="t">katabat ummī</span><span class="f">Ma mère a écrit — verbe au féminin (ـَتْ)</span></div>
  <div class="ex1"><span class="a">اِبْتَسَمَ عَلِيٌّ</span><span class="t">ibtasama ‘Aliyyun</span><span class="f">‘Alī a souri.</span></div>
</div>

<h3 class="sub">Les nombres de 11 à 20</h3>
<p>De 11 à 19, on <b>compose</b> l'unité avec « dix » (<span class="arword">عَشَرَ</span>).</p>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Nombre</th><th class="ac">En lettres</th><th>Lecture</th></tr></thead><tbody>
  <tr><td class="ac">١١</td><td class="ac">أَحَدَ عَشَرَ</td><td>aḥada ‘ashara</td></tr>
  <tr><td class="ac">١٢</td><td class="ac">اِثْنَا عَشَرَ</td><td>ithnā ‘ashara</td></tr>
  <tr><td class="ac">١٣</td><td class="ac">ثَلَاثَةَ عَشَرَ</td><td>thalāthata ‘ashara</td></tr>
  <tr><td class="ac">١٤</td><td class="ac">أَرْبَعَةَ عَشَرَ</td><td>arba‘ata ‘ashara</td></tr>
  <tr><td class="ac">١٥</td><td class="ac">خَمْسَةَ عَشَرَ</td><td>khamsata ‘ashara</td></tr>
  <tr><td class="ac">١٦ · ١٧</td><td class="ac">سِتَّةَ عَشَرَ · سَبْعَةَ عَشَرَ</td><td>sittata · sab‘ata ‘ashara</td></tr>
  <tr><td class="ac">١٨ · ١٩</td><td class="ac">ثَمَانِيَةَ عَشَرَ · تِسْعَةَ عَشَرَ</td><td>thamāniyata · tis‘ata ‘ashara</td></tr>
  <tr><td class="ac">٢٠</td><td class="ac">عِشْرُونَ</td><td>‘ishrūna</td></tr>
</tbody></table></div>
<div class="exs"><div class="ex1"><span class="a">اِشْتَرَيْتُ ثَلَاثَةَ عَشَرَ كِتَابًا</span><span class="f">J'ai acheté treize livres.</span></div></div>
<div class="clair"><div class="ct">En clair</div><p><span class="arword">أَيْنَ</span> → réponds par un lieu. Après <span class="arword">أَمَامَ، خَلْفَ، فَوْقَ، تَحْتَ</span> (et après <span class="arword">فِي، عَلَى، إِلَى</span>), le nom prend toujours la <b>kasra</b>.</p></div>`}
);

<div class="recap mauve" style="margin-top:0"><div class="rt">Rappel</div><p><span class="arword">مَنْ</span> (qui ?) pour les <b>personnes</b> — <span class="arword">مَا</span> (quoi ?) pour les <b>choses et animaux</b>.</p></div>

<h3 class="sub">La famille <span class="ar">الأُسْرَةُ</span></h3>

</div>
<div class="dlg">

/* ---------------------------------------------------------------- 12 */
{n:12, t:'Lafẓ, kalima, kalim, kalām', ar:'اللَّفْظُ · الكَلِمَةُ · الكَلِمُ · الكَلَامُ', html:`
<p class="lead">Premiers termes de grammaire : quatre mots pour décrire ce qu'on prononce, du simple son à la phrase complète.</p>
<div class="tree"><span class="root">اللَّفْظُ</span><div class="arrow">↓</div>
  <div class="branch">
    <div class="leaf"><div class="h">اللَّفْظُ</div><div class="d">tout son formé de lettres arabes, <b>avec ou sans sens</b></div><div class="e">طُطُطُ · بَيْتٌ</div></div>
    <div class="leaf"><div class="h">الكَلِمَةُ</div><div class="d">un lafẓ <b>qui a un sens</b> : un mot</div><div class="e">سَيَّارَةٌ</div></div>
    <div class="leaf"><div class="h">الكَلِمُ</div><div class="d"><b>3 mots ou plus</b>, sens complet ou non</div><div class="e">إِنْ جَاءَ زَيْدٌ…</div></div>
    <div class="leaf"><div class="h">الكَلَامُ</div><div class="d">une phrase au <b>sens complet</b> (2 mots suffisent)</div><div class="e">مُحَمَّدٌ مُجْتَهِدٌ</div></div>
  </div></div>
<div class="bi">
  <div class="fr"><span class="tag">Définitions du cours</span><b>Lafẓ</b> : son comprenant des lettres de l'alphabet, qui a un sens ou non.<br><b>Kalima</b> : lafẓ qui a un sens ; c'est avec elle qu'on construit la phrase.<br><b>Kalim</b> : ce qui est composé de trois mots ou plus, utile ou non.<br><b>Kalām</b> : ce qui est composé de deux mots ou plus et a un sens utile et autonome — « le lafẓ utile sur lequel on peut se taire ».</div>
  <div class="arb"><span class="tag">التَّعْرِيفَاتُ</span>اللَّفْظُ صَوْتٌ مُشْتَمِلٌ عَلَى بَعْضِ الحُرُوفِ الهِجَائِيَّةِ، دَلَّ عَلَى مَعْنًى أَوْ لَا. الكَلِمَةُ لَفْظٌ لَهُ مَعْنًى. الكَلِمُ مَا تَرَكَّبَ مِنْ ثَلَاثِ كَلِمَاتٍ فَأَكْثَرَ. الكَلَامُ اللَّفْظُ المُفِيدُ فَائِدَةً يَحْسُنُ السُّكُوتُ عَلَيْهَا.</div>
</div>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th>Terme</th><th>Nombre de mots</th><th>Sens complet ?</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td>Kalima</td><td>1</td><td>un sens</td><td class="ac">قِطَارٌ</td></tr>
  <tr><td>Kalim</td><td>3 ou plus</td><td>pas forcément</td><td class="ac">إِنْ تَكْثُرِ الصِّنَاعَاتُ…</td></tr>
  <tr><td>Kalām</td><td>2 ou plus</td><td><b>oui</b>, obligatoire</td><td class="ac">البُسْتَانُ جَمِيلٌ</td></tr>
</tbody></table></div>
<h3 class="sub">Teste ton œil</h3>
<div class="exs">
  <div class="ex1"><span class="a">البَيْتُ جَمِيلٌ</span><span class="f"><b>kalām</b> (sens complet) mais <b>pas kalim</b> (seulement 2 mots)</span></div>
  <div class="ex1"><span class="a">إِنْ جَاءَ زَيْدٌ</span><span class="f"><b>kalim</b> (3 mots) mais <b>pas kalām</b> : « si Zayd vient… » — on attend la suite</span></div>
  <div class="ex1"><span class="a">سَافَرَ إِبْرَاهِيمُ إِلَى مَكَّةَ</span><span class="f"><b>kalim</b> (4 mots) <b>et kalām</b> (sens complet)</span></div>
  <div class="ex1"><span class="a">النِّيلُ ثَرْوَةُ مِصْرَ</span><span class="f">« Le Nil est la richesse de l'Égypte » : kalim utile</span></div>
</div>

<h3 class="sub">Dialogue : où vas-tu ?</h3>
<div class="dlg">
  <div class="ln"><span class="who">Salīm</span><span class="a">أَهْلًا وَسَهْلًا يَا حُسَيْنُ</span><span class="f">Bienvenue, Ḥusayn.</span></div>
  <div class="ln"><span class="who">Ḥusayn</span><span class="a">أَهْلًا وَسَهْلًا يَا سَلِيمُ</span><span class="f">Bienvenue, Salīm.</span></div>
  <div class="ln"><span class="who">Salīm</span><span class="a">إِلَى أَيْنَ أَنْتَ ذَاهِبٌ؟</span><span class="f">Où vas-tu ?</span></div>
  <div class="ln"><span class="who">Ḥusayn</span><span class="a">أَنَا ذَاهِبٌ إِلَى المَسْجِدِ</span><span class="f">Je vais à la mosquée.</span></div>
  <div class="ln"><span class="who">Salīm</span><span class="a">هَلِ المَسْجِدُ بَعِيدٌ؟</span><span class="f">La mosquée est-elle loin ?</span></div>
  <div class="ln"><span class="who">Ḥusayn</span><span class="a">لَا، هُوَ قَرِيبٌ مِنْ هُنَا</span><span class="f">Non, elle est proche d'ici.</span></div>
</div>
<div class="clair"><div class="ct">En clair</div><p><b>Kalim</b> = on <b>compte</b> les mots (au moins 3). <b>Kalām</b> = on regarde le <b>sens</b> (il doit être complet). Une phrase peut être l'un, l'autre, ou les deux.</p></div>`},

/* ---------------------------------------------------------------- 13 */
{n:13, t:'Nom, verbe, particule et l’annexion', ar:'الاِسْمُ وَالفِعْلُ وَالحَرْفُ · الإِضَافَةُ', html:`
<p class="lead"><span class="arword">تَنْقَسِمُ الكَلِمَةُ إِلَى ثَلَاثَةِ أَقْسَامٍ : اِسْمٌ، وَفِعْلٌ، وَحَرْفٌ</span> — tout mot arabe est soit un <b>nom</b>, soit un <b>verbe</b>, soit une <b>particule</b>.</p>
<div class="schema cols-3">
  <div class="scard r-sujet"><div class="top">الاِسْمُ</div><div class="mid">Le nom</div><div class="fr-s">a un sens <b>en lui-même</b>, <b>sans temps</b> : personne, chose, animal, lieu, idée</div><div class="ex">أَحْمَدُ · شَاعِرٌ · فَرَسٌ</div></div>
  <div class="scard r-action"><div class="top">الفِعْلُ</div><div class="mid">Le verbe</div><div class="fr-s">une action <b>liée à un temps</b> (passé, présent, impératif)</div><div class="ex">كَتَبَ · يَكْتُبُ · اُكْتُبْ</div></div>
  <div class="scard r-outil"><div class="top">الحَرْفُ</div><div class="mid">La particule</div><div class="fr-s">son sens n'apparaît <b>qu'avec un autre mot</b></div><div class="ex">فِي · مِنْ · عَلَى · وَ</div></div>
</div>
<div class="bi">
  <div class="fr"><span class="tag">Définitions</span><b>Nom</b> : tout mot qui indique un sens en lui-même et n'est pas lié à un temps.<br><b>Verbe</b> : ce qui indique qu'une chose se produit à un moment précis.<br><b>Particule</b> : ce dont le sens n'apparaît complètement qu'avec autre chose.</div>
  <div class="arb"><span class="tag">التَّعْرِيفُ</span>الاِسْمُ : كُلُّ كَلِمَةٍ دَلَّتْ عَلَى مَعْنًى فِي نَفْسِهَا وَلَمْ تَقْتَرِنْ بِزَمَنٍ. الفِعْلُ : مَا دَلَّ عَلَى حُدُوثِ شَيْءٍ فِي زَمَنٍ مُعَيَّنٍ. الحَرْفُ : مَا لَا يَظْهَرُ مَعْنَاهُ كَامِلًا إِلَّا مَعَ غَيْرِهِ.</div>
</div>
<h3 class="sub">Exercice de classement</h3>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">اِسْمٌ (nom)</th><th class="ac">فِعْلٌ (verbe)</th><th class="ac">حَرْفٌ (particule)</th></tr></thead><tbody>
  <tr><td class="ac">كِتَابٌ <small class="faint">livre</small></td><td class="ac">نَجَحَ <small class="faint">il a réussi</small></td><td class="ac">مِنْ <small class="faint">de</small></td></tr>
  <tr><td class="ac">المَسْجِدُ <small class="faint">la mosquée</small></td><td class="ac">يُصَلِّي <small class="faint">il prie</small></td><td class="ac">إِنَّ <small class="faint">certes</small></td></tr>
  <tr><td class="ac">مُحَمَّدٌ</td><td class="ac">صَامَ <small class="faint">il a jeûné</small></td><td class="ac">فِي <small class="faint">dans</small></td></tr>
  <tr><td class="ac">شَمْسٌ <small class="faint">soleil</small></td><td class="ac">نَظَّفَ <small class="faint">il a nettoyé</small></td><td class="ac">إِلَى <small class="faint">vers</small></td></tr>
  <tr><td class="ac">المَدْرَسَةُ <small class="faint">l'école</small></td><td class="ac">يَلْعَبُ <small class="faint">il joue</small></td><td class="ac">هَلْ <small class="faint">est-ce que</small></td></tr>
</tbody></table></div>

<h3 class="sub">Le verbe avec « je » : ـتُ</h3>
<div class="exs">
  <div class="ex1"><span class="a">قَرَأْتُ دَرْسًا</span><span class="f">J'ai lu une leçon.</span></div>
  <div class="ex1"><span class="a">أَكَلْتُ طَعَامًا</span><span class="f">J'ai mangé de la nourriture.</span></div>
  <div class="ex1"><span class="a">شَرِبْتُ عَصِيرًا</span><span class="f">J'ai bu un jus.</span></div>
  <div class="ex1"><span class="a">وَجَدْتُ نُقُودًا</span><span class="f">J'ai trouvé de l'argent.</span></div>
</div>
<p class="faint" style="font-size:.86rem">Le suffixe <span class="arword">ـتُ</span> est un pronom (« je ») : en grammaire il compte comme un <b>nom</b>.</p>

<h3 class="sub">L'annexion <span class="ar">الإِضَافَةُ</span></h3>
<p>Deux noms collés pour dire « le … de … ». Rien ne les sépare.</p>
<div class="breakdown"><div class="bd-phrase">كِتَابُ الطَّالِبِ</div><div class="bd-words">
  <div class="bd-word r-sujet"><span class="w">كِتَابُ</span><span class="role">المُضَافُ — l'annexé</span><span class="fr">jamais de tanwīn, jamais de ال</span></div>
  <div class="bd-word r-annexe"><span class="w">الطَّالِبِ</span><span class="role">المُضَافُ إِلَيْهِ — le complément</span><span class="fr">toujours majrūr (kasra)</span></div>
</div><p class="faint" style="text-align:center;margin:8px 0 0">« le livre de l'étudiant »</p></div>
<div class="exs">
  <div class="ex1"><span class="a">بَابُ البَيْتِ</span><span class="f">la porte de la maison</span></div>
  <div class="ex1"><span class="a">سَعِيدٌ مُدَرِّسُ أَطْفَالٍ</span><span class="f">Sa‘īd est un enseignant d'enfants.</span></div>
  <div class="ex1"><span class="a">مُحَمَّدٌ طَبِيبُ أَسْنَانٍ</span><span class="f">Muḥammad est dentiste (médecin des dents).</span></div>
  <div class="ex1"><span class="a">بَكْرٌ مُدِيرُ فُنْدُقٍ</span><span class="f">Bakr est directeur d'un hôtel.</span></div>
</div>
<div class="warn"><div class="ct">Erreur fréquente</div><p>✅ <span class="arword">مُدَرِّسُ أَطْفَالٍ</span> — ❌ <span class="arword">مُدَرِّسٌ أَطْفَالٍ</span> (le 1ᵉʳ terme ne prend pas de tanwīn). ✅ <span class="arword">أَطْفَالٍ</span> — ❌ <span class="arword">أَطْفَالٌ</span> (le 2ᵉ terme est au cas indirect).</p></div>
<div class="note">Histoire : la grammaire (النَّحْو) est née pour corriger les fautes, jusque dans la lecture du Coran. On rapporte que ‘Alī demanda à Abū al-Aswad ad-Du’alī d'en poser les premières règles.</div>`},

/* ---------------------------------------------------------------- 14 */
{n:14, t:'Naḥw, ṣarf et la balance morphologique', ar:'النَّحْوُ وَالصَّرْفُ · المِيزَانُ الصَّرْفِيُّ', html:`
<div class="roads">
  <div class="road nom"><div class="top">النَّحْوُ</div><div class="q"><b>La phrase</b> : ordre des mots, accords, cas (marfū‘ / manṣūb / majrūr)</div><div class="ex">ذَهَبَ مُحَمَّدٌ · رَأَيْتُ مُحَمَّدًا</div></div>
  <div class="road verb"><div class="top">الصَّرْفُ</div><div class="q"><b>Le mot</b> : sa formation, sa conjugaison, ses schèmes</div><div class="ex">كَتَبَ · يَكْتُبُ · اُكْتُبْ · كَاتِبٌ</div></div>
</div>

<h3 class="sub">La balance <span class="ar">فَ · عَ · لَ</span></h3>
<p>La plupart des mots reposent sur une <b>racine de 3 lettres</b>. Pour comparer leurs formes, on les « pèse » sur le modèle <span class="arword">فَعَلَ</span> : <b>ف</b> = 1ʳᵉ lettre, <b>ع</b> = 2ᵉ, <b>ل</b> = 3ᵉ. Toute lettre <b>ajoutée</b> (<span class="arword">زَائِدٌ</span>) est recopiée sur la balance ; les lettres de base sont l'<span class="arword">أَصْلٌ</span>.</p>
<div class="breakdown"><div class="bd-phrase">مَكْتَبٌ ← مَفْعَلٌ</div><div class="bd-words">
  <div class="bd-word r-outil"><span class="w">مَـ</span><span class="role">lettre ajoutée (zā’id)</span><span class="fr">→ idée de <b>lieu</b></span></div>
  <div class="bd-word r-sujet"><span class="w">ك ت ب</span><span class="role">racine (aṣl) = ف ع ل</span><span class="fr">idée d'écrire</span></div>
</div><p class="faint" style="text-align:center;margin:8px 0 0">« le lieu où l'on écrit » = un bureau</p></div>
<div class="tbl-wrap"><table class="grid th-sage"><thead><tr><th>Racine</th><th class="ac">Mot</th><th class="ac">Balance</th><th>Sens</th></tr></thead><tbody>
  <tr><td>ك ت ب</td><td class="ac">كَتَبَ</td><td class="ac">فَعَلَ</td><td>il a écrit</td></tr>
  <tr><td></td><td class="ac">كَاتِبٌ</td><td class="ac">فَاعِلٌ</td><td>écrivain (celui qui fait)</td></tr>
  <tr><td></td><td class="ac">كِتَابٌ</td><td class="ac">فِعَالٌ</td><td>livre</td></tr>
  <tr><td></td><td class="ac">مَكْتَبَةٌ</td><td class="ac">مَفْعَلَةٌ</td><td>bibliothèque</td></tr>
  <tr><td>د خ ل</td><td class="ac">يَدْخُلُ</td><td class="ac">يَفْعُلُ</td><td>il entre</td></tr>
  <tr><td></td><td class="ac">اُدْخُلْ</td><td class="ac">اُفْعُلْ</td><td>entre !</td></tr>
  <tr><td></td><td class="ac">دُخُولٌ</td><td class="ac">فُعُولٌ</td><td>l'entrée (le fait d'entrer)</td></tr>
  <tr><td>س ج د</td><td class="ac">مَسْجِدٌ</td><td class="ac">مَفْعِلٌ</td><td>mosquée (lieu de prosternation)</td></tr>
  <tr><td></td><td class="ac">سُجُودٌ</td><td class="ac">فُعُولٌ</td><td>prosternation</td></tr>
  <tr><td>ع ل م</td><td class="ac">عِلْمٌ · عَالِمٌ · عُلَمَاءُ</td><td class="ac">فِعْلٌ · فَاعِلٌ · فُعَلَاءُ</td><td>science · savant · savants</td></tr>
</tbody></table></div>

<h3 class="sub">Les verbes de base et les formes augmentées</h3>
<div class="schema cols-3">
  <div class="scard"><div class="top">فَعَلَ</div><div class="ex">كَتَبَ · دَرَسَ · نَصَرَ</div></div>
  <div class="scard"><div class="top">فَعِلَ</div><div class="ex">فَهِمَ · عَلِمَ · حَسِبَ</div></div>
  <div class="scard"><div class="top">فَعُلَ</div><div class="ex">كَبُرَ · حَسُنَ · صَغُرَ</div></div>
</div>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th class="ac">Forme</th><th class="ac">Exemple</th><th>Sens ajouté</th></tr></thead><tbody>
  <tr><td class="ac">فَعَّلَ</td><td class="ac">دَرَّسَ</td><td>enseigner (faire étudier quelqu'un)</td></tr>
  <tr><td class="ac">أَفْعَلَ</td><td class="ac">أَكْرَمَ</td><td>honorer</td></tr>
  <tr><td class="ac">تَفَعَّلَ</td><td class="ac">تَعَلَّمَ</td><td>apprendre (soi-même)</td></tr>
  <tr><td class="ac">اِفْتَعَلَ</td><td class="ac">اِجْتَمَعَ · اِبْتَسَمَ</td><td>se réunir · sourire</td></tr>
  <tr><td class="ac">اِنْفَعَلَ</td><td class="ac">اِنْفَتَحَ</td><td>s'ouvrir</td></tr>
  <tr><td class="ac">اِسْتَفْعَلَ</td><td class="ac">اِسْتَحْسَنَ</td><td>trouver bon</td></tr>
</tbody></table></div>

<h3 class="sub">Trois familles de noms dérivés</h3>
<div class="schema cols-3">
  <div class="scard"><div class="top">المَصْدَرُ</div><div class="mid">Nom d'action</div><div class="ex">كِتَابَةٌ · جُلُوسٌ</div><div class="fr-s">l'écriture · le fait de s'asseoir</div></div>
  <div class="scard"><div class="top">اِسْمُ المَكَانِ</div><div class="mid">Nom de lieu (مَفْعَل)</div><div class="ex">مَلْعَبٌ · مَدْرَسَةٌ</div><div class="fr-s">terrain de jeu · école</div></div>
  <div class="scard"><div class="top">اِسْمُ الآلَةِ</div><div class="mid">Nom d'instrument</div><div class="ex">مِفْتَاحٌ · مِكْنَسَةٌ</div><div class="fr-s">clé (مِفْعَال) · balai (مِفْعَلَة)</div></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Repère la <b>racine</b> (3 lettres), puis regarde ce qui est <b>ajouté</b>. Un <span class="arword">مـ</span> devant = souvent un <b>lieu</b> ; un <span class="arword">ا</span> après la 1ʳᵉ lettre (<span class="arword">فَاعِل</span>) = <b>celui qui fait</b>. Les voyelles comptent aussi dans la pesée.</p></div>`},

/* ---------------------------------------------------------------- 15 */
{n:15, t:'Texte : la définition de la prière', ar:'تَعْرِيفُ الصَّلَاةِ', html:`
<div class="txt"><div class="tt">تَعْرِيفُ الصَّلَاةِ</div><div class="body">الصَّلَاةُ هِيَ الرُّكْنُ الثَّانِي مِنْ أَرْكَانِ الإِسْلَامِ الخَمْسَةِ، وَهِيَ فَرْضٌ عَلَى كُلِّ مُسْلِمٍ. قَالَ رَسُولُ اللهِ ﷺ : «بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ : شَهَادَةِ أَنْ لَا إِلٰهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَالحَجِّ، وَصَوْمِ رَمَضَانَ». فِي اليَوْمِ خَمْسُ صَلَوَاتٍ مَفْرُوضَةٍ : الصُّبْحُ، وَالظُّهْرُ، وَالعَصْرُ، وَالمَغْرِبُ، وَالعِشَاءُ.</div>
<div class="src">Hadith rapporté par al-Bukhārī et Muslim.</div></div>
<details class="sol"><summary>Voir la traduction</summary><div>La prière est le deuxième des cinq piliers de l'islam, et elle est obligatoire pour tout musulman. Le Messager d'Allah ﷺ a dit : « L'islam est bâti sur cinq : attester qu'il n'y a de divinité qu'Allah et que Muḥammad est le Messager d'Allah, accomplir la prière, s'acquitter de la zakāt, le pèlerinage et le jeûne du Ramadan. » Dans la journée, il y a cinq prières obligatoires : l'aube, le midi, l'après-midi, le coucher du soleil et la nuit.</div></details>

<h3 class="sub">Vocabulaire du texte</h3>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">رُكْنٌ ج. أَرْكَانٌ</td><td>pilier / piliers</td></tr>
  <tr><td class="ac">فَرْضٌ</td><td>obligation</td></tr>
  <tr><td class="ac">مَفْرُوضَةٌ</td><td>obligatoire</td></tr>
  <tr><td class="ac">بُنِيَ</td><td>il a été construit, bâti</td></tr>
  <tr><td class="ac">إِقَامَةٌ (إِقَامُ)</td><td>le fait d'accomplir</td></tr>
  <tr><td class="ac">اليَوْمُ</td><td>la journée, le jour</td></tr>
</tbody></table></div>

<h3 class="sub">Ce que le texte nous apprend en grammaire</h3>
<div class="rule">
  <div><b>Annexion</b> : <span class="arword">تَعْرِيفُ الصَّلَاةِ</span> « la définition <i>de</i> la prière » — le 2ᵉ nom à la kasra.</div>
  <div><b>Pronom</b> : <span class="arword">هِيَ</span> renvoie à <span class="arword">الصَّلَاةُ</span>, nom féminin (ة).</div>
  <div><b>Lettre solaire</b> : <span class="arword">الصَّلَاةُ</span> se lit « aṣ-ṣalātu » (le ص est doublé).</div>
  <div><b>Énumération</b> : en arabe on répète <span class="arword">وَ</span> devant chaque élément, là où le français met des virgules.</div>
  <div><b>Pause (waqf)</b> : à l'arrêt, sukūn sur la dernière lettre : <span class="arword">…العِشَاءْ</span>.</div>
</div>

<h3 class="sub">Questions sur le texte <span class="ar">أَجِبْ عَنِ الأَسْئِلَةِ</span></h3>
<details class="sol"><summary><span class="ar">عَرِّفِ الصَّلَاةَ فِي الإِسْلَامِ.</span> — Définis la prière en islam.</summary><div class="ar" style="font-size:1.2rem">الصَّلَاةُ هِيَ الرُّكْنُ الثَّانِي مِنْ أَرْكَانِ الإِسْلَامِ الخَمْسَةِ.</div></details>
<details class="sol"><summary><span class="ar">مَا حُكْمُهَا الشَّرْعِيُّ؟</span> — Quel est son statut ?</summary><div class="ar" style="font-size:1.2rem">هِيَ فَرْضٌ عَلَى كُلِّ مُسْلِمٍ.</div></details>
<details class="sol"><summary><span class="ar">كَمْ عَدَدُ الصَّلَوَاتِ المَفْرُوضَةِ؟</span> — Combien de prières obligatoires ?</summary><div class="ar" style="font-size:1.2rem">فِي اليَوْمِ خَمْسُ صَلَوَاتٍ مَفْرُوضَةٍ.</div></details>
<details class="sol"><summary><span class="ar">اُذْكُرِ الصَّلَوَاتِ المَفْرُوضَةَ.</span> — Cite-les.</summary><div class="ar" style="font-size:1.2rem">الصُّبْحُ، وَالظُّهْرُ، وَالعَصْرُ، وَالمَغْرِبُ، وَالعِشَاءُ.</div></details>
<div class="clair"><div class="ct">En clair</div><p>Réponds toujours par une <b>phrase complète</b> reprise du texte : c'est la meilleure façon de fixer les structures.</p></div>`},

/* ---------------------------------------------------------------- 16 */
{n:16, t:'Les démonstratifs : proche et lointain', ar:'أَسْمَاءُ الإِشَارَةِ', html:`
<p class="lead">Pour choisir le bon démonstratif, trois questions : <b>proche ou loin ?</b> · <b>masculin ou féminin ?</b> · <b>singulier, duel ou pluriel ?</b></p>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th></th><th class="ac">Proche <span class="ar">لِلْقَرِيبِ</span></th><th class="ac">Loin <span class="ar">لِلْبَعِيدِ</span></th></tr></thead><tbody>
  <tr><td>Masculin singulier</td><td class="ac">هٰذَا</td><td class="ac">ذٰلِكَ</td></tr>
  <tr><td>Féminin singulier</td><td class="ac">هٰذِهِ</td><td class="ac">تِلْكَ</td></tr>
  <tr><td>Masculin duel</td><td class="ac">هٰذَانِ</td><td class="ac">ذَانِكَ</td></tr>
  <tr><td>Féminin duel</td><td class="ac">هَاتَانِ</td><td class="ac">تَانِكَ</td></tr>
  <tr><td>Pluriel (m. et f.)</td><td class="ac">هٰؤُلَاءِ</td><td class="ac">أُولٰئِكَ</td></tr>
</tbody></table></div>
<div class="exs">
  <div class="ex1"><span class="a">هٰذَا الطَّالِبُ نَشِيطٌ</span><span class="f">Cet étudiant est actif.</span></div>
  <div class="ex1"><span class="a">ذٰلِكَ المَسْجِدُ هُنَاكَ</span><span class="f">Cette mosquée-là est là-bas.</span></div>
  <div class="ex1"><span class="a">تِلْكَ السَّيَّارَةُ جَدِيدَةٌ</span><span class="f">Cette voiture-là est neuve.</span></div>
  <div class="ex1"><span class="a">هٰذَانِ الطَّالِبَانِ مُجْتَهِدَانِ</span><span class="f">Ces deux étudiants sont appliqués.</span></div>
  <div class="ex1"><span class="a">هَاتَانِ المُمَرِّضَتَانِ لَطِيفَتَانِ</span><span class="f">Ces deux infirmières sont aimables.</span></div>
  <div class="ex1"><span class="a">هٰؤُلَاءِ الرِّجَالُ كُرَمَاءُ</span><span class="f">Ces hommes sont généreux.</span></div>
  <div class="ex1"><span class="a">أُولٰئِكَ الطُّلَّابُ فَائِزُونَ</span><span class="f">Ces étudiants-là sont lauréats.</span></div>
</div>
<div class="warn"><div class="ct">Règle importante</div><p>Un pluriel de <b>choses</b> ou d'<b>animaux</b> s'accorde comme un <b>féminin singulier</b> : <span class="arword">هٰذِهِ مَدَارِسُ</span> « ce sont des écoles », <span class="arword">هٰذِهِ أَسْوَاقٌ</span> « ce sont des marchés ».</p></div>
<div class="schema cols-2"><div class="scard"><div class="top">هُنَا</div><div class="fr-s">ici (proche)</div></div><div class="scard"><div class="top">هُنَاكَ</div><div class="fr-s">là-bas (loin)</div></div></div>

<h3 class="sub">Exercice : complète avec le bon démonstratif</h3>
<details class="sol"><summary><span class="ar">… بَيْتٌ وَاسِعٌ</span></summary><div><span class="arword">هٰذَا</span> بَيْتٌ وَاسِعٌ — masculin singulier.</div></details>
<details class="sol"><summary><span class="ar">… لُعْبَةٌ جَمِيلَةٌ</span></summary><div><span class="arword">هٰذِهِ</span> لُعْبَةٌ جَمِيلَةٌ — féminin (ة).</div></details>
<details class="sol"><summary><span class="ar">… مُمَرِّضَتَانِ رَحِيمَتَانِ</span></summary><div><span class="arword">هَاتَانِ</span> — féminin duel.</div></details>
<details class="sol"><summary><span class="ar">… طُلَّابٌ مُجِدُّونَ</span></summary><div><span class="arword">هٰؤُلَاءِ</span> — pluriel humain.</div></details>
<details class="sol"><summary><span class="ar">… فَلَّاحَانِ نَشِيطَانِ</span></summary><div><span class="arword">هٰذَانِ</span> — masculin duel.</div></details>
<div class="clair"><div class="ct">En clair</div><p>Regarde toujours le <b>nom qui suit</b> : sa terminaison (<span class="arword">ة</span>, <span class="arword">ـَانِ</span>, <span class="arword">ـُونَ</span>, <span class="arword">ـَاتٌ</span>) te dit quel démonstratif choisir.</p></div>`},

/* ---------------------------------------------------------------- 17 */
{n:17, t:'La phrase verbale · ‘Īd al-Aḍḥā', ar:'الجُمْلَةُ الفِعْلِيَّةُ', html:`
<p class="lead">La <span class="arword">جُمْلَةٌ فِعْلِيَّةٌ</span> commence par un <b>verbe</b>. Ses deux piliers obligatoires : le <b>verbe</b> (<span class="arword">الفِعْلُ</span>) et le <b>sujet</b> (<span class="arword">الفَاعِلُ</span>). On peut ajouter un <b>complément</b> (<span class="arword">المَفْعُولُ بِهِ</span>).</p>
<div class="breakdown"><div class="bd-phrase">صَلَّتِ الأُسْرَةُ صَلَاةَ العِيدِ</div><div class="bd-words">
  <div class="bd-word r-action"><span class="w">صَلَّتِ</span><span class="role">le verbe « a prié »</span><span class="fr">au féminin, car le sujet est féminin</span></div>
  <div class="bd-word r-sujet"><span class="w">الأُسْرَةُ</span><span class="role">le sujet (fā‘il)</span><span class="fr">marfū‘ → ḍamma</span></div>
  <div class="bd-word r-cod"><span class="w">صَلَاةَ</span><span class="role">le complément</span><span class="fr">manṣūb → fatḥa</span></div>
  <div class="bd-word r-annexe"><span class="w">العِيدِ</span><span class="role">complément du nom</span><span class="fr">majrūr → kasra</span></div>
</div><p class="faint" style="text-align:center;margin:8px 0 0">« La famille a accompli la prière de la fête. »</p></div>
<div class="rule">
  <div>Le <b>sujet vient après le verbe</b> et prend la <b>ḍamma</b> : <span class="arword">جَاءَ مُحَمَّدٌ</span> « Muḥammad est venu ».</div>
  <div>Le <b>complément</b> prend la <b>fatḥa</b> : <span class="arword">رَأَيْتُ مُحَمَّدًا</span> « j'ai vu Muḥammad ».</div>
  <div>Le verbe s'accorde en <b>genre</b> avec le sujet : <span class="arword">صَلَّى مُحَمَّدٌ</span> / <span class="arword">صَلَّتْ فَاطِمَةُ</span>.</div>
</div>
<div class="tbl-wrap"><table class="grid th-sky"><thead><tr><th class="ac">Phrase</th><th>Traduction</th></tr></thead><tbody>
  <tr><td class="ac">كَتَبَ المُعَلِّمُ الدَّرْسَ</td><td>Le professeur a écrit la leçon.</td></tr>
  <tr><td class="ac">أَكَلَ الطِّفْلُ التُّفَّاحَةَ</td><td>L'enfant a mangé la pomme.</td></tr>
  <tr><td class="ac">قَرَأَ الطَّالِبُ الكِتَابَ</td><td>L'étudiant a lu le livre.</td></tr>
  <tr><td class="ac">شَرِبَ الوَلَدُ الحَلِيبَ</td><td>Le garçon a bu le lait.</td></tr>
  <tr><td class="ac">سَافَرَ المُهَنْدِسُ إِلَى المَدِينَةِ</td><td>L'ingénieur a voyagé vers la ville.</td></tr>
</tbody></table></div>

<h3 class="sub">Le texte : la fête du sacrifice</h3>
<p>La famille rentre joyeuse de la prière de l'Aïd ; la mère explique à ses enfants que la fête accompagne le <b>ḥajj</b> et qu'on sacrifie en suivant la Sunna de « notre père Ibrāhīm ». Allah éprouva Ibrāhīm en lui ordonnant d'immoler son fils. Ibrāhīm consulta son fils :</p>
<div class="txt"><div class="body">يَا بُنَيَّ إِنِّي أَرَىٰ فِي الْمَنَامِ أَنِّي أَذْبَحُكَ فَانظُرْ مَاذَا تَرَىٰ</div><div class="src">« Ô mon fils, je me vois en songe en train de t'immoler ; vois donc ce que tu en penses. » — Aṣ-Ṣāffāt, 102</div></div>
<p>Ismā‘īl accepta avec patience ; au moment du sacrifice, Allah envoya un <b>grand bélier</b> (<span class="arword">كَبْشٌ عَظِيمٌ</span>) à sa place. C'est l'origine du sacrifice de ‘Īd al-Aḍḥā.</p>

<h3 class="sub">Les outils d'interrogation <span class="ar">أَدَوَاتُ الاِسْتِفْهَامِ</span></h3>
<div class="tbl-wrap"><table class="grid th-mauve"><thead><tr><th class="ac">Outil</th><th>Sens</th><th class="ac">Exemple</th></tr></thead><tbody>
  <tr><td class="ac">أَيْنَ</td><td>où ?</td><td class="ac">إِلَى أَيْنَ تُسَافِرُ؟ أُسَافِرُ إِلَى مَكَّةَ</td></tr>
  <tr><td class="ac">مَتَى</td><td>quand ?</td><td class="ac">مَتَى تُسَافِرُ؟</td></tr>
  <tr><td class="ac">كَيْفَ</td><td>comment ?</td><td class="ac">كَيْفَ تُسَافِرُ؟ بِالطَّائِرَةِ</td></tr>
  <tr><td class="ac">لِمَاذَا</td><td>pourquoi ?</td><td class="ac">لِمَاذَا تُسَافِرُ؟ لِأَدَاءِ الحَجِّ</td></tr>
  <tr><td class="ac">مَاذَا · مَا</td><td>quoi ?</td><td class="ac">مَاذَا اشْتَرَيْتَ؟ اِشْتَرَيْتُ كِتَابًا</td></tr>
  <tr><td class="ac">كَمْ · بِكَمْ</td><td>combien ? · à combien ?</td><td class="ac">بِكَمِ اشْتَرَيْتَ الكِتَابَ؟</td></tr>
  <tr><td class="ac">مَنْ</td><td>qui ?</td><td class="ac">مَنْ صَاحَبَكَ؟ صَاحَبَنِي أَخِي</td></tr>
  <tr><td class="ac">هَلْ</td><td>est-ce que ?</td><td class="ac">هَلْ زُرْتَ المَدِينَةَ؟ نَعَمْ</td></tr>
</tbody></table></div>
<div class="clair"><div class="ct">En clair</div><p>Pour analyser une phrase verbale : trouve le <b>verbe</b>, puis cherche son <b>sujet</b> (ḍamma), puis l'éventuel <b>complément</b> (fatḥa). Tout verbe a un sujet !</p></div>`},

/* ---------------------------------------------------------------- 18 */
{n:18, t:'Les bonnes manières à table, alif mamdūda / maqṣūra', ar:'آدَابُ الطَّعَامِ · الأَلِفُ المَمْدُودَةُ وَالمَقْصُورَةُ', html:`
<div class="hadith"><div class="a">يَا غُلَامُ، سَمِّ اللهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ</div><div class="f">« Ô garçon ! Mentionne le nom d'Allah, mange de ta main droite et mange de ce qui est devant toi. »</div><div class="src">Rapporté par al-Bukhārī et Muslim, d'après ‘Umar ibn Abī Salama, qui mangeait enfant avec le Prophète ﷺ et dont la main allait partout dans le plat.</div></div>
<h3 class="sub">Trois règles de bienséance</h3>
<div class="exs">
  <div class="ex1"><span class="a">أَقُولُ : بِسْمِ اللهِ قَبْلَ طَعَامِي</span><span class="f">Je dis Bismillāh avant de manger.</span></div>
  <div class="ex1"><span class="a">آكُلُ بِيَمِينِي</span><span class="f">Je mange de ma main droite.</span></div>
  <div class="ex1"><span class="a">آكُلُ مِمَّا يَلِينِي</span><span class="f">Je mange ce qui est devant moi.</span></div>
</div>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">صَحْفَةٌ = إِنَاءٌ</td><td>plat, récipient</td></tr>
  <tr><td class="ac">تَطِيشُ = تَتَحَرَّكُ</td><td>(la main) bouge, va partout</td></tr>
  <tr><td class="ac">يَمِينٌ · يَسَارٌ</td><td>droite · gauche</td></tr>
  <tr><td class="ac">سَمِّ · كُلْ</td><td>impératifs : « nomme ! » · « mange ! »</td></tr>
</tbody></table></div>
<div class="recap mauve"><div class="rt">Interpeller : يَا</div><p><span class="arword">يَا</span> sert à appeler quelqu'un : <span class="arword">يَا غُلَامُ</span>, <span class="arword">يَا مُحَمَّدُ</span>, <span class="arword">يَا أُسْتَاذُ</span>. Le nom appelé, s'il est seul, prend une <b>ḍamma</b> sans tanwīn.</p></div>

<h3 class="sub">L'alif « étendu » et l'alif « raccourci »</h3>
<div class="roads">
  <div class="road verb"><div class="top">الأَلِفُ المَمْدُودَةُ</div><div class="q">fin en <b>ـَاءُ</b> : alif + hamza</div><div class="ex">صَحْرَاءُ · سَمَاءٌ · حَمْرَاءُ</div></div>
  <div class="road nom"><div class="top">الأَلِفُ المَقْصُورَةُ</div><div class="q">fin en <b>ـَى</b> : yā’ <b>sans points</b>, lu « ā »</div><div class="ex">الهُدَى · الكُبْرَى · مُوسَى</div></div>
</div>
<div class="warn"><div class="ct">Ne pas confondre</div><p><span class="arword">ى</span> (sans points, se lit « ā ») ≠ <span class="arword">ي</span> (avec deux points, se lit « ī » ou « y »). Comparer <span class="arword">عَلَى</span> (‘alā, sur) et <span class="arword">عَلِيٌّ</span> (‘Aliyyun, le prénom).</p></div>
<h3 class="sub">Les couleurs <span class="ar">الأَلْوَانُ</span></h3>
<p>Le féminin des couleurs se termine justement par une <b>alif mamdūda</b>.</p>
<div class="tbl-wrap"><table class="grid th-coral"><thead><tr><th>Couleur</th><th class="ac">Masculin</th><th class="ac">Féminin</th></tr></thead><tbody>
  <tr><td>blanc</td><td class="ac">أَبْيَضُ</td><td class="ac">بَيْضَاءُ</td></tr>
  <tr><td>noir</td><td class="ac">أَسْوَدُ</td><td class="ac">سَوْدَاءُ</td></tr>
  <tr><td>vert</td><td class="ac">أَخْضَرُ</td><td class="ac">خَضْرَاءُ</td></tr>
  <tr><td>rouge</td><td class="ac">أَحْمَرُ</td><td class="ac">حَمْرَاءُ</td></tr>
  <tr><td>bleu</td><td class="ac">أَزْرَقُ</td><td class="ac">زَرْقَاءُ</td></tr>
  <tr><td>jaune</td><td class="ac">أَصْفَرُ</td><td class="ac">صَفْرَاءُ</td></tr>
</tbody></table></div>

<h3 class="sub">Phrase nominale ou verbale ?</h3>
<div class="roads">
  <div class="road nom"><div class="top">جُمْلَةٌ اِسْمِيَّةٌ</div><div class="q">مُبْتَدَأٌ + خَبَرٌ · pas de verbe exprimé</div><div class="ex">مُحَمَّدٌ طَالِبٌ</div><div class="q">Muḥammad (est) étudiant.</div></div>
  <div class="road verb"><div class="top">جُمْلَةٌ فِعْلِيَّةٌ</div><div class="q">فِعْلٌ + فَاعِلٌ</div><div class="ex">خَرَجَ أَحْمَدُ</div><div class="q">Aḥmad est sorti.</div></div>
</div>
<div class="clair"><div class="ct">En clair</div><p>Le français ajoute « est » dans la phrase nominale ; l'arabe se contente de <b>deux noms</b> au cas sujet.</p></div>`},

/* ---------------------------------------------------------------- 19 */
{n:19, t:'À l’épicerie : les pluriels, tā’ marbūṭa / maftūḥa', ar:'فِي البِقَالَةِ · الجَمْعُ', html:`
<div class="txt"><div class="tt">فِي البِقَالَةِ</div><div class="body">ذَهَبَتْ فَاطِمَةُ إِلَى البِقَالَةِ. وَالبِقَالَةُ مَحَلٌّ لِبَيْعِ الأَغْذِيَةِ بِالتَّجْزِئَةِ.</div><div class="src">« Fāṭima est allée à l'épicerie. L'épicerie est un magasin où l'on vend la nourriture au détail. »</div></div>
<div class="tbl-wrap"><table class="grid th-gold"><thead><tr><th class="ac">Mot</th><th>Sens</th></tr></thead><tbody>
  <tr><td class="ac">البِقَالَةُ</td><td>l'épicerie</td></tr><tr><td class="ac">مَحَلٌّ</td><td>magasin, lieu</td></tr>
  <tr><td class="ac">بَيْعٌ بِالتَّجْزِئَةِ</td><td>vente au détail</td></tr><tr><td class="ac">بَيْعٌ بِالجُمْلَةِ</td><td>vente en gros</td></tr>
  <tr><td class="ac">أَطْعِمَةٌ مُتَنَوِّعَةٌ</td><td>des nourritures variées</td></tr><tr><td class="ac">زَبَائِنُ</td><td>des clients</td></tr>
</tbody></table></div>

<h3 class="sub">Les trois pluriels <span class="ar">أَنْوَاعُ الجَمْعِ</span></h3>

<h3 class="sub">Les règles du sujet <span class="ar">الفَاعِلُ</span></h3>
<div class="rule">
  <div>Tout verbe a un sujet.</div>
  <div>Le sujet vient <b>toujours après</b> le verbe.</div>
  <div>Le sujet est soit un <b>nom</b>, soit un <b>pronom</b>.</div>
  <div>Il n'y a qu'<b>un seul</b> sujet par verbe : si c'est un nom, ce n'est pas un pronom, et inversement.</div>
  <div>Le sujet-pronom peut être <b>sous-entendu</b> (caché) : <span class="arword">ذَهَبَ</span> = « il est allé ».</div>
</div>
<div class="clair"><div class="ct">En clair</div><p><b>ـُونَ / ـِينَ</b> = pluriel masculin (selon la fonction), <b>ـَاتٌ</b> = pluriel féminin, et tout le reste = pluriel brisé, à apprendre avec chaque mot (tes flashcards indiquent le pluriel).</p></div>`}
